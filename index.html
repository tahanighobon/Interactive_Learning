 stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"590\" y1=\"155\" x2=\"590\" y2=\"225\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"625\" y1=\"155\" x2=\"625\" y2=\"225\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"520\" y1=\"178\" x2=\"660\" y2=\"178\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"520\" y1=\"201\" x2=\"660\" y2=\"201\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n            <\/g>\n\n            <\!-- normal line -->\n            <line id=\"normalLine\" x1=\"590\" y1=\"190\" x2=\"590\" y2=\"100\" stroke=\"#059669\" stroke-width=\"4\" stroke-dasharray=\"8 6\"><\/line>\n\n            <\!-- sun direction line -->\n            <line id=\"sunDirectionLine\" x1=\"590\" y1=\"190\" x2=\"460\" y2=\"80\" stroke=\"#f59e0b\" stroke-width=\"4\" stroke-dasharray=\"8 6\"><\/line>\n\n            <\!-- angle text -->\n            <text id=\"sceneText1\" x=\"40\" y=\"35\" font-size=\"22\" fill=\"#111827\" font-weight=\"bold\">Sun elevation: 45°<\/text>\n            <text id=\"sceneText2\" x=\"40\" y=\"65\" font-size=\"22\" fill=\"#111827\" font-weight=\"bold\">Panel tilt: 45°<\/text>\n            <text id=\"sceneText3\" x=\"40\" y=\"95\" font-size=\"22\" fill=\"#111827\" font-weight=\"bold\">Incident angle: 0°<\/text>\n          <\/svg>\n        <\/div>\n\n        <div class=\"legend\">\n          <div><span class=\"dot\" style=\"background:#f59e0b;\"><\/span>Sun direction<\/div>\n          <div><span class=\"dot\" style=\"background:#059669;\"><\/span>Panel normal<\/div>\n          <div><span class=\"dot\" style=\"background:#2563eb;\"><\/span>Power curve<\/div>\n          <div><span class=\"dot\" style=\"background:#dc2626;\"><\/span>Current operating point<\/div>\n        <\/div>\n\n        <div class=\"graph-wrap\">\n          <h3>Power vs Panel Tilt<\/h3>\n          <canvas id=\"graphCanvas\" width=\"820\" height=\"280\"><\/canvas>\n        <\/div>\n\n        <div class=\"notes\">\n          <div class=\"note-box\">\n            <h3>What students should notice<\/h3>\n            <ul>\n              <li>Power is highest when the sun rays are closest to perpendicular to the panel surface.<\/li>\n              <li>Changing panel tilt changes the incidence angle and therefore the usable irradiance.<\/li>\n              <li>Even with the same panel and same sunlight, poor alignment reduces power output.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"note-box\">\n            <h3>Teaching idea<\/h3>\n            <p>\n              Ask students to move the sun elevation and predict the new best tilt angle before checking the graph.\n              Then compare winter-like low sun angles with midday high sun angles.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based experiment for understanding solar panel angle and power output.\n    <\/div>\n  <\/div>\n\n  <script>\n    const sunSlider = document.getElementById(\"sunSlider\");\n    const tiltSlider = document.getElementById(\"tiltSlider\");\n    const irradianceSlider = document.getElementById(\"irradianceSlider\");\n    const areaSlider = document.getElementById(\"areaSlider\");\n    const efficiencySlider = document.getElementById(\"efficiencySlider\");\n\n    const sunValue = document.getElementById(\"sunValue\");\n    const tiltValue = document.getElementById(\"tiltValue\");\n    const irradianceValue = document.getElementById(\"irradianceValue\");\n    const areaValue = document.getElementById(\"areaValue\");\n    const efficiencyValue = document.getElementById(\"efficiencyValue\");\n\n    const thetaOut = document.getElementById(\"thetaOut\");\n    const cosOut = document.getElementById(\"cosOut\");\n    const powerOut = document.getElementById(\"powerOut\");\n    const optimalTiltOut = document.getElementById(\"optimalTiltOut\");\n    const maxPowerOut = document.getElementById(\"maxPowerOut\");\n    const ratioOut = document.getElementById(\"ratioOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const panelGroup = document.getElementById(\"panelGroup\");\n    const normalLine = document.getElementById(\"normalLine\");\n    const sunDirectionLine = document.getElementById(\"sunDirectionLine\");\n    const sunCore = document.getElementById(\"sunCore\");\n    const sunRays = document.getElementById(\"sunRays\");\n    const sceneText1 = document.getElementById(\"sceneText1\");\n    const sceneText2 = document.getElementById(\"sceneText2\");\n    const sceneText3 = document.getElementById(\"sceneText3\");\n\n    const canvas = document.getElementById(\"graphCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    function fmt(x) {\n      return Number(x).toFixed(2);\n    }\n\n    function degToRad(d) {\n      return d * Math.PI / 180;\n    }\n\n    function clamp(x, min, max) {\n      return Math.max(min, Math.min(max, x));\n    }\n\n    function getModel() {\n      const sunElevation = parseFloat(sunSlider.value);\n      const tilt = parseFloat(tiltSlider.value);\n      const G = parseFloat(irradianceSlider.value);\n      const A = parseFloat(areaSlider.value);\n      const eta = parseFloat(efficiencySlider.value) / 100;\n\n      const normalElevation = 90 - tilt;\n      const theta = Math.abs(sunElevation - normalElevation);\n      const alignment = Math.max(0, Math.cos(degToRad(theta)));\n\n      const power = G * A * eta * alignment;\n      const optimalTilt = 90 - sunElevation;\n      const maxPower = G * A * eta;\n      const ratio = maxPower > 0 ? (power / maxPower) * 100 : 0;\n\n      return {\n        sunElevation, tilt, G, A, eta,\n        normalElevation, theta, alignment,\n        power, optimalTilt, maxPower, ratio\n      };\n    }\n\n    function updateText(model) {\n      sunValue.textContent = `${model.sunElevation}°`;\n      tiltValue.textContent = `${model.tilt}°`;\n      irradianceValue.textContent = `${model.G} W/m²`;\n      areaValue.textContent = `${model.A.toFixed(1)} m²`;\n      efficiencyValue.textContent = `${(model.eta * 100).toFixed(0)}%`;\n\n      thetaOut.textContent = `${fmt(model.theta)}°`;\n      cosOut.textContent = fmt(model.alignment);\n      powerOut.textContent = `${fmt(model.power)} W`;\n      optimalTiltOut.textContent = `${fmt(model.optimalTilt)}°`;\n      maxPowerOut.textContent = `${fmt(model.maxPower)} W`;\n      ratioOut.textContent = `${fmt(model.ratio)}%`;\n\n      sceneText1.textContent = `Sun elevation: ${model.sunElevation}°`;\n      sceneText2.textContent = `Panel tilt: ${model.tilt}°`;\n      sceneText3.textContent = `Incident angle: ${fmt(model.theta)}°`;\n\n      if (model.theta < 8) {\n        statusText.textContent = \"Excellent alignment. The panel is almost directly facing the sun, so power is near maximum.\";\n      } else if (model.theta < 25) {\n        statusText.textContent = \"Good alignment. The panel is receiving strong sunlight, but a small tilt adjustment could improve power.\";\n      } else {\n        statusText.textContent = \"Weak alignment. The panel is not facing the sun well, so the usable solar power is reduced.\";\n      }\n    }\n\n    function updateScene(model) {\n      const pivotX = 590;\n      const pivotY = 190;\n\n      const panelWidth = 140;\n      const panelHeight = 70;\n\n      const panelX = pivotX - panelWidth / 2;\n      const panelY = pivotY - panelHeight / 2;\n\n      panelGroup.setAttribute(\n        \"transform\",\n        `rotate(${-model.tilt} ${pivotX} ${pivotY})`\n      );\n\n      const sunRadius = 180;\n      const sunX = 180 + 160 * Math.cos(degToRad(model.sunElevation));\n      const sunY = 250 - 160 * Math.sin(degToRad(model.sunElevation));\n\n      sunCore.setAttribute(\"cx\", sunX);\n      sunCore.setAttribute(\"cy\", sunY);\n\n      const normalLength = 110;\n      const normalX2 = pivotX + normalLength * Math.cos(degToRad(model.normalElevation));\n      const normalY2 = pivotY - normalLength * Math.sin(degToRad(model.normalElevation));\n\n      normalLine.setAttribute(\"x1\", pivotX);\n      normalLine.setAttribute(\"y1\", pivotY);\n      normalLine.setAttribute(\"x2\", normalX2);\n      normalLine.setAttribute(\"y2\", normalY2);\n\n      const rayLength = 170;\n      const rayX2 = pivotX - rayLength * Math.cos(degToRad(model.sunElevation));\n      const rayY2 = pivotY - rayLength * Math.sin(degToRad(model.sunElevation));\n\n      sunDirectionLine.setAttribute(\"x1\", pivotX);\n      sunDirectionLine.setAttribute(\"y1\", pivotY);\n      sunDirectionLine.setAttribute(\"x2\", rayX2);\n      sunDirectionLine.setAttribute(\"y2\", rayY2);\n\n      drawSunRays(sunX, sunY, model.sunElevation, model.alignment);\n    }\n\n    function drawSunRays(sunX, sunY, sunElevation, alignment) {\n      sunRays.innerHTML = \"\";\n      const count = 6;\n      const baseX = 520;\n      const baseY = 190;\n\n      for (let i = 0; i < count; i++) {\n        const offset = (i - (count - 1) / 2) * 20;\n        const x1 = sunX + offset * 0.3;\n        const y1 = sunY + offset * 0.15;\n        const x2 = baseX + offset;\n        const y2 = baseY + offset * 0.12;\n\n        const line = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        line.setAttribute(\"x1\", x1);\n        line.setAttribute(\"y1\", y1);\n        line.setAttribute(\"x2\", x2);\n        line.setAttribute(\"y2\", y2);\n        line.setAttribute(\"stroke\", \"#f59e0b\");\n        line.setAttribute(\"stroke-width\", 3 + alignment * 3);\n        line.setAttribute(\"opacity\", 0.35 + alignment * 0.45);\n        sunRays.appendChild(line);\n      }\n    }\n\n    function drawGraph(model) {\n      const w = canvas.width;\n      const h = canvas.height;\n      const pad = 55;\n\n      ctx.clearRect(0, 0, w, h);\n\n      const plotW = w - 2 * pad;\n      const plotH = h - 2 * pad;\n\n      const xMax = 90;\n      const yMax = model.maxPower * 1.1 || 1;\n\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= 6; i++) {\n        const x = pad + (plotW / 6) * i;\n        ctx.beginPath();\n        ctx.moveTo(x, pad);\n        ctx.lineTo(x, h - pad);\n        ctx.stroke();\n      }\n\n      for (let i = 0; i <= 5; i++) {\n        const y = pad + (plotH / 5) * i;\n        ctx.beginPath();\n        ctx.moveTo(pad, y);\n        ctx.lineTo(w - pad, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(pad, pad);\n      ctx.lineTo(pad, h - pad);\n      ctx.lineTo(w - pad, h - pad);\n      ctx.stroke();\n\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n\n      for (let tilt = 0; tilt <= 90; tilt += 1) {\n        const normalElevation = 90 - tilt;\n        const theta = Math.abs(model.sunElevation - normalElevation);\n        const alignment = Math.max(0, Math.cos(degToRad(theta)));\n        const power = model.G * model.A * model.eta * alignment;\n\n        const px = pad + (tilt / xMax) * plotW;\n        const py = h - pad - (power / yMax) * plotH;\n\n        if (tilt === 0) ctx.moveTo(px, py);\n        else ctx.lineTo(px, py);\n      }\n      ctx.stroke();\n\n      const currentX = pad + (model.tilt / xMax) * plotW;\n      const currentY = h - pad - (model.power / yMax) * plotH;\n\n      ctx.fillStyle = \"#dc2626\";\n      ctx.beginPath();\n      ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);\n      ctx.fill();\n\n      const optX = pad + (model.optimalTilt / xMax) * plotW;\n      const optY = h - pad - (model.maxPower / yMax) * plotH;\n\n      ctx.fillStyle = \"#059669\";\n      ctx.beginPath();\n      ctx.arc(optX, optY, 5, 0, Math.PI * 2);\n      ctx.fill();\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"Panel tilt (degrees)\", w / 2 - 60, h - 12);\n\n      ctx.save();\n      ctx.translate(18, h / 2 + 20);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(\"Power (W)\", 0, 0);\n      ctx.restore();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"14px Arial\";\n\n      for (let i = 0; i <= 6; i++) {\n        const xVal = (90 / 6) * i;\n        const px = pad + (plotW / 6) * i;\n        ctx.fillText(xVal.toFixed(0), px - 8, h - pad + 22);\n      }\n\n      for (let i = 0; i <= 5; i++) {\n        const yVal = yMax - (yMax / 5) * i;\n        const py = pad + (plotH / 5) * i;\n        ctx.fillText(yVal.toFixed(0), 8, py + 4);\n      }\n    }\n\n    function updateExplorer() {\n      const model = getModel();\n      updateText(model);\n      updateScene(model);\n      drawGraph(model);\n    }\n\n    sunSlider.addEventListener(\"input\", updateExplorer);\n    tiltSlider.addEventListener(\"input\", updateExplorer);\n    irradianceSlider.addEventListener(\"input\", updateExplorer);\n    areaSlider.addEventListener(\"input\", updateExplorer);\n    efficiencySlider.addEventListener(\"input\", updateExplorer);\n\n    updateExplorer();\n  <\/script>\n<\/body>\n<\/html>", "Solar_Panel_Tilt_and_Output": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Solar Panel Tilt and Output<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --sun: #f59e0b;\n      --good: #059669;\n      --bad: #dc2626;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1280px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 360px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    input[type=\"range\"] {\n      width: 100%;\n      cursor: pointer;\n    }\n\n    .formula-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      line-height: 1.7;\n      color: var(--muted);\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 16px;\n    }\n\n    .stat {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .status {\n      margin-top: 16px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      color: #0f172a;\n      line-height: 1.5;\n    }\n\n    .scene-wrap, .graph-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    svg, canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    svg {\n      height: auto;\n    }\n\n    canvas {\n      height: 280px;\n    }\n\n    .notes {\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 16px;\n    }\n\n    .note-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 16px;\n    }\n\n    .note-box p, .note-box li {\n      line-height: 1.6;\n      color: var(--muted);\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 960px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .notes {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Solar Panel Tilt and Output<\/h1>\n      <p>\n        Explore how changing the tilt of a solar panel affects the electrical output.\n        Move the panel tilt and sun elevation to see how alignment changes power generation.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"sunSlider\">\n            Sun elevation\n            <span class=\"value\" id=\"sunValue\">50°<\/span>\n          <\/label>\n          <input type=\"range\" id=\"sunSlider\" min=\"0\" max=\"90\" step=\"1\" value=\"50\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"tiltSlider\">\n            Panel tilt\n            <span class=\"value\" id=\"tiltValue\">40°<\/span>\n          <\/label>\n          <input type=\"range\" id=\"tiltSlider\" min=\"0\" max=\"90\" step=\"1\" value=\"40\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"irradianceSlider\">\n            Solar irradiance\n            <span class=\"value\" id=\"irradianceValue\">900 W/m²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"irradianceSlider\" min=\"200\" max=\"1200\" step=\"10\" value=\"900\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"areaSlider\">\n            Panel area\n            <span class=\"value\" id=\"areaValue\">2.0 m²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"areaSlider\" min=\"0.5\" max=\"5.0\" step=\"0.1\" value=\"2.0\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"effSlider\">\n            Panel efficiency\n            <span class=\"value\" id=\"effValue\">20%<\/span>\n          <\/label>\n          <input type=\"range\" id=\"effSlider\" min=\"5\" max=\"30\" step=\"1\" value=\"20\" />\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key relation<\/h3>\n          <div class=\"formula\">Output = G × A × η × cos(θ)<\/div><br>\n          <div class=\"formula\">θ = angle between sunlight and panel normal<\/div><br>\n          <div class=\"formula\">Best output occurs when θ = 0°<\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Incident angle<\/small>\n            <strong id=\"thetaOut\">0.00°<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Alignment factor<\/small>\n            <strong id=\"alignOut\">1.00<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Panel output<\/small>\n            <strong id=\"powerOut\">360.00 W<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Maximum output<\/small>\n            <strong id=\"maxOut\">360.00 W<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Best tilt<\/small>\n            <strong id=\"bestTiltOut\">40.00°<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Output ratio<\/small>\n            <strong id=\"ratioOut\">100%<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"status\" id=\"statusText\">\n          The closer the panel faces the sun directly, the higher the output.\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"scene-wrap\">\n          <h2>Live Solar View<\/h2>\n          <svg id=\"scene\" viewBox=\"0 0 900 420\">\n            <rect x=\"0\" y=\"0\" width=\"900\" height=\"420\" fill=\"#f8fbff\"><\/rect>\n            <line x1=\"0\" y1=\"280\" x2=\"900\" y2=\"280\" stroke=\"#94a3b8\" stroke-width=\"3\"><\/line>\n\n            <g id=\"rayGroup\"><\/g>\n\n            <circle id=\"sun\" cx=\"160\" cy=\"100\" r=\"34\" fill=\"#fbbf24\" stroke=\"#f59e0b\" stroke-width=\"6\"><\/circle>\n\n            <line x1=\"600\" y1=\"280\" x2=\"600\" y2=\"225\" stroke=\"#475569\" stroke-width=\"8\"><\/line>\n            <line x1=\"560\" y1=\"280\" x2=\"640\" y2=\"280\" stroke=\"#475569\" stroke-width=\"8\"><\/line>\n\n            <g id=\"panelGroup\">\n              <rect x=\"530\" y=\"190\" width=\"140\" height=\"70\" rx=\"8\" fill=\"#1d4ed8\" stroke=\"#0f172a\" stroke-width=\"4\"><\/rect>\n              <line x1=\"565\" y1=\"190\" x2=\"565\" y2=\"260\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"600\" y1=\"190\" x2=\"600\" y2=\"260\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"635\" y1=\"190\" x2=\"635\" y2=\"260\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"530\" y1=\"213\" x2=\"670\" y2=\"213\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n              <line x1=\"530\" y1=\"236\" x2=\"670\" y2=\"236\" stroke=\"#93c5fd\" stroke-width=\"2\"><\/line>\n            <\/g>\n\n            <line id=\"normalLine\" x1=\"600\" y1=\"225\" x2=\"600\" y2=\"120\" stroke=\"#059669\" stroke-width=\"4\" stroke-dasharray=\"8 6\"><\/line>\n            <line id=\"sunLine\" x1=\"600\" y1=\"225\" x2=\"470\" y2=\"110\" stroke=\"#f59e0b\" stroke-width=\"4\" stroke-dasharray=\"8 6\"><\/line>\n\n            <text id=\"txtSun\" x=\"40\" y=\"40\" font-size=\"24\" font-weight=\"bold\" fill=\"#111827\">Sun elevation: 50°<\/text>\n            <text id=\"txtTilt\" x=\"40\" y=\"75\" font-size=\"24\" font-weight=\"bold\" fill=\"#111827\">Panel tilt: 40°<\/text>\n            <text id=\"txtTheta\" x=\"40\" y=\"110\" font-size=\"24\" font-weight=\"bold\" fill=\"#111827\">Incident angle: 0°<\/text>\n          <\/svg>\n        <\/div>\n\n        <div class=\"graph-wrap\">\n          <h2>Output vs Tilt<\/h2>\n          <canvas id=\"graphCanvas\" width=\"820\" height=\"280\"><\/canvas>\n        <\/div>\n\n        <div class=\"notes\">\n          <div class=\"note-box\">\n            <h3>What students should notice<\/h3>\n            <ul>\n              <li>The same panel can produce different power depending on tilt alignment.<\/li>\n              <li>The best tilt changes when the sun elevation changes.<\/li>\n              <li>Poor alignment lowers output even if irradiance is strong.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"note-box\">\n            <h3>Teaching idea<\/h3>\n            <p>\n              Ask students to set a low morning sun angle and then a high noon sun angle.\n              Let them compare how the best panel tilt changes in each case.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding solar panel tilt and electrical output.\n    <\/div>\n  <\/div>\n\n  <script>\n    const sunSlider = document.getElementById(\"sunSlider\");\n    const tiltSlider = document.getElementById(\"tiltSlider\");\n    const irradianceSlider = document.getElementById(\"irradianceSlider\");\n    const areaSlider = document.getElementById(\"areaSlider\");\n    const effSlider = document.getElementById(\"effSlider\");\n\n    const sunValue = document.getElementById(\"sunValue\");\n    const tiltValue = document.getElementById(\"tiltValue\");\n    const irradianceValue = document.getElementById(\"irradianceValue\");\n    const areaValue = document.getElementById(\"areaValue\");\n    const effValue = document.getElementById(\"effValue\");\n\n    const thetaOut = document.getElementById(\"thetaOut\");\n    const alignOut = document.getElementById(\"alignOut\");\n    const powerOut = document.getElementById(\"powerOut\");\n    const maxOut = document.getElementById(\"maxOut\");\n    const bestTiltOut = document.getElementById(\"bestTiltOut\");\n    const ratioOut = document.getElementById(\"ratioOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const panelGroup = document.getElementById(\"panelGroup\");\n    const normalLine = document.getElementById(\"normalLine\");\n    const sunLine = document.getElementById(\"sunLine\");\n    const sun = document.getElementById(\"sun\");\n    const rayGroup = document.getElementById(\"rayGroup\");\n\n    const txtSun = document.getElementById(\"txtSun\");\n    const txtTilt = document.getElementById(\"txtTilt\");\n    const txtTheta = document.getElementById(\"txtTheta\");\n\n    const canvas = document.getElementById(\"graphCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    function degToRad(d) {\n      return d * Math.PI / 180;\n    }\n\n    function fmt(x) {\n      return Number(x).toFixed(2);\n    }\n\n    function model() {\n      const sunElevation = parseFloat(sunSlider.value);\n      const tilt = parseFloat(tiltSlider.value);\n      const G = parseFloat(irradianceSlider.value);\n      const A = parseFloat(areaSlider.value);\n      const eta = parseFloat(effSlider.value) / 100;\n\n      const normalElevation = 90 - tilt;\n      const theta = Math.abs(sunElevation - normalElevation);\n      const align = Math.max(0, Math.cos(degToRad(theta)));\n\n      const power = G * A * eta * align;\n      const maxPower = G * A * eta;\n      const bestTilt = 90 - sunElevation;\n      const ratio = maxPower > 0 ? (power / maxPower) * 100 : 0;\n\n      return { sunElevation, tilt, G, A, eta, normalElevation, theta, align, power, maxPower, bestTilt, ratio };\n    }\n\n    function updateText(m) {\n      sunValue.textContent = `${m.sunElevation}°`;\n      tiltValue.textContent = `${m.tilt}°`;\n      irradianceValue.textContent = `${m.G} W/m²`;\n      areaValue.textContent = `${m.A.toFixed(1)} m²`;\n      effValue.textContent = `${(m.eta * 100).toFixed(0)}%`;\n\n      thetaOut.textContent = `${fmt(m.theta)}°`;\n      alignOut.textContent = fmt(m.align);\n      powerOut.textContent = `${fmt(m.power)} W`;\n      maxOut.textContent = `${fmt(m.maxPower)} W`;\n      bestTiltOut.textContent = `${fmt(m.bestTilt)}°`;\n      ratioOut.textContent = `${fmt(m.ratio)}%`;\n\n      txtSun.textContent = `Sun elevation: ${m.sunElevation}°`;\n      txtTilt.textContent = `Panel tilt: ${m.tilt}°`;\n      txtTheta.textContent = `Incident angle: ${fmt(m.theta)}°`;\n\n      if (m.theta < 8) {\n        statusText.textContent = \"Excellent alignment. The panel is nearly facing the sun directly, so output is close to maximum.\";\n      } else if (m.theta < 25) {\n        statusText.textContent = \"Good alignment. The panel receives strong sunlight, but small tilt adjustments could improve output.\";\n      } else {\n        statusText.textContent = \"Weak alignment. The panel tilt does not match the sun well, so the output is reduced.\";\n      }\n    }\n\n    function updateScene(m) {\n      const pivotX = 600;\n      const pivotY = 225;\n\n      panelGroup.setAttribute(\"transform\", `rotate(${-m.tilt} ${pivotX} ${pivotY})`);\n\n      const sunX = 170 + 170 * Math.cos(degToRad(m.sunElevation));\n      const sunY = 280 - 170 * Math.sin(degToRad(m.sunElevation));\n      sun.setAttribute(\"cx\", sunX);\n      sun.setAttribute(\"cy\", sunY);\n\n      const normalLen = 110;\n      const nx = pivotX + normalLen * Math.cos(degToRad(m.normalElevation));\n      const ny = pivotY - normalLen * Math.sin(degToRad(m.normalElevation));\n      normalLine.setAttribute(\"x1\", pivotX);\n      normalLine.setAttribute(\"y1\", pivotY);\n      normalLine.setAttribute(\"x2\", nx);\n      normalLine.setAttribute(\"y2\", ny);\n\n      const sunLen = 170;\n      const sx = pivotX - sunLen * Math.cos(degToRad(m.sunElevation));\n      const sy = pivotY - sunLen * Math.sin(degToRad(m.sunElevation));\n      sunLine.setAttribute(\"x1\", pivotX);\n      sunLine.setAttribute(\"y1\", pivotY);\n      sunLine.setAttribute(\"x2\", sx);\n      sunLine.setAttribute(\"y2\", sy);\n\n      drawRays(sunX, sunY, m.align);\n    }\n\n    function drawRays(sunX, sunY, align) {\n      rayGroup.innerHTML = \"\";\n      const endX = 520;\n      const endY = 210;\n\n      for (let i = 0; i < 6; i++) {\n        const offset = (i - 2.5) * 18;\n        const line = document.createElementNS(\"http://www.w3.org/2000/svg\", \"line\");\n        line.setAttribute(\"x1\", sunX + offset * 0.2);\n        line.setAttribute(\"y1\", sunY + offset * 0.1);\n        line.setAttribute(\"x2\", endX + offset);\n        line.setAttribute(\"y2\", endY + offset * 0.15);\n        line.setAttribute(\"stroke\", \"#f59e0b\");\n        line.setAttribute(\"stroke-width\", 3 + align * 3);\n        line.setAttribute(\"opacity\", 0.35 + align * 0.45);\n        rayGroup.appendChild(line);\n      }\n    }\n\n    function drawGraph(m) {\n      const w = canvas.width;\n      const h = canvas.height;\n      const pad = 55;\n      const plotW = w - 2 * pad;\n      const plotH = h - 2 * pad;\n      const yMax = Math.max(m.maxPower * 1.1, 1);\n\n      ctx.clearRect(0, 0, w, h);\n\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= 6; i++) {\n        const x = pad + (plotW / 6) * i;\n        ctx.beginPath();\n        ctx.moveTo(x, pad);\n        ctx.lineTo(x, h - pad);\n        ctx.stroke();\n      }\n\n      for (let i = 0; i <= 5; i++) {\n        const y = pad + (plotH / 5) * i;\n        ctx.beginPath();\n        ctx.moveTo(pad, y);\n        ctx.lineTo(w - pad, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(pad, pad);\n      ctx.lineTo(pad, h - pad);\n      ctx.lineTo(w - pad, h - pad);\n      ctx.stroke();\n\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n\n      for (let tilt = 0; tilt <= 90; tilt++) {\n        const normalElevation = 90 - tilt;\n        const theta = Math.abs(m.sunElevation - normalElevation);\n        const align = Math.max(0, Math.cos(degToRad(theta)));\n        const power = m.G * m.A * m.eta * align;\n\n        const px = pad + (tilt / 90) * plotW;\n        const py = h - pad - (power / yMax) * plotH;\n\n        if (tilt === 0) ctx.moveTo(px, py);\n        else ctx.lineTo(px, py);\n      }\n      ctx.stroke();\n\n      const currentX = pad + (m.tilt / 90) * plotW;\n      const currentY = h - pad - (m.power / yMax) * plotH;\n      ctx.fillStyle = \"#dc2626\";\n      ctx.beginPath();\n      ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);\n      ctx.fill();\n\n      const bestX = pad + (m.bestTilt / 90) * plotW;\n      const bestY = h - pad - (m.maxPower / yMax) * plotH;\n      ctx.fillStyle = \"#059669\";\n      ctx.beginPath();\n      ctx.arc(bestX, bestY, 5, 0, Math.PI * 2);\n      ctx.fill();\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"Tilt angle (degrees)\", w / 2 - 55, h - 12);\n\n      ctx.save();\n      ctx.translate(20, h / 2 + 20);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(\"Output power (W)\", 0, 0);\n      ctx.restore();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"14px Arial\";\n\n      for (let i = 0; i <= 6; i++) {\n        const val = (90 / 6) * i;\n        const x = pad + (plotW / 6) * i;\n        ctx.fillText(val.toFixed(0), x - 8, h - pad + 22);\n      }\n\n      for (let i = 0; i <= 5; i++) {\n        const val = yMax - (yMax / 5) * i;\n        const y = pad + (plotH / 5) * i;\n        ctx.fillText(val.toFixed(0), 8, y + 4);\n      }\n    }\n\n    function update() {\n      const m = model();\n      updateText(m);\n      updateScene(m);\n      drawGraph(m);\n    }\n\n    sunSlider.addEventListener(\"input\", update);\n    tiltSlider.addEventListener(\"input\", update);\n    irradianceSlider.addEventListener(\"input\", update);\n    areaSlider.addEventListener(\"input\", update);\n    effSlider.addEventListener(\"input\", update);\n\n    update();\n  <\/script>\n<\/body>\n<\/html>", "Wind_Turbine_Experiment": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Wind Turbine Experiment<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n      --danger: #dc2626;\n      --purple: #7c3aed;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1380px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 410px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select, input[type=\"range\"] {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .slider-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n      margin-bottom: 12px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .formula-box, .scene-wrap, .chart-wrap, .notes-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    #turbineCanvas {\n      height: 420px;\n    }\n\n    #powerCanvas {\n      height: 260px;\n    }\n\n    .legend {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 16px;\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .legend span::before {\n      content: \"\";\n      display: inline-block;\n      width: 14px;\n      height: 3px;\n      margin-right: 8px;\n      vertical-align: middle;\n      border-radius: 999px;\n    }\n\n    .available::before { background: #dc2626; }\n    .output::before { background: #2563eb; }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 980px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr;\n      }\n\n      #turbineCanvas {\n        height: 320px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Wind Turbine Experiment<\/h1>\n      <p>\n        Explore how wind speed, blade radius, air density, and turbine efficiency affect wind power and electrical output.\n        Watch the rotor spin faster as conditions change and compare available wind power with the usable turbine output.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"locationSelect\">Air condition preset<\/label>\n          <select id=\"locationSelect\">\n            <option value=\"1.225\">Sea level air (1.225 kg/m³)<\/option>\n            <option value=\"1.15\">Mild altitude air (1.15 kg/m³)<\/option>\n            <option value=\"1.00\">High altitude air (1.00 kg/m³)<\/option>\n            <option value=\"custom\">Custom<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"windSlider\">\n            Wind speed\n            <span class=\"value\" id=\"windValue\">8.0 m/s<\/span>\n          <\/label>\n          <input type=\"range\" id=\"windSlider\" min=\"0\" max=\"25\" step=\"0.1\" value=\"8.0\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"radiusSlider\">\n            Blade radius\n            <span class=\"value\" id=\"radiusValue\">20.0 m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"radiusSlider\" min=\"2\" max=\"50\" step=\"0.1\" value=\"20.0\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"densitySlider\">\n            Air density\n            <span class=\"value\" id=\"densityValue\">1.225 kg/m³<\/span>\n          <\/label>\n          <input type=\"range\" id=\"densitySlider\" min=\"0.8\" max=\"1.4\" step=\"0.001\" value=\"1.225\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"cpSlider\">\n            Power coefficient C<sub>p<\/sub>\n            <span class=\"value\" id=\"cpValue\">0.40<\/span>\n          <\/label>\n          <input type=\"range\" id=\"cpSlider\" min=\"0.1\" max=\"0.59\" step=\"0.01\" value=\"0.40\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"generatorSlider\">\n            Generator efficiency\n            <span class=\"value\" id=\"generatorValue\">90%<\/span>\n          <\/label>\n          <input type=\"range\" id=\"generatorSlider\" min=\"50\" max=\"100\" step=\"1\" value=\"90\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"cutInSlider\">\n            Cut-in speed\n            <span class=\"value\" id=\"cutInValue\">3.0 m/s<\/span>\n          <\/label>\n          <input type=\"range\" id=\"cutInSlider\" min=\"1\" max=\"8\" step=\"0.1\" value=\"3.0\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"cutOutSlider\">\n            Cut-out speed\n            <span class=\"value\" id=\"cutOutValue\">20.0 m/s<\/span>\n          <\/label>\n          <input type=\"range\" id=\"cutOutSlider\" min=\"10\" max=\"30\" step=\"0.1\" value=\"20.0\" />\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key equations<\/h3>\n          <div class=\"formula\">A = πr²<\/div><br>\n          <div class=\"formula\">P<sub>wind<\/sub> = ½ρAv³<\/div><br>\n          <div class=\"formula\">P<sub>turbine<\/sub> = C<sub>p<\/sub> · ½ρAv³<\/div><br>\n          <div class=\"formula\">P<sub>electric<\/sub> = η · P<sub>turbine<\/sub><\/div>\n\n          <div class=\"status\" id=\"statusText\">\n            Wind power depends very strongly on wind speed because the power increases with the cube of wind speed.\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Swept area<\/small>\n            <strong id=\"areaOut\">1256.64 m²<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Available wind power<\/small>\n            <strong id=\"windPowerOut\">394.08 kW<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Turbine mechanical power<\/small>\n            <strong id=\"mechPowerOut\">157.63 kW<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Electrical output<\/small>\n            <strong id=\"elecPowerOut\">141.87 kW<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Rotor diameter<\/small>\n            <strong id=\"diameterOut\">40.00 m<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Operating state<\/small>\n            <strong id=\"stateOut\">Generating<\/strong>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"scene-wrap\">\n          <h2>Wind Turbine Animation<\/h2>\n          <canvas id=\"turbineCanvas\" width=\"920\" height=\"420\"><\/canvas>\n        <\/div>\n\n        <div class=\"chart-wrap\">\n          <h2>Power vs Wind Speed<\/h2>\n          <canvas id=\"powerCanvas\" width=\"920\" height=\"260\"><\/canvas>\n          <div class=\"legend\">\n            <span class=\"available\">Available wind power<\/span>\n            <span class=\"output\">Electrical output<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>When wind speed doubles, power does not just double. It increases much more because of the cubic relationship.<\/li>\n            <li>Larger blade radius means a larger swept area, so the turbine can capture more wind energy.<\/li>\n            <li>The power coefficient shows that only part of the wind power can be captured by the rotor.<\/li>\n            <li>If wind speed is below cut-in or above cut-out, the turbine does not generate power.<\/li>\n          <\/ul>\n          <p>\n            A strong classroom activity is to keep all variables fixed and change only wind speed, then ask students why small speed changes produce such large power changes.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding wind turbine energy conversion.\n    <\/div>\n  <\/div>\n\n  <script>\n    const locationSelect = document.getElementById(\"locationSelect\");\n    const windSlider = document.getElementById(\"windSlider\");\n    const radiusSlider = document.getElementById(\"radiusSlider\");\n    const densitySlider = document.getElementById(\"densitySlider\");\n    const cpSlider = document.getElementById(\"cpSlider\");\n    const generatorSlider = document.getElementById(\"generatorSlider\");\n    const cutInSlider = document.getElementById(\"cutInSlider\");\n    const cutOutSlider = document.getElementById(\"cutOutSlider\");\n\n    const windValue = document.getElementById(\"windValue\");\n    const radiusValue = document.getElementById(\"radiusValue\");\n    const densityValue = document.getElementById(\"densityValue\");\n    const cpValue = document.getElementById(\"cpValue\");\n    const generatorValue = document.getElementById(\"generatorValue\");\n    const cutInValue = document.getElementById(\"cutInValue\");\n    const cutOutValue = document.getElementById(\"cutOutValue\");\n\n    const areaOut = document.getElementById(\"areaOut\");\n    const windPowerOut = document.getElementById(\"windPowerOut\");\n    const mechPowerOut = document.getElementById(\"mechPowerOut\");\n    const elecPowerOut = document.getElementById(\"elecPowerOut\");\n    const diameterOut = document.getElementById(\"diameterOut\");\n    const stateOut = document.getElementById(\"stateOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const turbineCanvas = document.getElementById(\"turbineCanvas\");\n    const turbineCtx = turbineCanvas.getContext(\"2d\");\n\n    const powerCanvas = document.getElementById(\"powerCanvas\");\n    const powerCtx = powerCanvas.getContext(\"2d\");\n\n    let bladeAngle = 0;\n\n    function fmt(n) {\n      return Number(n).toFixed(2);\n    }\n\n    function getModel() {\n      const wind = parseFloat(windSlider.value);\n      const radius = parseFloat(radiusSlider.value);\n      const density = parseFloat(densitySlider.value);\n      const cp = parseFloat(cpSlider.value);\n      const efficiency = parseFloat(generatorSlider.value) / 100;\n      const cutIn = parseFloat(cutInSlider.value);\n      const cutOut = parseFloat(cutOutSlider.value);\n\n      const area = Math.PI * radius * radius;\n      const windPower = 0.5 * density * area * Math.pow(wind, 3);\n\n      let mechPower = 0;\n      let elecPower = 0;\n      let state = \"Stopped\";\n\n      if (wind >= cutIn && wind <= cutOut) {\n        mechPower = cp * windPower;\n        elecPower = efficiency * mechPower;\n        state = \"Generating\";\n      } else if (wind < cutIn) {\n        state = \"Below cut-in\";\n      } else {\n        state = \"Above cut-out\";\n      }\n\n      return {\n        wind,\n        radius,\n        density,\n        cp,\n        efficiency,\n        cutIn,\n        cutOut,\n        area,\n        windPower,\n        mechPower,\n        elecPower,\n        diameter: radius * 2,\n        state\n      };\n    }\n\n    function formatPower(watts) {\n      if (watts >= 1e6) return `${fmt(watts / 1e6)} MW`;\n      if (watts >= 1e3) return `${fmt(watts / 1e3)} kW`;\n      return `${fmt(watts)} W`;\n    }\n\n    function syncPreset() {\n      if (locationSelect.value !== \"custom\") {\n        densitySlider.value = locationSelect.value;\n      }\n      updateAll();\n    }\n\n    function updateText(m) {\n      windValue.textContent = `${m.wind.toFixed(1)} m/s`;\n      radiusValue.textContent = `${m.radius.toFixed(1)} m`;\n      densityValue.textContent = `${m.density.toFixed(3)} kg/m³`;\n      cpValue.textContent = `${m.cp.toFixed(2)}`;\n      generatorValue.textContent = `${Math.round(m.efficiency * 100)}%`;\n      cutInValue.textContent = `${m.cutIn.toFixed(1)} m/s`;\n      cutOutValue.textContent = `${m.cutOut.toFixed(1)} m/s`;\n\n      areaOut.textContent = `${fmt(m.area)} m²`;\n      windPowerOut.textContent = formatPower(m.windPower);\n      mechPowerOut.textContent = formatPower(m.mechPower);\n      elecPowerOut.textContent = formatPower(m.elecPower);\n      diameterOut.textContent = `${fmt(m.diameter)} m`;\n      stateOut.textContent = m.state;\n\n      if (m.wind < m.cutIn) {\n        statusText.textContent = \"The wind speed is too low, so the turbine stays below cut-in speed and does not generate electricity.\";\n      } else if (m.wind > m.cutOut) {\n        statusText.textContent = \"The wind speed is above the cut-out limit, so the turbine shuts down for safety.\";\n      } else if (m.cp > 0.5) {\n        statusText.textContent = \"This is a very efficient turbine setting. Remember that real turbines cannot capture all of the wind power.\";\n      } else {\n        statusText.textContent = \"Wind power rises with the cube of wind speed, so even a small increase in wind speed can greatly increase turbine output.\";\n      }\n    }\n\n    function drawTurbine(m) {\n      const ctx = turbineCtx;\n      const w = turbineCanvas.width;\n      const h = turbineCanvas.height;\n\n      ctx.clearRect(0, 0, w, h);\n\n      const sky = ctx.createLinearGradient(0, 0, 0, h);\n      sky.addColorStop(0, \"#dbeafe\");\n      sky.addColorStop(1, \"#ffffff\");\n      ctx.fillStyle = sky;\n      ctx.fillRect(0, 0, w, h);\n\n      ctx.fillStyle = \"#dcfce7\";\n      ctx.fillRect(0, h - 90, w, 90);\n\n      // clouds\n      ctx.fillStyle = \"rgba(255,255,255,0.9)\";\n      drawCloud(ctx, 120, 80, 36);\n      drawCloud(ctx, 300, 60, 28);\n      drawCloud(ctx, 760, 90, 32);\n\n      // wind lines\n      ctx.strokeStyle = \"rgba(37,99,235,0.35)\";\n      ctx.lineWidth = 2;\n      for (let i = 0; i < 7; i++) {\n        const y = 70 + i * 36;\n        const length = 110 + i * 18;\n        ctx.beginPath();\n        ctx.moveTo(30, y);\n        ctx.quadraticCurveTo(80, y - 8, length, y);\n        ctx.stroke();\n      }\n\n      // tower\n      const towerX = 650;\n      const towerBaseY = h - 90;\n      const towerTopY = 140;\n      ctx.fillStyle = \"#d1d5db\";\n      ctx.beginPath();\n      ctx.moveTo(towerX - 28, towerBaseY);\n      ctx.lineTo(towerX + 28, towerBaseY);\n      ctx.lineTo(towerX + 12, towerTopY);\n      ctx.lineTo(towerX - 12, towerTopY);\n      ctx.closePath();\n      ctx.fill();\n\n      // nacelle\n      ctx.fillStyle = \"#9ca3af\";\n      ctx.fillRect(towerX - 10, towerTopY - 10, 80, 22);\n\n      const hubX = towerX + 8;\n      const hubY = towerTopY + 1;\n\n      // blade rotation speed linked to wind\n      let speedFactor = 0;\n      if (m.state === \"Generating\") {\n        speedFactor = m.wind / 25;\n      }\n      bladeAngle += speedFactor * 0.12;\n\n      const bladeLengthPx = Math.min(110, m.radius * 2.4);\n\n      for (let i = 0; i < 3; i++) {\n        const angle = bladeAngle + i * (2 * Math.PI / 3);\n        const x2 = hubX + bladeLengthPx * Math.cos(angle);\n        const y2 = hubY + bladeLengthPx * Math.sin(angle);\n\n        ctx.strokeStyle = \"#374151\";\n        ctx.lineWidth = 8;\n        ctx.beginPath();\n        ctx.moveTo(hubX, hubY);\n        ctx.lineTo(x2, y2);\n        ctx.stroke();\n\n        ctx.beginPath();\n        ctx.arc(x2, y2, 3, 0, Math.PI * 2);\n        ctx.fillStyle = \"#374151\";\n        ctx.fill();\n      }\n\n      ctx.fillStyle = \"#4b5563\";\n      ctx.beginPath();\n      ctx.arc(hubX, hubY, 10, 0, Math.PI * 2);\n      ctx.fill();\n\n      // labels\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"18px Arial\";\n      ctx.fillText(`Wind speed: ${m.wind.toFixed(1)} m/s`, 24, 32);\n      ctx.fillText(`State: ${m.state}`, 24, 60);\n      ctx.fillText(`Electrical output: ${formatPower(m.elecPower)}`, 24, 88);\n\n      // small meter box\n      ctx.fillStyle = \"#ffffff\";\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1.5;\n      roundRect(ctx, 22, h - 145, 260, 85, 12, true, true);\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"15px Arial\";\n      ctx.fillText(`Swept area: ${fmt(m.area)} m²`, 38, h - 113);\n      ctx.fillText(`Cₚ: ${m.cp.toFixed(2)}`, 38, h - 88);\n      ctx.fillText(`Generator η: ${Math.round(m.efficiency * 100)}%`, 38, h - 63);\n    }\n\n    function drawCloud(ctx, x, y, r) {\n      ctx.beginPath();\n      ctx.arc(x, y, r, 0, Math.PI * 2);\n      ctx.arc(x + r * 0.9, y - 10, r * 0.8, 0, Math.PI * 2);\n      ctx.arc(x + r * 1.8, y, r * 0.9, 0, Math.PI * 2);\n      ctx.closePath();\n      ctx.fill();\n    }\n\n    function roundRect(ctx, x, y, w, h, r, fill, stroke) {\n      ctx.beginPath();\n      ctx.moveTo(x + r, y);\n      ctx.lineTo(x + w - r, y);\n      ctx.quadraticCurveTo(x + w, y, x + w, y + r);\n      ctx.lineTo(x + w, y + h - r);\n      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);\n      ctx.lineTo(x + r, y + h);\n      ctx.quadraticCurveTo(x, y + h, x, y + h - r);\n      ctx.lineTo(x, y + r);\n      ctx.quadraticCurveTo(x, y, x + r, y);\n      ctx.closePath();\n      if (fill) ctx.fill();\n      if (stroke) ctx.stroke();\n    }\n\n    function drawPowerChart(m) {\n      const ctx = powerCtx;\n      const w = powerCanvas.width;\n      const h = powerCanvas.height;\n      const padL = 55;\n      const padR = 18;\n      const padT = 20;\n      const padB = 40;\n      const plotW = w - padL - padR;\n      const plotH = h - padT - padB;\n\n      ctx.clearRect(0, 0, w, h);\n\n      const xMax = 25;\n      let maxP = 0;\n      for (let v = 0; v <= xMax; v += 0.2) {\n        const available = 0.5 * m.density * m.area * Math.pow(v, 3);\n        maxP = Math.max(maxP, available);\n      }\n      const yMax = maxP * 1.05;\n\n      ctx.strokeStyle = \"#e5e7eb\";\n      ctx.lineWidth = 1;\n      for (let i = 0; i <= 10; i++) {\n        const x = padL + (plotW / 10) * i;\n        ctx.beginPath();\n        ctx.moveTo(x, padT);\n        ctx.lineTo(x, h - padB);\n        ctx.stroke();\n      }\n      for (let i = 0; i <= 5; i++) {\n        const y = padT + (plotH / 5) * i;\n        ctx.beginPath();\n        ctx.moveTo(padL, y);\n        ctx.lineTo(w - padR, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(padL, padT);\n      ctx.lineTo(padL, h - padB);\n      ctx.lineTo(w - padR, h - padB);\n      ctx.stroke();\n\n      function mapX(v) {\n        return padL + (v / xMax) * plotW;\n      }\n\n      function mapY(p) {\n        return h - padB - (p / yMax) * plotH;\n      }\n\n      // available wind power\n      ctx.strokeStyle = \"#dc2626\";\n      ctx.lineWidth = 2.5;\n      ctx.beginPath();\n      for (let v = 0; v <= xMax; v += 0.1) {\n        const p = 0.5 * m.density * m.area * Math.pow(v, 3);\n        const x = mapX(v);\n        const y = mapY(p);\n        if (v === 0) ctx.moveTo(x, y);\n        else ctx.lineTo(x, y);\n      }\n      ctx.stroke();\n\n      // electrical output\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n      let started = false;\n      for (let v = 0; v <= xMax; v += 0.1) {\n        let p = 0;\n        if (v >= m.cutIn && v <= m.cutOut) {\n          p = m.efficiency * m.cp * 0.5 * m.density * m.area * Math.pow(v, 3);\n        }\n        const x = mapX(v);\n        const y = mapY(p);\n        if (!started) {\n          ctx.moveTo(x, y);\n          started = true;\n        } else {\n          ctx.lineTo(x, y);\n        }\n      }\n      ctx.stroke();\n\n      // current operating point\n      const currentX = mapX(m.wind);\n      const currentY = mapY(m.elecPower);\n      ctx.fillStyle = \"#2563eb\";\n      ctx.beginPath();\n      ctx.arc(currentX, currentY, 6, 0, Math.PI * 2);\n      ctx.fill();\n\n      // cut-in and cut-out markers\n      [m.cutIn, m.cutOut].forEach(v => {\n        const x = mapX(v);\n        ctx.strokeStyle = \"#9ca3af\";\n        ctx.setLineDash([6, 5]);\n        ctx.beginPath();\n        ctx.moveTo(x, padT);\n        ctx.lineTo(x, h - padB);\n        ctx.stroke();\n        ctx.setLineDash([]);\n      });\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"15px Arial\";\n      ctx.fillText(\"Wind speed (m/s)\", w / 2 - 48, h - 10);\n\n      ctx.save();\n      ctx.translate(18, h / 2 + 30);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(\"Power (W)\", 0, 0);\n      ctx.restore();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"13px Arial\";\n      for (let i = 0; i <= 10; i++) {\n        const val = (xMax / 10) * i;\n        const x = padL + (plotW / 10) * i;\n        ctx.fillText(val.toFixed(0), x - 5, h - padB + 18);\n      }\n      for (let i = 0; i <= 5; i++) {\n        const val = yMax - (yMax / 5) * i;\n        const y = padT + (plotH / 5) * i;\n        const label = val >= 1e6 ? `${(val / 1e6).toFixed(1)}M` : `${(val / 1e3).toFixed(0)}k`;\n        ctx.fillText(label, 5, y + 4);\n      }\n    }\n\n    function updateAll() {\n      const m = getModel();\n      updateText(m);\n      drawPowerChart(m);\n    }\n\n    function animate() {\n      const m = getModel();\n      drawTurbine(m);\n      requestAnimationFrame(animate);\n    }\n\n    locationSelect.addEventListener(\"change\", syncPreset);\n\n    densitySlider.addEventListener(\"input\", () => {\n      locationSelect.value = \"custom\";\n      updateAll();\n    });\n\n    [\n      windSlider,\n      radiusSlider,\n      cpSlider,\n      generatorSlider,\n      cutInSlider,\n      cutOutSlider\n    ].forEach(el => el.addEventListener(\"input\", updateAll));\n\n    updateAll();\n    requestAnimationFrame(animate);\n  <\/script>\n<\/body>\n<\/html>", "weather-visualizer": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Weather Visualizer<\/title>\n  <style>\n    :root{\n      --bg:#eef4fb;\n      --panel:#ffffff;\n      --line:#d9e3ef;\n      --text:#122033;\n      --muted:#5c6b7b;\n      --accent:#2563eb;\n    }\n\n    *{box-sizing:border-box}\n\n    body{\n      margin:0;\n      font-family:Arial, Helvetica, sans-serif;\n      background:linear-gradient(180deg,#edf4fb 0%, #dfeaf6 100%);\n      color:var(--text);\n    }\n\n    .wrap{\n      max-width:1450px;\n      margin:0 auto;\n      padding:20px;\n    }\n\n    .title{\n      background:linear-gradient(135deg,#eef5ff,#ffffff);\n      border:1px solid var(--line);\n      border-radius:18px;\n      padding:20px;\n      margin-bottom:18px;\n      box-shadow:0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    .title h1{\n      margin:0 0 8px;\n      font-size:30px;\n    }\n\n    .title p{\n      margin:0;\n      color:var(--muted);\n      line-height:1.6;\n    }\n\n    .layout{\n      display:grid;\n      grid-template-columns:320px 1fr;\n      gap:18px;\n    }\n\n    .panel,\n    .viewer{\n      background:var(--panel);\n      border:1px solid var(--line);\n      border-radius:18px;\n      padding:18px;\n      box-shadow:0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    .block{\n      border:1px solid var(--line);\n      border-radius:14px;\n      padding:14px;\n      margin-bottom:14px;\n      background:#fbfdff;\n    }\n\n    .block h3{\n      margin:0 0 12px;\n      font-size:17px;\n    }\n\n    .check{\n      display:flex;\n      align-items:center;\n      gap:10px;\n      margin-bottom:10px;\n      font-size:15px;\n    }\n\n    .check:last-child{\n      margin-bottom:0;\n    }\n\n    .row{\n      margin-bottom:12px;\n    }\n\n    label{\n      display:block;\n      font-weight:bold;\n      margin-bottom:6px;\n      font-size:14px;\n    }\n\n    .range-wrap{\n      display:grid;\n      grid-template-columns:1fr 80px;\n      gap:10px;\n      align-items:center;\n    }\n\n    .value{\n      text-align:center;\n      border:1px solid var(--line);\n      border-radius:10px;\n      background:#fff;\n      padding:8px;\n      color:var(--accent);\n      font-weight:bold;\n      font-size:14px;\n    }\n\n    input[type=\"range\"]{\n      width:100%;\n    }\n\n    .btns{\n      display:flex;\n      flex-wrap:wrap;\n      gap:10px;\n    }\n\n    button{\n      border:1px solid var(--line);\n      background:#fff;\n      color:var(--text);\n      padding:10px 14px;\n      border-radius:10px;\n      cursor:pointer;\n      font:inherit;\n      transition:.2s;\n    }\n\n    button:hover{\n      border-color:var(--accent);\n      color:var(--accent);\n    }\n\n    .primary{\n      background:var(--accent);\n      color:#fff;\n      border-color:var(--accent);\n    }\n\n    .primary:hover{\n      color:#fff;\n      opacity:.94;\n    }\n\n    .stats{\n      display:grid;\n      grid-template-columns:repeat(5,1fr);\n      gap:12px;\n      margin-bottom:14px;\n    }\n\n    .stat{\n      border:1px solid var(--line);\n      border-radius:12px;\n      background:#fff;\n      padding:12px;\n    }\n\n    .stat small{\n      display:block;\n      color:var(--muted);\n      margin-bottom:6px;\n    }\n\n    .stat strong{\n      font-size:18px;\n    }\n\n    .canvas-box{\n      border:1px solid var(--line);\n      border-radius:16px;\n      padding:10px;\n      background:#f8fbff;\n    }\n\n    canvas{\n      width:100%;\n      display:block;\n      border-radius:12px;\n      border:1px solid #e5edf7;\n      background:#fff;\n    }\n\n    .note{\n      color:var(--muted);\n      line-height:1.6;\n      font-size:14px;\n    }\n\n    @media (max-width:1100px){\n      .layout{grid-template-columns:1fr}\n      .stats{grid-template-columns:repeat(2,1fr)}\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"wrap\">\n    <div class=\"title\">\n      <h1>Weather Visualizer<\/h1>\n      <p>\n        Interactive HTML canvas weather scene with animated rain, snow, drifting clouds, lightning flashes,\n        and wind particles. Turn effects on and off and adjust intensity and wind strength.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <div class=\"block\">\n          <h3>Weather effects<\/h3>\n\n          <label class=\"check\">\n            <input type=\"checkbox\" id=\"rainToggle\" checked />\n            Rain\n          <\/label>\n\n          <label class=\"check\">\n            <input type=\"checkbox\" id=\"snowToggle\" />\n            Snow\n          <\/label>\n\n          <label class=\"check\">\n            <input type=\"checkbox\" id=\"cloudToggle\" checked />\n            Clouds\n          <\/label>\n\n          <label class=\"check\">\n            <input type=\"checkbox\" id=\"lightningToggle\" checked />\n            Lightning\n          <\/label>\n\n          <label class=\"check\">\n            <input type=\"checkbox\" id=\"windToggle\" checked />\n            Wind particles\n          <\/label>\n        <\/div>\n\n        <div class=\"block\">\n          <h3>Controls<\/h3>\n\n          <div class=\"row\">\n            <label for=\"intensity\">Intensity<\/label>\n            <div class=\"range-wrap\">\n              <input type=\"range\" id=\"intensity\" min=\"1\" max=\"10\" step=\"1\" value=\"6\" />\n              <div class=\"value\" id=\"intensityVal\">6<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"row\">\n            <label for=\"windSpeed\">Wind strength<\/label>\n            <div class=\"range-wrap\">\n              <input type=\"range\" id=\"windSpeed\" min=\"-10\" max=\"10\" step=\"1\" value=\"4\" />\n              <div class=\"value\" id=\"windSpeedVal\">4<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"row\">\n            <label for=\"cloudSpeed\">Cloud speed<\/label>\n            <div class=\"range-wrap\">\n              <input type=\"range\" id=\"cloudSpeed\" min=\"1\" max=\"10\" step=\"1\" value=\"4\" />\n              <div class=\"value\" id=\"cloudSpeedVal\">4<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"block\">\n          <h3>Presets<\/h3>\n          <div class=\"btns\">\n            <button id=\"stormBtn\">Thunderstorm<\/button>\n            <button id=\"snowBtn\">Snowy<\/button>\n            <button id=\"windyBtn\">Windy<\/button>\n            <button id=\"clearBtn\">Cloudy<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"block\">\n          <h3>Actions<\/h3>\n          <div class=\"btns\">\n            <button class=\"primary\" id=\"pauseBtn\">Pause<\/button>\n            <button id=\"resetBtn\">Reset<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"block\">\n          <h3>Notes<\/h3>\n          <div class=\"note\">\n            Positive wind values push particles to the right. Negative values push them to the left.\n            Lightning appears only when clouds and lightning are enabled.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"viewer\">\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Rain drops<\/small>\n            <strong id=\"rainCount\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Snow flakes<\/small>\n            <strong id=\"snowCount\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Clouds<\/small>\n            <strong id=\"cloudCount\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Wind particles<\/small>\n            <strong id=\"windCount\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Lightning flashes<\/small>\n            <strong id=\"lightningCount\">0<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"canvas-box\">\n          <canvas id=\"weatherCanvas\" width=\"1200\" height=\"760\"><\/canvas>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <script>\n    const canvas = document.getElementById(\"weatherCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n    const W = canvas.width;\n    const H = canvas.height;\n\n    const rainToggle = document.getElementById(\"rainToggle\");\n    const snowToggle = document.getElementById(\"snowToggle\");\n    const cloudToggle = document.getElementById(\"cloudToggle\");\n    const lightningToggle = document.getElementById(\"lightningToggle\");\n    const windToggle = document.getElementById(\"windToggle\");\n\n    const intensity = document.getElementById(\"intensity\");\n    const windSpeed = document.getElementById(\"windSpeed\");\n    const cloudSpeed = document.getElementById(\"cloudSpeed\");\n\n    const intensityVal = document.getElementById(\"intensityVal\");\n    const windSpeedVal = document.getElementById(\"windSpeedVal\");\n    const cloudSpeedVal = document.getElementById(\"cloudSpeedVal\");\n\n    const rainCount = document.getElementById(\"rainCount\");\n    const snowCount = document.getElementById(\"snowCount\");\n    const cloudCount = document.getElementById(\"cloudCount\");\n    const windCount = document.getElementById(\"windCount\");\n    const lightningCount = document.getElementById(\"lightningCount\");\n\n    const pauseBtn = document.getElementById(\"pauseBtn\");\n    const resetBtn = document.getElementById(\"resetBtn\");\n    const stormBtn = document.getElementById(\"stormBtn\");\n    const snowBtn = document.getElementById(\"snowBtn\");\n    const windyBtn = document.getElementById(\"windyBtn\");\n    const clearBtn = document.getElementById(\"clearBtn\");\n\n    let rainDrops = [];\n    let snowFlakes = [];\n    let clouds = [];\n    let gusts = [];\n\n    let paused = false;\n    let lastTime = 0;\n    let lightningFlashCount = 0;\n\n    let lightning = {\n      active: false,\n      timer: 0,\n      nextFlash: 2 + Math.random() * 4,\n      flashAlpha: 0,\n      bolt: []\n    };\n\n    function rand(min, max) {\n      return Math.random() * (max - min) + min;\n    }\n\n    function updateLabels() {\n      intensityVal.textContent = intensity.value;\n      windSpeedVal.textContent = windSpeed.value;\n      cloudSpeedVal.textContent = cloudSpeed.value;\n    }\n\n    function makeRainDrop() {\n      return {\n        x: rand(-100, W + 100),\n        y: rand(-H, 0),\n        len: rand(12, 22),\n        speed: rand(12, 22)\n      };\n    }\n\n    function makeSnowFlake() {\n      return {\n        x: rand(0, W),\n        y: rand(-H, 0),\n        r: rand(1.5, 4),\n        speed: rand(0.5, 1.8),\n        drift: rand(0, Math.PI * 2),\n        wobble: rand(0.4, 1.4)\n      };\n    }\n\n    function makeCloud(x = rand(-100, W + 100)) {\n      return {\n        x,\n        y: rand(70, 250),\n        scale: rand(0.8, 1.8),\n        speed: rand(0.1, 0.45),\n        shade: rand(170, 240)\n      };\n    }\n\n    function makeGust() {\n      return {\n        x: rand(-100, W),\n        y: rand(80, H - 100),\n        len: rand(20, 60),\n        speed: rand(3, 8),\n        alpha: rand(0.12, 0.35)\n      };\n    }\n\n    function syncParticles() {\n      const level = Number(intensity.value);\n\n      const desiredRain = rainToggle.checked ? level * 45 : 0;\n      const desiredSnow = snowToggle.checked ? level * 28 : 0;\n      const desiredClouds = cloudToggle.checked ? Math.max(3, Math.floor(level / 2) + 4) : 0;\n      const desiredGusts = windToggle.checked ? level * 18 : 0;\n\n      while (rainDrops.length < desiredRain) rainDrops.push(makeRainDrop());\n      while (rainDrops.length > desiredRain) rainDrops.pop();\n\n      while (snowFlakes.length < desiredSnow) snowFlakes.push(makeSnowFlake());\n      while (snowFlakes.length > desiredSnow) snowFlakes.pop();\n\n      while (clouds.length < desiredClouds) clouds.push(makeCloud());\n      while (clouds.length > desiredClouds) clouds.pop();\n\n      while (gusts.length < desiredGusts) gusts.push(makeGust());\n      while (gusts.length > desiredGusts) gusts.pop();\n\n      rainCount.textContent = rainDrops.length;\n      snowCount.textContent = snowFlakes.length;\n      cloudCount.textContent = clouds.length;\n      windCount.textContent = gusts.length;\n      lightningCount.textContent = lightningFlashCount;\n    }\n\n    function resetScene() {\n      rainDrops = [];\n      snowFlakes = [];\n      clouds = [];\n      gusts = [];\n      lightningFlashCount = 0;\n      lightning.active = false;\n      lightning.timer = 0;\n      lightning.flashAlpha = 0;\n      lightning.nextFlash = 2 + Math.random() * 4;\n      lightning.bolt = [];\n      syncParticles();\n    }\n\n    function createLightningBolt() {\n      const startX = rand(W * 0.2, W * 0.8);\n      let x = startX;\n      let y = rand(60, 150);\n      const points = [{ x, y }];\n\n      while (y < H * 0.7) {\n        x += rand(-35, 35);\n        y += rand(20, 45);\n        points.push({ x, y });\n        if (Math.random() < 0.2) break;\n      }\n\n      lightning.bolt = points;\n      lightning.active = true;\n      lightning.timer = 0.16;\n      lightning.flashAlpha = 0.85;\n      lightningFlashCount++;\n    }\n\n    function updateLightning(dt) {\n      if (!lightningToggle.checked || !cloudToggle.checked) {\n        lightning.active = false;\n        lightning.flashAlpha = 0;\n        return;\n      }\n\n      lightning.nextFlash -= dt;\n      if (lightning.nextFlash <= 0) {\n        createLightningBolt();\n        lightning.nextFlash = rand(2.5, 7);\n      }\n\n      if (lightning.active) {\n        lightning.timer -= dt;\n        lightning.flashAlpha *= 0.88;\n        if (lightning.timer <= 0) {\n          lightning.active = false;\n        }\n      }\n    }\n\n    function updateRain(dt) {\n      const wind = Number(windSpeed.value);\n\n      for (const d of rainDrops) {\n        d.x += wind * 2.2 * dt * 60;\n        d.y += d.speed * dt * 60;\n\n        if (d.y > H) {\n          d.y = rand(-120, -20);\n          d.x = rand(-80, W + 80);\n        }\n        if (d.x > W + 120 || d.x < -120) {\n          d.x = rand(-80, W + 80);\n        }\n      }\n    }\n\n    function updateSnow(dt) {\n      const wind = Number(windSpeed.value);\n\n      for (const s of snowFlakes) {\n        s.drift += 0.03;\n        s.x += (wind * 0.45 + Math.sin(s.drift) * s.wobble) * dt * 60;\n        s.y += s.speed * dt * 60;\n\n        if (s.y > H + 10) {\n          s.y = rand(-80, -10);\n          s.x = rand(0, W);\n        }\n        if (s.x > W + 20) s.x = -20;\n        if (s.x < -20) s.x = W + 20;\n      }\n    }\n\n    function updateClouds(dt) {\n      const base = Number(cloudSpeed.value) * 0.12;\n      const wind = Number(windSpeed.value) * 0.015;\n\n      for (const c of clouds) {\n        c.x += (c.speed + base + wind) * dt * 60;\n        if (c.x - 140 * c.scale > W) {\n          c.x = -200 * c.scale;\n          c.y = rand(70, 250);\n          c.scale = rand(0.8, 1.8);\n          c.shade = rand(170, 240);\n        }\n      }\n    }\n\n    function updateGusts(dt) {\n      const wind = Number(windSpeed.value);\n\n      for (const g of gusts) {\n        g.x += (g.speed + wind * 0.8) * dt * 60;\n        g.y += Math.sin((g.x + g.y) * 0.01) * 0.3;\n\n        if (g.x > W + 100) {\n          g.x = -100;\n          g.y = rand(80, H - 100);\n        }\n        if (g.x < -120) {\n          g.x = W + 80;\n          g.y = rand(80, H - 100);\n        }\n      }\n    }\n\n    function drawBackground() {\n      const hasStorm = rainToggle.checked || lightningToggle.checked;\n      const hasSnow = snowToggle.checked && !rainToggle.checked;\n\n      let skyTop = \"#7bb0e0\";\n      let skyBottom = \"#d8ecff\";\n\n      if (hasStorm) {\n        skyTop = \"#485f7c\";\n        skyBottom = \"#8fa6bf\";\n      } else if (hasSnow) {\n        skyTop = \"#a4bfd8\";\n        skyBottom = \"#eef7ff\";\n      }\n\n      const grad = ctx.createLinearGradient(0, 0, 0, H);\n      grad.addColorStop(0, skyTop);\n      grad.addColorStop(1, skyBottom);\n      ctx.fillStyle = grad;\n      ctx.fillRect(0, 0, W, H);\n\n      const groundGrad = ctx.createLinearGradient(0, H * 0.72, 0, H);\n      groundGrad.addColorStop(0, hasSnow ? \"#edf4fb\" : \"#7cb36a\");\n      groundGrad.addColorStop(1, hasSnow ? \"#d9e8f2\" : \"#568648\");\n      ctx.fillStyle = groundGrad;\n      ctx.fillRect(0, H * 0.72, W, H * 0.28);\n\n      drawMountains();\n    }\n\n    function drawMountains() {\n      ctx.fillStyle = \"rgba(80, 101, 123, 0.35)\";\n      ctx.beginPath();\n      ctx.moveTo(0, H * 0.78);\n      ctx.lineTo(170, H * 0.58);\n      ctx.lineTo(340, H * 0.78);\n      ctx.lineTo(520, H * 0.55);\n      ctx.lineTo(700, H * 0.78);\n      ctx.lineTo(900, H * 0.52);\n      ctx.lineTo(1200, H * 0.78);\n      ctx.lineTo(1200, H);\n      ctx.lineTo(0, H);\n      ctx.closePath();\n      ctx.fill();\n    }\n\n    function drawCloud(cloud) {\n      const s = cloud.scale;\n      const x = cloud.x;\n      const y = cloud.y;\n      const shade = cloud.shade;\n\n      ctx.fillStyle = `rgba(${shade},${shade},${shade + 8},0.88)`;\n\n      ctx.beginPath();\n      ctx.arc(x, y, 34 * s, Math.PI * 0.5, Math.PI * 1.5);\n      ctx.arc(x + 35 * s, y - 18 * s, 42 * s, Math.PI, Math.PI * 2);\n      ctx.arc(x + 82 * s, y - 4 * s, 36 * s, Math.PI * 1.1, Math.PI * 1.95);\n      ctx.arc(x + 118 * s, y + 6 * s, 26 * s, Math.PI * 1.5, Math.PI * 0.5);\n      ctx.closePath();\n      ctx.fill();\n    }\n\n    function drawClouds() {\n      if (!cloudToggle.checked) return;\n      for (const c of clouds) drawCloud(c);\n    }\n\n    function drawRain() {\n      if (!rainToggle.checked) return;\n      const wind = Number(windSpeed.value);\n\n      ctx.strokeStyle = \"rgba(190, 220, 255, 0.8)\";\n      ctx.lineWidth = 1.5;\n\n      for (const d of rainDrops) {\n        ctx.beginPath();\n        ctx.moveTo(d.x, d.y);\n        ctx.lineTo(d.x - wind * 1.4, d.y + d.len);\n        ctx.stroke();\n      }\n    }\n\n    function drawSnow() {\n      if (!snowToggle.checked) return;\n\n      for (const s of snowFlakes) {\n        ctx.beginPath();\n        ctx.fillStyle = \"rgba(255,255,255,0.92)\";\n        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);\n        ctx.fill();\n      }\n    }\n\n    function drawWindParticles() {\n      if (!windToggle.checked) return;\n      const wind = Number(windSpeed.value);\n\n      for (const g of gusts) {\n        ctx.strokeStyle = `rgba(255,255,255,${g.alpha})`;\n        ctx.lineWidth = 1.2;\n        ctx.beginPath();\n        ctx.moveTo(g.x, g.y);\n        ctx.lineTo(g.x + g.len + wind * 2, g.y + Math.sin(g.x * 0.02) * 4);\n        ctx.stroke();\n      }\n    }\n\n    function drawLightning() {\n      if (!lightning.active) return;\n\n      ctx.save();\n      ctx.strokeStyle = \"rgba(255,255,255,0.98)\";\n      ctx.lineWidth = 4;\n      ctx.shadowColor = \"rgba(255,255,255,0.95)\";\n      ctx.shadowBlur = 18;\n      ctx.beginPath();\n\n      lightning.bolt.forEach((p, i) => {\n        if (i === 0) ctx.moveTo(p.x, p.y);\n        else ctx.lineTo(p.x, p.y);\n      });\n\n      ctx.stroke();\n      ctx.restore();\n    }\n\n    function drawFlashOverlay() {\n      if (lightning.flashAlpha <= 0.01) return;\n      ctx.fillStyle = `rgba(255,255,255,${lightning.flashAlpha * 0.35})`;\n      ctx.fillRect(0, 0, W, H);\n    }\n\n    function drawScene() {\n      ctx.clearRect(0, 0, W, H);\n      drawBackground();\n      drawClouds();\n      drawWindParticles();\n      drawRain();\n      drawSnow();\n      drawLightning();\n      drawFlashOverlay();\n    }\n\n    function animate(ts) {\n      if (!lastTime) lastTime = ts;\n      let dt = (ts - lastTime) / 1000;\n      lastTime = ts;\n      if (dt > 0.04) dt = 0.04;\n\n      if (!paused) {\n        syncParticles();\n        updateRain(dt);\n        updateSnow(dt);\n        updateClouds(dt);\n        updateGusts(dt);\n        updateLightning(dt);\n        lightningCount.textContent = lightningFlashCount;\n      }\n\n      drawScene();\n      requestAnimationFrame(animate);\n    }\n\n    function setPreset(type) {\n      if (type === \"storm\") {\n        rainToggle.checked = true;\n        snowToggle.checked = false;\n        cloudToggle.checked = true;\n        lightningToggle.checked = true;\n        windToggle.checked = true;\n        intensity.value = 8;\n        windSpeed.value = 6;\n        cloudSpeed.value = 5;\n      }\n\n      if (type === \"snow\") {\n        rainToggle.checked = false;\n        snowToggle.checked = true;\n        cloudToggle.checked = true;\n        lightningToggle.checked = false;\n        windToggle.checked = true;\n        intensity.value = 7;\n        windSpeed.value = 2;\n        cloudSpeed.value = 3;\n      }\n\n      if (type === \"windy\") {\n        rainToggle.checked = false;\n        snowToggle.checked = false;\n        cloudToggle.checked = true;\n        lightningToggle.checked = false;\n        windToggle.checked = true;\n        intensity.value = 6;\n        windSpeed.value = 9;\n        cloudSpeed.value = 7;\n      }\n\n      if (type === \"clear\") {\n        rainToggle.checked = false;\n        snowToggle.checked = false;\n        cloudToggle.checked = true;\n        lightningToggle.checked = false;\n        windToggle.checked = false;\n        intensity.value = 4;\n        windSpeed.value = 1;\n        cloudSpeed.value = 2;\n      }\n\n      updateLabels();\n      syncParticles();\n    }\n\n    pauseBtn.addEventListener(\"click\", () => {\n      paused = !paused;\n      pauseBtn.textContent = paused ? \"Resume\" : \"Pause\";\n    });\n\n    resetBtn.addEventListener(\"click\", resetScene);\n    stormBtn.addEventListener(\"click\", () => setPreset(\"storm\"));\n    snowBtn.addEventListener(\"click\", () => setPreset(\"snow\"));\n    windyBtn.addEventListener(\"click\", () => setPreset(\"windy\"));\n    clearBtn.addEventListener(\"click\", () => setPreset(\"clear\"));\n\n    intensity.addEventListener(\"input\", updateLabels);\n    windSpeed.addEventListener(\"input\", updateLabels);\n    cloudSpeed.addEventListener(\"input\", updateLabels);\n\n    updateLabels();\n    resetScene();\n    requestAnimationFrame(animate);\n  <\/script>\n<\/body>\n<\/html>", "Interactive_Truss_Experiment": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Interactive Truss Experiment<\/title>\n  <style>\n    :root {\n      --bg: #f5f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280
