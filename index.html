<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interactive Learning</title>
<style>
:root{--bg:#fff4d6;--ink:#241b4d;--card:#fff;--p:#7c4dff;--o:#ff7a45;--pk:#ff5c93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1535;--ink:#f4f0ff;--card:#2a2350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1535;--ink:#f4f0ff;--card:#2a2350;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 8% 8%,#ff5c9355,transparent 30%),radial-gradient(circle at 92% 18%,#3d9bff55,transparent 30%),radial-gradient(circle at 50% 100%,#ffc83d55,transparent 40%)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:linear-gradient(90deg,#7c4dff,#ff5c93,#ff7a45);color:#fff}
.logo{color:#fff;font-weight:800;font-size:24px;text-decoration:none}
#hud{background:#ffffff40;padding:4px 14px;border-radius:99px;font-weight:700}
.wrap{max-width:1600px;margin:0 auto;padding:22px clamp(10px,2.4vw,36px)}
h1{font-size:clamp(32px,7vw,58px);line-height:1.1;margin:.2em 0}
h1 span{color:var(--p)}
.hero{text-align:center}
.roles,.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:22px 0}
.role,.card{background:var(--card);color:var(--ink);border:0;border-radius:24px;padding:20px;cursor:pointer;font:inherit;text-decoration:none;box-shadow:0 7px 0 var(--c,#7c4dff),0 14px 26px #0003;transition:transform .15s}
.role{text-align:center}
.role:nth-child(1){--c:#3d9bff}.role:nth-child(2){--c:#ff7a45}.role:nth-child(3){--c:#17c3a2}
.role:hover,.card:hover,.role:focus-visible,.card:focus-visible{transform:translateY(-6px) rotate(-1.5deg)}
.role b,.em{font-size:58px;display:block;line-height:1.2}
.role h3{margin:.2em 0;font-size:24px}
.card{border-top:12px solid var(--c);display:block}
.card h3{margin:0;font-size:24px;color:var(--c)}
.card p{margin:.4em 0 .8em}
.bar{height:10px;background:#0002;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.badge{font-size:30px;filter:grayscale(1);opacity:.35}.badge.on{filter:none;opacity:1}
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 26px #0003}
.back{display:inline-block;margin-bottom:6px;font-weight:700;color:var(--p);text-decoration:none}
canvas{width:100%;height:auto;border-radius:14px;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
button,select{font:inherit}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts button,.ctl button,.ghost{background:var(--p);color:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0004}
.opts button:active,.ctl button:active{transform:translateY(3px);box-shadow:none}
.big{background:var(--o)!important;font-size:18px!important}
input[type=range]{vertical-align:middle}
.stage{position:relative;height:120px;background:linear-gradient(#8fdcff,#e0f7ff);border-radius:16px;overflow:hidden}
.stage:before,.stage:after{content:"";position:absolute;bottom:0;width:12%;height:38px;background:#6b4a2f}
.stage:before{left:0}.stage:after{right:0}
#truck{position:absolute;bottom:40px;left:0;font-size:36px;transition:left .6s}
#br{position:absolute;bottom:32px;left:12%;right:12%;display:flex;gap:3px}
#br i{flex:1;height:10px;border-radius:4px;background:#0002}
#br i.on{background:#8b5a2b}
#fl{min-height:84px;display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:4px solid var(--p);border-radius:0 0 44px 44px;background:#7c4dff18}
.at{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;border:0;cursor:pointer}
#gd{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cell{aspect-ratio:1;border:0;border-radius:8px;font-size:26px;cursor:pointer}
.stats{display:flex;justify-content:center;gap:30px;font-size:15px;margin:10px 0}.stats b{display:block;font-size:36px;color:var(--p)}.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));text-align:left;margin:14px 0 26px}.steps .em{font-size:42px}.chip{color:#fff;text-decoration:none;padding:8px 16px;border-radius:99px;font-weight:700;box-shadow:0 4px 0 #0004}.mc{font-size:14px;min-height:60px}.arena{position:relative;height:300px;overflow:hidden;border-radius:16px;background:linear-gradient(#8fdcff,#e8f9ff)}.bb{position:absolute;bottom:-60px;width:23%;min-height:56px;padding:6px;border-radius:30px;border:0;background:#fff;color:#241b4d;font-weight:700;box-shadow:inset 0 0 0 4px var(--p),0 4px 0 #0003;cursor:pointer;animation:rise 8s linear forwards}@keyframes rise{to{transform:translateY(-380px)}}.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx span{position:absolute;top:-30px;font-size:28px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#7c4dff;z-index:19}
#nav{display:flex;gap:4px;overflow-x:auto;flex:1;justify-content:center}
#nav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
#nav a.on,#nav a:hover{background:#ffffff45}
@media (max-width:760px){#nav{order:3;flex-basis:100%;justify-content:flex-start}}
.lead{font-size:19px;max-width:680px;margin:0 auto 16px}
.simbox{background:#04101d;border-radius:20px;padding:8px;box-shadow:0 8px 0 var(--p),0 16px 30px #0004;margin:12px 0}
.simbox iframe{width:100%;height:78vh;min-height:560px;border:0;border-radius:14px;background:#04101d;display:block}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));text-align:left}
ol li,ul li{margin:.5em 0}
#ft{margin-top:30px;padding:20px 16px;background:#00000014;text-align:center;font-size:15px}
#ft a{color:var(--p);font-weight:700;text-decoration:none}

html{scroll-behavior:smooth}
:focus-visible{outline:3px solid #ffc83d;outline-offset:2px}
.wrap{animation:fadeup .5s ease both}@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
.card,.role,.panel{transition:transform .2s,box-shadow .2s}
#lg{display:flex;gap:2px;background:#ffffff30;border-radius:99px;padding:3px}
#lg button{background:none;border:0;color:#fff;font-weight:700;padding:4px 12px;border-radius:99px;cursor:pointer}
#lg button[aria-pressed=true]{background:#fff;color:#7c4dff}
[dir=rtl] body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
[dir=rtl] .steps,[dir=rtl] .two,[dir=rtl] .grid,[dir=rtl] .panel{text-align:right}
[dir=rtl] .hero,[dir=rtl] .role{text-align:center}
.tank{height:200px;border-radius:16px;background:linear-gradient(#e8f9ff 0 40px,#3d9bff 40px);position:relative}
.tank span{position:absolute;left:50%;top:0;margin-left:-20px;font-size:40px;transition:transform 1.2s}
.ctl .bit{width:52px;height:68px;border-radius:14px;font-size:24px;padding:0;background:#0003;color:var(--ink)}
.ctl .bit.on{background:#ffc83d;color:#241b4d;box-shadow:0 0 18px #ffc83d}
.bit small{display:block;font-size:11px}
.seesaw{position:relative;height:150px;margin:10px 0}
#bm{position:absolute;top:60px;left:5%;right:5%;height:12px;background:#8b5a2b;border-radius:6px;transition:transform .4s}
#bm span{position:absolute;top:-36px;font-size:30px;transform:translateX(-50%)}
.seesaw i{position:absolute;left:50%;top:72px;margin-left:-20px;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:50px solid #6b4a2f}
.sws{display:flex;gap:16px;margin:8px 0}.sw{width:120px;height:80px;border-radius:14px;border:3px solid var(--ink)}
.pz{width:200px;height:200px;border-radius:50%;margin:10px auto;border:6px solid #c98a3f}
.ctl .pc{width:40px;height:40px;border-radius:50%;padding:0}
.sg{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:360px;margin:auto}
.sc{aspect-ratio:1;border:2px solid #0003;border-radius:8px;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:auto}
.fc{aspect-ratio:1;border:0;background:none;perspective:600px;cursor:pointer;padding:0}
.fc .in{display:block;width:100%;height:100%;position:relative;transition:transform .5s;transform-style:preserve-3d}
.fc.up .in,.fc.ok .in{transform:rotateY(180deg)}
.fc b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(26px,7vw,40px);border-radius:14px;backface-visibility:hidden;background:var(--p);color:#fff}
.fc .bk{transform:rotateY(180deg);background:var(--card);color:var(--ink);border:3px solid var(--p)}
.fc.ok .bk{border-color:#17c3a2;box-shadow:0 0 14px #17c3a2}.fc.no{animation:sh .35s}.fc.no .bk{border-color:#ff5c5c}

.hx{position:relative;overflow:hidden;background:radial-gradient(520px circle at var(--mx,50%) var(--my,30%),#ffffff66,transparent 60%)}
.hx .wrap{position:relative}
.fl{position:absolute;inset:0;pointer-events:none}
.fl span{position:absolute;opacity:.4;animation:flt 9s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-30px) rotate(14deg)}}
h1 span{background:linear-gradient(90deg,#7c4dff,#ff5c93,#ff7a45,#7c4dff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
@keyframes gs{to{background-position:300%}}
.hx .hero>*{animation:fadeup .7s ease both}
.hx .hero>:nth-child(2){animation-delay:.12s}.hx .hero>:nth-child(3){animation-delay:.24s}.hx .hero>:nth-child(4){animation-delay:.36s}.hx .hero>:nth-child(5){animation-delay:.48s}
.rot{font-size:clamp(20px,4vw,30px);font-weight:800;margin:6px 0 14px}
#rw{display:inline-block;min-width:8ch;transition:opacity .3s}
.pulse{animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #ff7a4580}70%{box-shadow:0 0 0 18px #ff7a4500}100%{box-shadow:0 0 0 0 #ff7a4500}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.mq{overflow:hidden;margin:18px 0;mask-image:linear-gradient(90deg,#0000,#000 8%,#000 92%,#0000)}
.mt{display:flex;gap:12px;width:max-content;animation:mq 32s linear infinite}
.mq:hover .mt{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mt .chip{transition:transform .2s}.mt .chip:hover{transform:scale(1.15) rotate(-3deg)}
.opts button:disabled{opacity:1;color:#fff;cursor:default}
.tilt,.role{will-change:transform}
.stats b{font-variant-numeric:tabular-nums}
.roles,.grid,.steps{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
#game{max-width:920px;margin-inline:auto}
.simbox iframe{height:80vh}
.stats{gap:clamp(10px,3vw,28px);flex-wrap:wrap}
.st{position:relative;overflow:hidden;flex:1 1 170px;max-width:280px;background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:0 7px 0 var(--p),0 14px 26px #0003;animation:bob 4s ease-in-out infinite}
.st:nth-child(2){animation-delay:-1.3s;box-shadow:0 7px 0 #ff5c93,0 14px 26px #0003}
.st:nth-child(3){animation-delay:-2.6s;box-shadow:0 7px 0 #00a6b2,0 14px 26px #0003}
.st i{display:block;font-style:normal;font-size:38px;animation:wig 2.4s ease-in-out infinite}
.stats .st b{font-size:clamp(32px,6vw,52px);background:linear-gradient(90deg,#7c4dff,#ff5c93,#ff7a45);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
.st:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,#0000,#ffffff66,#0000);transform:skewX(-20deg);animation:shn 3.5s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}@keyframes wig{50%{transform:scale(1.2) rotate(8deg)}}@keyframes shn{to{left:130%}}
@media (max-width:760px){header{padding:10px 12px}.logo{font-size:20px}h2{font-size:22px}.role b,.em{font-size:46px}.panel{padding:12px}.opts,.ctl{gap:8px}.simbox{padding:4px;border-radius:14px}.simbox iframe{min-height:420px;height:72vh}.stats{font-size:13px;gap:8px}.st{flex:1 1 28%;min-width:0;padding:12px 6px}.st i{font-size:28px}.fl span{opacity:.25}#nav a{padding:6px 10px;font-size:14px}.stage{height:100px}.arena{height:260px}.ctl .bit{width:44px;height:60px}}
.trk{position:relative;height:70px;background:#5b6070;border-radius:12px;margin:10px 0}
.trk i{position:absolute;top:0;bottom:0;background:#17c3a266;border:2px dashed #17c3a2}
.trk span{position:absolute;left:0;top:14px;font-size:34px}
.rg{display:grid;grid-template-columns:40px repeat(8,1fr);gap:6px;align-items:center;max-width:560px}
.rg b{font-size:26px}.rb{aspect-ratio:1;border:0;border-radius:10px;background:#0002;cursor:pointer}
.rb.on{background:#ff5c93}.rb.cur{outline:3px solid #ffc83d}
</style></head>
<body>
<header><a class="logo" href="#home">🧠 Interactive Learning</a><nav id="nav" aria-label="Main"></nav><div id="hud"></div></header>
<main id="app"></main><footer id="ft"><p>🧠 Interactive Learning · Free for teachers and students · by Tahani A. Ghobon</p><p><a href="#home">Home</a> · <a href="#hub">Games</a> · <a href="#sims">Simulations</a> · <a href="#teachers">Teachers</a> · <a href="#students">Students</a> · <a href="#about">About</a></p></footer><div id="fx"></div>
<script>const SIMDOC={"Projectile_Motion": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Projectile Motion<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n      --danger: #dc2626;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1320px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 380px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select, input[type=\"range\"] {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .slider-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n      margin-bottom: 12px;\n    }\n\n    .btn-row {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n      margin-top: 12px;\n    }\n\n    button {\n      border: none;\n      border-radius: 12px;\n      padding: 12px;\n      font-weight: bold;\n      cursor: pointer;\n      background: #e5e7eb;\n      color: #111827;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      transform: translateY(-1px);\n    }\n\n    .primary {\n      background: #dbeafe;\n      color: #1d4ed8;\n    }\n\n    .secondary {\n      background: #ecfeff;\n      color: #0f766e;\n    }\n\n    .danger {\n      background: #fee2e2;\n      color: #b91c1c;\n    }\n\n    .formula-box, .scene-wrap, .notes-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      height: 450px;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    .readout {\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 980px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr;\n      }\n\n      .btn-row {\n        grid-template-columns: 1fr;\n      }\n\n      canvas {\n        height: 360px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Projectile Motion<\/h1>\n      <p>\n        Explore how launch angle, speed, gravity, and starting height affect the path of a projectile.\n        Watch the motion, compare horizontal and vertical behavior, and observe how the trajectory changes.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"planetSelect\">Gravity setting<\/label>\n          <select id=\"planetSelect\">\n            <option value=\"9.81\">Earth (9.81 m/s²)<\/option>\n            <option value=\"1.62\">Moon (1.62 m/s²)<\/option>\n            <option value=\"3.71\">Mars (3.71 m/s²)<\/option>\n            <option value=\"24.79\">Jupiter (24.79 m/s²)<\/option>\n            <option value=\"custom\">Custom<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"gravitySlider\">\n            Gravity g\n            <span class=\"value\" id=\"gravityValue\">9.81 m/s²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"gravitySlider\" min=\"0.5\" max=\"30\" step=\"0.01\" value=\"9.81\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"speedSlider\">\n            Initial speed\n            <span class=\"value\" id=\"speedValue\">25.0 m/s<\/span>\n          <\/label>\n          <input type=\"range\" id=\"speedSlider\" min=\"1\" max=\"80\" step=\"0.1\" value=\"25\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"angleSlider\">\n            Launch angle\n            <span class=\"value\" id=\"angleValue\">45.0°<\/span>\n          <\/label>\n          <input type=\"range\" id=\"angleSlider\" min=\"0\" max=\"90\" step=\"0.1\" value=\"45\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"heightSlider\">\n            Initial height\n            <span class=\"value\" id=\"heightValue\">0.0 m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"heightSlider\" min=\"0\" max=\"50\" step=\"0.1\" value=\"0\" />\n        <\/div>\n\n        <div class=\"btn-row\">\n          <button class=\"primary\" id=\"playBtn\">Play<\/button>\n          <button class=\"secondary\" id=\"pauseBtn\">Pause<\/button>\n          <button class=\"danger\" id=\"resetBtn\">Reset<\/button>\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key equations<\/h3>\n          <div class=\"formula\">x = v₀ cos(θ) · t<\/div><br>\n          <div class=\"formula\">y = h₀ + v₀ sin(θ) · t - ½gt²<\/div><br>\n          <div class=\"formula\">vₓ = constant, vᵧ changes with gravity<\/div>\n\n          <div class=\"status\" id=\"statusText\">\n            A projectile moves horizontally at constant speed while gravity changes its vertical motion.\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Horizontal speed<\/small>\n            <strong id=\"vxOut\">17.68 m/s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Vertical speed<\/small>\n            <strong id=\"vyOut\">17.68 m/s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Time of flight<\/small>\n            <strong id=\"timeOut\">3.60 s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Maximum height<\/small>\n            <strong id=\"heightOut\">15.93 m<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Horizontal range<\/small>\n            <strong id=\"rangeOut\">63.71 m<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Current time<\/small>\n            <strong id=\"currentTimeOut\">0.00 s<\/strong>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"scene-wrap\">\n          <h2>Projectile Path<\/h2>\n          <canvas id=\"simCanvas\" width=\"920\" height=\"450\"><\/canvas>\n          <div class=\"readout\" id=\"readoutText\">\n            The red ball shows the current projectile position. The blue curve shows the full trajectory.\n          <\/div>\n        <\/div>\n\n        <div class=\"notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>Horizontal motion stays uniform when air resistance is ignored.<\/li>\n            <li>Vertical motion is accelerated downward by gravity.<\/li>\n            <li>Changing the angle changes both range and maximum height.<\/li>\n            <li>Different planets produce different trajectories because gravity changes.<\/li>\n          <\/ul>\n          <p>\n            A useful classroom activity is to compare the same launch on Earth, Moon, and Mars, then ask students why the paths are different.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding projectile motion.\n    <\/div>\n  <\/div>\n\n  <script>\n    const planetSelect = document.getElementById(\"planetSelect\");\n    const gravitySlider = document.getElementById(\"gravitySlider\");\n    const speedSlider = document.getElementById(\"speedSlider\");\n    const angleSlider = document.getElementById(\"angleSlider\");\n    const heightSlider = document.getElementById(\"heightSlider\");\n\n    const gravityValue = document.getElementById(\"gravityValue\");\n    const speedValue = document.getElementById(\"speedValue\");\n    const angleValue = document.getElementById(\"angleValue\");\n    const heightValue = document.getElementById(\"heightValue\");\n\n    const vxOut = document.getElementById(\"vxOut\");\n    const vyOut = document.getElementById(\"vyOut\");\n    const timeOut = document.getElementById(\"timeOut\");\n    const heightOut = document.getElementById(\"heightOut\");\n    const rangeOut = document.getElementById(\"rangeOut\");\n    const currentTimeOut = document.getElementById(\"currentTimeOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const canvas = document.getElementById(\"simCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    const playBtn = document.getElementById(\"playBtn\");\n    const pauseBtn = document.getElementById(\"pauseBtn\");\n    const resetBtn = document.getElementById(\"resetBtn\");\n\n    let animating = false;\n    let simTime = 0;\n    let lastTimestamp = null;\n\n    function degToRad(d) {\n      return d * Math.PI / 180;\n    }\n\n    function fmt(n) {\n      return Number(n).toFixed(2);\n    }\n\n    function syncPlanetControl() {\n      const selected = planetSelect.value;\n      if (selected !== \"custom\") {\n        gravitySlider.value = selected;\n      }\n      update();\n    }\n\n    function getModel() {\n      const g = parseFloat(gravitySlider.value);\n      const v0 = parseFloat(speedSlider.value);\n      const angle = parseFloat(angleSlider.value);\n      const h0 = parseFloat(heightSlider.value);\n\n      const rad = degToRad(angle);\n      const vx = v0 * Math.cos(rad);\n      const vy = v0 * Math.sin(rad);\n\n      const disc = vy * vy + 2 * g * h0;\n      const flightTime = (vy + Math.sqrt(Math.max(0, disc))) / g;\n      const maxHeight = h0 + (vy * vy) / (2 * g);\n      const range = vx * flightTime;\n\n      return { g, v0, angle, h0, rad, vx, vy, flightTime, maxHeight, range };\n    }\n\n    function positionAtTime(t, m) {\n      const x = m.vx * t;\n      const y = m.h0 + m.vy * t - 0.5 * m.g * t * t;\n      return { x, y };\n    }\n\n    function velocityAtTime(t, m) {\n      const vx = m.vx;\n      const vy = m.vy - m.g * t;\n      return { vx, vy };\n    }\n\n    function updateText(m) {\n      gravityValue.textContent = `${m.g.toFixed(2)} m/s²`;\n      speedValue.textContent = `${m.v0.toFixed(1)} m/s`;\n      angleValue.textContent = `${m.angle.toFixed(1)}°`;\n      heightValue.textContent = `${m.h0.toFixed(1)} m`;\n\n      vxOut.textContent = `${fmt(m.vx)} m/s`;\n      vyOut.textContent = `${fmt(m.vy)} m/s`;\n      timeOut.textContent = `${fmt(m.flightTime)} s`;\n      heightOut.textContent = `${fmt(m.maxHeight)} m`;\n      rangeOut.textContent = `${fmt(m.range)} m`;\n      currentTimeOut.textContent = `${fmt(simTime)} s`;\n\n      if (m.angle === 45 && m.h0 === 0) {\n        statusText.textContent = \"At ground level, a launch angle near 45° often gives the greatest range when air resistance is ignored.\";\n      } else if (m.angle < 20) {\n        statusText.textContent = \"A small launch angle gives a flatter path and a lower maximum height.\";\n      } else if (m.angle > 70) {\n        statusText.textContent = \"A large launch angle sends the projectile much higher, but usually reduces the range.\";\n      } else {\n        statusText.textContent = \"Projectile motion combines constant horizontal motion with vertically accelerated motion under gravity.\";\n      }\n    }\n\n    function drawScene(m) {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n      const margin = 50;\n      const groundY = canvas.height - 50;\n      const xMax = Math.max(m.range * 1.08, 10);\n      const yMax = Math.max(m.maxHeight * 1.25, 10);\n\n      function toCanvas(x, y) {\n        const px = margin + (x / xMax) * (canvas.width - 2 * margin);\n        const py = groundY - (y / yMax) * (groundY - margin);\n        return { px, py };\n      }\n\n      // sky\n      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);\n      sky.addColorStop(0, \"#e0f2fe\");\n      sky.addColorStop(1, \"#ffffff\");\n      ctx.fillStyle = sky;\n      ctx.fillRect(0, 0, canvas.width, canvas.height);\n\n      // ground\n      ctx.fillStyle = \"#dcfce7\";\n      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);\n\n      ctx.strokeStyle = \"#4b5563\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(0, groundY);\n      ctx.lineTo(canvas.width, groundY);\n      ctx.stroke();\n\n      // grid\n      ctx.strokeStyle = \"#e5e7eb\";\n      ctx.lineWidth = 1;\n      for (let i = 0; i <= 10; i++) {\n        const x = margin + ((canvas.width - 2 * margin) / 10) * i;\n        ctx.beginPath();\n        ctx.moveTo(x, margin);\n        ctx.lineTo(x, groundY);\n        ctx.stroke();\n      }\n      for (let i = 0; i <= 8; i++) {\n        const y = groundY - ((groundY - margin) / 8) * i;\n        ctx.beginPath();\n        ctx.moveTo(margin, y);\n        ctx.lineTo(canvas.width - margin, y);\n        ctx.stroke();\n      }\n\n      // axes\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(margin, margin);\n      ctx.lineTo(margin, groundY);\n      ctx.lineTo(canvas.width - margin, groundY);\n      ctx.stroke();\n\n      // labels\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"14px Arial\";\n      ctx.fillText(\"Height (m)\", 16, 24);\n      ctx.fillText(\"Distance (m)\", canvas.width - 120, canvas.height - 15);\n\n      // tick labels\n      ctx.fillStyle = \"#6b7280\";\n      for (let i = 0; i <= 10; i++) {\n        const xVal = (xMax / 10) * i;\n        const x = margin + ((canvas.width - 2 * margin) / 10) * i;\n        ctx.fillText(xVal.toFixed(0), x - 8, groundY + 18);\n      }\n      for (let i = 0; i <= 8; i++) {\n        const yVal = (yMax / 8) * i;\n        const y = groundY - ((groundY - margin) / 8) * i;\n        ctx.fillText(yVal.toFixed(0), margin - 36, y + 4);\n      }\n\n      // launcher\n      const launchPos = toCanvas(0, m.h0);\n      ctx.fillStyle = \"#6b7280\";\n      ctx.fillRect(launchPos.px - 10, launchPos.py - 10, 20, 20);\n\n      // full trajectory\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n      let first = true;\n      for (let t = 0; t <= m.flightTime; t += m.flightTime / 160) {\n        const p = positionAtTime(t, m);\n        const c = toCanvas(p.x, Math.max(0, p.y));\n        if (first) {\n          ctx.moveTo(c.px, c.py);\n          first = false;\n        } else {\n          ctx.lineTo(c.px, c.py);\n        }\n      }\n      ctx.stroke();\n\n      // current projectile\n      const clampedTime = Math.min(simTime, m.flightTime);\n      const currentPos = positionAtTime(clampedTime, m);\n      const c = toCanvas(currentPos.x, Math.max(0, currentPos.y));\n\n      ctx.fillStyle = \"#dc2626\";\n      ctx.beginPath();\n      ctx.arc(c.px, c.py, 8, 0, Math.PI * 2);\n      ctx.fill();\n\n      // velocity vector\n      const vel = velocityAtTime(clampedTime, m);\n      const scale = 3;\n      ctx.strokeStyle = \"#059669\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n      ctx.moveTo(c.px, c.py);\n      ctx.lineTo(c.px + vel.vx * scale, c.py - vel.vy * scale);\n      ctx.stroke();\n\n      // current info\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(`t = ${fmt(clampedTime)} s`, 20, 28);\n      ctx.fillText(`x = ${fmt(currentPos.x)} m`, 20, 50);\n      ctx.fillText(`y = ${fmt(Math.max(0, currentPos.y))} m`, 20, 72);\n\n      if (simTime >= m.flightTime) {\n        ctx.fillStyle = \"#b91c1c\";\n        ctx.font = \"bold 18px Arial\";\n        ctx.fillText(\"Projectile has landed\", canvas.width - 210, 30);\n      }\n    }\n\n    function update() {\n      const m = getModel();\n      if (simTime > m.flightTime) simTime = m.flightTime;\n      updateText(m);\n      drawScene(m);\n    }\n\n    function animate(timestamp) {\n      if (!animating) return;\n\n      if (lastTimestamp == null) {\n        lastTimestamp = timestamp;\n      }\n\n      const dt = (timestamp - lastTimestamp) / 1000;\n      lastTimestamp = timestamp;\n\n      const m = getModel();\n      simTime += dt;\n\n      if (simTime >= m.flightTime) {\n        simTime = m.flightTime;\n        animating = false;\n      }\n\n      update();\n      requestAnimationFrame(animate);\n    }\n\n    playBtn.addEventListener(\"click\", () => {\n      const m = getModel();\n      if (simTime >= m.flightTime) {\n        simTime = 0;\n      }\n      if (!animating) {\n        animating = true;\n        lastTimestamp = null;\n        requestAnimationFrame(animate);\n      }\n    });\n\n    pauseBtn.addEventListener(\"click\", () => {\n      animating = false;\n      lastTimestamp = null;\n    });\n\n    resetBtn.addEventListener(\"click\", () => {\n      animating = false;\n      simTime = 0;\n      lastTimestamp = null;\n      update();\n    });\n\n    planetSelect.addEventListener(\"change\", syncPlanetControl);\n\n    gravitySlider.addEventListener(\"input\", () => {\n      planetSelect.value = \"custom\";\n      update();\n    });\n\n    [speedSlider, angleSlider, heightSlider].forEach(slider => {\n      slider.addEventListener(\"input\", update);\n    });\n\n    update();\n  <\/script>\n<\/body>\n<\/html>", "Friction_on_an_Inclined_Plane": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Friction on an Inclined Plane<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n      --danger: #dc2626;\n      --purple: #7c3aed;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1380px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 410px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .slider-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n      margin-bottom: 12px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    input[type=\"range\"], select {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .btn-row {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n      margin-top: 14px;\n    }\n\n    button {\n      border: none;\n      border-radius: 12px;\n      padding: 12px;\n      font-weight: bold;\n      cursor: pointer;\n      background: #e5e7eb;\n      color: #111827;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      transform: translateY(-1px);\n    }\n\n    .primary {\n      background: #dbeafe;\n      color: #1d4ed8;\n    }\n\n    .secondary {\n      background: #ecfeff;\n      color: #0f766e;\n    }\n\n    .danger {\n      background: #fee2e2;\n      color: #b91c1c;\n    }\n\n    .formula-box, .scene-wrap, .chart-wrap, .notes-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    #sceneCanvas {\n      height: 430px;\n    }\n\n    #graphCanvas {\n      height: 250px;\n    }\n\n    .legend {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 16px;\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .legend span::before {\n      content: \"\";\n      display: inline-block;\n      width: 14px;\n      height: 3px;\n      margin-right: 8px;\n      vertical-align: middle;\n      border-radius: 999px;\n    }\n\n    .parallel::before { background: #dc2626; }\n    .friction::before { background: #2563eb; }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 980px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr;\n      }\n\n      .btn-row {\n        grid-template-columns: 1fr;\n      }\n\n      #sceneCanvas {\n        height: 320px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Friction on an Inclined Plane<\/h1>\n      <p>\n        Explore how incline angle, mass, and friction affect whether a block remains at rest or slides down a slope.\n        Compare the downslope component of gravity with the maximum friction force, and observe the motion on the ramp.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"slider-box\">\n          <label for=\"angleSlider\">\n            Incline angle\n            <span class=\"value\" id=\"angleValue\">25°<\/span>\n          <\/label>\n          <input type=\"range\" id=\"angleSlider\" min=\"0\" max=\"60\" step=\"1\" value=\"25\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"massSlider\">\n            Block mass\n            <span class=\"value\" id=\"massValue\">5.0 kg<\/span>\n          <\/label>\n          <input type=\"range\" id=\"massSlider\" min=\"0.5\" max=\"20\" step=\"0.1\" value=\"5.0\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"muSlider\">\n            Coefficient of friction μ\n            <span class=\"value\" id=\"muValue\">0.35<\/span>\n          <\/label>\n          <input type=\"range\" id=\"muSlider\" min=\"0\" max=\"1.2\" step=\"0.01\" value=\"0.35\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"gravitySlider\">\n            Gravity\n            <span class=\"value\" id=\"gravityValue\">9.81 m/s²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"gravitySlider\" min=\"1\" max=\"20\" step=\"0.01\" value=\"9.81\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"surfaceSelect\">Surface preset<\/label>\n          <select id=\"surfaceSelect\">\n            <option value=\"0.05\">Ice / very smooth (μ = 0.05)<\/option>\n            <option value=\"0.2\">Wood on smooth surface (μ = 0.20)<\/option>\n            <option value=\"0.35\" selected>Wood on wood (μ = 0.35)<\/option>\n            <option value=\"0.6\">Rubber on concrete (μ = 0.60)<\/option>\n            <option value=\"0.9\">Very rough surface (μ = 0.90)<\/option>\n            <option value=\"custom\">Custom<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"btn-row\">\n          <button class=\"primary\" id=\"resetBtn\">Reset Block<\/button>\n          <button class=\"secondary\" id=\"gentleBtn\">Gentle Ramp<\/button>\n          <button class=\"danger\" id=\"steepBtn\">Steep Ramp<\/button>\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key equations<\/h3>\n          <div class=\"formula\">Weight = mg<\/div><br>\n          <div class=\"formula\">Normal force = mg cosθ<\/div><br>\n          <div class=\"formula\">Downslope force = mg sinθ<\/div><br>\n          <div class=\"formula\">Maximum friction = μN<\/div><br>\n          <div class=\"formula\">a = (mg sinθ - μmg cosθ) / m<\/div>\n\n          <div class=\"status\" id=\"statusText\">\n            The block stays at rest when friction can fully balance the downslope component of gravity.\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Weight<\/small>\n            <strong id=\"weightOut\">49.05 N<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Normal force<\/small>\n            <strong id=\"normalOut\">44.45 N<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Downslope gravity<\/small>\n            <strong id=\"parallelOut\">20.73 N<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Max friction<\/small>\n            <strong id=\"frictionOut\">15.56 N<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Acceleration<\/small>\n            <strong id=\"accelOut\">1.03 m/s²<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>State<\/small>\n            <strong id=\"stateOut\">Sliding<\/strong>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"scene-wrap\">\n          <h2>Inclined Plane Simulation<\/h2>\n          <canvas id=\"sceneCanvas\" width=\"920\" height=\"430\"><\/canvas>\n        <\/div>\n\n        <div class=\"chart-wrap\">\n          <h2>Force Comparison<\/h2>\n          <canvas id=\"graphCanvas\" width=\"920\" height=\"250\"><\/canvas>\n          <div class=\"legend\">\n            <span class=\"parallel\">Downslope gravity<\/span>\n            <span class=\"friction\">Maximum friction<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>As the incline angle increases, the downslope component of gravity increases.<\/li>\n            <li>As friction increases, the block is more likely to stay at rest.<\/li>\n            <li>Mass changes both gravity and normal force, so the condition for sliding depends mainly on angle and friction.<\/li>\n            <li>The block begins to slide when the downslope force becomes greater than the maximum friction force.<\/li>\n          <\/ul>\n          <p>\n            A very good classroom question is: why does changing the mass not change whether the block starts sliding, when friction and gravity both depend on mass?\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding friction on an inclined plane.\n    <\/div>\n  <\/div>\n\n  <script>\n    const angleSlider = document.getElementById(\"angleSlider\");\n    const massSlider = document.getElementById(\"massSlider\");\n    const muSlider = document.getElementById(\"muSlider\");\n    const gravitySlider = document.getElementById(\"gravitySlider\");\n    const surfaceSelect = document.getElementById(\"surfaceSelect\");\n\n    const angleValue = document.getElementById(\"angleValue\");\n    const massValue = document.getElementById(\"massValue\");\n    const muValue = document.getElementById(\"muValue\");\n    const gravityValue = document.getElementById(\"gravityValue\");\n\n    const weightOut = document.getElementById(\"weightOut\");\n    const normalOut = document.getElementById(\"normalOut\");\n    const parallelOut = document.getElementById(\"parallelOut\");\n    const frictionOut = document.getElementById(\"frictionOut\");\n    const accelOut = document.getElementById(\"accelOut\");\n    const stateOut = document.getElementById(\"stateOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const sceneCanvas = document.getElementById(\"sceneCanvas\");\n    const sceneCtx = sceneCanvas.getContext(\"2d\");\n\n    const graphCanvas = document.getElementById(\"graphCanvas\");\n    const graphCtx = graphCanvas.getContext(\"2d\");\n\n    const resetBtn = document.getElementById(\"resetBtn\");\n    const gentleBtn = document.getElementById(\"gentleBtn\");\n    const steepBtn = document.getElementById(\"steepBtn\");\n\n    let blockPos = 0;\n    let blockVel = 0;\n    let lastTime = performance.now();\n\n    function fmt(n) {\n      return Number(n).toFixed(2);\n    }\n\n    function getModel() {\n      const thetaDeg = parseFloat(angleSlider.value);\n      const theta = thetaDeg * Math.PI / 180;\n      const m = parseFloat(massSlider.value);\n      const mu = parseFloat(muSlider.value);\n      const g = parseFloat(gravitySlider.value);\n\n      const weight = m * g;\n      const normal = weight * Math.cos(theta);\n      const parallel = weight * Math.sin(theta);\n      const maxFriction = mu * normal;\n\n      let state = \"At Rest\";\n      let acceleration = 0;\n\n      if (parallel > maxFriction) {\n        acceleration = g * (Math.sin(theta) - mu * Math.cos(theta));\n        state = \"Sliding\";\n      }\n\n      return {\n        thetaDeg,\n        theta,\n        m,\n        mu,\n        g,\n        weight,\n        normal,\n        parallel,\n        maxFriction,\n        acceleration,\n        state\n      };\n    }\n\n    function updateText(m) {\n      angleValue.textContent = `${m.thetaDeg}°`;\n      massValue.textContent = `${m.m.toFixed(1)} kg`;\n      muValue.textContent = `${m.mu.toFixed(2)}`;\n      gravityValue.textContent = `${m.g.toFixed(2)} m/s²`;\n\n      weightOut.textContent = `${fmt(m.weight)} N`;\n      normalOut.textContent = `${fmt(m.normal)} N`;\n      parallelOut.textContent = `${fmt(m.parallel)} N`;\n      frictionOut.textContent = `${fmt(m.maxFriction)} N`;\n      accelOut.textContent = `${fmt(m.acceleration)} m/s²`;\n      stateOut.textContent = m.state;\n\n      if (m.state === \"At Rest\") {\n        statusText.textContent = \"The block remains at rest because friction is strong enough to balance the downslope component of gravity.\";\n      } else if (m.acceleration < 2) {\n        statusText.textContent = \"The block slides, but the friction force still reduces the acceleration noticeably.\";\n      } else {\n        statusText.textContent = \"The incline is steep enough that gravity overcomes friction, so the block accelerates down the ramp.\";\n      }\n    }\n\n    function resetBlock() {\n      blockPos = 0;\n      blockVel = 0;\n    }\n\n    function updatePhysics(dt) {\n      const m = getModel();\n      if (m.state === \"Sliding\") {\n        blockVel += m.acceleration * dt;\n        blockPos += blockVel * dt;\n      } else {\n        blockVel = 0;\n      }\n\n      blockPos = Math.max(0, Math.min(1, blockPos));\n      if (blockPos >= 1) {\n        blockPos = 1;\n        blockVel = 0;\n      }\n    }\n\n    function drawArrow(ctx, x1, y1, x2, y2, color, label) {\n      ctx.strokeStyle = color;\n      ctx.fillStyle = color;\n      ctx.lineWidth = 3;\n\n      ctx.beginPath();\n      ctx.moveTo(x1, y1);\n      ctx.lineTo(x2, y2);\n      ctx.stroke();\n\n      const angle = Math.atan2(y2 - y1, x2 - x1);\n      const head = 10;\n\n      ctx.beginPath();\n      ctx.moveTo(x2, y2);\n      ctx.lineTo(\n        x2 - head * Math.cos(angle - Math.PI / 6),\n        y2 - head * Math.sin(angle - Math.PI / 6)\n      );\n      ctx.lineTo(\n        x2 - head * Math.cos(angle + Math.PI / 6),\n        y2 - head * Math.sin(angle + Math.PI / 6)\n      );\n      ctx.closePath();\n      ctx.fill();\n\n      if (label) {\n        ctx.font = \"15px Arial\";\n        ctx.fillText(label, x2 + 8, y2 + 5);\n      }\n    }\n\n    function drawScene() {\n      const m = getModel();\n      const ctx = sceneCtx;\n      const w = sceneCanvas.width;\n      const h = sceneCanvas.height;\n\n      ctx.clearRect(0, 0, w, h);\n\n      const bg = ctx.createLinearGradient(0, 0, 0, h);\n      bg.addColorStop(0, \"#dbeafe\");\n      bg.addColorStop(1, \"#ffffff\");\n      ctx.fillStyle = bg;\n      ctx.fillRect(0, 0, w, h);\n\n      ctx.fillStyle = \"#dcfce7\";\n      ctx.fillRect(0, h - 70, w, 70);\n\n      const pivotX = 180;\n      const pivotY = h - 70;\n      const rampLength = 520;\n\n      const endX = pivotX + rampLength * Math.cos(m.theta);\n      const endY = pivotY - rampLength * Math.sin(m.theta);\n\n      ctx.strokeStyle = \"#6b7280\";\n      ctx.lineWidth = 10;\n      ctx.beginPath();\n      ctx.moveTo(pivotX, pivotY);\n      ctx.lineTo(endX, endY);\n      ctx.stroke();\n\n      ctx.fillStyle = \"#9ca3af\";\n      ctx.beginPath();\n      ctx.moveTo(pivotX, pivotY);\n      ctx.lineTo(endX, pivotY);\n      ctx.lineTo(endX, endY);\n      ctx.closePath();\n      ctx.globalAlpha = 0.18;\n      ctx.fill();\n      ctx.globalAlpha = 1;\n\n      const t = 0.12 + 0.76 * blockPos;\n      const bx = pivotX + rampLength * t * Math.cos(m.theta);\n      const by = pivotY - rampLength * t * Math.sin(m.theta);\n\n      ctx.save();\n      ctx.translate(bx, by);\n      ctx.rotate(-m.theta);\n\n      ctx.fillStyle = \"#f59e0b\";\n      ctx.fillRect(-28, -24, 56, 48);\n      ctx.strokeStyle = \"#92400e\";\n      ctx.lineWidth = 2;\n      ctx.strokeRect(-28, -24, 56, 48);\n\n      ctx.restore();\n\n      // angle arc\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.arc(pivotX, pivotY, 55, -m.theta, 0);\n      ctx.stroke();\n      ctx.fillStyle = \"#2563eb\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(`${m.thetaDeg}°`, pivotX + 58, pivotY - 12);\n\n      // force arrows on block\n      const arrowScale = 2.5;\n\n      // weight\n      drawArrow(ctx, bx, by, bx, by + 60, \"#dc2626\", \"mg\");\n\n      // normal\n      const nx2 = bx - 45 * Math.sin(m.theta);\n      const ny2 = by - 45 * Math.cos(m.theta);\n      drawArrow(ctx, bx, by, nx2, ny2, \"#059669\", \"N\");\n\n      // friction / motion direction\n      const fx2 = bx - 55 * Math.cos(m.theta);\n      const fy2 = by - 55 * Math.sin(m.theta);\n      drawArrow(ctx, bx, by, fx2, fy2, \"#2563eb\", \"friction\");\n\n      // downslope component\n      const gx2 = bx + 58 * Math.cos(m.theta);\n      const gy2 = by + 58 * Math.sin(m.theta);\n      drawArrow(ctx, bx, by, gx2, gy2, \"#7c3aed\", \"mg sinθ\");\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"18px Arial\";\n      ctx.fillText(`State: ${m.state}`, 26, 34);\n      ctx.fillText(`Acceleration: ${fmt(m.acceleration)} m/s²`, 26, 62);\n      ctx.fillText(`μ = ${m.mu.toFixed(2)}`, 26, 90);\n\n      // warning if reached bottom\n      if (blockPos >= 1 && m.state === \"Sliding\") {\n        ctx.fillStyle = \"#b91c1c\";\n        ctx.font = \"18px Arial\";\n        ctx.fillText(\"Block reached the bottom of the ramp\", 26, 118);\n      }\n    }\n\n    function drawGraph() {\n      const m = getModel();\n      const ctx = graphCtx;\n      const w = graphCanvas.width;\n      const h = graphCanvas.height;\n\n      ctx.clearRect(0, 0, w, h);\n\n      const barMax = Math.max(m.parallel, m.maxFriction, 1);\n      const scale = 260 / barMax;\n\n      const leftX = 180;\n      const rightX = 520;\n      const baseY = 190;\n      const barWidth = 120;\n\n      // axes\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(80, 30);\n      ctx.lineTo(80, 210);\n      ctx.lineTo(840, 210);\n      ctx.stroke();\n\n      // grid\n      ctx.strokeStyle = \"#e5e7eb\";\n      ctx.lineWidth = 1;\n      for (let i = 0; i <= 5; i++) {\n        const y = 210 - i * 30;\n        ctx.beginPath();\n        ctx.moveTo(80, y);\n        ctx.lineTo(840, y);\n        ctx.stroke();\n      }\n\n      const h1 = m.parallel * scale;\n      const h2 = m.maxFriction * scale;\n\n      ctx.fillStyle = \"#dc2626\";\n      ctx.fillRect(leftX, baseY - h1, barWidth, h1);\n\n      ctx.fillStyle = \"#2563eb\";\n      ctx.fillRect(rightX, baseY - h2, barWidth, h2);\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"Downslope gravity\", leftX - 4, 230);\n      ctx.fillText(\"Maximum friction\", rightX - 2, 230);\n\n      ctx.fillStyle = \"#374151\";\n      ctx.fillText(`${fmt(m.parallel)} N`, leftX + 18, baseY - h1 - 10);\n      ctx.fillText(`${fmt(m.maxFriction)} N`, rightX + 18, baseY - h2 - 10);\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"14px Arial\";\n      for (let i = 0; i <= 5; i++) {\n        const val = (barMax / 5) * i;\n        const y = 210 - i * 30;\n        ctx.fillText(val.toFixed(1), 28, y + 4);\n      }\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"15px Arial\";\n      ctx.fillText(\"Force (N)\", 18, 22);\n    }\n\n    function updateAll() {\n      const m = getModel();\n      updateText(m);\n      drawGraph();\n    }\n\n    function animate(now) {\n      const dt = Math.min((now - lastTime) / 1000, 0.03);\n      lastTime = now;\n\n      updatePhysics(dt);\n      drawScene();\n      requestAnimationFrame(animate);\n    }\n\n    surfaceSelect.addEventListener(\"change\", () => {\n      if (surfaceSelect.value !== \"custom\") {\n        muSlider.value = surfaceSelect.value;\n      }\n      updateAll();\n    });\n\n    muSlider.addEventListener(\"input\", () => {\n      surfaceSelect.value = \"custom\";\n      updateAll();\n    });\n\n    [angleSlider, massSlider, gravitySlider].forEach(el => {\n      el.addEventListener(\"input\", updateAll);\n    });\n\n    resetBtn.addEventListener(\"click\", () => {\n      resetBlock();\n      updateAll();\n    });\n\n    gentleBtn.addEventListener(\"click\", () => {\n      angleSlider.value = 15;\n      muSlider.value = 0.45;\n      surfaceSelect.value = \"custom\";\n      resetBlock();\n      updateAll();\n    });\n\n    steepBtn.addEventListener(\"click\", () => {\n      angleSlider.value = 40;\n      muSlider.value = 0.20;\n      surfaceSelect.value = \"custom\";\n      resetBlock();\n      updateAll();\n    });\n\n    updateAll();\n    requestAnimationFrame(animate);\n  <\/script>\n<\/body>\n<\/html>", "Hookes_Law_and_Spring_Systems": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Hooke’s Law and Spring Systems<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n      --danger: #dc2626;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1320px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 390px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select, input[type=\"range\"] {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .slider-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n      margin-bottom: 12px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .formula-box, .scene-wrap, .graph-wrap, .notes-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    #springCanvas {\n      height: 420px;\n    }\n\n    #graphCanvas {\n      height: 280px;\n    }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 980px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr;\n      }\n\n      #springCanvas {\n        height: 340px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Hooke’s Law and Spring Systems<\/h1>\n      <p>\n        Explore how force, spring constant, mass, and spring arrangement affect extension and motion.\n        Compare single springs with series and parallel spring systems, and observe how the system stiffness changes.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"systemType\">Spring system<\/label>\n          <select id=\"systemType\">\n            <option value=\"single\">Single spring<\/option>\n            <option value=\"series\">Two springs in series<\/option>\n            <option value=\"parallel\">Two springs in parallel<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"k1Slider\">\n            Spring constant k₁\n            <span class=\"value\" id=\"k1Value\">50 N/m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"k1Slider\" min=\"10\" max=\"200\" step=\"1\" value=\"50\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"k2Slider\">\n            Spring constant k₂\n            <span class=\"value\" id=\"k2Value\">80 N/m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"k2Slider\" min=\"10\" max=\"200\" step=\"1\" value=\"80\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"massSlider\">\n            Attached mass\n            <span class=\"value\" id=\"massValue\">2.0 kg<\/span>\n          <\/label>\n          <input type=\"range\" id=\"massSlider\" min=\"0.1\" max=\"10\" step=\"0.1\" value=\"2.0\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"stretchSlider\">\n            Extra pull from equilibrium\n            <span class=\"value\" id=\"stretchValue\">0.15 m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"stretchSlider\" min=\"0\" max=\"0.5\" step=\"0.01\" value=\"0.15\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"gravitySlider\">\n            Gravity\n            <span class=\"value\" id=\"gravityValue\">9.81 m/s²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"gravitySlider\" min=\"1\" max=\"20\" step=\"0.01\" value=\"9.81\" />\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key equations<\/h3>\n          <div class=\"formula\">F = kx<\/div><br>\n          <div class=\"formula\">E = ½kx²<\/div><br>\n          <div class=\"formula\">k(series) = 1 / (1/k₁ + 1/k₂)<\/div><br>\n          <div class=\"formula\">k(parallel) = k₁ + k₂<\/div>\n\n          <div class=\"status\" id=\"statusText\">\n            A stiffer spring has a larger spring constant, so it stretches less under the same force.\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Equivalent spring constant<\/small>\n            <strong id=\"keqOut\">50.00 N/m<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Weight force<\/small>\n            <strong id=\"forceOut\">19.62 N<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Static extension<\/small>\n            <strong id=\"extensionOut\">0.39 m<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Stored elastic energy<\/small>\n            <strong id=\"energyOut\">3.85 J<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Oscillation period<\/small>\n            <strong id=\"periodOut\">1.26 s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Maximum displacement<\/small>\n            <strong id=\"ampOut\">0.15 m<\/strong>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"scene-wrap\">\n          <h2>Spring Motion<\/h2>\n          <canvas id=\"springCanvas\" width=\"920\" height=\"420\"><\/canvas>\n        <\/div>\n\n        <div class=\"graph-wrap\">\n          <h2>Force vs Extension<\/h2>\n          <canvas id=\"graphCanvas\" width=\"920\" height=\"280\"><\/canvas>\n        <\/div>\n\n        <div class=\"notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>A larger spring constant means a stiffer spring and less extension.<\/li>\n            <li>Series systems are softer than either individual spring.<\/li>\n            <li>Parallel systems are stiffer because the springs share the load together.<\/li>\n            <li>The force-extension graph is linear for an ideal Hooke’s law spring.<\/li>\n          <\/ul>\n          <p>\n            A good classroom activity is to keep the mass the same and switch between single, series, and parallel systems to compare the extension and oscillation period.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding Hooke’s law and spring systems.\n    <\/div>\n  <\/div>\n\n  <script>\n    const systemType = document.getElementById(\"systemType\");\n    const k1Slider = document.getElementById(\"k1Slider\");\n    const k2Slider = document.getElementById(\"k2Slider\");\n    const massSlider = document.getElementById(\"massSlider\");\n    const stretchSlider = document.getElementById(\"stretchSlider\");\n    const gravitySlider = document.getElementById(\"gravitySlider\");\n\n    const k1Value = document.getElementById(\"k1Value\");\n    const k2Value = document.getElementById(\"k2Value\");\n    const massValue = document.getElementById(\"massValue\");\n    const stretchValue = document.getElementById(\"stretchValue\");\n    const gravityValue = document.getElementById(\"gravityValue\");\n\n    const keqOut = document.getElementById(\"keqOut\");\n    const forceOut = document.getElementById(\"forceOut\");\n    const extensionOut = document.getElementById(\"extensionOut\");\n    const energyOut = document.getElementById(\"energyOut\");\n    const periodOut = document.getElementById(\"periodOut\");\n    const ampOut = document.getElementById(\"ampOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const springCanvas = document.getElementById(\"springCanvas\");\n    const springCtx = springCanvas.getContext(\"2d\");\n\n    const graphCanvas = document.getElementById(\"graphCanvas\");\n    const graphCtx = graphCanvas.getContext(\"2d\");\n\n    let startTime = performance.now();\n\n    function fmt(n) {\n      return Number(n).toFixed(2);\n    }\n\n    function getEquivalentK(type, k1, k2) {\n      if (type === \"single\") return k1;\n      if (type === \"series\") return 1 / (1 / k1 + 1 / k2);\n      if (type === \"parallel\") return k1 + k2;\n      return k1;\n    }\n\n    function getModel() {\n      const type = systemType.value;\n      const k1 = parseFloat(k1Slider.value);\n      const k2 = parseFloat(k2Slider.value);\n      const mass = parseFloat(massSlider.value);\n      const extraStretch = parseFloat(stretchSlider.value);\n      const g = parseFloat(gravitySlider.value);\n\n      const keq = getEquivalentK(type, k1, k2);\n      const weightForce = mass * g;\n      const staticExtension = weightForce / keq;\n      const energy = 0.5 * keq * staticExtension * staticExtension;\n      const period = 2 * Math.PI * Math.sqrt(mass / keq);\n\n      return {\n        type,\n        k1,\n        k2,\n        mass,\n        extraStretch,\n        g,\n        keq,\n        weightForce,\n        staticExtension,\n        energy,\n        period\n      };\n    }\n\n    function updateText(m) {\n      k1Value.textContent = `${m.k1.toFixed(0)} N/m`;\n      k2Value.textContent = `${m.k2.toFixed(0)} N/m`;\n      massValue.textContent = `${m.mass.toFixed(1)} kg`;\n      stretchValue.textContent = `${m.extraStretch.toFixed(2)} m`;\n      gravityValue.textContent = `${m.g.toFixed(2)} m/s²`;\n\n      keqOut.textContent = `${fmt(m.keq)} N/m`;\n      forceOut.textContent = `${fmt(m.weightForce)} N`;\n      extensionOut.textContent = `${fmt(m.staticExtension)} m`;\n      energyOut.textContent = `${fmt(m.energy)} J`;\n      periodOut.textContent = `${fmt(m.period)} s`;\n      ampOut.textContent = `${fmt(m.extraStretch)} m`;\n\n      if (m.type === \"single\") {\n        statusText.textContent = \"A single spring stretches according to Hooke’s law: the extension is proportional to the applied force.\";\n      } else if (m.type === \"series\") {\n        statusText.textContent = \"Springs in series make the system softer, so the total extension becomes larger under the same load.\";\n      } else {\n        statusText.textContent = \"Springs in parallel make the system stiffer, so the total extension becomes smaller under the same load.\";\n      }\n    }\n\n    function drawSpringSegment(ctx, x, yTop, length, width, turns, color) {\n      ctx.strokeStyle = color;\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n      ctx.moveTo(x, yTop);\n\n      const step = length / (turns * 2);\n      let y = yTop;\n\n      for (let i = 0; i < turns * 2; i++) {\n        const dx = i % 2 === 0 ? -width : width;\n        y += step;\n        ctx.lineTo(x + dx, y);\n      }\n\n      ctx.lineTo(x, yTop + length);\n      ctx.stroke();\n    }\n\n    function drawArrow(ctx, x1, y1, x2, y2, color) {\n      ctx.strokeStyle = color;\n      ctx.fillStyle = color;\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n      ctx.moveTo(x1, y1);\n      ctx.lineTo(x2, y2);\n      ctx.stroke();\n\n      const angle = Math.atan2(y2 - y1, x2 - x1);\n      const head = 10;\n\n      ctx.beginPath();\n      ctx.moveTo(x2, y2);\n      ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));\n      ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));\n      ctx.closePath();\n      ctx.fill();\n    }\n\n    function drawSpringScene(m, timeSeconds) {\n      const ctx = springCtx;\n      const w = springCanvas.width;\n      const h = springCanvas.height;\n\n      ctx.clearRect(0, 0, w, h);\n\n      const bg = ctx.createLinearGradient(0, 0, 0, h);\n      bg.addColorStop(0, \"#eef6ff\");\n      bg.addColorStop(1, \"#ffffff\");\n      ctx.fillStyle = bg;\n      ctx.fillRect(0, 0, w, h);\n\n      ctx.fillStyle = \"#374151\";\n      ctx.fillRect(160, 40, 600, 14);\n\n      const omega = Math.sqrt(m.keq / m.mass);\n      const yOsc = m.extraStretch * Math.cos(omega * timeSeconds);\n\n      const baseLengthPx = 120;\n      const scale = 230;\n      const staticPx = m.staticExtension * scale;\n      const extraPx = yOsc * scale;\n\n      const anchorX = w / 2;\n      const anchorY = 54;\n      const massW = 100;\n      const massH = 70;\n\n      if (m.type === \"single\") {\n        const springLength = baseLengthPx + staticPx + extraPx;\n        drawSpringSegment(ctx, anchorX, anchorY, springLength, 28, 11, \"#2563eb\");\n\n        const massY = anchorY + springLength;\n        ctx.fillStyle = \"#9ca3af\";\n        ctx.fillRect(anchorX - massW / 2, massY, massW, massH);\n\n        drawArrow(ctx, anchorX + 120, massY + 12, anchorX + 120, massY + 70, \"#dc2626\");\n        ctx.fillStyle = \"#dc2626\";\n        ctx.font = \"16px Arial\";\n        ctx.fillText(\"Weight\", anchorX + 135, massY + 48);\n      }\n\n      if (m.type === \"series\") {\n        const totalSpring = baseLengthPx + staticPx + extraPx;\n        const part1 = totalSpring * (m.keq / m.k1);\n        const part2 = totalSpring * (m.keq / m.k2);\n\n        drawSpringSegment(ctx, anchorX, anchorY, part1, 28, 7, \"#2563eb\");\n        ctx.fillStyle = \"#475569\";\n        ctx.fillRect(anchorX - 18, anchorY + part1, 36, 10);\n        drawSpringSegment(ctx, anchorX, anchorY + part1 + 10, part2, 28, 7, \"#0ea5e9\");\n\n        const massY = anchorY + part1 + 10 + part2;\n        ctx.fillStyle = \"#9ca3af\";\n        ctx.fillRect(anchorX - massW / 2, massY, massW, massH);\n\n        drawArrow(ctx, anchorX + 120, massY + 12, anchorX + 120, massY + 70, \"#dc2626\");\n        ctx.fillStyle = \"#dc2626\";\n        ctx.font = \"16px Arial\";\n        ctx.fillText(\"Weight\", anchorX + 135, massY + 48);\n      }\n\n      if (m.type === \"parallel\") {\n        const springLength = baseLengthPx + staticPx + extraPx;\n        drawSpringSegment(ctx, anchorX - 60, anchorY, springLength, 18, 11, \"#2563eb\");\n        drawSpringSegment(ctx, anchorX + 60, anchorY, springLength, 18, 11, \"#0ea5e9\");\n\n        ctx.fillStyle = \"#475569\";\n        ctx.fillRect(anchorX - 85, anchorY + springLength, 170, 10);\n\n        const massY = anchorY + springLength + 10;\n        ctx.fillStyle = \"#9ca3af\";\n        ctx.fillRect(anchorX - massW / 2, massY, massW, massH);\n\n        drawArrow(ctx, anchorX + 120, massY + 12, anchorX + 120, massY + 70, \"#dc2626\");\n        ctx.fillStyle = \"#dc2626\";\n        ctx.font = \"16px Arial\";\n        ctx.fillText(\"Weight\", anchorX + 135, massY + 48);\n      }\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"18px Arial\";\n      ctx.fillText(`System: ${m.type.charAt(0).toUpperCase() + m.type.slice(1)}`, 24, 34);\n      ctx.fillText(`Equivalent k = ${fmt(m.keq)} N/m`, 24, 62);\n      ctx.fillText(`Extension = ${fmt(m.staticExtension)} m`, 24, 90);\n    }\n\n    function drawGraph(m) {\n      const ctx = graphCtx;\n      const w = graphCanvas.width;\n      const h = graphCanvas.height;\n      const pad = 55;\n      const plotW = w - 2 * pad;\n      const plotH = h - 2 * pad;\n\n      const xMax = Math.max(0.6, m.staticExtension * 1.5, 0.4);\n      const yMax = m.keq * xMax * 1.15;\n\n      ctx.clearRect(0, 0, w, h);\n\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= 6; i++) {\n        const x = pad + (plotW / 6) * i;\n        ctx.beginPath();\n        ctx.moveTo(x, pad);\n        ctx.lineTo(x, h - pad);\n        ctx.stroke();\n      }\n\n      for (let i = 0; i <= 5; i++) {\n        const y = pad + (plotH / 5) * i;\n        ctx.beginPath();\n        ctx.moveTo(pad, y);\n        ctx.lineTo(w - pad, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(pad, pad);\n      ctx.lineTo(pad, h - pad);\n      ctx.lineTo(w - pad, h - pad);\n      ctx.stroke();\n\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n\n      for (let i = 0; i <= 120; i++) {\n        const x = (xMax / 120) * i;\n        const force = m.keq * x;\n\n        const px = pad + (x / xMax) * plotW;\n        const py = h - pad - (force / yMax) * plotH;\n\n        if (i === 0) ctx.moveTo(px, py);\n        else ctx.lineTo(px, py);\n      }\n      ctx.stroke();\n\n      const currentX = m.staticExtension;\n      const currentY = m.weightForce;\n      const px = pad + (currentX / xMax) * plotW;\n      const py = h - pad - (currentY / yMax) * plotH;\n\n      ctx.fillStyle = \"#dc2626\";\n      ctx.beginPath();\n      ctx.arc(px, py, 6, 0, Math.PI * 2);\n      ctx.fill();\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"Extension x (m)\", w / 2 - 45, h - 12);\n\n      ctx.save();\n      ctx.translate(20, h / 2 + 20);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(\"Force F (N)\", 0, 0);\n      ctx.restore();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"14px Arial\";\n\n      for (let i = 0; i <= 6; i++) {\n        const val = (xMax / 6) * i;\n        const x = pad + (plotW / 6) * i;\n        ctx.fillText(val.toFixed(2), x - 12, h - pad + 22);\n      }\n\n      for (let i = 0; i <= 5; i++) {\n        const val = yMax - (yMax / 5) * i;\n        const y = pad + (plotH / 5) * i;\n        ctx.fillText(val.toFixed(1), 8, y + 4);\n      }\n    }\n\n    function update() {\n      const m = getModel();\n      updateText(m);\n      drawGraph(m);\n    }\n\n    function animate(now) {\n      const t = (now - startTime) / 1000;\n      const m = getModel();\n      drawSpringScene(m, t);\n      requestAnimationFrame(animate);\n    }\n\n    [systemType, k1Slider, k2Slider, massSlider, stretchSlider, gravitySlider].forEach(el => {\n      el.addEventListener(\"input\", update);\n    });\n\n    update();\n    requestAnimationFrame(animate);\n  <\/script>\n<\/body>\n<\/html>", "Graphing_Linear_and_Nonlinear_Functions": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Graphing Linear and Nonlinear Functions<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1320px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 380px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select, input[type=\"range\"] {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .slider-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n      margin-bottom: 12px;\n    }\n\n    .formula-box, .status-box, .table-wrap, .graph-wrap, .notes {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      height: 440px;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n      cursor: crosshair;\n    }\n\n    .readout {\n      margin-top: 10px;\n      color: var(--muted);\n      fo
