;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --tension: #dc2626;\n      --compression: #2563eb;\n      --neutral: #6b7280;\n      --good: #059669;\n      --warn: #d97706;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1200px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    h1, h2, h3 {\n      margin-top: 0;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #e8f0ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero p {\n      margin: 10px 0 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 340px 1fr;\n      gap: 20px;\n    }\n\n    .panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 16px;\n      padding: 18px;\n      box-shadow: 0 8px 22px rgba(0,0,0,0.04);\n    }\n\n    .controls .group {\n      margin-bottom: 20px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    .value {\n      font-size: 14px;\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    input[type=\"range\"] {\n      width: 100%;\n      cursor: pointer;\n    }\n\n    .btn-row {\n      display: flex;\n      gap: 10px;\n      flex-wrap: wrap;\n      margin-top: 12px;\n    }\n\n    button {\n      border: none;\n      background: var(--accent);\n      color: white;\n      padding: 10px 14px;\n      border-radius: 10px;\n      cursor: pointer;\n      font-weight: bold;\n    }\n\n    button.secondary {\n      background: #374151;\n    }\n\n    button.light {\n      background: #e5e7eb;\n      color: #111827;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 18px;\n    }\n\n    .stat {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .legend {\n      display: flex;\n      gap: 14px;\n      flex-wrap: wrap;\n      margin-top: 14px;\n      font-size: 14px;\n      color: var(--muted);\n    }\n\n    .legend span {\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n    }\n\n    .swatch {\n      width: 14px;\n      height: 14px;\n      border-radius: 50%;\n      display: inline-block;\n    }\n\n    .canvas-wrap {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 16px;\n      padding: 18px;\n      box-shadow: 0 8px 22px rgba(0,0,0,0.04);\n    }\n\n    svg {\n      width: 100%;\n      height: 520px;\n      display: block;\n      background: linear-gradient(to bottom, #ffffff, #f8fbff);\n      border-radius: 12px;\n      border: 1px solid #e5e7eb;\n    }\n\n    .notes {\n      margin-top: 18px;\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 16px;\n    }\n\n    .note-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 16px;\n    }\n\n    .note-box p, .note-box li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .formula {\n      font-family: \"Courier New\", monospace;\n      background: #eef2ff;\n      padding: 10px 12px;\n      border-radius: 10px;\n      display: inline-block;\n      margin: 6px 0;\n      color: #1e3a8a;\n    }\n\n    .quiz {\n      margin-top: 20px;\n      background: #fffbeb;\n      border: 1px solid #fcd34d;\n      border-radius: 14px;\n      padding: 16px;\n    }\n\n    .quiz p {\n      margin: 8px 0;\n    }\n\n    .answer {\n      margin-top: 10px;\n      padding: 12px;\n      border-radius: 10px;\n      background: #ecfdf5;\n      border: 1px solid #a7f3d0;\n      color: #065f46;\n      display: none;\n    }\n\n    .footer {\n      margin-top: 24px;\n      text-align: center;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    @media (max-width: 900px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .notes {\n        grid-template-columns: 1fr;\n      }\n\n      svg {\n        height: 420px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Interactive Truss Experiment<\/h1>\n      <p>\n        This simulation helps students understand how a simple triangular truss carries load.\n        Change the span, height, and load, then observe support reactions, member forces,\n        and which members are in tension or compression.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel controls\">\n        <h2>Experiment Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"loadRange\">\n            Applied Load at Top Joint\n            <span class=\"value\" id=\"loadValue\">20 kN<\/span>\n          <\/label>\n          <input type=\"range\" id=\"loadRange\" min=\"5\" max=\"100\" value=\"20\" step=\"1\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"spanRange\">\n            Span Length\n            <span class=\"value\" id=\"spanValue\">8 m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"spanRange\" min=\"4\" max=\"16\" value=\"8\" step=\"0.5\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"heightRange\">\n            Truss Height\n            <span class=\"value\" id=\"heightValue\">3 m<\/span>\n          <\/label>\n          <input type=\"range\" id=\"heightRange\" min=\"1\" max=\"8\" value=\"3\" step=\"0.5\" />\n        <\/div>\n\n        <div class=\"btn-row\">\n          <button onclick=\"randomizeExperiment()\">Random Example<\/button>\n          <button class=\"secondary\" onclick=\"resetExperiment()\">Reset<\/button>\n          <button class=\"light\" onclick=\"toggleLabels()\">Show/Hide Labels<\/button>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Left Reaction Ay<\/small>\n            <strong id=\"leftReaction\">10.00 kN<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Right Reaction Cy<\/small>\n            <strong id=\"rightReaction\">10.00 kN<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Member AB<\/small>\n            <strong id=\"forceAB\">13.33 kN<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Member BC<\/small>\n            <strong id=\"forceBC\">13.33 kN<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Member AC<\/small>\n            <strong id=\"forceAC\">6.67 kN<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Truss Angle<\/small>\n            <strong id=\"angleValue\">36.87°<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"legend\">\n          <span><i class=\"swatch\" style=\"background: var(--compression)\"><\/i> Compression<\/span>\n          <span><i class=\"swatch\" style=\"background: var(--tension)\"><\/i> Tension<\/span>\n          <span><i class=\"swatch\" style=\"background: var(--neutral)\"><\/i> Supports / structure<\/span>\n        <\/div>\n\n        <div class=\"quiz\">\n          <h3>Quick Question<\/h3>\n          <p id=\"quizQuestion\">If the load increases, which member force increases the most?<\/p>\n          <button class=\"light\" onclick=\"showAnswer()\">Reveal Answer<\/button>\n          <div class=\"answer\" id=\"quizAnswer\">\n            In this symmetric triangular truss, all member forces increase when the load increases.\n            The inclined members AB and BC usually carry larger force magnitudes than the bottom member AC.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"canvas-wrap\">\n        <h2>Live Truss Model<\/h2>\n        <svg id=\"trussSvg\" viewBox=\"0 0 900 520\" aria-label=\"Interactive truss diagram\">\n          <defs>\n            <marker id=\"arrowRed\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n              <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#dc2626\"><\/path>\n            <\/marker>\n            <marker id=\"arrowBlue\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n              <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#2563eb\"><\/path>\n            <\/marker>\n            <marker id=\"arrowDark\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n              <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#111827\"><\/path>\n            <\/marker>\n          <\/defs>\n\n          <\!-- ground -->\n          <line x1=\"60\" y1=\"430\" x2=\"840\" y2=\"430\" stroke=\"#9ca3af\" stroke-width=\"3\" stroke-dasharray=\"8 6\"><\/line>\n\n          <\!-- members -->\n          <line id=\"memberAB\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#2563eb\" stroke-width=\"10\" stroke-linecap=\"round\"><\/line>\n          <line id=\"memberBC\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#2563eb\" stroke-width=\"10\" stroke-linecap=\"round\"><\/line>\n          <line id=\"memberAC\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#dc2626\" stroke-width=\"10\" stroke-linecap=\"round\"><\/line>\n\n          <\!-- supports -->\n          <polygon id=\"leftSupport\" points=\"\" fill=\"#6b7280\"><\/polygon>\n          <polygon id=\"rightSupport\" points=\"\" fill=\"#6b7280\"><\/polygon>\n          <circle id=\"roller1\" cx=\"0\" cy=\"0\" r=\"8\" fill=\"#9ca3af\"><\/circle>\n          <circle id=\"roller2\" cx=\"0\" cy=\"0\" r=\"8\" fill=\"#9ca3af\"><\/circle>\n\n          <\!-- joints -->\n          <circle id=\"jointA\" cx=\"0\" cy=\"0\" r=\"9\" fill=\"#111827\"><\/circle>\n          <circle id=\"jointB\" cx=\"0\" cy=\"0\" r=\"9\" fill=\"#111827\"><\/circle>\n          <circle id=\"jointC\" cx=\"0\" cy=\"0\" r=\"9\" fill=\"#111827\"><\/circle>\n\n          <\!-- applied load -->\n          <line id=\"loadArrow\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#111827\" stroke-width=\"5\" marker-end=\"url(#arrowDark)\"><\/line>\n          <text id=\"loadText\" x=\"0\" y=\"0\" font-size=\"18\" text-anchor=\"middle\" fill=\"#111827\" font-weight=\"bold\">20 kN<\/text>\n\n          <\!-- reactions -->\n          <line id=\"reactionLeftArrow\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#059669\" stroke-width=\"5\" marker-end=\"url(#arrowDark)\"><\/line>\n          <line id=\"reactionRightArrow\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#059669\" stroke-width=\"5\" marker-end=\"url(#arrowDark)\"><\/line>\n          <text id=\"reactionLeftText\" x=\"0\" y=\"0\" font-size=\"16\" text-anchor=\"middle\" fill=\"#065f46\" font-weight=\"bold\"><\/text>\n          <text id=\"reactionRightText\" x=\"0\" y=\"0\" font-size=\"16\" text-anchor=\"middle\" fill=\"#065f46\" font-weight=\"bold\"><\/text>\n\n          <\!-- labels -->\n          <text class=\"node-label\" id=\"labelA\" x=\"0\" y=\"0\" font-size=\"18\" font-weight=\"bold\" fill=\"#111827\">A<\/text>\n          <text class=\"node-label\" id=\"labelB\" x=\"0\" y=\"0\" font-size=\"18\" font-weight=\"bold\" fill=\"#111827\">B<\/text>\n          <text class=\"node-label\" id=\"labelC\" x=\"0\" y=\"0\" font-size=\"18\" font-weight=\"bold\" fill=\"#111827\">C<\/text>\n\n          <text class=\"force-label\" id=\"labelAB\" x=\"0\" y=\"0\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111827\"><\/text>\n          <text class=\"force-label\" id=\"labelBC\" x=\"0\" y=\"0\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111827\"><\/text>\n          <text class=\"force-label\" id=\"labelAC\" x=\"0\" y=\"0\" font-size=\"16\" text-anchor=\"middle\" fill=\"#111827\"><\/text>\n        <\/svg>\n\n        <div class=\"notes\">\n          <div class=\"note-box\">\n            <h3>What students should notice<\/h3>\n            <ul>\n              <li>The top load is shared by the two supports.<\/li>\n              <li>The two inclined members carry compression.<\/li>\n              <li>The bottom member carries tension.<\/li>\n              <li>Changing the truss height changes the internal forces.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"note-box\">\n            <h3>Key relationships<\/h3>\n            <div class=\"formula\">Ay = Cy = P / 2<\/div><br>\n            <div class=\"formula\">F_AB = F_BC = P / (2 sinθ)<\/div><br>\n            <div class=\"formula\">F_AC = P / (2 tanθ)<\/div>\n            <p>\n              Where θ is the angle of the inclined member with the horizontal.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Built for teaching basic truss behavior using a simple triangular truss model.\n    <\/div>\n  <\/div>\n\n  <script>\n    const loadRange = document.getElementById(\"loadRange\");\n    const spanRange = document.getElementById(\"spanRange\");\n    const heightRange = document.getElementById(\"heightRange\");\n\n    const loadValue = document.getElementById(\"loadValue\");\n    const spanValue = document.getElementById(\"spanValue\");\n    const heightValue = document.getElementById(\"heightValue\");\n\n    const leftReaction = document.getElementById(\"leftReaction\");\n    const rightReaction = document.getElementById(\"rightReaction\");\n    const forceAB = document.getElementById(\"forceAB\");\n    const forceBC = document.getElementById(\"forceBC\");\n    const forceAC = document.getElementById(\"forceAC\");\n    const angleValue = document.getElementById(\"angleValue\");\n\n    let labelsVisible = true;\n\n    function formatNumber(value) {\n      return Number(value).toFixed(2);\n    }\n\n    function updateExperiment() {\n      const P = parseFloat(loadRange.value);\n      const L = parseFloat(spanRange.value);\n      const H = parseFloat(heightRange.value);\n\n      loadValue.textContent = `${P} kN`;\n      spanValue.textContent = `${L} m`;\n      heightValue.textContent = `${H} m`;\n\n      const theta = Math.atan(H / (L / 2));\n      const thetaDeg = theta * 180 / Math.PI;\n\n      const Ay = P / 2;\n      const Cy = P / 2;\n      const FAB = P / (2 * Math.sin(theta));\n      const FBC = FAB;\n      const FAC = P / (2 * Math.tan(theta));\n\n      leftReaction.textContent = `${formatNumber(Ay)} kN`;\n      rightReaction.textContent = `${formatNumber(Cy)} kN`;\n      forceAB.textContent = `${formatNumber(FAB)} kN C`;\n      forceBC.textContent = `${formatNumber(FBC)} kN C`;\n      forceAC.textContent = `${formatNumber(FAC)} kN T`;\n      angleValue.textContent = `${formatNumber(thetaDeg)}°`;\n\n      drawTruss(P, L, H, Ay, Cy, FAB, FBC, FAC, thetaDeg);\n      updateQuiz(P, H, L);\n    }\n\n    function drawTruss(P, L, H, Ay, Cy, FAB, FBC, FAC, thetaDeg) {\n      const svgWidth = 900;\n      const baseY = 390;\n      const centerX = svgWidth / 2;\n\n      const maxSpan = 16;\n      const maxHeight = 8;\n\n      const visualSpan = 520 * (L / maxSpan) + 180;\n      const visualHeight = 230 * (H / maxHeight) + 50;\n\n      const A = { x: centerX - visualSpan / 2, y: baseY };\n      const C = { x: centerX + visualSpan / 2, y: baseY };\n      const B = { x: centerX, y: baseY - visualHeight };\n\n      setLine(\"memberAB\", A, B, getStrokeWidth(FAB), getColor(\"compression\"));\n      setLine(\"memberBC\", B, C, getStrokeWidth(FBC), getColor(\"compression\"));\n      setLine(\"memberAC\", A, C, getStrokeWidth(FAC), getColor(\"tension\"));\n\n      setCircle(\"jointA\", A.x, A.y);\n      setCircle(\"jointB\", B.x, B.y);\n      setCircle(\"jointC\", C.x, C.y);\n\n      drawSupports(A, C);\n      drawLoad(B, P);\n      drawReactions(A, C, Ay, Cy);\n\n      setText(\"labelA\", A.x - 18, A.y - 14, \"A\");\n      setText(\"labelB\", B.x - 18, B.y - 14, \"B\");\n      setText(\"labelC\", C.x + 10, C.y - 14, \"C\");\n\n      setText(\"labelAB\", (A.x + B.x) / 2 - 20, (A.y + B.y) / 2 - 12, `${formatNumber(FAB)} kN C`);\n      setText(\"labelBC\", (B.x + C.x) / 2 + 20, (B.y + C.y) / 2 - 12, `${formatNumber(FBC)} kN C`);\n      setText(\"labelAC\", (A.x + C.x) / 2, A.y + 30, `${formatNumber(FAC)} kN T`);\n\n      document.getElementById(\"loadText\").textContent = `${P} kN`;\n      document.getElementById(\"reactionLeftText\").textContent = `${formatNumber(Ay)} kN`;\n      document.getElementById(\"reactionRightText\").textContent = `${formatNumber(Cy)} kN`;\n\n      document.querySelectorAll(\".node-label, .force-label\").forEach(el => {\n        el.style.display = labelsVisible ? \"block\" : \"none\";\n      });\n    }\n\n    function getStrokeWidth(force) {\n      return Math.max(6, Math.min(18, 5 + force / 7));\n    }\n\n    function getColor(type) {\n      if (type === \"compression\") return \"#2563eb\";\n      if (type === \"tension\") return \"#dc2626\";\n      return \"#6b7280\";\n    }\n\n    function setLine(id, p1, p2, width, color) {\n      const el = document.getElementById(id);\n      el.setAttribute(\"x1\", p1.x);\n      el.setAttribute(\"y1\", p1.y);\n      el.setAttribute(\"x2\", p2.x);\n      el.setAttribute(\"y2\", p2.y);\n      el.setAttribute(\"stroke-width\", width);\n      el.setAttribute(\"stroke\", color);\n    }\n\n    function setCircle(id, x, y) {\n      const el = document.getElementById(id);\n      el.setAttribute(\"cx\", x);\n      el.setAttribute(\"cy\", y);\n    }\n\n    function setText(id, x, y, text) {\n      const el = document.getElementById(id);\n      el.setAttribute(\"x\", x);\n      el.setAttribute(\"y\", y);\n      el.textContent = text;\n    }\n\n    function drawSupports(A, C) {\n      const leftSupport = document.getElementById(\"leftSupport\");\n      leftSupport.setAttribute(\"points\", `${A.x - 18},${A.y + 24} ${A.x + 18},${A.y + 24} ${A.x},${A.y}`);\n\n      const rightSupport = document.getElementById(\"rightSupport\");\n      rightSupport.setAttribute(\"points\", `${C.x - 18},${C.y + 24} ${C.x + 18},${C.y + 24} ${C.x},${C.y}`);\n\n      document.getElementById(\"roller1\").setAttribute(\"cx\", C.x - 10);\n      document.getElementById(\"roller1\").setAttribute(\"cy\", C.y + 32);\n      document.getElementById(\"roller2\").setAttribute(\"cx\", C.x + 10);\n      document.getElementById(\"roller2\").setAttribute(\"cy\", C.y + 32);\n    }\n\n    function drawLoad(B, P) {\n      const arrowLength = 90 + P * 0.6;\n      const loadArrow = document.getElementById(\"loadArrow\");\n      loadArrow.setAttribute(\"x1\", B.x);\n      loadArrow.setAttribute(\"y1\", B.y - arrowLength);\n      loadArrow.setAttribute(\"x2\", B.x);\n      loadArrow.setAttribute(\"y2\", B.y - 14);\n\n      setText(\"loadText\", B.x, B.y - arrowLength - 12, `${P} kN`);\n    }\n\n    function drawReactions(A, C, Ay, Cy) {\n      const leftLen = 55 + Ay * 1.2;\n      const rightLen = 55 + Cy * 1.2;\n\n      const leftArrow = document.getElementById(\"reactionLeftArrow\");\n      leftArrow.setAttribute(\"x1\", A.x, A.y + 10);\n      leftArrow.setAttribute(\"y1\", A.y + 10);\n      leftArrow.setAttribute(\"x2\", A.x, A.y - leftLen);\n\n      const rightArrow = document.getElementById(\"reactionRightArrow\");\n      rightArrow.setAttribute(\"x1\", C.x, C.y + 10);\n      rightArrow.setAttribute(\"y1\", C.y + 10);\n      rightArrow.setAttribute(\"x2\", C.x, C.y - rightLen);\n\n      setText(\"reactionLeftText\", A.x, A.y - leftLen - 10, `${formatNumber(Ay)} kN`);\n      setText(\"reactionRightText\", C.x, C.y - rightLen - 10, `${formatNumber(Cy)} kN`);\n    }\n\n    function toggleLabels() {\n      labelsVisible = !labelsVisible;\n      updateExperiment();\n    }\n\n    function resetExperiment() {\n      loadRange.value = 20;\n      spanRange.value = 8;\n      heightRange.value = 3;\n      document.getElementById(\"quizAnswer\").style.display = \"none\";\n      updateExperiment();\n    }\n\n    function randomizeExperiment() {\n      loadRange.value = Math.floor(Math.random() * 50) + 10;\n      spanRange.value = (Math.floor(Math.random() * 17) + 8) / 2;\n      heightRange.value = (Math.floor(Math.random() * 13) + 2) / 2;\n      document.getElementById(\"quizAnswer\").style.display = \"none\";\n      updateExperiment();\n    }\n\n    function showAnswer() {\n      document.getElementById(\"quizAnswer\").style.display = \"block\";\n    }\n\n    function updateQuiz(P, H, L) {\n      const question = document.getElementById(\"quizQuestion\");\n\n      if (H < 2.5) {\n        question.textContent = \"This truss is getting flatter. What happens to member forces when the height becomes smaller?\";\n      } else if (H > 5) {\n        question.textContent = \"This truss is taller now. Why do the inclined member forces decrease compared with a flatter truss?\";\n      } else if (P > 50) {\n        question.textContent = \"The load is high. Which members are still in compression, and which member stays in tension?\";\n      } else {\n        question.textContent = \"If the load increases, which member force increases the most?\";\n      }\n\n      document.getElementById(\"quizAnswer\").style.display = \"none\";\n    }\n\n    loadRange.addEventListener(\"input\", updateExperiment);\n    spanRange.addEventListener(\"input\", updateExperiment);\n    heightRange.addEventListener(\"input\", updateExperiment);\n\n    updateExperiment();\n  <\/script>\n<\/body>\n<\/html>", "wind_load_tall_buildings": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Wind Load on Tall Buildings<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --wind: #0ea5e9;\n      --high: #ef4444;\n      --mid: #f59e0b;\n      --low: #10b981;\n      --dark: #0f172a;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n    }\n\n    .container {\n      max-width: 1500px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 420px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    input, select, button {\n      font: inherit;\n    }\n\n    input[type=\"range\"],\n    select {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n    }\n\n    .range-row {\n      display: grid;\n      grid-template-columns: 1fr 78px;\n      gap: 10px;\n      align-items: center;\n    }\n\n    .value-box {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      text-align: center;\n      padding: 10px 6px;\n      font-weight: bold;\n      color: var(--accent);\n    }\n\n    .box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .btn-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n    }\n\n    button {\n      padding: 10px 14px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      cursor: pointer;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      border-color: var(--accent);\n      color: var(--accent);\n    }\n\n    .primary {\n      background: var(--accent);\n      color: white;\n      border-color: var(--accent);\n    }\n\n    .primary:hover {\n      opacity: 0.92;\n      color: white;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(5, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .grid-2 {\n      display: grid;\n      grid-template-columns: 1.4fr 1fr;\n      gap: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    .table-wrap {\n      overflow-x: auto;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border-radius: 12px;\n      overflow: hidden;\n    }\n\n    th, td {\n      border-bottom: 1px solid #e5e7eb;\n      padding: 10px;\n      text-align: center;\n      font-size: 14px;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    .pill {\n      display: inline-block;\n      padding: 4px 10px;\n      border-radius: 999px;\n      font-size: 12px;\n      font-weight: bold;\n    }\n\n    .pill.low {\n      background: #dcfce7;\n      color: #166534;\n    }\n\n    .pill.mid {\n      background: #fef3c7;\n      color: #92400e;\n    }\n\n    .pill.high {\n      background: #fee2e2;\n      color: #991b1b;\n    }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 1150px) {\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .grid-2 {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .stats {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Wind Load on Tall Buildings<\/h1>\n      <p>\n        Explore how building height, shape, and wind speed affect wind pressure zones, façade loading,\n        sway behavior, and a simplified structural response.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Inputs<\/h2>\n\n        <div class=\"group\">\n          <label for=\"heightSlider\">Building height<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"heightSlider\" min=\"50\" max=\"400\" step=\"5\" value=\"180\" />\n            <div class=\"value-box\" id=\"heightValue\">180 m<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"shapeSelect\">Building shape<\/label>\n          <select id=\"shapeSelect\">\n            <option value=\"rectangular\">Rectangular tower<\/option>\n            <option value=\"circular\">Circular tower<\/option>\n            <option value=\"tapered\">Tapered tower<\/option>\n            <option value=\"setback\">Setback tower<\/option>\n            <option value=\"slender\">Slender tower<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"windSlider\">Wind speed<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"windSlider\" min=\"10\" max=\"70\" step=\"1\" value=\"35\" />\n            <div class=\"value-box\" id=\"windValue\">35 m/s<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <div class=\"btn-row\">\n            <button class=\"primary\" id=\"updateBtn\">Update Simulation<\/button>\n            <button id=\"sampleUrbanBtn\">Urban Sample<\/button>\n            <button id=\"sampleCoastalBtn\">Coastal Sample<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>What this shows<\/h3>\n          <ul style=\"margin:0; padding-left:20px; color:var(--muted); line-height:1.6;\">\n            <li>Windward pressure increases with wind speed and elevation.<\/li>\n            <li>Top displacement grows strongly with building height.<\/li>\n            <li>Shape changes aerodynamic behavior and sway sensitivity.<\/li>\n            <li>This is a conceptual visualization, not a code design check.<\/li>\n          <\/ul>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>Status<\/h3>\n          <div class=\"status\" id=\"statusText\">\n            Change the inputs and update the simulation to see wind pressure zones and sway response.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"box\">\n          <h2>Key Results<\/h2>\n          <div class=\"stats\">\n            <div class=\"stat\">\n              <small>Base pressure<\/small>\n              <strong id=\"basePressureOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Mid-height pressure<\/small>\n              <strong id=\"midPressureOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Top pressure<\/small>\n              <strong id=\"topPressureOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Top sway<\/small>\n              <strong id=\"swayOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Response level<\/small>\n              <strong id=\"responseOut\">-<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"grid-2\">\n          <div class=\"box\">\n            <h2>Building, Wind Zones, and Sway<\/h2>\n            <canvas id=\"buildingCanvas\" width=\"760\" height=\"520\"><\/canvas>\n          <\/div>\n\n          <div class=\"box\">\n            <h2>Façade Pressure by Height<\/h2>\n            <canvas id=\"pressureCanvas\" width=\"520\" height=\"520\"><\/canvas>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h2>Pressure Zones and Structural Response Idea<\/h2>\n          <div class=\"table-wrap\">\n            <table>\n              <thead>\n                <tr>\n                  <th>Zone<\/th>\n                  <th>Height range<\/th>\n                  <th>Façade pressure<\/th>\n                  <th>Behavior idea<\/th>\n                <\/tr>\n              <\/thead>\n              <tbody id=\"zonesBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n\n        <div class=\"box notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>Taller buildings tend to experience larger lateral displacement under the same wind speed.<\/li>\n            <li>The upper zone usually sees higher wind pressure than the lower zone.<\/li>\n            <li>Smoother or more aerodynamic shapes can reduce pressure and sway effects.<\/li>\n            <li>As sway increases, stiffness systems such as cores, outriggers, or bracing become more important.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Educational wind-response visualizer using simplified assumptions. Not for final structural design.\n    <\/div>\n  <\/div>\n\n  <script>\n    const heightSlider = document.getElementById(\"heightSlider\");\n    const windSlider = document.getElementById(\"windSlider\");\n    const shapeSelect = document.getElementById(\"shapeSelect\");\n\n    const heightValue = document.getElementById(\"heightValue\");\n    const windValue = document.getElementById(\"windValue\");\n\n    const updateBtn = document.getElementById(\"updateBtn\");\n    const sampleUrbanBtn = document.getElementById(\"sampleUrbanBtn\");\n    const sampleCoastalBtn = document.getElementById(\"sampleCoastalBtn\");\n\n    const statusText = document.getElementById(\"statusText\");\n    const basePressureOut = document.getElementById(\"basePressureOut\");\n    const midPressureOut = document.getElementById(\"midPressureOut\");\n    const topPressureOut = document.getElementById(\"topPressureOut\");\n    const swayOut = document.getElementById(\"swayOut\");\n    const responseOut = document.getElementById(\"responseOut\");\n    const zonesBody = document.getElementById(\"zonesBody\");\n\n    const buildingCanvas = document.getElementById(\"buildingCanvas\");\n    const pressureCanvas = document.getElementById(\"pressureCanvas\");\n    const bCtx = buildingCanvas.getContext(\"2d\");\n    const pCtx = pressureCanvas.getContext(\"2d\");\n\n    const shapeData = {\n      rectangular: { label: \"Rectangular tower\", cd: 1.30, swayFactor: 1.00, slenderness: 7 },\n      circular:    { label: \"Circular tower\",    cd: 0.85, swayFactor: 0.80, slenderness: 6 },\n      tapered:     { label: \"Tapered tower\",     cd: 1.00, swayFactor: 0.85, slenderness: 8 },\n      setback:     { label: \"Setback tower\",     cd: 1.10, swayFactor: 0.90, slenderness: 7 },\n      slender:     { label: \"Slender tower\",     cd: 1.40, swayFactor: 1.35, slenderness: 10 }\n    };\n\n    function updateLabels() {\n      heightValue.textContent = `${heightSlider.value} m`;\n      windValue.textContent = `${windSlider.value} m/s`;\n    }\n\n    function exposureFactor(z, H) {\n      const ratio = Math.max(z / 10, 1);\n      const expo = Math.pow(ratio, 0.18);\n      const heightBoost = 1 + 0.08 * Math.min(H / 200, 2);\n      return expo * heightBoost;\n    }\n\n    function pressureAtHeight(windSpeed, cd, z, H) {\n      const q = 0.613 * windSpeed * windSpeed; // N/m²\n      const kz = exposureFactor(z, H);\n      return q * kz * cd / 1000; // kPa\n    }\n\n    function estimateTopSway(height, windSpeed, swayFactor) {\n      const driftRatio =\n        (1 / 7000) *\n        Math.pow(windSpeed / 30, 2) *\n        Math.pow(height / 150, 1.7) *\n        swayFactor;\n\n      const topDispMm = height * 1000 * driftRatio;\n      return Math.max(topDispMm, 5);\n    }\n\n    function getResponseLevel(swayMm, topPressure) {\n      if (swayMm < 150 && topPressure < 2.2) {\n        return { label: \"Low\", className: \"low\", idea: \"Stable response. Conventional stiffness systems may be sufficient.\" };\n      }\n      if (swayMm < 350 && topPressure < 3.5) {\n        return { label: \"Moderate\", className: \"mid\", idea: \"Check lateral stiffness and serviceability. Core and bracing become more important.\" };\n      }\n      return { label: \"High\", className: \"high\", idea: \"Strong wind response. Advanced lateral systems and drift control are likely needed.\" };\n    }\n\n    function getZoneBehavior(zoneName, responseLabel) {\n      if (zoneName === \"Lower zone\") {\n        return responseLabel === \"High\"\n          ? \"Lower pressures than the top, but large cumulative load contributes to base shear.\"\n          : \"Generally lower pressure, but still important for total building force.\";\n      }\n      if (zoneName === \"Middle zone\") {\n        return responseLabel === \"High\"\n          ? \"Noticeable façade loading and increasing contribution to overturning moment.\"\n          : \"Transition zone where both pressure and sway influence become clearer.\";\n      }\n      return responseLabel === \"High\"\n        ? \"Highest façade pressure zone. Critical for cladding pressure and lateral response.\"\n        : \"Top zone is most sensitive to wind acceleration and higher local pressure.\";\n    }\n\n    function drawBuildingScene(H, shapeKey, windSpeed, pBase, pMid, pTop, swayMm) {\n      bCtx.clearRect(0, 0, buildingCanvas.width, buildingCanvas.height);\n\n      const W = buildingCanvas.width;\n      const Hc = buildingCanvas.height;\n      const groundY = Hc - 50;\n      const buildingHeightPx = 360;\n      const baseX = 310;\n      const shape = shapeData[shapeKey];\n\n      const topShiftPx = Math.min(90, swayMm / 12);\n\n      // Sky\n      bCtx.fillStyle = \"#f8fbff\";\n      bCtx.fillRect(0, 0, W, Hc);\n\n      // Ground\n      bCtx.fillStyle = \"#e5e7eb\";\n      bCtx.fillRect(0, groundY, W, Hc - groundY);\n\n      bCtx.strokeStyle = \"#9ca3af\";\n      bCtx.lineWidth = 2;\n      bCtx.beginPath();\n      bCtx.moveTo(0, groundY);\n      bCtx.lineTo(W, groundY);\n      bCtx.stroke();\n\n      // Wind arrows\n      bCtx.strokeStyle = \"#0ea5e9\";\n      bCtx.fillStyle = \"#0ea5e9\";\n      bCtx.lineWidth = 2;\n\n      const arrowCount = 6;\n      for (let i = 0; i < arrowCount; i++) {\n        const y = 80 + i * 55;\n        const len = 70 + (windSpeed - 10) * 1.3;\n        const x1 = 40;\n        const x2 = x1 + len;\n\n        bCtx.beginPath();\n        bCtx.moveTo(x1, y);\n        bCtx.lineTo(x2, y);\n        bCtx.stroke();\n\n        bCtx.beginPath();\n        bCtx.moveTo(x2, y);\n        bCtx.lineTo(x2 - 10, y - 6);\n        bCtx.lineTo(x2 - 10, y + 6);\n        bCtx.closePath();\n        bCtx.fill();\n      }\n\n      bCtx.fillStyle = \"#0ea5e9\";\n      bCtx.font = \"16px Arial\";\n      bCtx.fillText(`Wind = ${windSpeed} m/s`, 40, 45);\n\n      function widthAt(t) {\n        // t: 0 base to 1 top\n        if (shapeKey === \"rectangular\") return 120;\n        if (shapeKey === \"circular\") return 110;\n        if (shapeKey === \"tapered\") return 132 - 42 * t;\n        if (shapeKey === \"setback\") {\n          if (t < 0.35) return 125;\n          if (t < 0.7) return 102;\n          return 82;\n        }\n        if (shapeKey === \"slender\") return 78;\n        return 120;\n      }\n\n      function centerShift(t) {\n        return topShiftPx * t * t;\n      }\n\n      const segments = 40;\n      const leftPts = [];\n      const rightPts = [];\n\n      for (let i = 0; i <= segments; i++) {\n        const t = i / segments;\n        const y = groundY - buildingHeightPx * t;\n        const w = widthAt(t);\n        const shift = centerShift(t);\n        const cx = baseX + shift;\n\n        if (shapeKey === \"circular\") {\n          const bulge = Math.sin(Math.PI * t) * 10;\n          leftPts.push({ x: cx - (w / 2 + bulge), y });\n          rightPts.push({ x: cx + (w / 2 + bulge), y });\n        } else {\n          leftPts.push({ x: cx - w / 2, y });\n          rightPts.push({ x: cx + w / 2, y });\n        }\n      }\n\n      // Building body\n      bCtx.beginPath();\n      bCtx.moveTo(leftPts[0].x, leftPts[0].y);\n      leftPts.forEach(pt => bCtx.lineTo(pt.x, pt.y));\n      rightPts.slice().reverse().forEach(pt => bCtx.lineTo(pt.x, pt.y));\n      bCtx.closePath();\n      bCtx.fillStyle = \"#dbeafe\";\n      bCtx.fill();\n      bCtx.strokeStyle = \"#1e3a8a\";\n      bCtx.lineWidth = 2;\n      bCtx.stroke();\n\n      // Pressure zones on windward façade\n      const zoneFractions = [\n        { name: \"Lower zone\", t1: 0.0, t2: 0.33, color: \"rgba(16,185,129,0.45)\", pressure: pBase },\n        { name: \"Middle zone\", t1: 0.33, t2: 0.66, color: \"rgba(245,158,11,0.45)\", pressure: pMid },\n        { name: \"Upper zone\", t1: 0.66, t2: 1.0, color: \"rgba(239,68,68,0.45)\", pressure: pTop }\n      ];\n\n      zoneFractions.forEach(z => {\n        const y1 = groundY - buildingHeightPx * z.t1;\n        const y2 = groundY - buildingHeightPx * z.t2;\n        const tCenter = (z.t1 + z.t2) / 2;\n        const xShift = centerShift(tCenter);\n        const w = widthAt(tCenter);\n\n        bCtx.fillStyle = z.color;\n        bCtx.beginPath();\n        bCtx.moveTo(baseX + xShift - w / 2, y1);\n        bCtx.lineTo(baseX + xShift - w / 2 + 18, y1);\n        bCtx.lineTo(baseX + xShift - w / 2 + 18, y2);\n        bCtx.lineTo(baseX + xShift - w / 2, y2);\n        bCtx.closePath();\n        bCtx.fill();\n\n        bCtx.fillStyle = \"#111827\";\n        bCtx.font = \"13px Arial\";\n        bCtx.fillText(`${z.pressure.toFixed(2)} kPa`, baseX + xShift - w / 2 + 28, (y1 + y2) / 2);\n      });\n\n      // Sway line\n      bCtx.strokeStyle = \"#7c3aed\";\n      bCtx.lineWidth = 3;\n      bCtx.beginPath();\n      for (let i = 0; i <= segments; i++) {\n        const t = i / segments;\n        const y = groundY - buildingHeightPx * t;\n        const x = baseX + centerShift(t);\n        if (i === 0) bCtx.moveTo(x, y);\n        else bCtx.lineTo(x, y);\n      }\n      bCtx.stroke();\n\n      bCtx.fillStyle = \"#7c3aed\";\n      bCtx.font = \"14px Arial\";\n      bCtx.fillText(`Top sway ≈ ${swayMm.toFixed(0)} mm`, baseX + topShiftPx + 20, groundY - buildingHeightPx - 10);\n\n      // Height label\n      bCtx.strokeStyle = \"#6b7280\";\n      bCtx.lineWidth = 1.5;\n      bCtx.beginPath();\n      bCtx.moveTo(540, groundY);\n      bCtx.lineTo(540, groundY - buildingHeightPx);\n      bCtx.stroke();\n\n      bCtx.beginPath();\n      bCtx.moveTo(532, groundY);\n      bCtx.lineTo(548, groundY);\n      bCtx.moveTo(532, groundY - buildingHeightPx);\n      bCtx.lineTo(548, groundY - buildingHeightPx);\n      bCtx.stroke();\n\n      bCtx.fillStyle = \"#111827\";\n      bCtx.font = \"14px Arial\";\n      bCtx.fillText(`${H} m`, 552, groundY - buildingHeightPx / 2);\n\n      // Title inside drawing\n      bCtx.fillStyle = \"#111827\";\n      bCtx.font = \"16px Arial\";\n      bCtx.fillText(`${shape.label}`, 20, Hc - 18);\n    }\n\n    function drawPressureChart(baseP, midP, topP) {\n      pCtx.clearRect(0, 0, pressureCanvas.width, pressureCanvas.height);\n\n      const W = pressureCanvas.width;\n      const H = pressureCanvas.height;\n      const padL = 80;\n      const padR = 30;\n      const padT = 40;\n      const padB = 50;\n      const plotW = W - padL - padR;\n      const plotH = H - padT - padB;\n\n      const values = [\n        { label: \"Lower\", value: baseP, color: \"#10b981\" },\n        { label: \"Middle\", value: midP, color: \"#f59e0b\" },\n        { label: \"Upper\", value: topP, color: \"#ef4444\" }\n      ];\n\n      const maxVal = Math.max(topP, midP, baseP, 1);\n\n      pCtx.fillStyle = \"#111827\";\n      pCtx.font = \"16px Arial\";\n      pCtx.fillText(\"Windward Façade Pressure\", 16, 24);\n\n      pCtx.strokeStyle = \"#111827\";\n      pCtx.lineWidth = 2;\n      pCtx.beginPath();\n      pCtx.moveTo(padL, padT);\n      pCtx.lineTo(padL, H - padB);\n      pCtx.lineTo(W - padR, H - padB);\n      pCtx.stroke();\n\n      for (let i = 0; i <= 5; i++) {\n        const v = (maxVal / 5) * i;\n        const y = H - padB - (plotH / 5) * i;\n\n        pCtx.strokeStyle = \"#e5e7eb\";\n        pCtx.beginPath();\n        pCtx.moveTo(padL, y);\n        pCtx.lineTo(W - padR, y);\n        pCtx.stroke();\n\n        pCtx.fillStyle = \"#6b7280\";\n        pCtx.font = \"12px Arial\";\n        pCtx.fillText(v.toFixed(1), 28, y + 4);\n      }\n\n      const barW = 70;\n      const gap = 42;\n      const totalBarsW = values.length * barW + (values.length - 1) * gap;\n      const startX = padL + (plotW - totalBarsW) / 2;\n\n      values.forEach((item, i) => {\n        const x = startX + i * (barW + gap);\n        const h = (item.value / maxVal) * plotH;\n        const y = H - padB - h;\n\n        pCtx.fillStyle = item.color;\n        pCtx.fillRect(x, y, barW, h);\n\n        pCtx.fillStyle = \"#111827\";\n        pCtx.font = \"13px Arial\";\n        pCtx.fillText(item.label, x + 10, H - padB + 20);\n        pCtx.fillText(`${item.value.toFixed(2)} kPa`, x - 4, y - 8);\n      });\n\n      pCtx.save();\n      pCtx.translate(18, H / 2 + 30);\n      pCtx.rotate(-Math.PI / 2);\n      pCtx.fillStyle = \"#111827\";\n      pCtx.font = \"14px Arial\";\n      pCtx.fillText(\"Pressure (kPa)\", 0, 0);\n      pCtx.restore();\n    }\n\n    function renderZonesTable(H, pBase, pMid, pTop, response) {\n      zonesBody.innerHTML = \"\";\n\n      const zones = [\n        {\n          name: \"Lower zone\",\n          range: `0 – ${(H * 0.33).toFixed(0)} m`,\n          pressure: `${pBase.toFixed(2)} kPa`,\n          behavior: getZoneBehavior(\"Lower zone\", response.label)\n        },\n        {\n          name: \"Middle zone\",\n          range: `${(H * 0.33).toFixed(0)} – ${(H * 0.66).toFixed(0)} m`,\n          pressure: `${pMid.toFixed(2)} kPa`,\n          behavior: getZoneBehavior(\"Middle zone\", response.label)\n        },\n        {\n          name: \"Upper zone\",\n          range: `${(H * 0.66).toFixed(0)} – ${H.toFixed(0)} m`,\n          pressure: `${pTop.toFixed(2)} kPa`,\n          behavior: getZoneBehavior(\"Upper zone\", response.label)\n        }\n      ];\n\n      zones.forEach(z => {\n        const tr = document.createElement(\"tr\");\n        tr.innerHTML = `\n          <td>${z.name}<\/td>\n          <td>${z.range}<\/td>\n          <td>${z.pressure}<\/td>\n          <td>${z.behavior}<\/td>\n        `;\n        zonesBody.appendChild(tr);\n      });\n    }\n\n    function updateSimulation() {\n      const buildingHeight = Number(heightSlider.value);\n      const windSpeed = Number(windSlider.value);\n      const shapeKey = shapeSelect.value;\n      const shape = shapeData[shapeKey];\n\n      const pBase = pressureAtHeight(windSpeed, shape.cd, buildingHeight * 0.15, buildingHeight);\n      const pMid  = pressureAtHeight(windSpeed, shape.cd, buildingHeight * 0.50, buildingHeight);\n      const pTop  = pressureAtHeight(windSpeed, shape.cd, buildingHeight * 0.90, buildingHeight);\n\n      const swayMm = estimateTopSway(buildingHeight, windSpeed, shape.swayFactor);\n      const response = getResponseLevel(swayMm, pTop);\n\n      basePressureOut.textContent = `${pBase.toFixed(2)} kPa`;\n      midPressureOut.textContent = `${pMid.toFixed(2)} kPa`;\n      topPressureOut.textContent = `${pTop.toFixed(2)} kPa`;\n      swayOut.textContent = `${swayMm.toFixed(0)} mm`;\n      responseOut.innerHTML = `<span class=\"pill ${response.className}\">${response.label}<\/span>`;\n\n      statusText.textContent =\n        `${shape.label} at ${buildingHeight} m under ${windSpeed} m/s wind shows a ${response.label.toLowerCase()} wind-response level. ${response.idea}`;\n\n      drawBuildingScene(buildingHeight, shapeKey, windSpeed, pBase, pMid, pTop, swayMm);\n      drawPressureChart(pBase, pMid, pTop);\n      renderZonesTable(buildingHeight, pBase, pMid, pTop, response);\n    }\n\n    function loadUrbanSample() {\n      heightSlider.value = 180;\n      windSlider.value = 30;\n      shapeSelect.value = \"rectangular\";\n      updateLabels();\n      updateSimulation();\n    }\n\n    function loadCoastalSample() {\n      heightSlider.value = 280;\n      windSlider.value = 52;\n      shapeSelect.value = \"slender\";\n      updateLabels();\n      updateSimulation();\n    }\n\n    heightSlider.addEventListener(\"input\", updateLabels);\n    windSlider.addEventListener(\"input\", updateLabels);\n    updateBtn.addEventListener(\"click\", updateSimulation);\n    sampleUrbanBtn.addEventListener(\"click\", loadUrbanSample);\n    sampleCoastalBtn.addEventListener(\"click\", loadCoastalSample);\n\n    updateLabels();\n    updateSimulation();\n  <\/script>\n<\/body>\n<\/html>", "hvac_load_estimator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>HVAC Load Estimator<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --cool: #0ea5e9;\n      --heat: #ef4444;\n      --good: #059669;\n      --warn: #d97706;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n    }\n\n    .container {\n      max-width: 1450px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 420px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    input, select, button {\n      font: inherit;\n    }\n\n    input[type=\"number\"],\n    input[type=\"range\"],\n    select {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n    }\n\n    .range-row {\n      display: grid;\n      grid-template-columns: 1fr 72px;\n      gap: 10px;\n      align-items: center;\n    }\n\n    .value-box {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      text-align: center;\n      padding: 10px 6px;\n      font-weight: bold;\n      color: var(--accent);\n    }\n\n    .box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .btn-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n    }\n\n    button {\n      padding: 10px 14px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      cursor: pointer;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      border-color: var(--accent);\n      color: var(--accent);\n    }\n\n    .primary {\n      background: var(--accent);\n      color: white;\n      border-color: var(--accent);\n    }\n\n    .primary:hover {\n      opacity: 0.92;\n      color: white;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(130px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .cooling {\n      color: var(--cool);\n    }\n\n    .heating {\n      color: var(--heat);\n    }\n\n    .tonnage {\n      color: var(--good);\n    }\n\n    .grid-2 {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 18px;\n    }\n\n    .table-wrap {\n      overflow-x: auto;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border-radius: 12px;\n      overflow: hidden;\n    }\n\n    th, td {\n      border-bottom: 1px solid #e5e7eb;\n      padding: 10px;\n      text-align: center;\n      font-size: 14px;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 1100px) {\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr 1fr;\n      }\n\n      .grid-2 {\n        grid-template-columns: 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .stats {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>HVAC Load Estimator<\/h1>\n      <p>\n        Explore how room size, occupancy, glazing, and climate affect cooling load, heating load,\n        major load contributors, and estimated air-conditioning tonnage.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Inputs<\/h2>\n\n        <div class=\"group\">\n          <label for=\"lengthInput\">Room length (m)<\/label>\n          <input type=\"number\" id=\"lengthInput\" min=\"1\" step=\"0.1\" value=\"6\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"widthInput\">Room width (m)<\/label>\n          <input type=\"number\" id=\"widthInput\" min=\"1\" step=\"0.1\" value=\"5\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"heightInput\">Room height (m)<\/label>\n          <input type=\"number\" id=\"heightInput\" min=\"2\" step=\"0.1\" value=\"3\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"occupancyInput\">Occupancy (people)<\/label>\n          <input type=\"number\" id=\"occupancyInput\" min=\"0\" step=\"1\" value=\"4\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"glazingSlider\">Glazing ratio of wall area (%)<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"glazingSlider\" min=\"0\" max=\"80\" step=\"1\" value=\"25\" />\n            <div class=\"value-box\" id=\"glazingValue\">25%<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"climateSelect\">Climate<\/label>\n          <select id=\"climateSelect\">\n            <option value=\"hotDry\">Hot Dry<\/option>\n            <option value=\"hotHumid\">Hot Humid<\/option>\n            <option value=\"temperate\" selected>Temperate<\/option>\n            <option value=\"cold\">Cold<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"box\">\n          <div class=\"btn-row\">\n            <button class=\"primary\" id=\"calculateBtn\">Estimate Loads<\/button>\n            <button id=\"sampleOfficeBtn\">Office Sample<\/button>\n            <button id=\"sampleClassBtn\">Classroom Sample<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>How it works<\/h3>\n          <ul style=\"margin:0; padding-left:20px; color:var(--muted); line-height:1.6;\">\n            <li>Cooling load includes envelope, glass solar gain, ventilation, people, and equipment.<\/li>\n            <li>Heating load includes transmission and ventilation losses, reduced by internal gains.<\/li>\n            <li>The model uses simplified assumptions for educational use.<\/li>\n          <\/ul>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>Status<\/h3>\n          <div class=\"status\" id=\"statusText\">\n            Change the inputs and click Estimate Loads to calculate HVAC demand.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"box\">\n          <h2>Estimated Results<\/h2>\n          <div class=\"stats\">\n            <div class=\"stat\">\n              <small>Cooling load<\/small>\n              <strong class=\"cooling\" id=\"coolingLoadOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Heating load<\/small>\n              <strong class=\"heating\" id=\"heatingLoadOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>AC tonnage estimate<\/small>\n              <strong class=\"tonnage\" id=\"tonnageOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Room area<\/small>\n              <strong id=\"areaOut\">-<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"grid-2\">\n          <div class=\"box\">\n            <h2>Cooling Load Contributors<\/h2>\n            <canvas id=\"coolingCanvas\" width=\"560\" height=\"320\"><\/canvas>\n          <\/div>\n\n          <div class=\"box\">\n            <h2>Heating Load Contributors<\/h2>\n            <canvas id=\"heatingCanvas\" width=\"560\" height=\"320\"><\/canvas>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h2>Major Load Contributors<\/h2>\n          <div class=\"table-wrap\">\n            <table>\n              <thead>\n                <tr>\n                  <th>Contributor<\/th>\n                  <th>Cooling (kW)<\/th>\n                  <th>Heating (kW)<\/th>\n                  <th>Importance<\/th>\n                <\/tr>\n              <\/thead>\n              <tbody id=\"contributorsBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n\n        <div class=\"box notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>Larger glazing areas usually increase cooling demand strongly because of solar gain.<\/li>\n            <li>Occupancy increases cooling load and can reduce heating load due to internal gains.<\/li>\n            <li>Climate has a major influence on both cooling and heating demand.<\/li>\n            <li>Room size affects envelope area, ventilation volume, and internal load magnitude.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Educational HVAC estimator using simplified load assumptions. Not for final engineering design.\n    <\/div>\n  <\/div>\n\n  <script>\n    const lengthInput = document.getElementById(\"lengthInput\");\n    const widthInput = document.getElementById(\"widthInput\");\n    const heightInput = document.getElementById(\"heightInput\");\n    const occupancyInput = document.getElementById(\"occupancyInput\");\n    const glazingSlider = document.getElementById(\"glazingSlider\");\n    const glazingValue = document.getElementById(\"glazingValue\");\n    const climateSelect = document.getElementById(\"climateSelect\");\n\n    const calculateBtn = document.getElementById(\"calculateBtn\");\n    const sampleOfficeBtn = document.getElementById(\"sampleOfficeBtn\");\n    const sampleClassBtn = document.getElementById(\"sampleClassBtn\");\n\n    const coolingLoadOut = document.getElementById(\"coolingLoadOut\");\n    const heatingLoadOut = document.getElementById(\"heatingLoadOut\");\n    const tonnageOut = document.getElementById(\"tonnageOut\");\n    const areaOut = document.getElementById(\"areaOut\");\n    const statusText = document.getElementById(\"statusText\");\n    const contributorsBody = document.getElementById(\"contributorsBody\");\n\n    const coolingCanvas = document.getElementById(\"coolingCanvas\");\n    const heatingCanvas = document.getElementById(\"heatingCanvas\");\n    const coolingCtx = coolingCanvas.getContext(\"2d\");\n    const heatingCtx = heatingCanvas.getContext(\"2d\");\n\n    const climates = {\n      hotDry: {\n        name: \"Hot Dry\",\n        summerOutdoor: 40,\n        winterOutdoor: 8,\n        solarGain: 260,\n        ach: 0.7\n      },\n      hotHumid: {\n        name: \"Hot Humid\",\n        summerOutdoor: 35,\n        winterOutdoor: 18,\n        solarGain: 230,\n        ach: 1.0\n      },\n      temperate: {\n        name: \"Temperate\",\n        summerOutdoor: 30,\n        winterOutdoor: 8,\n        solarGain: 180,\n        ach: 0.6\n      },\n      cold: {\n        name: \"Cold\",\n        summerOutdoor: 26,\n        winterOutdoor: -5,\n        solarGain: 120,\n        ach: 0.5\n      }\n    };\n\n    const assumptions = {\n      coolingSetpoint: 24,\n      heatingSetpoint: 21,\n      wallU: 0.8,\n      roofU: 0.5,\n      glassU: 5.5,\n      shgc: 0.7,\n      peopleCoolingW: 130,\n      peopleHeatingOffsetW: 100,\n      equipmentWm2: 8\n    };\n\n    function formatKW(value) {\n      return `${value.toFixed(2)} kW`;\n    }\n\n    function formatArea(value) {\n      return `${value.toFixed(1)} m²`;\n    }\n\n    function updateGlazingLabel() {\n      glazingValue.textContent = `${glazingSlider.value}%`;\n    }\n\n    function clampMin(value, min) {\n      return Math.max(min, value);\n    }\n\n    function calculateLoads() {\n      const L = clampMin(Number(lengthInput.value), 1);\n      const W = clampMin(Number(widthInput.value), 1);\n      const H = clampMin(Number(heightInput.value), 2);\n      const occupancy = clampMin(Number(occupancyInput.value), 0);\n      const glazingRatio = Number(glazingSlider.value) / 100;\n      const climate = climates[climateSelect.value];\n\n      const floorArea = L * W;\n      const volume = floorArea * H;\n      const wallArea = 2 * H * (L + W);\n      const glazingArea = wallArea * glazingRatio;\n      const opaqueWallArea = wallArea - glazingArea;\n      const roofArea = floorArea;\n\n      const deltaTCooling = Math.max(climate.summerOutdoor - assumptions.coolingSetpoint, 0);\n      const deltaTHeating = Math.max(assumptions.heatingSetpoint - climate.winterOutdoor, 0);\n\n      const wallCooling = assumptions.wallU * opaqueWallArea * deltaTCooling;\n      const roofCooling = assumptions.roofU * roofArea * deltaTCooling;\n      const glassCondCooling = assumptions.glassU * glazingArea * deltaTCooling;\n      const solarCooling = glazingArea * climate.solarGain * assumptions.shgc;\n      const ventilationCooling = 0.33 * climate.ach * volume * deltaTCooling;\n      const peopleCooling = occupancy * assumptions.peopleCoolingW;\n      const equipmentCooling = floorArea * assumptions.equipmentWm2;\n\n      const coolingContributors = {\n        \"Walls\": wallCooling / 1000,\n        \"Roof\": roofCooling / 1000,\n        \"Glass conduction\": glassCondCooling / 1000,\n        \"Solar through glazing\": solarCooling / 1000,\n        \"Ventilation / infiltration\": ventilationCooling / 1000,\n        \"Occupancy\": peopleCooling / 1000,\n        \"Equipment / lighting\": equipmentCooling / 1000\n      };\n\n      const totalCoolingKW = Object.values(coolingContributors).reduce((a, b) => a + b, 0);\n\n      const wallHeating = assumptions.wallU * opaqueWallArea * deltaTHeating;\n      const roofHeating = assumptions.roofU * roofArea * deltaTHeating;\n      const glassCondHeating = assumptions.glassU * glazingArea * deltaTHeating;\n      const ventilationHeating = 0.33 * climate.ach * volume * deltaTHeating;\n      const peopleHeatingOffset = occupancy * assumptions.peopleHeatingOffsetW;\n      const equipmentHeatingOffset = floorArea * assumptions.equipmentWm2;\n\n      const grossHeatingKW = (wallHeating + roofHeating + glassCondHeating + ventilationHeating) / 1000;\n      const internalHeatOffsetKW = (peopleHeatingOffset + equipmentHeatingOffset) / 1000;\n      const totalHeatingKW = Math.max(grossHeatingKW - internalHeatOffsetKW, 0);\n\n      const heatingContributors = {\n        \"Walls\": wallHeating / 1000,\n        \"Roof\": roofHeating / 1000,\n        \"Glass conduction\": glassCondHeating / 1000,\n        \"Ventilation / infiltration\": ventilationHeating / 1000,\n        \"Occupancy offset\": -(peopleHeatingOffset / 1000),\n        \"Equipment / lighting offset\": -(equipmentHeatingOffset / 1000)\n      };\n\n      const totalCoolingBTUh = totalCoolingKW * 3412.142;\n      const acTons = totalCoolingBTUh / 12000;\n\n      coolingLoadOut.textContent = formatKW(totalCoolingKW);\n      heatingLoadOut.textContent = formatKW(totalHeatingKW);\n      tonnageOut.textContent = `${acTons.toFixed(2)} TR`;\n      areaOut.textContent = formatArea(floorArea);\n\n      statusText.textContent =\n        `Estimated loads updated for a ${floorArea.toFixed(1)} m² room in ${climate.name} climate. Cooling is mainly influenced by solar gain, ventilation, occupancy, and envelope conditions.`;\n\n      drawBarChart(coolingCtx, coolingCanvas, coolingContributors, \"Cooling Contributors\", true);\n      drawBarChart(heatingCtx, heatingCanvas, heatingContributors, \"Heating Contributors\", false);\n      renderContributorsTable(coolingContributors, heatingContributors);\n    }\n\n    function renderContributorsTable(cooling, heating) {\n      contributorsBody.innerHTML = \"\";\n\n      const allKeys = Array.from(new Set([...Object.keys(cooling), ...Object.keys(heating)]));\n\n      const rows = allKeys.map(key => {\n        const c = cooling[key] || 0;\n        const h = heating[key] || 0;\n        const importance = Math.max(Math.abs(c), Math.abs(h));\n        return { key, c, h, importance };\n      }).sort((a, b) => b.importance - a.importance);\n\n      rows.forEach(row => {\n        const tr = document.createElement(\"tr\");\n\n        let importanceLabel = \"Low\";\n        if (row.importance >= 2.5) importanceLabel = \"High\";\n        else if (row.importance >= 1.0) importanceLabel = \"Medium\";\n\n        tr.innerHTML = `\n          <td>${row.key}<\/td>\n          <td>${row.c.toFixed(2)}<\/td>\n          <td>${row.h.toFixed(2)}<\/td>\n          <td>${importanceLabel}<\/td>\n        `;\n\n        contributorsBody.appendChild(tr);\n      });\n    }\n\n    function drawBarChart(ctx, canvas, data, title, positiveOnly) {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n      const entries = Object.entries(data);\n      if (entries.length === 0) return;\n\n      const padL = 160;\n      const padR = 30;\n      const padT = 35;\n      const padB = 35;\n      const plotW = canvas.width - padL - padR;\n      const plotH = canvas.height - padT - padB;\n\n      let maxAbs = 0;\n      entries.forEach(([, value]) => {\n        maxAbs = Math.max(maxAbs, Math.abs(value));\n      });\n      if (maxAbs === 0) maxAbs = 1;\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(title, 16, 24);\n\n      const rowH = plotH / entries.length;\n\n      entries.forEach(([label, value], i) => {\n        const y = padT + i * rowH + 8;\n        const barH = rowH - 16;\n\n        ctx.fillStyle = \"#6b7280\";\n        ctx.font = \"13px Arial\";\n        ctx.fillText(label, 12, y + barH * 0.72);\n\n        const zeroX = positiveOnly ? padL : padL + plotW * 0.35;\n\n        ctx.strokeStyle = \"#e5e7eb\";\n        ctx.beginPath();\n        ctx.moveTo(padL, y + barH + 5);\n        ctx.lineTo(canvas.width - padR, y + barH + 5);\n        ctx.stroke();\n\n        if (!positiveOnly) {\n          ctx.strokeStyle = \"#9ca3af\";\n          ctx.beginPath();\n          ctx.moveTo(zeroX, padT);\n          ctx.lineTo(zeroX, canvas.height - padB);\n          ctx.stroke();\n        }\n\n        if (positiveOnly) {\n          const width = (Math.max(value, 0) / maxAbs) * plotW;\n          ctx.fillStyle = \"#0ea5e9\";\n          ctx.fillRect(padL, y, width, barH);\n          ctx.fillStyle = \"#111827\";\n          ctx.fillText(`${value.toFixed(2)} kW`, padL + width + 8, y + barH * 0.72);\n        } else {\n          const halfW = plotW * 0.65;\n          const width = (Math.abs(value) / maxAbs) * halfW;\n\n          if (value >= 0) {\n            ctx.fillStyle = \"#ef4444\";\n            ctx.fillRect(zeroX, y, width, barH);\n            ctx.fillStyle = \"#111827\";\n            ctx.fillText(`${value.toFixed(2)} kW`, zeroX + width + 8, y + barH * 0.72);\n          } else {\n            ctx.fillStyle = \"#10b981\";\n            ctx.fillRect(zeroX - width, y, width, barH);\n            ctx.fillStyle = \"#111827\";\n            ctx.fillText(`${value.toFixed(2)} kW`, zeroX - width - 60, y + barH * 0.72);\n          }\n        }\n      });\n    }\n\n    function loadOfficeSample() {\n      lengthInput.value = 6;\n      widthInput.value = 5;\n      heightInput.value = 3;\n      occupancyInput.value = 4;\n      glazingSlider.value = 30;\n      climateSelect.value = \"hotHumid\";\n      updateGlazingLabel();\n      calculateLoads();\n    }\n\n    function loadClassroomSample() {\n      lengthInput.value = 9;\n      widthInput.value = 7;\n      heightInput.value = 3.2;\n      occupancyInput.value = 20;\n      glazingSlider.value = 20;\n      climateSelect.value = \"temperate\";\n      updateGlazingLabel();\n      calculateLoads();\n    }\n\n    glazingSlider.addEventListener(\"input\", updateGlazingLabel);\n    calculateBtn.addEventListener(\"click\", calculateLoads);\n    sampleOfficeBtn.addEventListener(\"click\", loadOfficeSample);\n    sampleClassBtn.addEventListener(\"click\", loadClassroomSample);\n\n    updateGlazingLabel();\n    calculateLoads();\n  <\/script>\n<\/body>\n<\/html>", "PID_Controller_Basics": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>PID Controller Basics<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n      --danger: #dc2626;\n      --purple: #7c3aed;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1360px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 400px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select, input[type=\"range\"] {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .slider-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n      margin-bottom: 12px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .btn-row {\n      display: grid;\n      grid-template-columns: repeat(3, 1fr);\n      gap: 10px;\n      margin-top: 14px;\n    }\n\n    button {\n      border: none;\n      border-radius: 12px;\n      padding: 12px;\n      font-weight: bold;\n      cursor: pointer;\n      background: #e5e7eb;\n      color: #111827;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      transform: translateY(-1px);\n    }\n\n    .primary {\n      background: #dbeafe;\n      color: #1d4ed8;\n    }\n\n    .secondary {\n      background: #ecfeff;\n      color: #0f766e;\n    }\n\n    .danger {\n      background: #fee2e2;\n      color: #b91c1c;\n    }\n\n    .formula-box, .chart-wrap, .mini-wrap, .notes-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    #responseCanvas {\n      height: 420px;\n    }\n\n    #controlCanvas {\n      height: 220px;\n    }\n\n    .legend {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 16px;\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .legend span::before {\n      content: \"\";\n      display: inline-block;\n      width: 14px;\n      height: 3px;\n      margin-right: 8px;\n      vertical-align: middle;\n      border-radius: 999px;\n    }\n\n    .setpoint::before { background: var(--danger); }\n    .process::before { background: var(--accent); }\n    .control::before { background: var(--good); }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 980px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr;\n      }\n\n      .btn-row {\n        grid-template-columns: 1fr;\n      }\n\n      #responseCanvas {\n        height: 320px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>PID Controller Basics<\/h1>\n      <p>\n        Explore how proportional, integral, and derivative control affect system response.\n        Change the controller gains and see how the process variable tracks the setpoint, how quickly it settles,\n        and whether it overshoots or oscillates.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"modeSelect\">Controller mode<\/label>\n          <select id=\"modeSelect\">\n            <option value=\"P\">P only<\/option>\n            <option value=\"PI\">PI<\/option>\n            <option value=\"PD\">PD<\/option>\n            <option value=\"PID\" selected>PID<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"setpointSlider\">\n            Setpoint\n            <span class=\"value\" id=\"setpointValue\">1.00<\/span>\n          <\/label>\n          <input type=\"range\" id=\"setpointSlider\" min=\"0.2\" max=\"2\" step=\"0.01\" value=\"1.00\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"kpSlider\">\n            Proportional gain Kp\n            <span class=\"value\" id=\"kpValue\">2.50<\/span>\n          <\/label>\n          <input type=\"range\" id=\"kpSlider\" min=\"0\" max=\"10\" step=\"0.01\" value=\"2.50\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"kiSlider\">\n            Integral gain Ki\n            <span class=\"value\" id=\"kiValue\">0.80<\/span>\n          <\/label>\n          <input type=\"range\" id=\"kiSlider\" min=\"0\" max=\"5\" step=\"0.01\" value=\"0.80\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"kdSlider\">\n            Derivative gain Kd\n            <span class=\"value\" id=\"kdValue\">0.60<\/span>\n          <\/label>\n          <input type=\"range\" id=\"kdSlider\" min=\"0\" max=\"5\" step=\"0.01\" value=\"0.60\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"tauSlider\">\n            Plant time constant\n            <span class=\"value\" id=\"tauValue\">1.50 s<\/span>\n          <\/label>\n          <input type=\"range\" id=\"tauSlider\" min=\"0.2\" max=\"6\" step=\"0.01\" value=\"1.50\" />\n        <\/div>\n\n        <div class=\"slider-box\">\n          <label for=\"disturbanceSlider\">\n            Disturbance (starts at 8 s)\n            <span class=\"value\" id=\"disturbanceValue\">0.20<\/span>\n          <\/label>\n          <input type=\"range\" id=\"disturbanceSlider\" min=\"-1\" max=\"1\" step=\"0.01\" value=\"0.20\" />\n        <\/div>\n\n        <div class=\"btn-row\">\n          <button class=\"primary\" id=\"runBtn\">Run Simulation<\/button>\n          <button class=\"secondary\" id=\"presetBtn\">Load Stable Example<\/button>\n          <button class=\"danger\" id=\"aggressiveBtn\">Load Aggressive Example<\/button>\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Core idea<\/h3>\n          <div class=\"formula\">error = setpoint - process value<\/div><br>\n          <div class=\"formula\">u = Kp·e + Ki∫e dt + Kd·de/dt<\/div><br>\n          <div class=\"formula\">Plant: τ(dy/dt) + y = u + disturbance<\/div>\n\n          <div class=\"status\" id=\"statusText\">\n            Proportional control reacts to the current error, integral control removes long-term offset, and derivative control predicts the trend and damps motion.\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Overshoot<\/small>\n            <strong id=\"overshootOut\">0.00%<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Settling time<\/small>\n            <strong id=\"settlingOut\">--<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Final value<\/small>\n            <strong id=\"finalOut\">0.00<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Steady-state error<\/small>\n            <strong id=\"sseOut\">0.00<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Peak value<\/small>\n            <strong id=\"peakOut\">0.00<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Controller type<\/small>\n            <strong id=\"modeOut\">PID<\/strong>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"chart-wrap\">\n          <h2>System Response<\/h2>\n          <canvas id=\"responseCanvas\" width=\"920\" height=\"420\"><\/canvas>\n          <div class=\"legend\">\n            <span class=\"setpoint\">Setpoint<\/span>\n            <span class=\"process\">Process value<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"m
