ini-wrap\">\n          <h2>Control Signal<\/h2>\n          <canvas id=\"controlCanvas\" width=\"920\" height=\"220\"><\/canvas>\n          <div class=\"legend\">\n            <span class=\"control\">Controller output<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>P control responds immediately, but it may leave a steady-state error.<\/li>\n            <li>I control accumulates past error and helps remove offset.<\/li>\n            <li>D control reacts to how fast the error changes and can reduce overshoot.<\/li>\n            <li>Too much gain can make the system oscillate or become unstable.<\/li>\n          <\/ul>\n          <p>\n            A useful activity is to start with P only, then add I, then add D, and compare how the response changes each time.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding PID controller basics.\n    <\/div>\n  <\/div>\n\n  <script>\n    const modeSelect = document.getElementById(\"modeSelect\");\n    const setpointSlider = document.getElementById(\"setpointSlider\");\n    const kpSlider = document.getElementById(\"kpSlider\");\n    const kiSlider = document.getElementById(\"kiSlider\");\n    const kdSlider = document.getElementById(\"kdSlider\");\n    const tauSlider = document.getElementById(\"tauSlider\");\n    const disturbanceSlider = document.getElementById(\"disturbanceSlider\");\n\n    const setpointValue = document.getElementById(\"setpointValue\");\n    const kpValue = document.getElementById(\"kpValue\");\n    const kiValue = document.getElementById(\"kiValue\");\n    const kdValue = document.getElementById(\"kdValue\");\n    const tauValue = document.getElementById(\"tauValue\");\n    const disturbanceValue = document.getElementById(\"disturbanceValue\");\n\n    const overshootOut = document.getElementById(\"overshootOut\");\n    const settlingOut = document.getElementById(\"settlingOut\");\n    const finalOut = document.getElementById(\"finalOut\");\n    const sseOut = document.getElementById(\"sseOut\");\n    const peakOut = document.getElementById(\"peakOut\");\n    const modeOut = document.getElementById(\"modeOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const responseCanvas = document.getElementById(\"responseCanvas\");\n    const responseCtx = responseCanvas.getContext(\"2d\");\n\n    const controlCanvas = document.getElementById(\"controlCanvas\");\n    const controlCtx = controlCanvas.getContext(\"2d\");\n\n    const runBtn = document.getElementById(\"runBtn\");\n    const presetBtn = document.getElementById(\"presetBtn\");\n    const aggressiveBtn = document.getElementById(\"aggressiveBtn\");\n\n    function fmt(n) {\n      return Number(n).toFixed(2);\n    }\n\n    function getSettings() {\n      let mode = modeSelect.value;\n      let kp = parseFloat(kpSlider.value);\n      let ki = parseFloat(kiSlider.value);\n      let kd = parseFloat(kdSlider.value);\n\n      if (mode === \"P\") {\n        ki = 0;\n        kd = 0;\n      } else if (mode === \"PI\") {\n        kd = 0;\n      } else if (mode === \"PD\") {\n        ki = 0;\n      }\n\n      return {\n        mode,\n        setpoint: parseFloat(setpointSlider.value),\n        kp,\n        ki,\n        kd,\n        tau: parseFloat(tauSlider.value),\n        disturbance: parseFloat(disturbanceSlider.value)\n      };\n    }\n\n    function syncLabels() {\n      const s = getSettings();\n      setpointValue.textContent = s.setpoint.toFixed(2);\n      kpValue.textContent = s.kp.toFixed(2);\n      kiValue.textContent = parseFloat(kiSlider.value).toFixed(2);\n      kdValue.textContent = parseFloat(kdSlider.value).toFixed(2);\n      tauValue.textContent = `${s.tau.toFixed(2)} s`;\n      disturbanceValue.textContent = s.disturbance.toFixed(2);\n      modeOut.textContent = s.mode;\n    }\n\n    function simulate() {\n      const s = getSettings();\n      const dt = 0.02;\n      const tMax = 20;\n\n      const time = [];\n      const setpointArr = [];\n      const yArr = [];\n      const uArr = [];\n      const eArr = [];\n\n      let y = 0;\n      let u = 0;\n      let integral = 0;\n      let prevError = s.setpoint - y;\n\n      for (let t = 0; t <= tMax; t += dt) {\n        const disturbance = t >= 8 ? s.disturbance : 0;\n        const error = s.setpoint - y;\n\n        integral += error * dt;\n        const derivative = (error - prevError) / dt;\n\n        u = s.kp * error + s.ki * integral + s.kd * derivative;\n\n        // simple actuator saturation\n        u = Math.max(-5, Math.min(5, u));\n\n        // first-order plant\n        const dydt = (-y + u + disturbance) / s.tau;\n        y += dydt * dt;\n\n        time.push(t);\n        setpointArr.push(s.setpoint);\n        yArr.push(y);\n        uArr.push(u);\n        eArr.push(error);\n\n        prevError = error;\n      }\n\n      const peak = Math.max(...yArr);\n      const overshoot = Math.max(0, ((peak - s.setpoint) / s.setpoint) * 100);\n      const finalValue = yArr[yArr.length - 1];\n      const steadyStateError = s.setpoint - finalValue;\n\n      let settlingTime = null;\n      const tol = 0.02 * s.setpoint;\n\n      for (let i = 0; i < yArr.length; i++) {\n        let settled = true;\n        for (let j = i; j < yArr.length; j++) {\n          if (Math.abs(yArr[j] - s.setpoint) > tol) {\n            settled = false;\n            break;\n          }\n        }\n        if (settled) {\n          settlingTime = time[i];\n          break;\n        }\n      }\n\n      updateMetrics({\n        overshoot,\n        settlingTime,\n        finalValue,\n        steadyStateError,\n        peak,\n        mode: s.mode\n      });\n\n      updateStatus(s, overshoot, settlingTime, steadyStateError);\n      drawResponseChart(time, setpointArr, yArr);\n      drawControlChart(time, uArr);\n    }\n\n    function updateMetrics(m) {\n      overshootOut.textContent = `${fmt(m.overshoot)}%`;\n      settlingOut.textContent = m.settlingTime === null ? \"--\" : `${fmt(m.settlingTime)} s`;\n      finalOut.textContent = fmt(m.finalValue);\n      sseOut.textContent = fmt(m.steadyStateError);\n      peakOut.textContent = fmt(m.peak);\n      modeOut.textContent = m.mode;\n    }\n\n    function updateStatus(s, overshoot, settlingTime, sse) {\n      if (overshoot > 25) {\n        statusText.textContent = \"The response is aggressive and shows large overshoot. Try reducing Kp or Ki, or increasing Kd for more damping.\";\n      } else if (settlingTime === null) {\n        statusText.textContent = \"The system does not settle within the simulated time. This may indicate oscillation, slow dynamics, or poor tuning.\";\n      } else if (Math.abs(sse) > 0.03 && s.ki === 0) {\n        statusText.textContent = \"There is noticeable steady-state error. Adding integral action can help remove the long-term offset.\";\n      } else if (s.kd > 0 && overshoot < 10) {\n        statusText.textContent = \"Derivative action is helping damp the response and reduce overshoot.\";\n      } else {\n        statusText.textContent = \"This response is reasonably balanced. The controller tracks the setpoint with manageable overshoot and settling.\";\n      }\n    }\n\n    function drawAxes(ctx, canvas, xMax, yMin, yMax, xLabel, yLabel) {\n      const w = canvas.width;\n      const h = canvas.height;\n      const padL = 55;\n      const padR = 20;\n      const padT = 20;\n      const padB = 45;\n      const plotW = w - padL - padR;\n      const plotH = h - padT - padB;\n\n      ctx.clearRect(0, 0, w, h);\n\n      ctx.strokeStyle = \"#e5e7eb\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= 10; i++) {\n        const x = padL + (plotW / 10) * i;\n        ctx.beginPath();\n        ctx.moveTo(x, padT);\n        ctx.lineTo(x, h - padB);\n        ctx.stroke();\n      }\n\n      for (let i = 0; i <= 6; i++) {\n        const y = padT + (plotH / 6) * i;\n        ctx.beginPath();\n        ctx.moveTo(padL, y);\n        ctx.lineTo(w - padR, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(padL, padT);\n      ctx.lineTo(padL, h - padB);\n      ctx.lineTo(w - padR, h - padB);\n      ctx.stroke();\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"15px Arial\";\n      ctx.fillText(xLabel, w / 2 - 18, h - 10);\n\n      ctx.save();\n      ctx.translate(16, h / 2 + 20);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(yLabel, 0, 0);\n      ctx.restore();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"13px Arial\";\n      for (let i = 0; i <= 10; i++) {\n        const val = (xMax / 10) * i;\n        const x = padL + (plotW / 10) * i;\n        ctx.fillText(val.toFixed(0), x - 5, h - padB + 18);\n      }\n\n      for (let i = 0; i <= 6; i++) {\n        const val = yMax - ((yMax - yMin) / 6) * i;\n        const y = padT + (plotH / 6) * i;\n        ctx.fillText(val.toFixed(2), 5, y + 4);\n      }\n\n      return {\n        padL, padR, padT, padB, plotW, plotH,\n        toCanvasX: x => padL + (x / xMax) * plotW,\n        toCanvasY: y => padT + ((yMax - y) / (yMax - yMin)) * plotH\n      };\n    }\n\n    function drawResponseChart(time, setpointArr, yArr) {\n      const xMax = time[time.length - 1];\n      const yMin = 0;\n      const yMax = Math.max(2.2, ...setpointArr, ...yArr) * 1.1;\n\n      const map = drawAxes(responseCtx, responseCanvas, xMax, yMin, yMax, \"Time (s)\", \"Output\");\n\n      responseCtx.strokeStyle = \"#dc2626\";\n      responseCtx.lineWidth = 2.5;\n      responseCtx.beginPath();\n      for (let i = 0; i < time.length; i++) {\n        const x = map.toCanvasX(time[i]);\n        const y = map.toCanvasY(setpointArr[i]);\n        if (i === 0) responseCtx.moveTo(x, y);\n        else responseCtx.lineTo(x, y);\n      }\n      responseCtx.stroke();\n\n      responseCtx.strokeStyle = \"#2563eb\";\n      responseCtx.lineWidth = 3;\n      responseCtx.beginPath();\n      for (let i = 0; i < time.length; i++) {\n        const x = map.toCanvasX(time[i]);\n        const y = map.toCanvasY(yArr[i]);\n        if (i === 0) responseCtx.moveTo(x, y);\n        else responseCtx.lineTo(x, y);\n      }\n      responseCtx.stroke();\n\n      // disturbance marker\n      const dx = map.toCanvasX(8);\n      responseCtx.strokeStyle = \"#9ca3af\";\n      responseCtx.lineWidth = 1.5;\n      responseCtx.setLineDash([6, 6]);\n      responseCtx.beginPath();\n      responseCtx.moveTo(dx, map.padT);\n      responseCtx.lineTo(dx, responseCanvas.height - map.padB);\n      responseCtx.stroke();\n      responseCtx.setLineDash([]);\n\n      responseCtx.fillStyle = \"#6b7280\";\n      responseCtx.font = \"13px Arial\";\n      responseCtx.fillText(\"Disturbance applied\", dx + 8, map.padT + 16);\n    }\n\n    function drawControlChart(time, uArr) {\n      const xMax = time[time.length - 1];\n      const yMin = -5.5;\n      const yMax = 5.5;\n\n      const map = drawAxes(controlCtx, controlCanvas, xMax, yMin, yMax, \"Time (s)\", \"Control\");\n\n      controlCtx.strokeStyle = \"#059669\";\n      controlCtx.lineWidth = 3;\n      controlCtx.beginPath();\n      for (let i = 0; i < time.length; i++) {\n        const x = map.toCanvasX(time[i]);\n        const y = map.toCanvasY(uArr[i]);\n        if (i === 0) controlCtx.moveTo(x, y);\n        else controlCtx.lineTo(x, y);\n      }\n      controlCtx.stroke();\n    }\n\n    function loadStableExample() {\n      modeSelect.value = \"PID\";\n      setpointSlider.value = \"1.00\";\n      kpSlider.value = \"2.50\";\n      kiSlider.value = \"0.80\";\n      kdSlider.value = \"0.60\";\n      tauSlider.value = \"1.50\";\n      disturbanceSlider.value = \"0.20\";\n      syncLabels();\n      simulate();\n    }\n\n    function loadAggressiveExample() {\n      modeSelect.value = \"PID\";\n      setpointSlider.value = \"1.00\";\n      kpSlider.value = \"6.50\";\n      kiSlider.value = \"2.50\";\n      kdSlider.value = \"0.10\";\n      tauSlider.value = \"1.00\";\n      disturbanceSlider.value = \"0.20\";\n      syncLabels();\n      simulate();\n    }\n\n    [modeSelect, setpointSlider, kpSlider, kiSlider, kdSlider, tauSlider, disturbanceSlider].forEach(el => {\n      el.addEventListener(\"input\", () => {\n        syncLabels();\n        simulate();\n      });\n    });\n\n    runBtn.addEventListener(\"click\", simulate);\n    presetBtn.addEventListener(\"click\", loadStableExample);\n    aggressiveBtn.addEventListener(\"click\", loadAggressiveExample);\n\n    syncLabels();\n    simulate();\n  <\/script>\n<\/body>\n<\/html>", "elevator-control-simulator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Elevator Control Simulator<\/title>\n  <style>\n    :root{\n      --bg:#f4f7fb;\n      --panel:#ffffff;\n      --line:#dbe3ee;\n      --text:#132033;\n      --muted:#667085;\n      --accent:#2563eb;\n      --green:#16a34a;\n      --orange:#f59e0b;\n      --red:#dc2626;\n      --building:#dfe7f2;\n      --shaft:#aebed1;\n      --floor:#8ba0b7;\n      --car:#334155;\n      --door:#cbd5e1;\n    }\n\n    *{box-sizing:border-box}\n\n    body{\n      margin:0;\n      font-family:Arial, Helvetica, sans-serif;\n      background:var(--bg);\n      color:var(--text);\n    }\n\n    .wrap{\n      max-width:1500px;\n      margin:0 auto;\n      padding:20px;\n    }\n\n    .hero{\n      background:linear-gradient(135deg,#eef4ff,#ffffff);\n      border:1px solid var(--line);\n      border-radius:18px;\n      padding:20px;\n      margin-bottom:18px;\n    }\n\n    .hero h1{\n      margin:0 0 8px;\n      font-size:30px;\n    }\n\n    .hero p{\n      margin:0;\n      color:var(--muted);\n      line-height:1.6;\n    }\n\n    .grid{\n      display:grid;\n      grid-template-columns:360px 1fr;\n      gap:18px;\n    }\n\n    .panel,.main{\n      background:var(--panel);\n      border:1px solid var(--line);\n      border-radius:18px;\n      padding:18px;\n      box-shadow:0 10px 28px rgba(0,0,0,0.05);\n    }\n\n    .section{\n      margin-bottom:16px;\n      padding:14px;\n      border:1px solid var(--line);\n      border-radius:14px;\n      background:#fbfcfe;\n    }\n\n    .section h3{\n      margin:0 0 12px;\n      font-size:17px;\n    }\n\n    .row{\n      margin-bottom:12px;\n    }\n\n    .row:last-child{\n      margin-bottom:0;\n    }\n\n    label{\n      display:block;\n      font-weight:bold;\n      margin-bottom:6px;\n      font-size:14px;\n    }\n\n    .range-wrap{\n      display:grid;\n      grid-template-columns:1fr 90px;\n      gap:10px;\n      align-items:center;\n    }\n\n    input[type=\"range\"], select{\n      width:100%;\n    }\n\n    .value{\n      text-align:center;\n      padding:8px 6px;\n      border:1px solid var(--line);\n      border-radius:10px;\n      background:#fff;\n      color:var(--accent);\n      font-weight:bold;\n      font-size:14px;\n    }\n\n    .btns{\n      display:flex;\n      flex-wrap:wrap;\n      gap:10px;\n    }\n\n    button{\n      border:1px solid var(--line);\n      background:#fff;\n      border-radius:10px;\n      padding:10px 14px;\n      cursor:pointer;\n      font:inherit;\n      transition:.2s;\n    }\n\n    button:hover{\n      border-color:var(--accent);\n      color:var(--accent);\n    }\n\n    .primary{\n      background:var(--accent);\n      border-color:var(--accent);\n      color:#fff;\n    }\n\n    .primary:hover{\n      color:#fff;\n      opacity:.92;\n    }\n\n    .stats{\n      display:grid;\n      grid-template-columns:repeat(6,minmax(120px,1fr));\n      gap:12px;\n      margin-bottom:16px;\n    }\n\n    .stat{\n      border:1px solid var(--line);\n      border-radius:12px;\n      background:#fff;\n      padding:12px;\n    }\n\n    .stat small{\n      display:block;\n      color:var(--muted);\n      margin-bottom:6px;\n    }\n\n    .stat strong{\n      font-size:18px;\n    }\n\n    .canvas-box{\n      border:1px solid var(--line);\n      border-radius:16px;\n      background:#f8fafc;\n      padding:10px;\n    }\n\n    canvas{\n      width:100%;\n      display:block;\n      border-radius:12px;\n      background:#fff;\n      border:1px solid #e5e7eb;\n    }\n\n    .note{\n      color:var(--muted);\n      font-size:14px;\n      line-height:1.6;\n    }\n\n    .pill{\n      display:inline-block;\n      padding:6px 10px;\n      border-radius:999px;\n      font-size:12px;\n      margin-right:8px;\n      margin-bottom:8px;\n      border:1px solid var(--line);\n      background:#fff;\n    }\n\n    @media (max-width:1200px){\n      .grid{grid-template-columns:1fr}\n      .stats{grid-template-columns:repeat(3,1fr)}\n    }\n\n    @media (max-width:700px){\n      .stats{grid-template-columns:1fr 1fr}\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"wrap\">\n    <div class=\"hero\">\n      <h1>Elevator Control Simulator<\/h1>\n      <p>\n        A visual simulation for control systems, optimization, and operations. Test how elevator traffic changes under\n        normal conditions, morning up-peak, evening down-peak, and lunch-time mixed demand.\n      <\/p>\n    <\/div>\n\n    <div class=\"grid\">\n      <div class=\"panel\">\n        <div class=\"section\">\n          <h3>Simulation controls<\/h3>\n\n          <div class=\"row\">\n            <label for=\"trafficMode\">Traffic mode<\/label>\n            <select id=\"trafficMode\">\n              <option value=\"normal\">Normal mixed traffic<\/option>\n              <option value=\"uppeak\">Morning up-peak<\/option>\n              <option value=\"downpeak\">Evening down-peak<\/option>\n              <option value=\"lunch\">Lunch-time mixed flow<\/option>\n            <\/select>\n          <\/div>\n\n          <div class=\"row\">\n            <label for=\"arrivalRate\">Passenger arrival rate<\/label>\n            <div class=\"range-wrap\">\n              <input type=\"range\" id=\"arrivalRate\" min=\"0.4\" max=\"4.0\" step=\"0.1\" value=\"1.6\">\n              <div class=\"value\" id=\"arrivalRateVal\">1.6 /s<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"row\">\n            <label for=\"simSpeed\">Simulation speed<\/label>\n            <div class=\"range-wrap\">\n              <input type=\"range\" id=\"simSpeed\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1\">\n              <div class=\"value\" id=\"simSpeedVal\">1.0x<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"row\">\n            <label for=\"doorTime\">Door dwell time<\/label>\n            <div class=\"range-wrap\">\n              <input type=\"range\" id=\"doorTime\" min=\"1\" max=\"4\" step=\"0.1\" value=\"1.8\">\n              <div class=\"value\" id=\"doorTimeVal\">1.8 s<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"section\">\n          <h3>Presets<\/h3>\n          <div class=\"btns\">\n            <button id=\"presetNormal\">Normal<\/button>\n            <button id=\"presetPeak\">Morning Peak<\/button>\n            <button id=\"presetEvening\">Evening Peak<\/button>\n            <button id=\"presetHeavy\">Heavy Congestion<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"section\">\n          <h3>Actions<\/h3>\n          <div class=\"btns\">\n            <button class=\"primary\" id=\"pauseBtn\">Pause<\/button>\n            <button id=\"resetBtn\">Reset<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"section\">\n          <h3>What to observe<\/h3>\n          <div class=\"note\">\n            Compare queue buildup, average wait time, elevator occupancy, and passenger throughput across different demand patterns.\n            Morning up-peak usually overloads the lobby queue, while evening down-peak creates high demand on upper floors.\n          <\/div>\n        <\/div>\n\n        <div class=\"section\">\n          <h3>Legend<\/h3>\n          <div class=\"pill\">Blue people = going up<\/div>\n          <div class=\"pill\">Orange people = going down<\/div>\n          <div class=\"pill\">Dark car = elevator<\/div>\n          <div class=\"pill\">Sliding light panels = doors<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main\">\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Simulation time<\/small>\n            <strong id=\"timeOut\">0.0 s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Passengers waiting<\/small>\n            <strong id=\"waitingOut\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Passengers served<\/small>\n            <strong id=\"servedOut\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Average wait<\/small>\n            <strong id=\"avgWaitOut\">0.0 s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Avg system time<\/small>\n            <strong id=\"avgSystemOut\">0.0 s<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Elevator utilization<\/small>\n            <strong id=\"utilOut\">0%<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Lobby queue<\/small>\n            <strong id=\"lobbyQueueOut\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Upper-floor queue<\/small>\n            <strong id=\"upperQueueOut\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Max queue observed<\/small>\n            <strong id=\"maxQueueOut\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Car 1 load<\/small>\n            <strong id=\"car1Out\">0/8<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Car 2 load<\/small>\n            <strong id=\"car2Out\">0/8<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Car 3 load<\/small>\n            <strong id=\"car3Out\">0/8<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"canvas-box\">\n          <canvas id=\"simCanvas\" width=\"1100\" height=\"860\"><\/canvas>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <script>\n    const canvas = document.getElementById(\"simCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    const trafficMode = document.getElementById(\"trafficMode\");\n    const arrivalRate = document.getElementById(\"arrivalRate\");\n    const simSpeed = document.getElementById(\"simSpeed\");\n    const doorTime = document.getElementById(\"doorTime\");\n\n    const arrivalRateVal = document.getElementById(\"arrivalRateVal\");\n    const simSpeedVal = document.getElementById(\"simSpeedVal\");\n    const doorTimeVal = document.getElementById(\"doorTimeVal\");\n\n    const pauseBtn = document.getElementById(\"pauseBtn\");\n    const resetBtn = document.getElementById(\"resetBtn\");\n\n    const presetNormal = document.getElementById(\"presetNormal\");\n    const presetPeak = document.getElementById(\"presetPeak\");\n    const presetEvening = document.getElementById(\"presetEvening\");\n    const presetHeavy = document.getElementById(\"presetHeavy\");\n\n    const timeOut = document.getElementById(\"timeOut\");\n    const waitingOut = document.getElementById(\"waitingOut\");\n    const servedOut = document.getElementById(\"servedOut\");\n    const avgWaitOut = document.getElementById(\"avgWaitOut\");\n    const avgSystemOut = document.getElementById(\"avgSystemOut\");\n    const utilOut = document.getElementById(\"utilOut\");\n    const lobbyQueueOut = document.getElementById(\"lobbyQueueOut\");\n    const upperQueueOut = document.getElementById(\"upperQueueOut\");\n    const maxQueueOut = document.getElementById(\"maxQueueOut\");\n    const car1Out = document.getElementById(\"car1Out\");\n    const car2Out = document.getElementById(\"car2Out\");\n    const car3Out = document.getElementById(\"car3Out\");\n\n    const W = canvas.width;\n    const H = canvas.height;\n\n    const FLOOR_COUNT = 10;\n    const ELEVATOR_COUNT = 3;\n    const CAR_CAPACITY = 8;\n\n    const buildingLeft = 150;\n    const buildingRight = 930;\n    const shaftTop = 70;\n    const shaftBottom = 790;\n    const floorGap = (shaftBottom - shaftTop) / (FLOOR_COUNT - 1);\n    const shaftXs = [460, 610, 760];\n    const shaftWidth = 90;\n    const carWidth = 72;\n    const carHeight = 42;\n\n    let simTime = 0;\n    let lastTime = 0;\n    let paused = false;\n    let passengerId = 0;\n\n    let passengers = [];\n    let waiting = Array.from({ length: FLOOR_COUNT }, () => []);\n    let elevators = [];\n    let arrivalAccumulator = 0;\n\n    let servedCount = 0;\n    let totalWait = 0;\n    let totalSystemTime = 0;\n    let maxQueueObserved = 0;\n    let busyTimeAccumulator = 0;\n    let totalElevatorTime = 0;\n\n    function floorToY(floor) {\n      return shaftBottom - floor * floorGap;\n    }\n\n    function yToFloor(y) {\n      return Math.round((shaftBottom - y) / floorGap);\n    }\n\n    function rand(min, max) {\n      return Math.random() * (max - min) + min;\n    }\n\n    function choice(arr) {\n      return arr[Math.floor(Math.random() * arr.length)];\n    }\n\n    function updateLabels() {\n      arrivalRateVal.textContent = `${Number(arrivalRate.value).toFixed(1)} /s`;\n      simSpeedVal.textContent = `${Number(simSpeed.value).toFixed(1)}x`;\n      doorTimeVal.textContent = `${Number(doorTime.value).toFixed(1)} s`;\n    }\n\n    function createElevators() {\n      elevators = [];\n      for (let i = 0; i < ELEVATOR_COUNT; i++) {\n        elevators.push({\n          id: i + 1,\n          shaftX: shaftXs[i],\n          pos: 0,\n          target: null,\n          direction: 0,\n          state: \"idle\", // idle, moving, opening, open, closing\n          door: 0,\n          passengers: [],\n          serviceCooldown: 0,\n          dwell: 0,\n          busy: false\n        });\n      }\n    }\n\n    function createPassenger(source, dest) {\n      const dir = dest > source ? 1 : -1;\n      const p = {\n        id: ++passengerId,\n        source,\n        dest,\n        dir,\n        createdAt: simTime,\n        boardedAt: null,\n        servedAt: null,\n        elevatorId: null,\n        state: \"waiting\", // waiting, boarding, inElevator, exiting, done\n        x: buildingLeft + 85,\n        y: floorToY(source),\n        targetX: buildingLeft + 85,\n        targetY: floorToY(source),\n        color: dir > 0 ? \"#2563eb\" : \"#f59e0b\"\n      };\n      passengers.push(p);\n      waiting[source].push(p.id);\n    }\n\n    function generatePassenger() {\n      const mode = trafficMode.value;\n      let source, dest;\n\n      if (mode === \"uppeak\") {\n        if (Math.random() < 0.82) {\n          source = 0;\n          dest = Math.floor(rand(1, FLOOR_COUNT));\n        } else {\n          source = Math.floor(rand(1, FLOOR_COUNT));\n          do { dest = Math.floor(rand(1, FLOOR_COUNT)); } while (dest === source);\n        }\n      } else if (mode === \"downpeak\") {\n        if (Math.random() < 0.82) {\n          source = Math.floor(rand(1, FLOOR_COUNT));\n          dest = 0;\n        } else {\n          source = Math.floor(rand(1, FLOOR_COUNT));\n          do { dest = Math.floor(rand(1, FLOOR_COUNT)); } while (dest === source);\n        }\n      } else if (mode === \"lunch\") {\n        const r = Math.random();\n        if (r < 0.4) {\n          source = 0;\n          dest = Math.floor(rand(1, FLOOR_COUNT));\n        } else if (r < 0.8) {\n          source = Math.floor(rand(1, FLOOR_COUNT));\n          dest = 0;\n        } else {\n          source = Math.floor(rand(1, FLOOR_COUNT));\n          do { dest = Math.floor(rand(1, FLOOR_COUNT)); } while (dest === source);\n        }\n      } else {\n        source = Math.floor(rand(0, FLOOR_COUNT));\n        do { dest = Math.floor(rand(0, FLOOR_COUNT)); } while (dest === source);\n      }\n\n      createPassenger(source, dest);\n    }\n\n    function getPassengerById(id) {\n      return passengers.find(p => p.id === id);\n    }\n\n    function getWaitingCount() {\n      return waiting.reduce((sum, arr) => sum + arr.length, 0);\n    }\n\n    function getLobbyQueue() {\n      return waiting[0].length;\n    }\n\n    function getUpperQueue() {\n      let s = 0;\n      for (let i = 1; i < FLOOR_COUNT; i++) s += waiting[i].length;\n      return s;\n    }\n\n    function getCurrentFloor(e) {\n      return Math.round(e.pos);\n    }\n\n    function getAssignedTargets() {\n      return elevators\n        .filter(e => e.target !== null)\n        .map(e => e.target);\n    }\n\n    function getFloorsWithWaiting() {\n      const arr = [];\n      for (let f = 0; f < FLOOR_COUNT; f++) {\n        if (waiting[f].length > 0) arr.push(f);\n      }\n      return arr;\n    }\n\n    function getNearestFloor(fromFloor, floors) {\n      if (!floors.length) return null;\n      let best = floors[0];\n      let bestDist = Math.abs(best - fromFloor);\n      for (const f of floors) {\n        const d = Math.abs(f - fromFloor);\n        if (d < bestDist) {\n          best = f;\n          bestDist = d;\n        }\n      }\n      return best;\n    }\n\n    function chooseTarget(e) {\n      const currentFloor = getCurrentFloor(e);\n\n      const dropFloors = [...new Set(e.passengers.map(p => p.dest))];\n      const waitingFloors = getFloorsWithWaiting();\n      const otherTargets = getAssignedTargets().filter(t => t !== e.target);\n\n      if (dropFloors.includes(currentFloor)) {\n        return currentFloor;\n      }\n\n      const hasWaitingHere = waiting[currentFloor].length > 0;\n      if (hasWaitingHere && e.passengers.length < CAR_CAPACITY) {\n        return currentFloor;\n      }\n\n      if (dropFloors.length > 0) {\n        if (e.direction > 0) {\n          const ahead = dropFloors.filter(f => f >= currentFloor).sort((a,b) => a-b);\n          if (ahead.length) return ahead[0];\n        } else if (e.direction < 0) {\n          const behind = dropFloors.filter(f => f <= currentFloor).sort((a,b) => b-a);\n          if (behind.length) return behind[0];\n        }\n        return getNearestFloor(currentFloor, dropFloors);\n      }\n\n      let freeCalls = waitingFloors.filter(f => !otherTargets.includes(f));\n      if (!freeCalls.length) freeCalls = waitingFloors;\n\n      if (freeCalls.length > 0) {\n        return getNearestFloor(currentFloor, freeCalls);\n      }\n\n      return null;\n    }\n\n    function shouldOpenAtCurrentFloor(e) {\n      const floor = getCurrentFloor(e);\n      const drop = e.passengers.some(p => p.dest === floor);\n      const pick = waiting[floor].length > 0 && e.passengers.length < CAR_CAPACITY;\n      return drop || pick;\n    }\n\n    function updateElevator(e, dt) {\n      e.serviceCooldown -= dt;\n      e.busy = false;\n\n      if (e.state === \"idle\") {\n        if (shouldOpenAtCurrentFloor(e)) {\n          e.state = \"opening\";\n        } else {\n          e.target = chooseTarget(e);\n          if (e.target !== null) {\n            if (Math.abs(e.target - e.pos) < 0.01) {\n              e.state = \"opening\";\n            } else {\n              e.direction = e.target > e.pos ? 1 : -1;\n              e.state = \"moving\";\n            }\n          }\n        }\n      }\n\n      if (e.state === \"moving\") {\n        e.busy = true;\n        const speedFloorsPerSecond = 1.15;\n        const dir = e.target > e.pos ? 1 : -1;\n        e.direction = dir;\n        e.pos += dir * speedFloorsPerSecond * dt;\n\n        if ((dir > 0 && e.pos >= e.target) || (dir < 0 && e.pos <= e.target)) {\n          e.pos = e.target;\n          e.state = \"opening\";\n        }\n      }\n\n      if (e.state === \"opening\") {\n        e.busy = true;\n        e.door += dt * 2.2;\n        if (e.door >= 1) {\n          e.door = 1;\n          e.state = \"open\";\n          e.dwell = 0;\n          e.serviceCooldown = 0;\n        }\n      }\n\n      if (e.state === \"open\") {\n        e.busy = true;\n        e.dwell += dt;\n        const floor = getCurrentFloor(e);\n\n        const exitingPassengers = e.passengers.filter(p => p.dest === floor);\n        if (exitingPassengers.length > 0 && e.serviceCooldown <= 0) {\n          const p = exitingPassengers[0];\n          p.state = \"exiting\";\n          p.targetX = e.shaftX + 90;\n          p.targetY = floorToY(floor);\n          e.passengers = e.passengers.filter(x => x.id !== p.id);\n          e.serviceCooldown = 0.25;\n        } else {\n          const eligibleIds = waiting[floor].filter(id => {\n            const p = getPassengerById(id);\n            if (!p) return false;\n            if (e.passengers.length >= CAR_CAPACITY) return false;\n            if (e.passengers.length === 0) return true;\n            if (e.direction === 0) return true;\n            return p.dir === e.direction;\n          });\n\n          if (eligibleIds.length > 0 && e.serviceCooldown <= 0) {\n            const pid = eligibleIds[0];\n            const p = getPassengerById(pid);\n            waiting[floor] = waiting[floor].filter(id => id !== pid);\n            p.state = \"boarding\";\n            p.elevatorId = e.id;\n            p.targetX = e.shaftX;\n            p.targetY = floorToY(floor);\n            e.serviceCooldown = 0.25;\n          }\n        }\n\n        const stillNeedService =\n          e.passengers.some(p => p.dest === floor) ||\n          (waiting[floor].length > 0 && e.passengers.length < CAR_CAPACITY) ||\n          passengers.some(p => p.state === \"boarding\" && p.elevatorId === e.id) ||\n          passengers.some(p => p.state === \"exiting\" && p.elevatorId === e.id);\n\n        if (!stillNeedService && e.dwell >= Number(doorTime.value)) {\n          e.state = \"closing\";\n        }\n      }\n\n      if (e.state === \"closing\") {\n        e.busy = true;\n        e.door -= dt * 2.2;\n        if (e.door <= 0) {\n          e.door = 0;\n          const next = chooseTarget(e);\n          e.target = next;\n          if (next === null) {\n            e.state = \"idle\";\n            e.direction = 0;\n          } else if (Math.abs(next - e.pos) < 0.01) {\n            e.state = \"opening\";\n          } else {\n            e.direction = next > e.pos ? 1 : -1;\n            e.state = \"moving\";\n          }\n        }\n      }\n    }\n\n    function updatePassengers(dt) {\n      for (const p of passengers) {\n        if (p.state === \"waiting\") {\n          const queue = waiting[p.source];\n          const index = queue.indexOf(p.id);\n          const row = Math.floor(index / 10);\n          const col = index % 10;\n          p.targetX = buildingLeft + 85 + col * 14;\n          p.targetY = floorToY(p.source) - 10 - row * 12;\n        }\n\n        if (p.state === \"boarding\") {\n          const e = elevators.find(el => el.id === p.elevatorId);\n          if (e) {\n            p.targetX = e.shaftX;\n            p.targetY = floorToY(getCurrentFloor(e));\n          }\n        }\n\n        if (p.state === \"inElevator\") {\n          const e = elevators.find(el => el.id === p.elevatorId);\n          if (e) {\n            const idx = e.passengers.findIndex(x => x.id === p.id);\n            const col = idx % 3;\n            const row = Math.floor(idx / 3);\n            p.x = e.shaftX - 16 + col * 16;\n            p.y = floorToY(getCurrentFloor(e)) + 10 - row * 12;\n            continue;\n          }\n        }\n\n        if (p.state === \"exiting\") {\n          const e = elevators.find(el => el.id === p.elevatorId);\n          if (!e) {\n            p.targetX = buildingRight - 40;\n          }\n        }\n\n        const dx = p.targetX - p.x;\n        const dy = p.targetY - p.y;\n        const dist = Math.hypot(dx, dy);\n        const speed = 220 * dt;\n\n        if (dist > 1) {\n          p.x += (dx / dist) * Math.min(speed, dist);\n          p.y += (dy / dist) * Math.min(speed, dist);\n        } else {\n          p.x = p.targetX;\n          p.y = p.targetY;\n\n          if (p.state === \"boarding\") {\n            const e = elevators.find(el => el.id === p.elevatorId);\n            if (e && e.passengers.length < CAR_CAPACITY) {\n              p.state = \"inElevator\";\n              p.boardedAt = simTime;\n              totalWait += (p.boardedAt - p.createdAt);\n              e.passengers.push(p);\n              if (p.dest > getCurrentFloor(e)) e.direction = 1;\n              if (p.dest < getCurrentFloor(e)) e.direction = -1;\n            }\n          } else if (p.state === \"exiting\") {\n            p.state = \"done\";\n            p.servedAt = simTime;\n            servedCount++;\n            totalSystemTime += (p.servedAt - p.createdAt);\n          }\n        }\n      }\n\n      passengers = passengers.filter(p => p.state !== \"done\");\n    }\n\n    function updateArrivals(dt) {\n      arrivalAccumulator += Number(arrivalRate.value) * dt;\n      while (arrivalAccumulator >= 1) {\n        arrivalAccumulator -= 1;\n        generatePassenger();\n      }\n    }\n\n    function updateMetrics(dt) {\n      const waitingCount = getWaitingCount();\n      const lobbyQueue = getLobbyQueue();\n      const upperQueue = getUpperQueue();\n      maxQueueObserved = Math.max(maxQueueObserved, waitingCount);\n\n      totalElevatorTime += elevators.length * dt;\n      busyTimeAccumulator += elevators.filter(e => e.busy).length * dt;\n\n      timeOut.textContent = `${simTime.toFixed(1)} s`;\n      waitingOut.textContent = waitingCount;\n      servedOut.textContent = servedCount;\n      avgWaitOut.textContent = `${servedCount ? (totalWait / servedCount).toFixed(1) : \"0.0\"} s`;\n      avgSystemOut.textContent = `${servedCount ? (totalSystemTime / servedCount).toFixed(1) : \"0.0\"} s`;\n      utilOut.textContent = `${totalElevatorTime ? Math.round((busyTimeAccumulator / totalElevatorTime) * 100) : 0}%`;\n\n      lobbyQueueOut.textContent = lobbyQueue;\n      upperQueueOut.textContent = upperQueue;\n      maxQueueOut.textContent = maxQueueObserved;\n\n      car1Out.textContent = `${elevators[0].passengers.length}/8`;\n      car2Out.textContent = `${elevators[1].passengers.length}/8`;\n      car3Out.textContent = `${elevators[2].passengers.length}/8`;\n    }\n\n    function draw() {\n      ctx.clearRect(0, 0, W, H);\n\n      drawBackground();\n      drawFloors();\n      drawQueues();\n      drawElevators();\n      drawPassengers();\n      drawLabels();\n    }\n\n    function drawBackground() {\n      ctx.fillStyle = \"#eef4fa\";\n      ctx.fillRect(0, 0, W, H);\n\n      ctx.fillStyle = \"#dde7f0\";\n      ctx.fillRect(buildingLeft, 40, buildingRight - buildingLeft, 780);\n\n      ctx.fillStyle = \"#c7d4e4\";\n      ctx.fillRect(buildingLeft - 30, 40, 30, 780);\n\n      ctx.fillStyle = \"#c7d4e4\";\n      ctx.fillRect(buildingRight, 40, 30, 780);\n    }\n\n    function drawFloors() {\n      for (let f = 0; f < FLOOR_COUNT; f++) {\n        const y = floorToY(f);\n\n        ctx.strokeStyle = \"#8ba0b7\";\n        ctx.lineWidth = 2;\n        ctx.beginPath();\n        ctx.moveTo(buildingLeft, y);\n        ctx.lineTo(buildingRight, y);\n        ctx.stroke();\n\n        ctx.fillStyle = \"#334155\";\n        ctx.font = \"bold 15px Arial\";\n        ctx.fillText(`Floor ${f}`, 30, y + 5);\n      }\n\n      for (let i = 0; i < shaftXs.length; i++) {\n        const x = shaftXs[i];\n        ctx.fillStyle = \"#aebed1\";\n        ctx.fillRect(x - shaftWidth / 2, shaftTop - 15, shaftWidth, shaftBottom - shaftTop + 30);\n\n        ctx.fillStyle = \"#94a3b8\";\n        ctx.fillRect(x - shaftWidth / 2 + 8, shaftTop - 8, shaftWidth - 16, shaftBottom - shaftTop + 16);\n      }\n    }\n\n    function drawQueues() {\n      ctx.fillStyle = \"#0f172a\";\n      ctx.font = \"bold 16px Arial\";\n      ctx.fillText(`Lobby queue: ${waiting[0].length}`, buildingLeft + 20, floorToY(0) + 30);\n\n      let upper = 0;\n      for (let i = 1; i < FLOOR_COUNT; i++) upper += waiting[i].length;\n      ctx.fillText(`Upper-floor queue: ${upper}`, buildingLeft + 20, 55);\n    }\n\n    function drawElevators() {\n      for (const e of elevators) {\n        const y = floorToY(e.pos);\n\n        ctx.fillStyle = \"#334155\";\n        ctx.fillRect(e.shaftX - carWidth / 2, y - carHeight / 2, carWidth, carHeight);\n\n        ctx.fillStyle = \"#0f172a\";\n        ctx.fillRect(e.shaftX - carWidth / 2, y - carHeight / 2 - 14, carWidth, 10);\n\n        ctx.fillStyle = \"#ffffff\";\n        ctx.font = \"bold 12px Arial\";\n        ctx.fillText(`E${e.id}`, e.shaftX - 10, y - carHeight / 2 - 6);\n\n        const half = carWidth / 2;\n        const doorGap = half * e.door;\n        const panelW = half - doorGap;\n\n        ctx.fillStyle = \"#cbd5e1\";\n        ctx.fillRect(e.shaftX - half, y - carHeight / 2 + 2, panelW, carHeight - 4);\n        ctx.fillRect(e.shaftX + doorGap, y - carHeight / 2 + 2, panelW, carHeight - 4);\n\n        ctx.strokeStyle = \"#111827\";\n        ctx.lineWidth = 1.2;\n        ctx.strokeRect(e.shaftX - carWidth / 2, y - carHeight / 2, carWidth, carHeight);\n\n        // load dots\n        for (let i = 0; i < e.passengers.length; i++) {\n          const col = i % 3;\n          const row = Math.floor(i / 3);\n          const px = e.shaftX - 16 + col * 16;\n          const py = y + 10 - row * 12;\n          ctx.beginPath();\n          ctx.fillStyle = e.passengers[i].color;\n          ctx.arc(px, py, 4.5, 0, Math.PI * 2);\n          ctx.fill();\n        }\n\n        // direction arrow\n        ctx.fillStyle = \"#e2e8f0\";\n        ctx.font = \"bold 18px Arial\";\n        const arrow = e.direction > 0 ? \"↑\" : e.direction < 0 ? \"↓\" : \"•\";\n        ctx.fillText(arrow, e.shaftX - 4, y + 6);\n      }\n    }\n\n    function drawPassengers() {\n      for (const p of passengers) {\n        if (p.state === \"done\") continue;\n\n        ctx.beginPath();\n        ctx.fillStyle = p.color;\n        ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);\n        ctx.fill();\n\n        ctx.strokeStyle = \"rgba(15,23,42,0.35)\";\n        ctx.stroke();\n      }\n    }\n\n    function drawLabels() {\n      ctx.fillStyle = \"#0f172a\";\n      ctx.font = \"bold 18px Arial\";\n      ctx.fillText(\"Waiting area\", buildingLeft + 20, shaftBottom + 48);\n\n      ctx.fillText(\"Elevator shafts\", shaftXs[0] - 20, 28);\n\n      const modeText = {\n        normal: \"Normal mixed traffic\",\n        uppeak: \"Morning up-peak\",\n        downpeak: \"Evening down-peak\",\n        lunch: \"Lunch-time mixed flow\"\n      }[trafficMode.value];\n\n      ctx.fillStyle = \"#334155\";\n      ctx.font = \"bold 16px Arial\";\n      ctx.fillText(`Mode: ${modeText}`, 820, 28);\n    }\n\n    function resetSimulation() {\n      simTime = 0;\n      lastTime = 0;\n      passengerId = 0;\n      arrivalAccumulator = 0;\n      servedCount = 0;\n      totalWait = 0;\n      totalSystemTime = 0;\n      maxQueueObserved = 0;\n      busyTimeAccumulator = 0;\n      totalElevatorTime = 0;\n      waiting = Array.from({ length: FLOOR_COUNT }, () => []);\n      passengers = [];\n      createElevators();\n      updateMetrics(0);\n      draw();\n    }\n\n    function animate(ts) {\n      if (!lastTime) lastTime = ts;\n      let dt = (ts - lastTime) / 1000;\n      lastTime = ts;\n      if (dt > 0.04) dt = 0.04;\n\n      if (!paused) {\n        const s = Number(simSpeed.value);\n        dt *= s;\n        simTime += dt;\n\n        updateArrivals(dt);\n        for (const e of elevators) updateElevator(e, dt);\n        updatePassengers(dt);\n        updateMetrics(dt);\n      }\n\n      draw();\n      requestAnimationFrame(animate);\n    }\n\n    function setPreset(mode, rate, speed, dwell) {\n      trafficMode.value = mode;\n      arrivalRate.value = rate;\n      simSpeed.value = speed;\n      doorTime.value = dwell;\n      updateLabels();\n    }\n\n    arrivalRate.addEventListener(\"input\", updateLabels);\n    simSpeed.addEventListener(\"input\", updateLabels);\n    doorTime.addEventListener(\"input\", updateLabels);\n\n    pauseBtn.addEventListener(\"click\", () => {\n      paused = !paused;\n      pauseBtn.textContent = paused ? \"Resume\" : \"Pause\";\n    });\n\n    resetBtn.addEventListener(\"click\", resetSimulation);\n\n    presetNormal.addEventListener(\"click\", () => setPreset(\"normal\", 1.6, 1.0, 1.8));\n    presetPeak.addEventListener(\"click\", () => setPreset(\"uppeak\", 2.4, 1.0, 1.8));\n    presetEvening.addEventListener(\"click\", () => setPreset(\"downpeak\", 2.4, 1.0, 1.8));\n    presetHeavy.addEventListener(\"click\", () => setPreset(\"uppeak\", 3.6, 1.0, 2.2));\n\n    updateLabels();\n    resetSimulation();\n    requestAnimationFrame(animate);\n  <\/script>\n<\/body>\n<\/html>", "traffic_intersection_simulator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Traffic Intersection Simulator - Road Engineering Version<\/title>\n  <style>\n    :root{\n      --bg:#f4f7fb;\n      --panel:#ffffff;\n      --line:#d6dbe3;\n      --text:#172033;\n      --muted:#667085;\n      --road:#2f3640;\n      --road2:#3b434f;\n      --grass:#cde89b;\n      --accent:#2563eb;\n    }\n\n    *{box-sizing:border-box}\n\n    body{\n      margin:0;\n      font-family:Arial, Helvetica, sans-serif;\n      background:var(--bg);\n      color:var(--text);\n    }\n\n    .wrap{\n      max-width:1500px;\n      margin:0 auto;\n      padding:20px;\n    }\n\n    .hero{\n      background:linear-gradient(135deg,#eef4ff,#ffffff);\n      border:1px solid var(--line);\n      border-radius:18px;\n      padding:20px;\n      margin-bottom:18px;\n    }\n\n    .hero h1{\n      margin:0 0 8px;\n      font-size:30px;\n    }\n\n    .hero p{\n      margin:0;\n      color:var(--muted);\n      line-height:1.6;\n    }\n\n    .grid{\n      display:grid;\n      grid-template-columns:390px 1fr;\n      gap:18px;\n    }\n\n    .panel, .main{\n      background:var(--panel);\n      border:1px solid var(--line);\n      border-radius:18px;\n      padding:18px;\n      box-shadow:0 10px 28px rgba(0,0,0,0.05);\n    }\n\n    h3{\n      margin:0 0 12px;\n      font-size:18px;\n    }\n\n    .section{\n      margin-bottom:18px;\n      padding:14px;\n      border:1px solid var(--line);\n      border-radius:14px;\n      background:#fbfcfe;\n    }\n\n    .row{\n      margin-bottom:12px;\n    }\n\n    .row:last-child{\n      margin-bottom:0;\n    }\n\n    label{\n      display:block;\n      font-weight:bold;\n      margin-bottom:6px;\n      font-size:14px;\n    }\n\n    .range-wrap{\n      display:grid;\n      grid-template-columns:1fr 80px;\n      gap:10px;\n      align-items:center;\n    }\n\n    input[type=\"range\"]{\n      width:100%;\n    }\n\n    .value{\n      text-align:center;\n      padding:9px 6px;\n      border:1px solid var(--line);\n      border-radius:10px;\n      background:#fff;\n      color:var(--accent);\n      font-weight:bold;\n      font-size:14px;\n    }\n\n    .btns{\n      display:flex;\n      flex-wrap:wrap;\n      gap:10px;\n    }\n\n    button{\n      border:1px solid var(--line);\n      background:#fff;\n      border-radius:10px;\n      padding:10px 14px;\n      cursor:pointer;\n      font:inherit;\n      transition:.2s;\n    }\n\n    button:hover{\n      border-color:var(--accent);\n      color:var(--accent);\n    }\n\n    .primary{\n      background:var(--accent);\n      border-color:var(--accent);\n      color:#fff;\n    }\n\n    .primary:hover{\n      color:#fff;\n      opacity:.92;\n    }\n\n    .stats{\n      display:grid;\n      grid-template-columns:repeat(6,minmax(120px,1fr));\n      gap:12px;\n      margin-bottom:16px;\n    }\n\n    .stat{\n      border:1px solid var(--line);\n      border-radius:12px;\n      background:#fff;\n      padding:12px;\n    }\n\n    .stat small{\n      display:block;\n      color:var(--muted);\n      margin-bottom:6px;\n    }\n\n    .stat strong{\n      font-size:18px;\n    }\n\n    .canvas-box{\n      border:1px solid var(--line);\n      border-radius:16px;\n      background:#f8fafc;\n      padding:10px;\n    }\n\n    canvas{\n      width:100%;\n      display:block;\n      border-radius:12px;\n      background:#fff;\n      border:1px solid #e5e7eb;\n    }\n\n    .note{\n      color:var(--muted);\n      font-size:14px;\n      line-height:1.6;\n    }\n\n    .legend{\n      display:flex;\n      flex-wrap:wrap;\n      gap:16px;\n      margin-top:12px;\n      color:var(--muted);\n      font-size:14px;\n    }\n\n    .dot{\n      width:12px;\n      height:12px;\n      border-radius:999px;\n      display:inline-block;\n      margin-right:6px;\n      vertical-align:middle;\n    }\n\n    .status{\n      border:1px solid var(--line);\n      border-radius:12px;\n      background:#f9fafb;\n      padding:12px;\n      line-height:1.6;\n      color:#334155;\n      font-size:14px;\n    }\n\n    @media (max-width:1200px){\n      .grid{grid-template-columns:1fr}\n      .stats{grid-template-columns:repeat(3,1fr)}\n    }\n\n    @media (max-width:700px){\n      .stats{grid-template-columns:1fr 1fr}\n    }\n  <\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"hero\">\n    <h1>Traffic Intersection Simulator<\/h1>\n    <p>\n      This version is structured as a road engineering experiment. You can test how different arrival demands\n      and signal timings affect queue growth, delay, throughput, and approximate level of service.\n    <\/p>\n  <\/div>\n\n  <div class=\"grid\">\n    <div class=\"panel\">\n      <div class=\"section\">\n        <h3>Approach demand (veh/hr)<\/h3>\n\n        <div class=\"row\">\n          <label for=\"nDemand\">North approach<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"nDemand\" min=\"100\" max=\"1600\" step=\"50\" value=\"700\">\n            <div class=\"value\" id=\"nDemandVal\">700<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"sDemand\">South approach<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"sDemand\" min=\"100\" max=\"1600\" step=\"50\" value=\"700\">\n            <div class=\"value\" id=\"sDemandVal\">700<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"eDemand\">East approach<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"eDemand\" min=\"100\" max=\"1600\" step=\"50\" value=\"500\">\n            <div class=\"value\" id=\"eDemandVal\">500<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"wDemand\">West approach<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"wDemand\" min=\"100\" max=\"1600\" step=\"50\" value=\"500\">\n            <div class=\"value\" id=\"wDemandVal\">500<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"section\">\n        <h3>Signal timing<\/h3>\n\n        <div class=\"row\">\n          <label for=\"nsGreen\">North-South green (s)<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"nsGreen\" min=\"5\" max=\"25\" step=\"1\" value=\"12\">\n            <div class=\"value\" id=\"nsGreenVal\">12 s<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"ewGreen\">East-West green (s)<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"ewGreen\" min=\"5\" max=\"25\" step=\"1\" value=\"10\">\n            <div class=\"value\" id=\"ewGreenVal\">10 s<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"yellow\">Yellow (s)<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"yellow\" min=\"2\" max=\"5\" step=\"1\" value=\"3\">\n            <div class=\"value\" id=\"yellowVal\">3 s<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"allRed\">All-red (s)<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"allRed\" min=\"0\" max=\"3\" step=\"1\" value=\"1\">\n            <div class=\"value\" id=\"allRedVal\">1 s<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"row\">\n          <label for=\"simSpeed\">Simulation speed<\/label>\n          <div class=\"range-wrap\">\n            <input type=\"range\" id=\"simSpeed\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1\">\n            <div class=\"value\" id=\"simSpeedVal\">1.0x<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"section\">\n        <h3>Scenarios<\/h3>\n        <div class=\"btns\">\n          <button id=\"balancedBtn\">Balanced<\/button>\n          <button id=\"nsPeakBtn\">NS Peak<\/button>\n          <button id=\"ewPeakBtn\">EW Peak<\/button>\n          <button id=\"oversatBtn\">Oversaturated<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"section\">\n        <div class=\"btns\">\n          <button class=\"primary\" id=\"pauseBtn\">Pause<\/button>\n          <button id=\"resetBtn\">Reset<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"section\">\n        <h3>Road engineering meaning<\/h3>\n        <div class=\"note\">\n          This simulator can be used as a simplified signalized-intersection experiment:\n          compare how changing demand and green split affects queue buildup,\n          control delay, and corridor performance under directional peak traffic.\n        <\/div>\n      <\/div>\n\n      <div class=\"section\">\n        <h3>Status<\/h3>\n        <div class=\"status\" id=\"statusText\">\n          Running under normal conditions. Try making one corridor heavier than the other,\n          then adjust the green times and observe the queue and delay changes.\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"main\">\n      <div class=\"stats\">\n        <div class=\"stat\">\n          <small>Current phase<\/small>\n          <strong id=\"phaseOut\">-<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Active vehicles<\/small>\n          <strong id=\"activeOut\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Total discharged<\/small>\n          <strong id=\"completedOut\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Avg control delay<\/small>\n          <strong id=\"delayOut\">0.0 s/veh<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Throughput<\/small>\n          <strong id=\"throughputOut\">0 veh/hr<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Approx. LOS<\/small>\n          <strong id=\"losOut\">A<\/strong>\n        <\/div>\n      <\/div>\n\n      <div class=\"stats\">\n        <div class=\"stat\">\n          <small>Queue North<\/small>\n          <strong id=\"qN\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Queue South<\/small>\n          <strong id=\"qS\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Queue East<\/small>\n          <strong id=\"qE\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Queue West<\/small>\n          <strong id=\"qW\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Max queue observed<\/small>\n          <strong id=\"maxQ\">0<\/strong>\n        <\/div>\n        <div class=\"stat\">\n          <small>Cycle length<\/small>\n          <strong id=\"cycleOut\">0 s<\/strong>\n        <\/div>\n      <\/div>\n\n      <div class=\"canvas-box\">\n        <canvas id=\"canvas\" width=\"1100\" height=\"900\"><\/canvas>\n        <div class=\"legend\">\n          <span><i class=\"dot\" style=\"background:#16a34a\"><\/i>Green<\/span>\n          <span><i class=\"dot\" style=\"background:#f59e0b\"><\/i>Yellow<\/span>\n          <span><i class=\"dot\" style=\"background:#dc2626\"><\/i>Red<\/span>\n          <span><i class=\"dot\" style=\"background:#7c3aed\"><\/i>Lane change<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst canvas = document.getElementById(\"canvas\");\nconst ctx = canvas.getContext(\"2d\");\n\nconst controls = {\n  nDemand: document.getElementById(\"nDemand\"),\n  sDemand: document.getElementById(\"sDemand\"),\n  eDemand: document.getElementById(\"eDemand\"),\n  wDemand: document.getElementById(\"wDemand\"),\n  nsGreen: document.getElementById(\"nsGreen\"),\n  ewGreen: document.getElementById(\"ewGreen\"),\n  yellow: document.getElementById(\"yellow\"),\n  allRed: document.getElementById(\"allRed\"),\n  simSpeed: document.getElementById(\"simSpeed\"),\n};\n\nconst values = {\n  nDemandVal: document.getElementById(\"nDemandVal\"),\n  sDemandVal: document.getElementById(\"sDemandVal\"),\n  eDemandVal: document.getElementById(\"eDemandVal\"),\n  wDemandVal: document.getElementById(\"wDemandVal\"),\n  nsGreenVal: document.getElementById(\"nsGreenVal\"),\n  ewGreenVal: document.getElementById(\"ewGreenVal\"),\n  yellowVal: document.getElementById(\"yellowVal\"),\n  allRedVal: document.getElementById(\"allRedVal\"),\n  simSpeedVal: document.getElementById(\"simSpeedVal\"),\n};\n\nconst phaseOut = document.getElementById(\"phaseOut\");\nconst activeOut = document.getElementById(\"activeOut\");\nconst completedOut = document.getElementById(\"completedOut\");\nconst delayOut = document.getElementById(\"delayOut\");\nconst throughputOut = document.getElementById(\"throughputOut\");\nconst losOut = document.getElementById(\"losOut\");\n\nconst qN = document.getElementById(\"qN\");\nconst qS = document.getElementById(\"qS\");\nconst qE = document.getElementById(\"qE\");\nconst qW = document.getElementById(\"qW\");\nconst maxQ = document.getElementById(\"maxQ\");\nconst cycleOut = document.getElementById(\"cycleOut\");\nconst statusText = document.getElementById(\"statusText\");\n\nconst pauseBtn = document.getElementById(\"pauseBtn\");\nconst resetBtn = document.getElementById(\"resetBtn\");\nconst balancedBtn = document.getElementById(\"balancedBtn\");\nconst nsPeakBtn = document.getElementById(\"nsPeakBtn\");\nconst ewPeakBtn = document.getElementById(\"ewPeakBtn\");\nconst oversatBtn = document.getElementById(\"oversatBtn\");\n\nconst W = canvas.width;\nconst H = canvas.height;\nconst cx = W / 2;\nconst cy = H / 2;\n\nconst laneWidth = 28;\nconst roadHalf = laneWidth * 4;\nconst interHalf = 115;\n\nconst laneMap = {\n  W: [cy + 22, cy + 50], // west approach -> eastbound\n  E: [cy - 22, cy - 50], // east approach -> westbound\n  N: [cx - 22, cx - 50], // north approach -> southbound\n  S: [cx + 22, cx + 50], // south approach -> northbound\n};\n\nlet vehicles = [];\nlet vehicleId = 0;\nlet paused = false;\nlet lastTime = 0;\nlet simTime = 0;\n\nlet completed = 0;\nlet totalDelay = 0;\nlet maxObservedQueue = 0;\n\nconst arrivals = {\n  N: 0,\n  S: 0,\n  E: 0,\n  W: 0\n};\n\nconst signal = {\n  phase: \"NS_GREEN\",\n  t: 0\n};\n\nfunction updateLabels() {\n  values.nDemandVal.textContent = controls.nDemand.value;\n  values.sDemandVal.textContent = controls.sDemand.value;\n  values.eDemandVal.textContent = controls.eDemand.value;\n  values.wDemandVal.textContent = controls.wDemand.value;\n  values.nsGreenVal.textContent = `${controls.nsGreen.value} s`;\n  values.ewGreenVal.textContent = `${controls.ewGreen.value} s`;\n  values.yellowVal.textContent = `${controls.yellow.value} s`;\n  values.allRedVal.textContent = `${controls.allRed.value} s`;\n  values.simSpeedVal.textContent = `${Number(controls.simSpeed.value).toFixed(1)}x`;\n\n  const cycle = Number(controls.nsGreen.value) + Number(controls.ewGreen.value) + 2 * Number(controls.yellow.value) + 2 * Number(controls.allRed.value);\n  cycleOut.textContent = `${cycle} s`;\n}\n\nObject.values(controls).forEach(el => el.addEventListener(\"input\", updateLabels));\nupdateLabels();\n\nfunction rand(min, max) {\n  return Math.random() * (max - min) + min;\n}\nfunction pick(arr) {\n  return arr[Math.floor(Math.random() * arr.length)];\n}\n\nfunction getPhaseName() {\n  return signal.phase.replace(\"_\", \" \");\n}\n\nfunction phaseForApproach(app) {\n  if (app === \"N\" || app === \"S\") {\n    return signal.phase.startsWith(\"NS\");\n  }\n  return signal.phase.startsWith(\"EW\");\n}\n\nfunction approachHasGreen(app) {\n  if ((app === \"N\" || app === \"S\") && signal.phase === \"NS_GREEN\") return true;\n  if ((app === \"E\" || app === \"W\") && signal.phase === \"EW_GREEN\") return true;\n  return false;\n}\n\nfunction approachHasYellow(app) {\n  if ((app === \"N\" || app === \"S\") && signal.phase === \"NS_YELLOW\") return true;\n  if ((app === \"E\" || app === \"W\") && signal.phase === \"EW_YELLOW\") return true;\n  return false;\n}\n\nfunction updateSignal(dt) {\n  signal.t += dt;\n\n  const nsGreen = Number(controls.nsGreen.value);\n  const ewGreen = Number(controls.ewGreen.value);\n  const yellow = Number(controls.yellow.value);\n  const allRed = Number(controls.allRed.value);\n\n  if (signal.phase === \"NS_GREEN\" && signal.t >= nsGreen) {\n    signal.phase = \"NS_YELLOW\";\n    signal.t = 0;\n  } else if (signal.phase === \"NS_YELLOW\" && signal.t >= yellow) {\n    signal.phase = \"ALL_RED_1\";\n    signal.t = 0;\n  } else if (signal.phase === \"ALL_RED_1\" && signal.t >= allRed) {\n    signal.phase = \"EW_GREEN\";\n    signal.t = 0;\n  } else if (signal.phase === \"EW_GREEN\" && signal.t >= ewGreen) {\n    signal.phase = \"EW_YELLOW\";\n    signal.t = 0;\n  } else if (signal.phase === \"EW_YELLOW\" && signal.t >= yellow) {\n    signal.phase = \"ALL_RED_2\";\n    signal.t = 0;\n  } else if (signal.phase === \"ALL_RED_2\" && signal.t >= allRed) {\n    signal.phase = \"NS_GREEN\";\n    signal.t = 0;\n  }\n}\n\nfunction spawnPoint(app, laneIndex) {\n  if (app === \"W\") return { x: -70, y: laneMap.W[laneIndex] };\n  if (app === \"E\") return { x: W + 70, y: laneMap.E[laneIndex] };\n  if (app === \"N\") return { x: laneMap.N[laneIndex], y: -70 };\n  if (app === \"S\") return { x: laneMap.S[laneIndex], y: H + 70 };\n}\n\nfunction directionAngle(app) {\n  if (app === \"W\") return 0;              // eastbound\n  if (app === \"E\") return Math.PI;        // westbound\n  if (app === \"N\") return Math.PI / 2;    // southbound\n  if (app === \"S\") return -Math.PI / 2;   // northbound\n  return 0;\n}\n\nfunction createVehicle(app) {\n  const laneIndex = Math.random() < 0.5 ? 0 : 1;\n  const p = spawnPoint(app, laneIndex);\n\n  return {\n    id: ++vehicleId,\n    app,\n    laneIndex,\n    targetLaneIndex: laneIndex,\n    x: p.x,\n    y: p.y,\n    length: 34,   // fixed long dimension\n    width: 18,    // fixed short dimension\n    speed: rand(85, 110),\n    desiredSpeed: rand(95, 130),\n    color: `hsl(${Math.floor(rand(0, 360))}, 72%, 58%)`,\n    delay: 0,\n    changingLane: false,\n    laneCooldown: rand(1.2, 2.8),\n  };\n}\n\nfunction lateralCoord(app, laneIndex) {\n  return laneMap[app][laneIndex];\n}\n\nfunction canSpawn(v) {\n  for (const other of vehicles) {\n    if (other.app !== v.app) continue;\n    if (other.laneIndex !== v.laneIndex && other.targetLaneIndex !== v.laneIndex) continue;\n\n    if ((v.app === \"W\" || v.app === \"E\") && Math.abs(other.y - v.y) < 8 && Math.abs(other.x - v.x) < 60) {\n      return false;\n    }\n    if ((v.app === \"N\" || v.app === \"S\") && Math.abs(other.x - v.x) < 8 && Math.abs(other.y - v.y) < 60) {\n      return false;\n    }\n  }\n  return true;\n}\n\nfunction updateArrivals(dt) {\n  const demand = {\n    N: Number(controls.nDemand.value),\n    S: Number(controls.sDemand.value),\n    E: Number(controls.eDemand.value),\n    W: Number(controls.wDemand.value),\n  };\n\n  for (const app of [\"N\",\"S\",\"E\",\"W\"]) {\n    arrivals[app] += (demand[app] / 3600) * dt;\n\n    while (arrivals[app] >= 1) {\n      arrivals[app] -= 1;\n      const v = createVehicle(app);\n      if (canSpawn(v)) vehicles.push(v);\n    }\n  }\n}\n\nfunction stopLine(v) {\n  if (v.app === \"W\") return cx - interHalf - v.length / 2 - 4;\n  if (v.app === \"E\") return cx + interHalf + v.length / 2 + 4;\n  if (v.app === \"N\") return cy - interHalf - v.length / 2 - 4;\n  if (v.app === \"S\") return cy + interHalf + v.length / 2 + 4;\n}\n\nfunction distanceToStop(v) {\n  const s = stopLine(v);\n  if (v.app === \"W\") return s - v.x;\n  if (v.app === \"E\") return v.x - s;\n  if (v.app === \"N\") return s - v.y;\n  if (v.app === \"S\") return v.y - s;\n  return 9999;\n}\n\nfunction beforeStop(v) {\n  return distanceToStop(v) > -12;\n}\n\nfunction findLeader(v, laneIndex = v.laneIndex) {\n  let best = null;\n  let minGap = Infinity;\n\n  for (const other of vehicles) {\n    if (other.id === v.id) continue;\n    if (other.app !== v.app) continue;\n    if (other.laneIndex !== laneIndex && other.targetLaneIndex !== laneIndex) continue;\n\n    let gap = Infinity;\n\n    if (v.app === \"W\" && other.x > v.x) {\n      gap = other.x - v.x - (v.length/2 + other.length/2);\n    } else if (v.app === \"E\" && other.x < v.x) {\n      gap = v.x - other.x - (v.length/2 + other.length/2);\n    } else if (v.app === \"N\" && other.y > v.y) {\n      gap = other.y - v.y - (v.length/2 + other.length/2);\n    } else if (v.app === \"S\" && other.y < v.y) {\n      gap = v.y - other.y - (v.length/2 + other.length/2);\n    }\n\n    if (gap < minGap) {\n      minGap = gap;\n      best = other;\n    }\n  }\n\n  return { leader: best, gap: minGap };\n}\n\nfunction safeToChange(v, targetLane) {\n  for (const other of vehicles) {\n    if (other.id === v.id) continue;\n    if (other.app !== v.app) continue;\n    if (other.laneIndex !== targetLane && other.targetLaneIndex !== targetLane) continue;\n\n    if ((v.app === \"W\" || v.app === \"E\") && Math.abs(other.x - v.x) < 70) return false;\n    if ((v.app === \"N\" || v.app === \"S\") && Math.abs(other.y - v.y) < 70) return false;\n  }\n  return true;\n}\n\nfunction maybeLaneChange(v) {\n  if (!beforeStop(v)) return;\n  if (v.changingLane) return;\n  if (v.laneCooldown > 0) return;\n\n  const d = distanceToStop(v);\n  if (d < 30 || d > 250) return;\n\n  const current = findLeader(v, v.laneIndex);\n  const otherLane = v.laneIndex === 0 ? 1 : 0;\n  const alt = findLeader(v, otherLane);\n\n  const blocked = current.gap < 65 || v.speed < v.desiredSpeed * 0.55;\n  const betterOther = alt.gap > current.gap + 35;\n\n  if (blocked && betterOther && safeToChange(v, otherLane)) {\n    v.targetLaneIndex = otherLane;\n    v.changingLane = true;\n    v.laneCooldown = rand(2.5, 4.0);\n  }\n}\n\nfunction updateLanePosition(v, dt) {\n  const target = lateralCoord(v.app, v.targetLaneIndex);\n  const rate = 75;\n\n  if (v.app === \"W\" || v.app === \"E\") {\n    const diff = target - v.y;\n    if (Math.abs(diff) < 1) {\n      v.y = target;\n      v.laneIndex = v.targetLaneIndex;\n      v.changingLane = false;\n    } else {\n      v.y += Math.sign(diff) * Math.min(Math.abs(diff), rate * dt);\n    }\n  } else {\n    const diff = target - v.x;\n    if (Math.abs(diff) < 1) {\n      v.x = target;\n      v.laneIndex = v.targetLaneIndex;\n      v.changingLane = false;\n    } else {\n      v.x += Math.sign(diff) * Math.min(Math.abs(diff), rate * dt);\n    }\n  }\n}\n\nfunction moveVehicle(v, dt) {\n  if (v.app === \"W\") v.x += v.speed * dt;\n  if (v.app === \"E\") v.x -= v.speed * dt;\n  if (v.app === \"N\") v.y += v.speed * dt;\n  if (v.app === \"S\") v.y -= v.speed * dt;\n}\n\nfunction outOfBounds(v) {\n  return v.x < -120 || v.x > W + 120 || v.y < -120 || v.y > H + 120;\n}\n\nfunction updateVehicles(dt) {\n  const simSpeed = Number(controls.simSpeed.value);\n\n  for (const v of vehicles) {\n    v.laneCooldown -= dt;\n    maybeLaneChange(v);\n    updateLanePosition(v, dt);\n\n    let targetSpeed = v.desiredSpeed;\n\n    const lead = findLeader(v);\n    if (lead.leader && lead.gap < 80) {\n      const ratio = Math.max(0, (lead.gap - 16) / 64);\n      targetSpeed = Math.min(targetSpeed, lead.leader.speed * 0.95, v.desiredSpeed * ratio);\n    }\n\n    const d = distanceToStop(v);\n    const green = approachHasGreen(v.app);\n    const yellow = approachHasYellow(v.app);\n\n    if (beforeStop(v) && d < 130) {\n      if (!green) {\n        if (!(yellow && d < 24)) {\n          const factor = Math.max(0, d / 130);\n          targetSpeed = Math.min(targetSpeed, v.desiredSpeed * factor);\n        }\n      }\n    }\n\n    const accel = 120 * dt;\n    const decel = 180 * dt;\n\n    if (v.speed < targetSpeed) v.speed = Math.min(targetSpeed, v.speed + accel);\n    else v.speed = Math.max(targetSpeed, v.speed - decel);\n\n    if (v.speed < 8 && beforeStop(v)) {\n      v.delay += dt;\n    }\n\n    moveVehicle(v, dt * simSpeed);\n  }\n\n  const keep = [];\n  for (const v of vehicles) {\n    if (outOfBounds(v)) {\n      completed++;\n      totalDelay += v.delay;\n    } else {\n      keep.push(v);\n    }\n  }\n  vehicles = keep;\n}\n\nfunction getQueues() {\n  const q = {N:0,S:0,E:0,W:0};\n\n  for (const v of vehicles) {\n    if (v.speed < 8 && beforeStop(v)) q[v.app]++;\n  }\n\n  const currentMax = Math.max(q.N, q.S, q.E, q.W);\n  if (currentMax > maxObservedQueue) maxObservedQueue = currentMax;\n\n  return q;\n}\n\nfunction getThroughput() {\n  if (simTime <= 0) return 0;\n  return Math.round((completed / simTime) * 3600);\n}\n\nfunction getAvgDelay() {\n  if (completed === 0) return 0;\n  return totalDelay / completed;\n}\n\nfunction getLOS(delay) {\n  if (delay <= 10) return \"A\";\n  if (delay <= 20) return \"B\";\n  if (delay <= 35) return \"C\";\n  if (delay <= 55) return \"D\";\n  if (delay <= 80) return \"E\";\n  return \"F\";\n}\n\nfunction updateOutputs() {\n  const q = getQueues();\n  const avgDelay = getAvgDelay();\n  const los = getLOS(avgDelay);\n\n  phaseOut.textContent = getPhaseName();\n  activeOut.textContent = vehicles.length;\n  completedOut.textContent = completed;\n  delayOut.textContent = `${avgDelay.toFixed(1)} s/veh`;\n  throughputOut.textContent = `${getThroughput()} veh/hr`;\n  losOut.textContent = los;\n\n  qN.textContent = q.N;\n  qS.textContent = q.S;\n  qE.textContent = q.E;\n  qW.textContent = q.W;\n  maxQ.textContent = maxObservedQueue;\n\n  const nsDemand = Number(controls.nDemand.value) + Number(controls.sDemand.value);\n  const ewDemand = Number(controls.eDemand.value) + Number(controls.wDemand.value);\n\n  if (los === \"A\" || los === \"B\") {\n    statusText.textContent = \"Intersection operates well. Queueing is limited and control delay is low.\";\n  } else if (los === \"C\" || los === \"D\") {\n    statusText.textContent = \"Moderate operation. The signal is handling demand, but one or more approaches are building noticeable queues.\";\n  } else {\n    statusText.textContent = \"Poor operation or oversaturation. Try redistributing green time toward the heavier corridor or reducing demand.\";\n  }\n\n  if (nsDemand > ewDemand * 1.4) {\n    statusText.textContent += \" Current demand is north-south dominant, so a longer NS green is usually justified.\";\n  } else if (ewDemand > nsDemand * 1.4) {\n    statusText.textContent += \" Current demand is east-west dominant, so a longer EW green is usually justified.\";\n  }\n}\n\nfunction drawScene() {\n  ctx.clearRect(0,0,W,H);\n\n  // background\n  ctx.fillStyle = \"#cde89b\";\n  ctx.fillRect(0,0,W,H);\n\n  // roads\n  ctx.fillStyle = \"#2f3640\";\n  ctx.fillRect(0, cy - roadHalf, W, roadHalf * 2);\n  ctx.fillRect(cx - roadHalf, 0, roadHalf * 2, H);\n\n  // intersection box\n  ctx.fillStyle = \"#3b434f\";\n  ctx.fillRect(cx - interHalf, cy - interHalf, interHalf * 2, interHalf * 2);\n\n  drawLaneMarkings();\n  drawCrosswalks();\n  drawStopBars();\n  drawSignalHeads();\n  drawQueueLabels();\n\n  for (const v of vehicles) drawVehicle(v);\n\n  drawTitles();\n}\n\nfunction drawLaneMarkings() {\n  ctx.strokeStyle = \"rgba(255,255,255,0.88)\";\n  ctx.lineWidth = 2.4;\n  ctx.setLineDash([16,14]);\n\n  // horizontal lanes\n  [cy - 42, cy - 14, cy + 14, cy + 42].forEach(y => {\n    ctx.beginPath();\n    ctx.moveTo(0, y);\n    ctx.lineTo(W, y);\n    ctx.stroke();\n  });\n\n  // vertical lanes\n  [cx - 42, cx - 14, cx + 14, cx + 42].forEach(x => {\n    ctx.beginPath();\n    ctx.moveTo(x, 0);\n    ctx.lineTo(x, H);\n    ctx.stroke();\n  });\n\n  ctx.setLineDash([]);\n}\n\nfunction drawCrosswalks() {\n  ctx.fillStyle = \"rgba(255,255,255,0.85)\";\n  for (let i = 0; i < 8; i++) {\n    ctx.fillRect(cx - 90 + i * 24, cy - interHalf - 18, 12, 18);\n    ctx.fillRect(cx - 90 + i * 24, cy + interHalf, 12, 18);\n    ctx.fillRect(cx - interHalf - 18, cy - 90 + i * 24, 18, 12);\n    ctx.fillRect(cx + interHalf, cy - 90 + i * 24, 18, 12);\n  }\n}\n\nfunction drawStopBars() {\n  ctx.strokeStyle = \"#ffffff\";\n  ctx.lineWidth = 5;\n\n  ctx.beginPath();\n  ctx.moveTo(cx - interHalf, cy + 2);\n  ctx.lineTo(cx - interHalf, cy + roadHalf);\n  ctx.stroke();\n\n  ctx.beginPath();\n  ctx.moveTo(cx + interHalf, cy - roadHalf);\n  ctx.lineTo(cx + interHalf, cy - 2);\n  ctx.stroke();\n\n  ctx.beginPath();\n  ctx.moveTo(cx - roadHalf, cy - interHalf);\n  ctx.lineTo(cx - 2, cy - interHalf);\n  ctx.stroke();\n\n  ctx.beginPath();\n  ctx.moveTo(cx + 2, cy + interHalf);\n  ctx.lineTo(cx + roadHalf, cy + interHalf);\n  ctx.stroke();\n}\n\nfunction lightColorsFor(appGroup) {\n  const green = \"#16a34a\";\n  const yellow = \"#f59e0b\";\n  const red = \"#dc2626\";\n  const off = \"#2d2d2d\";\n\n  if (appGroup === \"NS\") {\n    if (signal.phase === \"NS_GREEN\") return [red === red ? red : red, off, green];\n    if (signal.phase === \"NS_YELLOW\") return [off, yellow, off];\n    return [red, off, off];\n  }\n\n  if (signal.phase === \"EW_GREEN\") return [red === red ? red : red, off, green];\n  if (signal.phase === \"EW_YELLOW\") return [off, yellow, off];\n  return [red, off, off];\n}\n\nfunction drawSignalHead(x, y, group) {\n  const colors = lightColorsFor(group);\n  ctx.fillStyle = \"#111827\";\n  ctx.fillRect(x - 16, y - 44, 32, 88);\n\n  [0,1,2].forEach(i => {\n    ctx.beginPath();\n    ctx.arc(x, y - 24 + i * 24, 8, 0, Math.PI * 2);\n    ctx.fillStyle = colors[i];\n    ctx.fill();\n  });\n}\n\nfunction drawSignalHeads() {\n  drawSignalHead(cx - interHalf - 28, cy - interHalf - 10, \"NS\");\n  drawSignalHead(cx + interHalf + 28, cy + interHalf + 10, \"NS\");\n  drawSignalHead(cx + interHalf + 28, cy - interHalf - 10, \"EW\");\n  drawSignalHead(cx - interHalf - 28, cy + interHalf + 10, \"EW\");\n}\n\nfunction drawQueueLabels() {\n  const q = getQueues();\n\n  ctx.fillStyle = \"#0f172a\";\n  ctx.font = \"bold 18px Arial\";\n  ctx.fillText(`Queue N: ${q.N}`, cx - 100, 34);\n  ctx.fillText(`Queue S: ${q.S}`, cx - 100, H - 20);\n  ctx.fillText(`Queue W: ${q.W}`, 28, cy - 128);\n  ctx.fillText(`Queue E: ${q.E}`, W - 170, cy + 150);\n}\n\nfunction drawTitles() {\n  ctx.fillStyle = \"rgba(255,255,255,0.88)\";\n  ctx.font = \"bold 16px Arial\";\n\n  ctx.save();\n  ctx.translate(cx + 210, H - 120);\n  ctx.rotate(-Math.PI / 2);\n  ctx.fillText(\"South → North\", 0, 0);\n  ctx.restore();\n\n  ctx.save();\n  ctx.translate(cx - 210, 140);\n  ctx.rotate(-Math.PI / 2);\n  ctx.fillText(\"North → South\", 0, 0);\n  ctx.restore();\n\n  ctx.fillText(\"West → East\", 32, cy + 88);\n  ctx.fillText(\"East → West\", W - 150, cy - 88);\n}\n\nfunction drawVehicle(v) {\n  ctx.save();\n  ctx.translate(v.x, v.y);\n  ctx.rotate(directionAngle(v.app));\n\n  ctx.fillStyle = v.changingLane ? \"#7c3aed\" : v.color;\n  ctx.strokeStyle = \"#111827\";\n  ctx.lineWidth = 1.2;\n\n  ctx.beginPath();\n  ctx.roundRect(-v.length/2, -v.width/2, v.length, v.width, 5);\n  ctx.fill();\n  ctx.stroke();\n\n  ctx.fillStyle = \"rgba(255,255,255,0.78)\";\n  ctx.fillRect(-6, -v.width/2 + 2.2, 12, v.width - 4.4);\n\n  ctx.fillStyle = \"#111827\";\n  ctx.fillRect(v.length/2 - 5, -v.width/2 + 3, 3, v.width - 6);\n\n  ctx.restore();\n}\n\nfunction resetSim() {\n  vehicles = [];\n  vehicleId = 0;\n  simTime = 0;\n  completed = 0;\n  totalDelay = 0;\n  maxObservedQueue = 0;\n  arrivals.N = 0;\n  arrivals.S = 0;\n  arrivals.E = 0;\n  arrivals.W = 0;\n  signal.phase = \"NS_GREEN\";\n  signal.t = 0;\n  updateOutputs();\n  drawScene();\n}\n\npauseBtn.addEventListener(\"click\", () => {\n  paused = !paused;\n  pauseBtn.textContent = paused ? \"Resume\" : \"Pause\";\n});\n\nresetBtn.addEventListener(\"click\", resetSim);\n\nbalancedBtn.addEventListener(\"click\", () => {\n  controls.nDemand.value = 700;\n  controls.sDemand.value = 700;\n  controls.eDemand.value = 500;\n  controls.wDemand.value = 500;\n  controls.nsGreen.value = 12;\n  controls.ewGreen.value = 10;\n  updateLabels();\n});\n\nnsPeakBtn.addEventListener(\"click\", () => {\n  controls.nDemand.value = 1100;\n  controls.sDemand.value = 1100;\n  controls.eDemand.value = 400;\n  controls.wDemand.value = 400;\n  controls.nsGreen.value = 18;\n  controls.ewGreen.value = 8;\n  updateLabels();\n});\n\newPeakBtn.addEventListener(\"click\", () => {\n  controls.nDemand.value = 450;\n  controls.sDemand.value = 450;\n  controls.eDemand.value = 1100;\n  controls.wDemand.value = 1100;\n  controls.nsGreen.value = 8;\n  controls.ewGreen.value = 18;\n  updateLabels();\n});\n\noversatBtn.addEventListener(\"click\", () => {\n  controls.nDemand.value = 1400;\n  controls.sDemand.value = 1400;\n  controls.eDemand.value = 1300;\n  controls.wDemand.value = 1300;\n  controls.nsGreen.value = 11;\n  controls.ewGreen.value = 11;\n  updateLabels();\n});\n\nfunction animate(ts) {\n  if (!lastTime) lastTime = ts;\n  let dt = (ts - lastTime) / 1000;\n  lastTime = ts;\n  if (dt > 0.04) dt = 0.04;\n\n  if (!paused) {\n    const speedFactor = Number(controls.simSpeed.value);\n    simTime += dt * speedFactor;\n    updateSignal(dt * speedFactor);\n    updateArrivals(dt * speedFactor);\n    updateVehicles(dt);\n    updateOutputs();\n  }\n\n  drawScene();\n  requestAnimationFrame(animate);\n}\n\nresetSim();\nrequestAnimationFrame(animate);\n<\/script>\n<\/body>\n<\/html>"};</script>
