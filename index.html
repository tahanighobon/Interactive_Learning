{ x: 670, y: 120, class: \"B\" }\n      ];\n\n      queryPoint = { x: 470, y: 280 };\n      kSlider.value = 3;\n      kValue.textContent = \"3\";\n      draw();\n    }\n\n    canvas.addEventListener(\"click\", canvasClick);\n\n    kSlider.addEventListener(\"input\", () => {\n      kValue.textContent = kSlider.value;\n      draw();\n    });\n\n    sampleBtn.addEventListener(\"click\", loadSample);\n    undoBtn.addEventListener(\"click\", undoLastPoint);\n    clearBtn.addEventListener(\"click\", clearAll);\n\n    draw();\n  <\/script>\n<\/body>\n<\/html>", "Logic_Gates_and_Truth_Tables": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Logic Gates and Truth Tables<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --bad: #dc2626;\n      --soft: #eef2ff;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1280px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 360px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      font-size: 15px;\n    }\n\n    .toggle-grid {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 12px;\n      margin-top: 8px;\n    }\n\n    .toggle-card {\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      background: #f9fafb;\n    }\n\n    .toggle-card.disabled {\n      opacity: 0.45;\n    }\n\n    .toggle-card h4 {\n      margin: 0 0 12px;\n    }\n\n    .toggle-btn {\n      width: 100%;\n      border: none;\n      border-radius: 12px;\n      padding: 14px 10px;\n      font-size: 18px;\n      font-weight: bold;\n      cursor: pointer;\n      transition: 0.2s ease;\n      background: #e5e7eb;\n      color: #111827;\n    }\n\n    .toggle-btn.on {\n      background: #dbeafe;\n      color: #1d4ed8;\n      box-shadow: inset 0 0 0 2px #2563eb;\n    }\n\n    .formula-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      line-height: 1.7;\n      color: var(--muted);\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: var(--soft);\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 16px;\n    }\n\n    .stat {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .status {\n      margin-top: 16px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      color: #0f172a;\n      line-height: 1.5;\n    }\n\n    .circuit-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .truth-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    svg {\n      width: 100%;\n      height: auto;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      overflow: hidden;\n      border-radius: 12px;\n      background: white;\n      border: 1px solid #e5e7eb;\n    }\n\n    th, td {\n      padding: 12px;\n      text-align: center;\n      border-bottom: 1px solid #e5e7eb;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    tr.active-row {\n      background: #dbeafe;\n      font-weight: bold;\n    }\n\n    tr:last-child td {\n      border-bottom: none;\n    }\n\n    .notes {\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 16px;\n    }\n\n    .note-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 16px;\n    }\n\n    .note-box p, .note-box li {\n      line-height: 1.6;\n      color: var(--muted);\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 960px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .notes {\n        grid-template-columns: 1fr;\n      }\n\n      .toggle-grid {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Logic Gates and Truth Tables<\/h1>\n      <p>\n        Explore how digital logic gates work by changing the inputs and watching the output update live.\n        The truth table highlights the current input combination so students can connect logic symbols to binary results.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"gateSelect\">Gate type<\/label>\n          <select id=\"gateSelect\">\n            <option value=\"AND\">AND<\/option>\n            <option value=\"OR\">OR<\/option>\n            <option value=\"NOT\">NOT<\/option>\n            <option value=\"NAND\">NAND<\/option>\n            <option value=\"NOR\">NOR<\/option>\n            <option value=\"XOR\">XOR<\/option>\n            <option value=\"XNOR\">XNOR<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\">\n          <label>Inputs<\/label>\n          <div class=\"toggle-grid\">\n            <div class=\"toggle-card\" id=\"cardA\">\n              <h4>Input A<\/h4>\n              <button class=\"toggle-btn\" id=\"toggleA\">0<\/button>\n            <\/div>\n            <div class=\"toggle-card\" id=\"cardB\">\n              <h4>Input B<\/h4>\n              <button class=\"toggle-btn\" id=\"toggleB\">0<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Gate rule<\/h3>\n          <div class=\"formula\" id=\"equationText\">Q = A · B<\/div><br>\n          <div class=\"formula\" id=\"meaningText\">AND gives 1 only when both inputs are 1<\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Input A<\/small>\n            <strong id=\"outA\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Input B<\/small>\n            <strong id=\"outB\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Output Q<\/small>\n            <strong id=\"outQ\">0<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Binary expression<\/small>\n            <strong id=\"binaryText\">0 ? 0<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"status\" id=\"statusText\">\n          Change the inputs to see how the selected logic gate responds.\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"circuit-wrap\">\n          <h2>Live Logic Diagram<\/h2>\n          <svg viewBox=\"0 0 900 300\" aria-label=\"Logic gate diagram\">\n            <\!-- input lines -->\n            <line id=\"lineA\" x1=\"80\" y1=\"100\" x2=\"310\" y2=\"100\" stroke=\"#374151\" stroke-width=\"6\"><\/line>\n            <line id=\"lineB\" x1=\"80\" y1=\"200\" x2=\"310\" y2=\"200\" stroke=\"#374151\" stroke-width=\"6\"><\/line>\n\n            <\!-- input nodes -->\n            <circle id=\"nodeA\" cx=\"80\" cy=\"100\" r=\"18\" fill=\"#e5e7eb\" stroke=\"#111827\" stroke-width=\"3\"><\/circle>\n            <text id=\"labelA\" x=\"80\" y=\"107\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\" fill=\"#111827\">0<\/text>\n\n            <circle id=\"nodeB\" cx=\"80\" cy=\"200\" r=\"18\" fill=\"#e5e7eb\" stroke=\"#111827\" stroke-width=\"3\"><\/circle>\n            <text id=\"labelB\" x=\"80\" y=\"207\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\" fill=\"#111827\">0<\/text>\n\n            <\!-- gate body -->\n            <rect id=\"gateBody\" x=\"310\" y=\"65\" width=\"220\" height=\"170\" rx=\"22\" fill=\"#e0e7ff\" stroke=\"#2563eb\" stroke-width=\"5\"><\/rect>\n            <text id=\"gateLabel\" x=\"420\" y=\"160\" text-anchor=\"middle\" font-size=\"40\" font-weight=\"bold\" fill=\"#1d4ed8\">AND<\/text>\n\n            <\!-- output line -->\n            <line id=\"lineQ\" x1=\"530\" y1=\"150\" x2=\"720\" y2=\"150\" stroke=\"#374151\" stroke-width=\"6\"><\/line>\n\n            <\!-- output lamp -->\n            <circle id=\"lampGlow\" cx=\"785\" cy=\"150\" r=\"44\" fill=\"#fde68a\" opacity=\"0.15\"><\/circle>\n            <circle id=\"lamp\" cx=\"785\" cy=\"150\" r=\"34\" fill=\"#f3f4f6\" stroke=\"#111827\" stroke-width=\"4\"><\/circle>\n            <text id=\"lampText\" x=\"785\" y=\"158\" text-anchor=\"middle\" font-size=\"28\" font-weight=\"bold\" fill=\"#111827\">0<\/text>\n\n            <\!-- labels -->\n            <text x=\"42\" y=\"68\" font-size=\"24\" font-weight=\"bold\" fill=\"#111827\">Inputs<\/text>\n            <text x=\"754\" y=\"92\" font-size=\"24\" font-weight=\"bold\" fill=\"#111827\">Output<\/text>\n            <text x=\"420\" y=\"270\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"bold\" fill=\"#111827\" id=\"gateDescription\">\n              AND gate\n            <\/text>\n          <\/svg>\n        <\/div>\n\n        <div class=\"truth-wrap\">\n          <h2>Truth Table<\/h2>\n          <table>\n            <thead>\n              <tr id=\"tableHead\">\n                <th>A<\/th>\n                <th>B<\/th>\n                <th>Q<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"truthTableBody\"><\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"notes\">\n          <div class=\"note-box\">\n            <h3>What students should notice<\/h3>\n            <ul>\n              <li>Each logic gate follows a fixed rule no matter how many times the inputs change.<\/li>\n              <li>The truth table lists every possible input combination and the corresponding output.<\/li>\n              <li>NOT is different because it uses only one input and inverts it.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"note-box\">\n            <h3>Teaching idea<\/h3>\n            <p>\n              Ask students to predict the output before they press the input buttons.\n              Then compare their prediction with the highlighted row in the truth table.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding logic gates and truth tables.\n    <\/div>\n  <\/div>\n\n  <script>\n    const gateSelect = document.getElementById(\"gateSelect\");\n    const toggleA = document.getElementById(\"toggleA\");\n    const toggleB = document.getElementById(\"toggleB\");\n    const cardB = document.getElementById(\"cardB\");\n\n    const outA = document.getElementById(\"outA\");\n    const outB = document.getElementById(\"outB\");\n    const outQ = document.getElementById(\"outQ\");\n    const binaryText = document.getElementById(\"binaryText\");\n    const equationText = document.getElementById(\"equationText\");\n    const meaningText = document.getElementById(\"meaningText\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const nodeA = document.getElementById(\"nodeA\");\n    const nodeB = document.getElementById(\"nodeB\");\n    const labelA = document.getElementById(\"labelA\");\n    const labelB = document.getElementById(\"labelB\");\n    const gateLabel = document.getElementById(\"gateLabel\");\n    const gateDescription = document.getElementById(\"gateDescription\");\n    const lamp = document.getElementById(\"lamp\");\n    const lampGlow = document.getElementById(\"lampGlow\");\n    const lampText = document.getElementById(\"lampText\");\n    const lineB = document.getElementById(\"lineB\");\n\n    const truthTableBody = document.getElementById(\"truthTableBody\");\n    const tableHead = document.getElementById(\"tableHead\");\n\n    let A = 0;\n    let B = 0;\n\n    function setButtonState(button, value) {\n      button.textContent = value;\n      if (value === 1) button.classList.add(\"on\");\n      else button.classList.remove(\"on\");\n    }\n\n    function evaluateGate(gate, a, b) {\n      switch (gate) {\n        case \"AND\": return a & b;\n        case \"OR\": return a | b;\n        case \"NOT\": return a ? 0 : 1;\n        case \"NAND\": return (a & b) ? 0 : 1;\n        case \"NOR\": return (a | b) ? 0 : 1;\n        case \"XOR\": return a ^ b;\n        case \"XNOR\": return (a ^ b) ? 0 : 1;\n        default: return 0;\n      }\n    }\n\n    function getGateInfo(gate) {\n      switch (gate) {\n        case \"AND\":\n          return {\n            equation: \"Q = A · B\",\n            meaning: \"AND gives 1 only when both inputs are 1\",\n            description: \"AND gate\"\n          };\n        case \"OR\":\n          return {\n            equation: \"Q = A + B\",\n            meaning: \"OR gives 1 when at least one input is 1\",\n            description: \"OR gate\"\n          };\n        case \"NOT\":\n          return {\n            equation: \"Q = ¬A\",\n            meaning: \"NOT flips the input: 0 becomes 1, and 1 becomes 0\",\n            description: \"NOT gate\"\n          };\n        case \"NAND\":\n          return {\n            equation: \"Q = ¬(A · B)\",\n            meaning: \"NAND is the opposite of AND\",\n            description: \"NAND gate\"\n          };\n        case \"NOR\":\n          return {\n            equation: \"Q = ¬(A + B)\",\n            meaning: \"NOR is the opposite of OR\",\n            description: \"NOR gate\"\n          };\n        case \"XOR\":\n          return {\n            equation: \"Q = A ⊕ B\",\n            meaning: \"XOR gives 1 only when the inputs are different\",\n            description: \"XOR gate\"\n          };\n        case \"XNOR\":\n          return {\n            equation: \"Q = ¬(A ⊕ B)\",\n            meaning: \"XNOR gives 1 only when the inputs are the same\",\n            description: \"XNOR gate\"\n          };\n        default:\n          return {\n            equation: \"\",\n            meaning: \"\",\n            description: \"\"\n          };\n      }\n    }\n\n    function updateTruthTable(gate) {\n      truthTableBody.innerHTML = \"\";\n\n      const isNot = gate === \"NOT\";\n\n      if (isNot) {\n        tableHead.innerHTML = `\n          <th>A<\/th>\n          <th>Q<\/th>\n        `;\n\n        [0, 1].forEach(a => {\n          const q = evaluateGate(gate, a, 0);\n          const row = document.createElement(\"tr\");\n          if (a === A) row.classList.add(\"active-row\");\n          row.innerHTML = `\n            <td>${a}<\/td>\n            <td>${q}<\/td>\n          `;\n          truthTableBody.appendChild(row);\n        });\n      } else {\n        tableHead.innerHTML = `\n          <th>A<\/th>\n          <th>B<\/th>\n          <th>Q<\/th>\n        `;\n\n        [\n          [0,0],\n          [0,1],\n          [1,0],\n          [1,1]\n        ].forEach(([a, b]) => {\n          const q = evaluateGate(gate, a, b);\n          const row = document.createElement(\"tr\");\n          if (a === A && b === B) row.classList.add(\"active-row\");\n          row.innerHTML = `\n            <td>${a}<\/td>\n            <td>${b}<\/td>\n            <td>${q}<\/td>\n          `;\n          truthTableBody.appendChild(row);\n        });\n      }\n    }\n\n    function updateDiagram(gate, q) {\n      labelA.textContent = A;\n      labelB.textContent = B;\n      gateLabel.textContent = gate;\n      gateDescription.textContent = getGateInfo(gate).description;\n      lampText.textContent = q;\n\n      nodeA.setAttribute(\"fill\", A ? \"#bfdbfe\" : \"#e5e7eb\");\n      nodeB.setAttribute(\"fill\", B ? \"#bfdbfe\" : \"#e5e7eb\");\n\n      if (gate === \"NOT\") {\n        cardB.classList.add(\"disabled\");\n        toggleB.disabled = true;\n        lineB.setAttribute(\"opacity\", \"0.18\");\n        nodeB.setAttribute(\"opacity\", \"0.18\");\n        labelB.setAttribute(\"opacity\", \"0.18\");\n      } else {\n        cardB.classList.remove(\"disabled\");\n        toggleB.disabled = false;\n        lineB.setAttribute(\"opacity\", \"1\");\n        nodeB.setAttribute(\"opacity\", \"1\");\n        labelB.setAttribute(\"opacity\", \"1\");\n      }\n\n      if (q === 1) {\n        lamp.setAttribute(\"fill\", \"#fef08a\");\n        lamp.setAttribute(\"stroke\", \"#ca8a04\");\n        lampGlow.setAttribute(\"opacity\", \"0.65\");\n      } else {\n        lamp.setAttribute(\"fill\", \"#f3f4f6\");\n        lamp.setAttribute(\"stroke\", \"#111827\");\n        lampGlow.setAttribute(\"opacity\", \"0.15\");\n      }\n    }\n\n    function updateOutputs() {\n      const gate = gateSelect.value;\n      const q = evaluateGate(gate, A, B);\n      const info = getGateInfo(gate);\n\n      outA.textContent = A;\n      outB.textContent = gate === \"NOT\" ? \"—\" : B;\n      outQ.textContent = q;\n      equationText.textContent = info.equation;\n      meaningText.textContent = info.meaning;\n\n      if (gate === \"NOT\") {\n        binaryText.textContent = `${A} → ${q}`;\n        statusText.textContent = `NOT gate selected. The output is the opposite of input A.`;\n      } else {\n        binaryText.textContent = `${A} ${gate} ${B} = ${q}`;\n        statusText.textContent = `${gate} gate selected. Change A and B to see how the output follows the rule.`;\n      }\n\n      updateDiagram(gate, q);\n      updateTruthTable(gate);\n    }\n\n    toggleA.addEventListener(\"click\", () => {\n      A = A ? 0 : 1;\n      setButtonState(toggleA, A);\n      updateOutputs();\n    });\n\n    toggleB.addEventListener(\"click\", () => {\n      B = B ? 0 : 1;\n      setButtonState(toggleB, B);\n      updateOutputs();\n    });\n\n    gateSelect.addEventListener(\"change\", () => {\n      updateOutputs();\n    });\n\n    setButtonState(toggleA, A);\n    setButtonState(toggleB, B);\n    updateOutputs();\n  <\/script>\n<\/body>\n<\/html>", "cpu_scheduling_simulator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>CPU Scheduling Simulator<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #d97706;\n      --idle: #e5e7eb;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n    }\n\n    .container {\n      max-width: 1400px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 420px 1fr;\n      gap: 20px;\n    }\n\n    .panel,\n    .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    select,\n    input,\n    button {\n      font: inherit;\n    }\n\n    select,\n    input[type=\"number\"] {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n    }\n\n    .slider-box,\n    .table-wrap,\n    .formula-box,\n    .chart-wrap,\n    .metrics-wrap,\n    .notes-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .row-inline {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 12px;\n    }\n\n    .btn-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n      margin-top: 12px;\n    }\n\n    button {\n      padding: 10px 14px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      cursor: pointer;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      border-color: var(--accent);\n      color: var(--accent);\n    }\n\n    .primary {\n      background: var(--accent);\n      color: white;\n      border-color: var(--accent);\n    }\n\n    .primary:hover {\n      opacity: 0.92;\n      color: white;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border-radius: 12px;\n      overflow: hidden;\n    }\n\n    th, td {\n      border-bottom: 1px solid #e5e7eb;\n      padding: 10px;\n      text-align: center;\n      font-size: 14px;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    td input {\n      width: 90px;\n      text-align: center;\n      padding: 8px;\n    }\n\n    .gantt-container {\n      overflow-x: auto;\n      padding-bottom: 6px;\n    }\n\n    .gantt {\n      display: flex;\n      align-items: stretch;\n      min-height: 84px;\n      margin-top: 12px;\n      min-width: max-content;\n    }\n\n    .gantt-block {\n      position: relative;\n      min-width: 48px;\n      border: 1px solid white;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      font-weight: bold;\n      color: white;\n      padding: 0 8px;\n    }\n\n    .gantt-block.idle {\n      background: var(--idle);\n      color: #374151;\n    }\n\n    .gantt-time-row {\n      display: flex;\n      min-width: max-content;\n      margin-top: 4px;\n    }\n\n    .gantt-time {\n      position: relative;\n      font-size: 13px;\n      color: var(--muted);\n    }\n\n    .legend {\n      display: flex;\n      gap: 12px;\n      flex-wrap: wrap;\n      margin-top: 14px;\n      font-size: 14px;\n      color: var(--muted);\n    }\n\n    .legend-item {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .legend-swatch {\n      width: 14px;\n      height: 14px;\n      border-radius: 4px;\n      border: 1px solid rgba(0,0,0,0.08);\n    }\n\n    .notes-wrap p,\n    .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    .muted {\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .hidden {\n      display: none;\n    }\n\n    @media (max-width: 1000px) {\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .stats,\n      .row-inline {\n        grid-template-columns: 1fr;\n      }\n\n      td input {\n        width: 70px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>CPU Scheduling Simulator<\/h1>\n      <p>\n        Explore how different CPU scheduling algorithms affect execution order, waiting time,\n        turnaround time, and CPU utilization. Try FCFS, SJF, and Round Robin using customizable processes.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"algorithm\">Scheduling algorithm<\/label>\n          <select id=\"algorithm\">\n            <option value=\"FCFS\">FCFS<\/option>\n            <option value=\"SJF\">SJF (Non-Preemptive)<\/option>\n            <option value=\"RR\">Round Robin<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\" id=\"quantumGroup\">\n          <label for=\"quantum\">Time quantum<\/label>\n          <input type=\"number\" id=\"quantum\" min=\"1\" value=\"2\" />\n        <\/div>\n\n        <div class=\"table-wrap\">\n          <h3>Processes<\/h3>\n          <table id=\"processTable\">\n            <thead>\n              <tr>\n                <th>Process<\/th>\n                <th>Arrival<\/th>\n                <th>Burst<\/th>\n                <th>Remove<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"processTableBody\"><\/tbody>\n          <\/table>\n\n          <div class=\"btn-row\">\n            <button id=\"addProcessBtn\">Add Process<\/button>\n            <button id=\"sampleBtn\">Load Sample<\/button>\n            <button id=\"clearBtn\">Clear<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key formulas<\/h3>\n          <div>Waiting Time = Completion Time − Arrival Time − Burst Time<\/div>\n          <div style=\"margin-top: 6px;\">Turnaround Time = Completion Time − Arrival Time<\/div>\n          <div style=\"margin-top: 6px;\">CPU Utilization = (Busy Time ÷ Total Time) × 100%<\/div>\n\n          <div class=\"status\" id=\"statusText\">\n            FCFS executes processes in the order they arrive.\n          <\/div>\n        <\/div>\n\n        <div class=\"btn-row\">\n          <button class=\"primary\" id=\"runBtn\">Run Simulation<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"chart-wrap\">\n          <h2>Gantt Chart<\/h2>\n          <div class=\"gantt-container\">\n            <div id=\"ganttChart\" class=\"gantt\"><\/div>\n            <div id=\"ganttTimeRow\" class=\"gantt-time-row\"><\/div>\n          <\/div>\n          <div class=\"legend\" id=\"legend\"><\/div>\n        <\/div>\n\n        <div class=\"metrics-wrap\">\n          <h2>Scheduling Metrics<\/h2>\n          <div class=\"stats\">\n            <div class=\"stat\">\n              <small>Average waiting time<\/small>\n              <strong id=\"avgWaiting\">0.00<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Average turnaround time<\/small>\n              <strong id=\"avgTurnaround\">0.00<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>CPU utilization<\/small>\n              <strong id=\"cpuUtilization\">0.00%<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Total completion time<\/small>\n              <strong id=\"totalTime\">0<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"table-wrap\">\n          <h2>Per-Process Results<\/h2>\n          <table>\n            <thead>\n              <tr>\n                <th>Process<\/th>\n                <th>Arrival<\/th>\n                <th>Burst<\/th>\n                <th>Completion<\/th>\n                <th>Waiting<\/th>\n                <th>Turnaround<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"resultsBody\"><\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>FCFS is simple, but long jobs can make later jobs wait a lot.<\/li>\n            <li>SJF often reduces average waiting time by running shorter jobs first.<\/li>\n            <li>Round Robin improves fairness by giving each process a time slice.<\/li>\n            <li>Idle time affects CPU utilization, especially when no process has arrived yet.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding CPU scheduling algorithms.\n    <\/div>\n  <\/div>\n\n  <script>\n    const algorithmEl = document.getElementById(\"algorithm\");\n    const quantumEl = document.getElementById(\"quantum\");\n    const quantumGroup = document.getElementById(\"quantumGroup\");\n    const processTableBody = document.getElementById(\"processTableBody\");\n    const resultsBody = document.getElementById(\"resultsBody\");\n    const ganttChart = document.getElementById(\"ganttChart\");\n    const ganttTimeRow = document.getElementById(\"ganttTimeRow\");\n    const legend = document.getElementById(\"legend\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const avgWaitingEl = document.getElementById(\"avgWaiting\");\n    const avgTurnaroundEl = document.getElementById(\"avgTurnaround\");\n    const cpuUtilizationEl = document.getElementById(\"cpuUtilization\");\n    const totalTimeEl = document.getElementById(\"totalTime\");\n\n    const addProcessBtn = document.getElementById(\"addProcessBtn\");\n    const sampleBtn = document.getElementById(\"sampleBtn\");\n    const clearBtn = document.getElementById(\"clearBtn\");\n    const runBtn = document.getElementById(\"runBtn\");\n\n    const PROCESS_COLORS = [\n      \"#2563eb\",\n      \"#059669\",\n      \"#d97706\",\n      \"#7c3aed\",\n      \"#dc2626\",\n      \"#0891b2\",\n      \"#9333ea\",\n      \"#16a34a\",\n      \"#ea580c\",\n      \"#4f46e5\"\n    ];\n\n    let processCounter = 1;\n\n    function getProcessColor(index) {\n      return PROCESS_COLORS[index % PROCESS_COLORS.length];\n    }\n\n    function createProcessRow(name = `P${processCounter}`, arrival = 0, burst = 1) {\n      const tr = document.createElement(\"tr\");\n\n      tr.innerHTML = `\n        <td>${name}<\/td>\n        <td><input type=\"number\" min=\"0\" value=\"${arrival}\" class=\"arrival-input\"><\/td>\n        <td><input type=\"number\" min=\"1\" value=\"${burst}\" class=\"burst-input\"><\/td>\n        <td><button class=\"remove-btn\">✕<\/button><\/td>\n      `;\n\n      tr.querySelector(\".remove-btn\").addEventListener(\"click\", () => {\n        tr.remove();\n        updateProcessLabels();\n      });\n\n      processTableBody.appendChild(tr);\n      processCounter++;\n    }\n\n    function updateProcessLabels() {\n      const rows = [...processTableBody.querySelectorAll(\"tr\")];\n      rows.forEach((row, index) => {\n        row.children[0].textContent = `P${index + 1}`;\n      });\n    }\n\n    function getProcesses() {\n      const rows = [...processTableBody.querySelectorAll(\"tr\")];\n      return rows.map((row, index) => {\n        const arrival = Number(row.querySelector(\".arrival-input\").value);\n        const burst = Number(row.querySelector(\".burst-input\").value);\n\n        return {\n          id: `P${index + 1}`,\n          arrival: Math.max(0, arrival),\n          burst: Math.max(1, burst),\n          color: getProcessColor(index),\n          originalIndex: index\n        };\n      });\n    }\n\n    function loadSample() {\n      processTableBody.innerHTML = \"\";\n      processCounter = 1;\n      createProcessRow(\"P1\", 0, 5);\n      createProcessRow(\"P2\", 1, 3);\n      createProcessRow(\"P3\", 2, 8);\n      createProcessRow(\"P4\", 4, 2);\n      updateProcessLabels();\n    }\n\n    function clearProcesses() {\n      processTableBody.innerHTML = \"\";\n      processCounter = 1;\n      createProcessRow(\"P1\", 0, 1);\n      updateProcessLabels();\n    }\n\n    function updateStatusText() {\n      const algorithm = algorithmEl.value;\n      quantumGroup.classList.toggle(\"hidden\", algorithm !== \"RR\");\n\n      if (algorithm === \"FCFS\") {\n        statusText.textContent = \"FCFS executes processes in the order they arrive.\";\n      } else if (algorithm === \"SJF\") {\n        statusText.textContent = \"SJF chooses the shortest available burst first to reduce average waiting time.\";\n      } else {\n        statusText.textContent = \"Round Robin shares CPU time fairly using a fixed time quantum.\";\n      }\n    }\n\n    function scheduleFCFS(processes) {\n      const sorted = [...processes].sort((a, b) =>\n        a.arrival - b.arrival || a.originalIndex - b.originalIndex\n      );\n\n      const timeline = [];\n      const completion = {};\n      let currentTime = 0;\n      let busyTime = 0;\n\n      for (const p of sorted) {\n        if (currentTime < p.arrival) {\n          timeline.push({\n            id: \"Idle\",\n            start: currentTime,\n            end: p.arrival,\n            color: \"#e5e7eb\",\n            idle: true\n          });\n          currentTime = p.arrival;\n        }\n\n        const start = currentTime;\n        const end = currentTime + p.burst;\n\n        timeline.push({\n          id: p.id,\n          start,\n          end,\n          color: p.color,\n          idle: false\n        });\n\n        currentTime = end;\n        busyTime += p.burst;\n        completion[p.id] = end;\n      }\n\n      return { timeline, completion, busyTime, totalTime: currentTime };\n    }\n\n    function scheduleSJF(processes) {\n      const pending = [...processes]\n        .map(p => ({ ...p }))\n        .sort((a, b) => a.arrival - b.arrival || a.originalIndex - b.originalIndex);\n\n      const timeline = [];\n      const completion = {};\n      let currentTime = 0;\n      let busyTime = 0;\n      let done = 0;\n\n      while (done < processes.length) {\n        const available = pending.filter(p => !p.done && p.arrival <= currentTime);\n\n        if (available.length === 0) {\n          const nextArrival = Math.min(...pending.filter(p => !p.done).map(p => p.arrival));\n          timeline.push({\n            id: \"Idle\",\n            start: currentTime,\n            end: nextArrival,\n            color: \"#e5e7eb\",\n            idle: true\n          });\n          currentTime = nextArrival;\n          continue;\n        }\n\n        available.sort((a, b) =>\n          a.burst - b.burst ||\n          a.arrival - b.arrival ||\n          a.originalIndex - b.originalIndex\n        );\n\n        const p = available[0];\n        const start = currentTime;\n        const end = start + p.burst;\n\n        timeline.push({\n          id: p.id,\n          start,\n          end,\n          color: p.color,\n          idle: false\n        });\n\n        currentTime = end;\n        busyTime += p.burst;\n        completion[p.id] = end;\n        p.done = true;\n        done++;\n      }\n\n      return { timeline, completion, busyTime, totalTime: currentTime };\n    }\n\n    function scheduleRR(processes, quantum) {\n      const procMap = processes.map(p => ({\n        ...p,\n        remaining: p.burst,\n        completion: null\n      })).sort((a, b) => a.arrival - b.arrival || a.originalIndex - b.originalIndex);\n\n      const timeline = [];\n      const completion = {};\n      let currentTime = 0;\n      let busyTime = 0;\n      let finished = 0;\n      let i = 0;\n      const queue = [];\n\n      while (finished < procMap.length) {\n        while (i < procMap.length && procMap[i].arrival <= currentTime) {\n          queue.push(procMap[i]);\n          i++;\n        }\n\n        if (queue.length === 0) {\n          if (i < procMap.length) {\n            const nextArrival = procMap[i].arrival;\n            timeline.push({\n              id: \"Idle\",\n              start: currentTime,\n              end: nextArrival,\n              color: \"#e5e7eb\",\n              idle: true\n            });\n            currentTime = nextArrival;\n\n            while (i < procMap.length && procMap[i].arrival <= currentTime) {\n              queue.push(procMap[i]);\n              i++;\n            }\n          }\n          continue;\n        }\n\n        const current = queue.shift();\n        const slice = Math.min(quantum, current.remaining);\n        const start = currentTime;\n        const end = currentTime + slice;\n\n        timeline.push({\n          id: current.id,\n          start,\n          end,\n          color: current.color,\n          idle: false\n        });\n\n        currentTime = end;\n        busyTime += slice;\n        current.remaining -= slice;\n\n        while (i < procMap.length && procMap[i].arrival <= currentTime) {\n          queue.push(procMap[i]);\n          i++;\n        }\n\n        if (current.remaining > 0) {\n          queue.push(current);\n        } else {\n          completion[current.id] = currentTime;\n          finished++;\n        }\n      }\n\n      return { timeline, completion, busyTime, totalTime: currentTime };\n    }\n\n    function buildResults(processes, scheduleResult) {\n      const { completion, busyTime, totalTime } = scheduleResult;\n\n      const results = processes.map(p => {\n        const ct = completion[p.id];\n        const tat = ct - p.arrival;\n        const wt = tat - p.burst;\n\n        return {\n          id: p.id,\n          arrival: p.arrival,\n          burst: p.burst,\n          completion: ct,\n          waiting: wt,\n          turnaround: tat,\n          color: p.color\n        };\n      });\n\n      const avgWaiting =\n        results.reduce((sum, p) => sum + p.waiting, 0) / results.length || 0;\n\n      const avgTurnaround =\n        results.reduce((sum, p) => sum + p.turnaround, 0) / results.length || 0;\n\n      const utilization = totalTime > 0 ? (busyTime / totalTime) * 100 : 0;\n\n      return {\n        results,\n        avgWaiting,\n        avgTurnaround,\n        utilization,\n        totalTime\n      };\n    }\n\n    function renderResults(metrics) {\n      resultsBody.innerHTML = \"\";\n\n      metrics.results.forEach(p => {\n        const tr = document.createElement(\"tr\");\n        tr.innerHTML = `\n          <td style=\"font-weight:bold; color:${p.color};\">${p.id}<\/td>\n          <td>${p.arrival}<\/td>\n          <td>${p.burst}<\/td>\n          <td>${p.completion}<\/td>\n          <td>${p.waiting}<\/td>\n          <td>${p.turnaround}<\/td>\n        `;\n        resultsBody.appendChild(tr);\n      });\n\n      avgWaitingEl.textContent = metrics.avgWaiting.toFixed(2);\n      avgTurnaroundEl.textContent = metrics.avgTurnaround.toFixed(2);\n      cpuUtilizationEl.textContent = `${metrics.utilization.toFixed(2)}%`;\n      totalTimeEl.textContent = metrics.totalTime.toFixed(2);\n    }\n\n    function renderLegend(processes) {\n      legend.innerHTML = \"\";\n\n      processes.forEach(p => {\n        const item = document.createElement(\"div\");\n        item.className = \"legend-item\";\n        item.innerHTML = `\n          <span class=\"legend-swatch\" style=\"background:${p.color};\"><\/span>\n          <span>${p.id}<\/span>\n        `;\n        legend.appendChild(item);\n      });\n\n      const idleItem = document.createElement(\"div\");\n      idleItem.className = \"legend-item\";\n      idleItem.innerHTML = `\n        <span class=\"legend-swatch\" style=\"background:#e5e7eb;\"><\/span>\n        <span>Idle<\/span>\n      `;\n      legend.appendChild(idleItem);\n    }\n\n    function renderGantt(timeline) {\n      ganttChart.innerHTML = \"\";\n      ganttTimeRow.innerHTML = \"\";\n\n      if (!timeline.length) return;\n\n      const scale = 42;\n\n      timeline.forEach(block => {\n        const width = Math.max((block.end - block.start) * scale, 48);\n\n        const blockEl = document.createElement(\"div\");\n        blockEl.className = `gantt-block ${block.idle ? \"idle\" : \"\"}`;\n        blockEl.style.width = `${width}px`;\n        blockEl.style.background = block.idle ? \"#e5e7eb\" : block.color;\n        blockEl.textContent = block.id;\n        ganttChart.appendChild(blockEl);\n      });\n\n      timeline.forEach((block, index) => {\n        const width = Math.max((block.end - block.start) * scale, 48);\n\n        const timeEl = document.createElement(\"div\");\n        timeEl.className = \"gantt-time\";\n        timeEl.style.width = `${width}px`;\n        timeEl.textContent = block.start;\n        ganttTimeRow.appendChild(timeEl);\n\n        if (index === timeline.length - 1) {\n          const endEl = document.createElement(\"div\");\n          endEl.className = \"gantt-time\";\n          endEl.style.width = `0px`;\n          endEl.style.marginLeft = \"-2px\";\n          endEl.textContent = block.end;\n          ganttTimeRow.appendChild(endEl);\n        }\n      });\n    }\n\n    function runSimulation() {\n      const processes = getProcesses();\n\n      if (processes.length === 0) {\n        alert(\"Please add at least one process.\");\n        return;\n      }\n\n      if (processes.some(p => Number.isNaN(p.arrival) || Number.isNaN(p.burst))) {\n        alert(\"Please enter valid numeric values.\");\n        return;\n      }\n\n      const algorithm = algorithmEl.value;\n      const quantum = Math.max(1, Number(quantumEl.value) || 1);\n\n      let scheduleResult;\n\n      if (algorithm === \"FCFS\") {\n        scheduleResult = scheduleFCFS(processes);\n      } else if (algorithm === \"SJF\") {\n        scheduleResult = scheduleSJF(processes);\n      } else {\n        scheduleResult = scheduleRR(processes, quantum);\n      }\n\n      const metrics = buildResults(processes, scheduleResult);\n\n      renderGantt(scheduleResult.timeline);\n      renderResults(metrics);\n      renderLegend(processes);\n    }\n\n    addProcessBtn.addEventListener(\"click\", () => {\n      createProcessRow();\n      updateProcessLabels();\n    });\n\n    sampleBtn.addEventListener(\"click\", () => {\n      loadSample();\n      runSimulation();\n    });\n\n    clearBtn.addEventListener(\"click\", () => {\n      clearProcesses();\n      runSimulation();\n    });\n\n    runBtn.addEventListener(\"click\", runSimulation);\n    algorithmEl.addEventListener(\"change\", updateStatusText);\n\n    loadSample();\n    updateStatusText();\n    runSimulation();\n  <\/script>\n<\/body>\n<\/html>\n", "page_replacement_simulator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Page Replacement Algorithms Simulator<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --danger: #dc2626;\n      --warn: #d97706;\n      --idle: #e5e7eb;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n    }\n\n    .container {\n      max-width: 1420px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 420px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    input, select, button, textarea {\n      font: inherit;\n    }\n\n    select,\n    input[type=\"number\"],\n    textarea {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n    }\n\n    textarea {\n      resize: vertical;\n      min-height: 90px;\n      line-height: 1.5;\n    }\n\n    .box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .btn-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n    }\n\n    button {\n      padding: 10px 14px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      cursor: pointer;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      border-color: var(--accent);\n      color: var(--accent);\n    }\n\n    .primary {\n      background: var(--accent);\n      color: white;\n      border-color: var(--accent);\n    }\n\n    .primary:hover {\n      opacity: 0.92;\n      color: white;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .step-info {\n      display: grid;\n      grid-template-columns: 220px 1fr;\n      gap: 16px;\n      align-items: start;\n    }\n\n    .page-card {\n      background: #ffffff;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      text-align: center;\n    }\n\n    .page-big {\n      width: 90px;\n      height: 90px;\n      margin: 12px auto 0;\n      border-radius: 16px;\n      display: grid;\n      place-items: center;\n      font-size: 28px;\n      font-weight: bold;\n      color: white;\n      background: var(--accent);\n    }\n\n    .frames-grid {\n      display: grid;\n      gap: 12px;\n    }\n\n    .frame-box {\n      background: white;\n      border: 2px solid #dbeafe;\n      border-radius: 14px;\n      padding: 14px;\n      min-height: 70px;\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n    }\n\n    .frame-label {\n      color: var(--muted);\n      font-size: 14px;\n      font-weight: bold;\n    }\n\n    .frame-value {\n      font-size: 24px;\n      font-weight: bold;\n      color: var(--text);\n    }\n\n    .frame-box.changed {\n      border-color: #f59e0b;\n      background: #fffbeb;\n    }\n\n    .frame-box.hit {\n      border-color: #10b981;\n      background: #ecfdf5;\n    }\n\n    .timeline-wrap {\n      overflow-x: auto;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border-radius: 12px;\n      overflow: hidden;\n      min-width: 840px;\n    }\n\n    th, td {\n      border-bottom: 1px solid #e5e7eb;\n      padding: 10px;\n      text-align: center;\n      font-size: 14px;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    tr.active-row {\n      background: #eff6ff;\n    }\n\n    .hit-badge,\n    .fault-badge {\n      display: inline-block;\n      padding: 6px 10px;\n      border-radius: 999px;\n      font-size: 12px;\n      font-weight: bold;\n    }\n\n    .hit-badge {\n      background: #dcfce7;\n      color: #166534;\n    }\n\n    .fault-badge {\n      background: #fee2e2;\n      color: #991b1b;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n    }\n\n    #comparisonCanvas {\n      height: 300px;\n    }\n\n    .legend {\n      display: flex;\n      gap: 16px;\n      flex-wrap: wrap;\n      margin-top: 10px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .legend span::before {\n      content: \"\";\n      display: inline-block;\n      width: 14px;\n      height: 14px;\n      margin-right: 8px;\n      vertical-align: middle;\n      border-radius: 4px;\n    }\n\n    .fifo::before { background: #2563eb; }\n    .lru::before { background: #059669; }\n    .optimal::before { background: #d97706; }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 1100px) {\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr 1fr;\n      }\n\n      .step-info {\n        grid-template-columns: 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .stats {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Page Replacement Algorithms<\/h1>\n      <p>\n        Explore how FIFO, LRU, and Optimal page replacement behave with different page reference strings and frame counts.\n        Step through the sequence visually and compare hits, faults, and fault rate.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"algorithmSelect\">Algorithm<\/label>\n          <select id=\"algorithmSelect\">\n            <option value=\"FIFO\">FIFO<\/option>\n            <option value=\"LRU\">LRU<\/option>\n            <option value=\"Optimal\">Optimal<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"frameCount\">Number of frames<\/label>\n          <input type=\"number\" id=\"frameCount\" min=\"1\" max=\"8\" value=\"3\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"referenceInput\">Page reference string<\/label>\n          <textarea id=\"referenceInput\">7 0 1 2 0 3 0 4 2 3 0 3 2<\/textarea>\n        <\/div>\n\n        <div class=\"box\">\n          <div class=\"btn-row\">\n            <button class=\"primary\" id=\"runBtn\">Run<\/button>\n            <button id=\"stepBtn\">Next Step<\/button>\n            <button id=\"resetBtn\">Reset<\/button>\n            <button id=\"sampleBtn\">Load Sample<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>Step Summary<\/h3>\n          <div class=\"status\" id=\"statusText\">\n            Ready to simulate page replacement.\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>Key idea<\/h3>\n          <p style=\"margin:0; color:var(--muted); line-height:1.6;\">\n            A page hit means the requested page is already in memory.\n            A page fault means the page is not in memory and must be loaded into a frame.\n          <\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"box\">\n          <h2>Current Step Visualization<\/h2>\n          <div class=\"step-info\">\n            <div class=\"page-card\">\n              <div style=\"font-weight:bold;\">Current Page<\/div>\n              <div class=\"page-big\" id=\"currentPageBox\">-<\/div>\n              <div style=\"margin-top:12px; color:var(--muted);\" id=\"currentStepText\">\n                Step 0 of 0\n              <\/div>\n            <\/div>\n\n            <div>\n              <div class=\"frames-grid\" id=\"framesGrid\"><\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"stats\">\n            <div class=\"stat\">\n              <small>Hits<\/small>\n              <strong id=\"hitsOut\">0<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Faults<\/small>\n              <strong id=\"faultsOut\">0<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Fault rate<\/small>\n              <strong id=\"faultRateOut\">0.00%<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Algorithm<\/small>\n              <strong id=\"algorithmOut\">FIFO<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h2>Reference Timeline<\/h2>\n          <div class=\"timeline-wrap\">\n            <table>\n              <thead>\n                <tr id=\"timelineHead\">\n                  <th>Step<\/th>\n                  <th>Page<\/th>\n                  <th>Result<\/th>\n                  <th>Frames<\/th>\n                <\/tr>\n              <\/thead>\n              <tbody id=\"timelineBody\"><\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h2>Comparison Graph<\/h2>\n          <canvas id=\"comparisonCanvas\" width=\"920\" height=\"300\"><\/canvas>\n          <div class=\"legend\">\n            <span class=\"fifo\">FIFO faults<\/span>\n            <span class=\"lru\">LRU faults<\/span>\n            <span class=\"optimal\">Optimal faults<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"box notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>FIFO removes the oldest loaded page, even if it may be used again soon.<\/li>\n            <li>LRU tries to keep recently used pages in memory.<\/li>\n            <li>Optimal gives the minimum possible faults because it replaces the page used farthest in the future.<\/li>\n            <li>The same reference string can behave very differently depending on the number of frames.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding page replacement algorithms.\n    <\/div>\n  <\/div>\n\n  <script>\n    const algorithmSelect = document.getElementById(\"algorithmSelect\");\n    const frameCountInput = document.getElementById(\"frameCount\");\n    const referenceInput = document.getElementById(\"referenceInput\");\n\n    const runBtn = document.getElementById(\"runBtn\");\n    const stepBtn = document.getElementById(\"stepBtn\");\n    const resetBtn = document.getElementById(\"resetBtn\");\n    const sampleBtn = document.getElementById(\"sampleBtn\");\n\n    const currentPageBox = document.getElementById(\"currentPageBox\");\n    const currentStepText = document.getElementById(\"currentStepText\");\n    const framesGrid = document.getElementById(\"framesGrid\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const hitsOut = document.getElementById(\"hitsOut\");\n    const faultsOut = document.getElementById(\"faultsOut\");\n    const faultRateOut = document.getElementById(\"faultRateOut\");\n    const algorithmOut = document.getElementById(\"algorithmOut\");\n\n    const timelineBody = document.getElementById(\"timelineBody\");\n\n    const comparisonCanvas = document.getElementById(\"comparisonCanvas\");\n    const comparisonCtx = comparisonCanvas.getContext(\"2d\");\n\n    let currentSimulation = null;\n    let currentStepIndex = 0;\n\n    function parseReferenceString(text) {\n      return text\n        .split(/[\\s,]+/)\n        .map(x => x.trim())\n        .filter(x => x !== \"\")\n        .map(Number)\n        .filter(x => !Number.isNaN(x));\n    }\n\n    function cloneFrames(frames) {\n      return frames.map(x => x);\n    }\n\n    function simulateFIFO(reference, frameCount) {\n      const frames = Array(frameCount).fill(null);\n      const queue = [];\n      const steps = [];\n      let hits = 0;\n      let faults = 0;\n\n      for (let i = 0; i < reference.length; i++) {\n        const page = reference[i];\n        let hit = frames.includes(page);\n        let replacedIndex = -1;\n        let replacedPage = null;\n\n        if (hit) {\n          hits++;\n        } else {\n          faults++;\n          if (frames.includes(null)) {\n            replacedIndex = frames.indexOf(null);\n            frames[replacedIndex] = page;\n            queue.push(replacedIndex);\n          } else {\n            replacedIndex = queue.shift();\n            replacedPage = frames[replacedIndex];\n            frames[replacedIndex] = page;\n            queue.push(replacedIndex);\n          }\n        }\n\n        steps.push({\n          step: i + 1,\n          page,\n          hit,\n          frames: cloneFrames(frames),\n          replacedIndex,\n          replacedPage,\n          hits,\n          faults\n        });\n      }\n\n      return { steps, hits, faults };\n    }\n\n    function simulateLRU(reference, frameCount) {\n      const frames = Array(frameCount).fill(null);\n      const lastUsed = Array(frameCount).fill(-1);\n      const steps = [];\n      let hits = 0;\n      let faults = 0;\n\n      for (let i = 0; i < reference.length; i++) {\n        const page = reference[i];\n        let frameIndex = frames.indexOf(page);\n        let hit = frameIndex !== -1;\n        let replacedIndex = -1;\n        let replacedPage = null;\n\n        if (hit) {\n          hits++;\n          lastUsed[frameIndex] = i;\n        } else {\n          faults++;\n          if (frames.includes(null)) {\n            replacedIndex = frames.indexOf(null);\n          } else {\n            let minUse = Infinity;\n            for (let j = 0; j < frameCount; j++) {\n              if (lastUsed[j] < minUse) {\n                minUse = lastUsed[j];\n                replacedIndex = j;\n              }\n            }\n            replacedPage = frames[replacedIndex];\n          }\n          frames[replacedIndex] = page;\n          lastUsed[replacedIndex] = i;\n        }\n\n        steps.push({\n          step: i + 1,\n          page,\n          hit,\n          frames: cloneFrames(frames),\n          replacedIndex,\n          replacedPage,\n          hits,\n          faults\n        });\n      }\n\n      return { steps, hits, faults };\n    }\n\n    function simulateOptimal(reference, frameCount) {\n      const frames = Array(frameCount).fill(null);\n      const steps = [];\n      let hits = 0;\n      let faults = 0;\n\n      for (let i = 0; i < reference.length; i++) {\n        const page = reference[i];\n        let hit = frames.includes(page);\n        let replacedIndex = -1;\n        let replacedPage = null;\n\n        if (hit) {\n          hits++;\n        } else {\n          faults++;\n          if (frames.includes(null)) {\n            replacedIndex = frames.indexOf(null);\n            frames[replacedIndex] = page;\n          } else {\n            let farthest = -1;\n            let bestIndex = -1;\n\n            for (let j = 0; j < frameCount; j++) {\n              const framePage = frames[j];\n              let nextUse = Infinity;\n\n              for (let k = i + 1; k < reference.length; k++) {\n                if (reference[k] === framePage) {\n                  nextUse = k;\n                  break;\n                }\n              }\n\n              if (nextUse > farthest) {\n                farthest = nextUse;\n                bestIndex = j;\n              }\n            }\n\n            replacedIndex = bestIndex;\n            replacedPage = frames[replacedIndex];\n            frames[replacedIndex] = page;\n          }\n        }\n\n        steps.push({\n          step: i + 1,\n          page,\n          hit,\n          frames: cloneFrames(frames),\n          replacedIndex,\n          replacedPage,\n          hits,\n          faults\n        });\n      }\n\n      return { steps, hits, faults };\n    }\n\n    function simulateByName(name, reference, frameCount) {\n      if (name === \"FIFO\") return simulateFIFO(reference, frameCount);\n      if (name === \"LRU\") return simulateLRU(reference, frameCount);\n      return simulateOptimal(reference, frameCount);\n    }\n\n    function renderFrames(step, frameCount) {\n      framesGrid.innerHTML = \"\";\n\n      for (let i = 0; i < frameCount; i++) {\n        const frame = document.createElement(\"div\");\n        let className = \"frame-box\";\n\n        if (step) {\n          if (step.hit && step.frames[i] === step.page) {\n            className += \" hit\";\n          } else if (!step.hit && step.replacedIndex === i) {\n            className += \" changed\";\n          }\n        }\n\n        frame.className = className;\n        frame.innerHTML = `\n          <div class=\"frame-label\">Frame ${i + 1}<\/div>\n          <div class=\"frame-value\">${step && step.frames[i] !== null ? step.frames[i] : \"-\"}<\/div>\n        `;\n        framesGrid.appendChild(frame);\n      }\n    }\n\n    function renderTimeline(steps) {\n      timelineBody.innerHTML = \"\";\n\n      steps.forEach((step, index) => {\n        const tr = document.createElement(\"tr\");\n        if (index === currentStepIndex - 1) tr.classList.add(\"active-row\");\n\n        const resultBadge = step.hit\n          ? `<span class=\"hit-badge\">Hit<\/span>`\n          : `<span class=\"fault-badge\">Fault<\/span>`;\n\n        tr.innerHTML = `\n          <td>${step.step}<\/td>\n          <td>${step.page}<\/td>\n          <td>${resultBadge}<\/td>\n          <td>${step.frames.map(v => v === null ? \"-\" : v).join(\" | \")}<\/td>\n        `;\n\n        timelineBody.appendChild(tr);\n      });\n    }\n\n    function renderCurrentStep() {\n      if (!currentSimulation || currentSimulation.steps.length === 0) {\n        currentPageBox.textContent = \"-\";\n        currentStepText.textContent = \"Step 0 of 0\";\n        hitsOut.textContent = \"0\";\n        faultsOut.textContent = \"0\";\n        faultRateOut.textContent = \"0.00%\";\n        algorithmOut.textContent = algorithmSelect.value;\n        renderFrames(null, Number(frameCountInput.value));\n        timelineBody.innerHTML = \"\";\n        statusText.textContent = \"Ready to simulate page replacement.\";\n        return;\n      }\n\n      const frameCount = Number(frameCountInput.value);\n      const totalSteps = currentSimulation.steps.length;\n\n      if (currentStepIndex === 0) {\n        currentPageBox.textContent = \"-\";\n        currentStepText.textContent = `Step 0 of ${totalSteps}`;\n        hitsOut.textContent = \"0\";\n        faultsOut.textContent = \"0\";\n        faultRateOut.textContent = \"0.00%\";\n        algorithmOut.textContent = currentSimulation.algorithm;\n        renderFrames(null, frameCount);\n        statusText.textContent = `Simulation loaded for ${currentSimulation.algorithm}. Click Next Step to start.`;\n      } else {\n        const step = currentSimulation.steps[currentStepIndex - 1];\n        currentPageBox.textContent = step.page;\n        currentStepText.textContent = `Step ${currentStepIndex} of ${totalSteps}`;\n        hitsOut.textContent = step.hits;\n        faultsOut.textContent = step.faults;\n\n        const faultRate = (step.faults / currentStepIndex) * 100;\n        faultRateOut.textContent = `${faultRate.toFixed(2)}%`;\n        algorithmOut.textContent = currentSimulation.algorithm;\n        renderFrames(step, frameCount);\n\n        if (step.hit) {\n          statusText.textContent = `Step ${step.step}: Page ${step.page} is already in memory, so this is a hit.`;\n        } else if (step.replacedPage === null) {\n          statusText.textContent = `Step ${step.step}: Page ${step.page} caused a fault and was loaded into an empty frame.`;\n        } else {\n          statusText.textContent = `Step ${step.step}: Page ${step.page} caused a fault and replaced page ${step.replacedPage}.`;\n        }\n      }\n\n      renderTimeline(currentSimulation.steps);\n      drawComparisonGraph();\n    }\n\n    function runSimulation() {\n      const reference = parseReferenceString(referenceInput.value);\n      const frameCount = Number(frameCountInput.value);\n      const algorithm = algorithmSelect.value;\n\n      if (reference.length === 0) {\n        alert(\"Please enter at least one page reference.\");\n        return;\n      }\n\n      if (!frameCount || frameCount < 1) {\n        alert(\"Please enter a valid frame count.\");\n        return;\n      }\n\n      const result = simulateByName(algorithm, reference, frameCount);\n\n      currentSimulation = {\n        algorithm,\n        reference,\n        frameCount,\n        steps: result.steps,\n        totalHits: result.hits,\n        totalFaults: result.faults\n      };\n\n      currentStepIndex = result.steps.length;\n      renderCurrentStep();\n    }\n\n    function resetSimulation() {\n      const reference = parseReferenceString(referenceInput.value);\n      const frameCount = Number(frameCountInput.value);\n      const algorithm = algorithmSelect.value;\n\n      if (reference.length === 0 || frameCount < 1) {\n        currentSimulation = null;\n        currentStepIndex = 0;\n        renderCurrentStep();\n        drawComparisonGraph();\n        return;\n      }\n\n      const result = simulateByName(algorithm, reference, frameCount);\n\n      currentSimulation = {\n        algorithm,\n        reference,\n        frameCount,\n        steps: result.steps,\n        totalHits: result.hits,\n        totalFaults: result.faults\n      };\n\n      currentStepIndex = 0;\n      renderCurrentStep();\n    }\n\n    function nextStep() {\n      if (!currentSimulation) {\n        resetSimulation();\n      }\n\n      if (!currentSimulation) return;\n\n      if (currentStepIndex < currentSimulation.steps.length) {\n        currentStepIndex++;\n        renderCurrentStep();\n      }\n    }\n\n    function drawComparisonGraph() {\n      const ctx = comparisonCtx;\n      const w = comparisonCanvas.width;\n      const h = comparisonCanvas.height;\n      ctx.clearRect(0, 0, w, h);\n\n      const reference = parseReferenceString(referenceInput.value);\n      const frameCount = Number(frameCountInput.value);\n\n      if (reference.length === 0 || frameCount < 1) {\n        return;\n      }\n\n      const fifo = simulateFIFO(reference, frameCount).faults;\n      const lru = simulateLRU(reference, frameCount).faults;\n      const optimal = simulateOptimal(reference, frameCount).faults;\n\n      const data = [\n        { label: \"FIFO\", value: fifo, color: \"#2563eb\" },\n        { label: \"LRU\", value: lru, color: \"#059669\" },\n        { label: \"Optimal\", value: optimal, color: \"#d97706\" }\n      ];\n\n      const padL = 70;\n      const padR = 30;\n      const padT = 25;\n      const padB = 55;\n      const plotW = w - padL - padR;\n      const plotH = h - padT - padB;\n      const maxVal = Math.max(...data.map(d => d.value), 1);\n\n      ctx.strokeStyle = \"#e5e7eb\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= maxVal; i++) {\n        const y = h - padB - (i / maxVal) * plotH;\n        ctx.beginPath();\n        ctx.moveTo(padL, y);\n        ctx.lineTo(w - padR, y);\n        ctx.stroke();\n\n        ctx.fillStyle = \"#6b7280\";\n        ctx.font = \"13px Arial\";\n        ctx.fillText(String(i), 40, y + 4);\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(padL, padT);\n      ctx.lineTo(padL, h - padB);\n      ctx.lineTo(w - padR, h - padB);\n      ctx.stroke();\n\n      const barWidth = 120;\n      const gap = 90;\n      const startX = padL + 80;\n\n      data.forEach((item, index) => {\n        const x = startX + index * (barWidth + gap);\n        const barHeight = (item.value / maxVal) * plotH;\n        const y = h - padB - barHeight;\n\n        ctx.fillStyle = item.color;\n        ctx.fillRect(x, y, barWidth, barHeight);\n\n        ctx.fillStyle = \"#111827\";\n        ctx.font = \"15px Arial\";\n        ctx.fillText(item.label, x + 28, h - padB + 25);\n        ctx.fillText(String(item.value), x + 50, y - 8);\n      });\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"Page Faults\", 20, 22);\n    }\n\n    function loadSample() {\n      algorithmSelect.value = \"FIFO\";\n      frameCountInput.value = 3;\n      referenceInput.value = \"7 0 1 2 0 3 0 4 2 3 0 3 2\";\n      resetSimulation();\n    }\n\n    runBtn.addEventListener(\"click\", runSimulation);\n    resetBtn.addEventListener(\"click\", resetSimulation);\n    stepBtn.addEventListener(\"click\", nextStep);\n    sampleBtn.addEventListener(\"click\", loadSample);\n\n    algorithmSelect.addEventListener(\"change\", resetSimulation);\n    frameCountInput.addEventListener(\"input\", resetSimulation);\n    referenceInput.addEventListener(\"input\", resetSimulation);\n\n    loadSample();\n  <\/script>\n<\/body>\n<\/html>", "Solar_Panel_Angle_vs_Power": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Solar Panel Angle vs Power<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --sun: #f59e0b;\n      --good: #059669;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1280px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      line-height: 1.6;\n      color: var(--muted);\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 360px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .canvas-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    input[type=\"range\"] {\n      width: 100%;\n      cursor: pointer;\n    }\n\n    .formula-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      line-height: 1.7;\n      color: var(--muted);\n      margin-top: 10px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 16px;\n    }\n\n    .stat {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .status {\n      margin-top: 16px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      color: #0f172a;\n      line-height: 1.5;\n    }\n\n    .visual {\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      background: linear-gradient(to bottom, #dbeafe 0%, #eff6ff 55%, #eef2ff 55%, #e5e7eb 100%);\n      height: 420px;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .graph-wrap {\n      margin-top: 18px;\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n    }\n\n    canvas {\n      width: 100%;\n      height: 280px;\n      display: block;\n      background: white;\n      border-radius: 10px;\n      border: 1px solid #e5e7eb;\n    }\n\n    .notes {\n      margin-top: 18px;\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 16px;\n    }\n\n    .note-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 16px;\n    }\n\n    .note-box p, .note-box li {\n      line-height: 1.6;\n      color: var(--muted);\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    .legend {\n      display: flex;\n      gap: 18px;\n      margin-top: 10px;\n      flex-wrap: wrap;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .dot {\n      width: 12px;\n      height: 12px;\n      border-radius: 50%;\n      display: inline-block;\n      margin-right: 6px;\n      vertical-align: middle;\n    }\n\n    @media (max-width: 960px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .notes {\n        grid-template-columns: 1fr;\n      }\n\n      .visual {\n        height: 360px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Solar Panel Angle vs Power<\/h1>\n      <p>\n        Explore how the tilt angle of a solar panel affects power output.\n        Move the sun and panel angle to see how alignment changes the incident angle and the generated power.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"sunSlider\">\n            Sun elevation\n            <span class=\"value\" id=\"sunValue\">45°<\/span>\n          <\/label>\n          <input type=\"range\" id=\"sunSlider\" min=\"0\" max=\"90\" step=\"1\" value=\"45\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"tiltSlider\">\n            Panel tilt\n            <span class=\"value\" id=\"tiltValue\">45°<\/span>\n          <\/label>\n          <input type=\"range\" id=\"tiltSlider\" min=\"0\" max=\"90\" step=\"1\" value=\"45\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"irradianceSlider\">\n            Solar irradiance\n            <span class=\"value\" id=\"irradianceValue\">800 W/m²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"irradianceSlider\" min=\"200\" max=\"1200\" step=\"10\" value=\"800\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"areaSlider\">\n            Panel area\n            <span class=\"value\" id=\"areaValue\">2.0 m²<\/span>\n          <\/label>\n          <input type=\"range\" id=\"areaSlider\" min=\"0.5\" max=\"5\" step=\"0.1\" value=\"2\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"efficiencySlider\">\n            Efficiency\n            <span class=\"value\" id=\"efficiencyValue\">20%<\/span>\n          <\/label>\n          <input type=\"range\" id=\"efficiencySlider\" min=\"5\" max=\"30\" step=\"1\" value=\"20\" />\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Model used<\/h3>\n          <div class=\"formula\">P = G × A × η × cos(θ)<\/div><br>\n          <div class=\"formula\">θ = incidence angle<\/div><br>\n          <div class=\"formula\">Best power when θ = 0°<\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Incident angle θ<\/small>\n            <strong id=\"thetaOut\">0.00°<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Alignment factor<\/small>\n            <strong id=\"cosOut\">1.00<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Output power<\/small>\n            <strong id=\"powerOut\">320.00 W<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Optimal tilt<\/small>\n            <strong id=\"optimalTiltOut\">45.00°<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Maximum possible power<\/small>\n            <strong id=\"maxPowerOut\">320.00 W<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Power efficiency ratio<\/small>\n            <strong id=\"ratioOut\">100%<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"status\" id=\"statusText\">\n          The panel produces maximum power when its surface is most directly facing the sun.\n        <\/div>\n      <\/div>\n\n      <div class=\"canvas-panel\">\n        <h2>Solar Geometry View<\/h2>\n\n        <div class=\"visual\">\n          <svg id=\"scene\" viewBox=\"0 0 900 420\" width=\"100%\" height=\"100%\">\n            <\!-- horizon -->\n            <line x1=\"0\" y1=\"250\" x2=\"900\" y2=\"250\" stroke=\"#94a3b8\" stroke-width=\"3\"><\/line>\n\n            <\!-- sun rays -->\n            <g id=\"sunRays\"><\/g>\n\n            <\!-- sun -->\n            <circle id=\"sunCore\" cx=\"140\" cy=\"90\" r=\"34\" fill=\"#fbbf24\" stroke=\"#f59e0b\" stroke-width=\"6\"><\/circle>\n\n            <\!-- panel stand -->\n            <line x1=\"580\" y1=\"250\" x2=\"580\" y2=\"205\" stroke=\"#475569\" stroke-width=\"8\"><\/line>\n            <line x1=\"540\" y1=\"250\" x2=\"620\" y2=\"250\" stroke=\"#475569\" stroke-width=\"8\"><\/line>\n\n            <\!-- panel -->\n            <g id=\"panelGroup\">\n              <rect id=\"panelRect\" x=\"520\" y=\"155\" width=\"140\" height=\"70\" rx=\"8\" fill=\"#1d4ed8\" stroke=\"#0f172a\" stroke-width=\"4\"><\/rect>\n              <line x1=\"555\" y1=\"155\" x2=\"555\" y2=\"225\"
