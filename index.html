nt-size: 14px;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n      overflow: hidden;\n    }\n\n    th, td {\n      padding: 10px 12px;\n      text-align: center;\n      border-bottom: 1px solid #e5e7eb;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    tr:last-child td {\n      border-bottom: none;\n    }\n\n    .notes p, .notes li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .hidden {\n      display: none;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 980px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr;\n      }\n\n      canvas {\n        height: 360px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Graphing Linear and Nonlinear Functions<\/h1>\n      <p>\n        Explore how changing coefficients affects the shape of linear and nonlinear graphs.\n        Compare straight-line behavior with curved graphs and observe how parameters control slope, stretching, shifting, and turning.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"functionType\">Function type<\/label>\n          <select id=\"functionType\">\n            <option value=\"linear\">Linear<\/option>\n            <option value=\"quadratic\">Quadratic<\/option>\n            <option value=\"cubic\">Cubic<\/option>\n            <option value=\"absolute\">Absolute Value<\/option>\n            <option value=\"exponential\">Exponential<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"slider-box\" id=\"boxA\">\n          <label for=\"sliderA\">\n            <span id=\"labelA\">a<\/span>\n            <span class=\"value\" id=\"valueA\">1<\/span>\n          <\/label>\n          <input type=\"range\" id=\"sliderA\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"1\" />\n        <\/div>\n\n        <div class=\"slider-box\" id=\"boxB\">\n          <label for=\"sliderB\">\n            <span id=\"labelB\">b<\/span>\n            <span class=\"value\" id=\"valueB\">0<\/span>\n          <\/label>\n          <input type=\"range\" id=\"sliderB\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"0\" />\n        <\/div>\n\n        <div class=\"slider-box\" id=\"boxC\">\n          <label for=\"sliderC\">\n            <span id=\"labelC\">c<\/span>\n            <span class=\"value\" id=\"valueC\">0<\/span>\n          <\/label>\n          <input type=\"range\" id=\"sliderC\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"0\" />\n        <\/div>\n\n        <div class=\"slider-box\" id=\"boxD\">\n          <label for=\"sliderD\">\n            <span id=\"labelD\">d<\/span>\n            <span class=\"value\" id=\"valueD\">0<\/span>\n          <\/label>\n          <input type=\"range\" id=\"sliderD\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"0\" />\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Current equation<\/h3>\n          <div class=\"formula\" id=\"equationText\">y = ax + b<\/div><br>\n          <div class=\"formula\" id=\"classificationText\">Classification: Linear<\/div>\n          <div class=\"status\" id=\"statusText\">\n            Linear functions make straight lines and have a constant rate of change.\n          <\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Function family<\/small>\n            <strong id=\"familyOut\">Linear<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Graph type<\/small>\n            <strong id=\"graphTypeOut\">Straight line<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Main behavior<\/small>\n            <strong id=\"behaviorOut\">Constant slope<\/strong>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"graph-wrap\">\n          <h2>Function Graph<\/h2>\n          <canvas id=\"graphCanvas\" width=\"900\" height=\"440\"><\/canvas>\n          <div class=\"readout\" id=\"mouseReadout\">Move your mouse over the graph to inspect x and y values.<\/div>\n        <\/div>\n\n        <div class=\"table-wrap\">\n          <h2>Sample Values<\/h2>\n          <table>\n            <thead>\n              <tr>\n                <th>x<\/th>\n                <th>y<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"valueTable\"><\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"notes\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>Linear functions form straight lines and have the same rate of change everywhere.<\/li>\n            <li>Nonlinear functions curve, bend, turn, or grow at changing rates.<\/li>\n            <li>Changing coefficients can stretch, shift, reflect, or reshape the graph.<\/li>\n          <\/ul>\n          <p>\n            A good teaching activity is to ask students to predict the graph shape first, then move the sliders to test their prediction.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for exploring linear and nonlinear functions.\n    <\/div>\n  <\/div>\n\n  <script>\n    const functionType = document.getElementById(\"functionType\");\n\n    const sliderA = document.getElementById(\"sliderA\");\n    const sliderB = document.getElementById(\"sliderB\");\n    const sliderC = document.getElementById(\"sliderC\");\n    const sliderD = document.getElementById(\"sliderD\");\n\n    const labelA = document.getElementById(\"labelA\");\n    const labelB = document.getElementById(\"labelB\");\n    const labelC = document.getElementById(\"labelC\");\n    const labelD = document.getElementById(\"labelD\");\n\n    const valueA = document.getElementById(\"valueA\");\n    const valueB = document.getElementById(\"valueB\");\n    const valueC = document.getElementById(\"valueC\");\n    const valueD = document.getElementById(\"valueD\");\n\n    const boxA = document.getElementById(\"boxA\");\n    const boxB = document.getElementById(\"boxB\");\n    const boxC = document.getElementById(\"boxC\");\n    const boxD = document.getElementById(\"boxD\");\n\n    const equationText = document.getElementById(\"equationText\");\n    const classificationText = document.getElementById(\"classificationText\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const familyOut = document.getElementById(\"familyOut\");\n    const graphTypeOut = document.getElementById(\"graphTypeOut\");\n    const behaviorOut = document.getElementById(\"behaviorOut\");\n\n    const valueTable = document.getElementById(\"valueTable\");\n    const canvas = document.getElementById(\"graphCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n    const mouseReadout = document.getElementById(\"mouseReadout\");\n\n    const world = {\n      xMin: -10,\n      xMax: 10,\n      yMin: -10,\n      yMax: 10\n    };\n\n    function fmt(n) {\n      return Number(n).toFixed(2);\n    }\n\n    function updateSliderDisplay() {\n      valueA.textContent = sliderA.value;\n      valueB.textContent = sliderB.value;\n      valueC.textContent = sliderC.value;\n      valueD.textContent = sliderD.value;\n    }\n\n    function configureControls() {\n      const type = functionType.value;\n\n      boxA.classList.remove(\"hidden\");\n      boxB.classList.remove(\"hidden\");\n      boxC.classList.remove(\"hidden\");\n      boxD.classList.remove(\"hidden\");\n\n      if (type === \"linear\") {\n        labelA.textContent = \"a (slope)\";\n        labelB.textContent = \"b (intercept)\";\n        boxC.classList.add(\"hidden\");\n        boxD.classList.add(\"hidden\");\n\n        sliderA.min = -5; sliderA.max = 5; sliderA.step = 0.1;\n        sliderB.min = -10; sliderB.max = 10; sliderB.step = 0.1;\n\n        if (sliderA.value === \"\") sliderA.value = 1;\n        if (sliderB.value === \"\") sliderB.value = 0;\n      }\n\n      if (type === \"quadratic\") {\n        labelA.textContent = \"a\";\n        labelB.textContent = \"b\";\n        labelC.textContent = \"c\";\n        boxD.classList.add(\"hidden\");\n\n        sliderA.min = -3; sliderA.max = 3; sliderA.step = 0.1;\n        sliderB.min = -6; sliderB.max = 6; sliderB.step = 0.1;\n        sliderC.min = -10; sliderC.max = 10; sliderC.step = 0.1;\n      }\n\n      if (type === \"cubic\") {\n        labelA.textContent = \"a\";\n        labelB.textContent = \"b\";\n        labelC.textContent = \"c\";\n        labelD.textContent = \"d\";\n\n        sliderA.min = -1.5; sliderA.max = 1.5; sliderA.step = 0.1;\n        sliderB.min = -4; sliderB.max = 4; sliderB.step = 0.1;\n        sliderC.min = -6; sliderC.max = 6; sliderC.step = 0.1;\n        sliderD.min = -10; sliderD.max = 10; sliderD.step = 0.1;\n      }\n\n      if (type === \"absolute\") {\n        labelA.textContent = \"a\";\n        labelB.textContent = \"h\";\n        labelC.textContent = \"k\";\n        boxD.classList.add(\"hidden\");\n\n        sliderA.min = -5; sliderA.max = 5; sliderA.step = 0.1;\n        sliderB.min = -8; sliderB.max = 8; sliderB.step = 0.1;\n        sliderC.min = -8; sliderC.max = 8; sliderC.step = 0.1;\n      }\n\n      if (type === \"exponential\") {\n        labelA.textContent = \"a\";\n        labelB.textContent = \"base\";\n        labelC.textContent = \"h\";\n        labelD.textContent = \"k\";\n\n        sliderA.min = -5; sliderA.max = 5; sliderA.step = 0.1;\n        sliderB.min = 0.2; sliderB.max = 3; sliderB.step = 0.1;\n        sliderC.min = -6; sliderC.max = 6; sliderC.step = 0.1;\n        sliderD.min = -8; sliderD.max = 8; sliderD.step = 0.1;\n\n        if (parseFloat(sliderB.value) <= 0) sliderB.value = 2;\n      }\n\n      updateSliderDisplay();\n    }\n\n    function getParams() {\n      return {\n        a: parseFloat(sliderA.value),\n        b: parseFloat(sliderB.value),\n        c: parseFloat(sliderC.value),\n        d: parseFloat(sliderD.value)\n      };\n    }\n\n    function evaluate(x) {\n      const type = functionType.value;\n      const { a, b, c, d } = getParams();\n\n      if (type === \"linear\") return a * x + b;\n      if (type === \"quadratic\") return a * x * x + b * x + c;\n      if (type === \"cubic\") return a * x * x * x + b * x * x + c * x + d;\n      if (type === \"absolute\") return a * Math.abs(x - b) + c;\n      if (type === \"exponential\") return a * Math.pow(b, x - c) + d;\n\n      return 0;\n    }\n\n    function getEquationAndDescription() {\n      const type = functionType.value;\n      const { a, b, c, d } = getParams();\n\n      if (type === \"linear\") {\n        return {\n          eq: `y = ${fmt(a)}x + ${fmt(b)}`,\n          cls: \"Classification: Linear\",\n          family: \"Linear\",\n          graphType: \"Straight line\",\n          behavior: \"Constant slope\",\n          note: \"Linear functions make straight lines and have a constant rate of change.\"\n        };\n      }\n\n      if (type === \"quadratic\") {\n        return {\n          eq: `y = ${fmt(a)}x² + ${fmt(b)}x + ${fmt(c)}`,\n          cls: \"Classification: Nonlinear\",\n          family: \"Quadratic\",\n          graphType: \"Parabola\",\n          behavior: \"Changes direction once\",\n          note: \"Quadratic functions form parabolas. They curve upward or downward and do not have a constant slope.\"\n        };\n      }\n\n      if (type === \"cubic\") {\n        return {\n          eq: `y = ${fmt(a)}x³ + ${fmt(b)}x² + ${fmt(c)}x + ${fmt(d)}`,\n          cls: \"Classification: Nonlinear\",\n          family: \"Cubic\",\n          graphType: \"S-shaped curve\",\n          behavior: \"Changing slope\",\n          note: \"Cubic functions can bend in different ways and often show an S-shaped graph.\"\n        };\n      }\n\n      if (type === \"absolute\") {\n        return {\n          eq: `y = ${fmt(a)}|x - ${fmt(b)}| + ${fmt(c)}`,\n          cls: \"Classification: Nonlinear\",\n          family: \"Absolute Value\",\n          graphType: \"V-shape\",\n          behavior: \"Sharp turning point\",\n          note: \"Absolute value functions make V-shaped graphs with a vertex where the direction changes suddenly.\"\n        };\n      }\n\n      if (type === \"exponential\") {\n        return {\n          eq: `y = ${fmt(a)} · ${fmt(b)}^(x - ${fmt(c)}) + ${fmt(d)}`,\n          cls: \"Classification: Nonlinear\",\n          family: \"Exponential\",\n          graphType: \"Rapid growth or decay\",\n          behavior: \"Rate changes continuously\",\n          note: \"Exponential functions grow or decay rapidly and their rate of change is not constant.\"\n        };\n      }\n\n      return {};\n    }\n\n    function worldToCanvas(x, y) {\n      const px = ((x - world.xMin) / (world.xMax - world.xMin)) * canvas.width;\n      const py = canvas.height - ((y - world.yMin) / (world.yMax - world.yMin)) * canvas.height;\n      return { px, py };\n    }\n\n    function canvasToWorld(px, py) {\n      const x = world.xMin + (px / canvas.width) * (world.xMax - world.xMin);\n      const y = world.yMin + ((canvas.height - py) / canvas.height) * (world.yMax - world.yMin);\n      return { x, y };\n    }\n\n    function drawGrid() {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n      ctx.strokeStyle = \"#e5e7eb\";\n      ctx.lineWidth = 1;\n\n      for (let x = Math.ceil(world.xMin); x <= world.xMax; x++) {\n        const { px } = worldToCanvas(x, 0);\n        ctx.beginPath();\n        ctx.moveTo(px, 0);\n        ctx.lineTo(px, canvas.height);\n        ctx.stroke();\n      }\n\n      for (let y = Math.ceil(world.yMin); y <= world.yMax; y++) {\n        const { py } = worldToCanvas(0, y);\n        ctx.beginPath();\n        ctx.moveTo(0, py);\n        ctx.lineTo(canvas.width, py);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n\n      const yAxis = worldToCanvas(0, 0).px;\n      const xAxis = worldToCanvas(0, 0).py;\n\n      ctx.beginPath();\n      ctx.moveTo(yAxis, 0);\n      ctx.lineTo(yAxis, canvas.height);\n      ctx.stroke();\n\n      ctx.beginPath();\n      ctx.moveTo(0, xAxis);\n      ctx.lineTo(canvas.width, xAxis);\n      ctx.stroke();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"12px Arial\";\n\n      for (let x = Math.ceil(world.xMin); x <= world.xMax; x++) {\n        if (x === 0) continue;\n        const p = worldToCanvas(x, 0);\n        ctx.fillText(x, p.px - 4, xAxis + 14);\n      }\n\n      for (let y = Math.ceil(world.yMin); y <= world.yMax; y++) {\n        if (y === 0) continue;\n        const p = worldToCanvas(0, y);\n        ctx.fillText(y, yAxis + 6, p.py + 4);\n      }\n    }\n\n    function drawFunction() {\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n\n      let started = false;\n\n      for (let px = 0; px <= canvas.width; px++) {\n        const { x } = canvasToWorld(px, 0);\n        const y = evaluate(x);\n\n        if (!isFinite(y)) {\n          started = false;\n          continue;\n        }\n\n        const p = worldToCanvas(x, y);\n\n        if (p.py < -1000 || p.py > canvas.height + 1000) {\n          started = false;\n          continue;\n        }\n\n        if (!started) {\n          ctx.moveTo(p.px, p.py);\n          started = true;\n        } else {\n          ctx.lineTo(p.px, p.py);\n        }\n      }\n\n      ctx.stroke();\n    }\n\n    function draw() {\n      drawGrid();\n      drawFunction();\n    }\n\n    function updateTable() {\n      const sampleX = [-4, -2, 0, 2, 4];\n      valueTable.innerHTML = \"\";\n\n      sampleX.forEach(x => {\n        const y = evaluate(x);\n        const row = document.createElement(\"tr\");\n        row.innerHTML = `\n          <td>${x}<\/td>\n          <td>${isFinite(y) ? fmt(y) : \"undefined\"}<\/td>\n        `;\n        valueTable.appendChild(row);\n      });\n    }\n\n    function updateText() {\n      const info = getEquationAndDescription();\n      equationText.textContent = info.eq;\n      classificationText.textContent = info.cls;\n      statusText.textContent = info.note;\n      familyOut.textContent = info.family;\n      graphTypeOut.textContent = info.graphType;\n      behaviorOut.textContent = info.behavior;\n    }\n\n    function updateAll() {\n      configureControls();\n      updateSliderDisplay();\n      updateText();\n      updateTable();\n      draw();\n    }\n\n    [functionType, sliderA, sliderB, sliderC, sliderD].forEach(el => {\n      el.addEventListener(\"input\", updateAll);\n    });\n\n    canvas.addEventListener(\"mousemove\", (e) => {\n      const rect = canvas.getBoundingClientRect();\n      const px = (e.clientX - rect.left) * (canvas.width / rect.width);\n      const py = (e.clientY - rect.top) * (canvas.height / rect.height);\n      const point = canvasToWorld(px, py);\n      const yFunc = evaluate(point.x);\n\n      mouseReadout.textContent =\n        `x = ${fmt(point.x)}, graph y = ${isFinite(yFunc) ? fmt(yFunc) : \"undefined\"}`;\n    });\n\n    canvas.addEventListener(\"mouseleave\", () => {\n      mouseReadout.textContent = \"Move your mouse over the graph to inspect x and y values.\";\n    });\n\n    sliderA.value = 1;\n    sliderB.value = 0;\n    sliderC.value = 0;\n    sliderD.value = 0;\n\n    updateAll();\n  <\/script>\n<\/body>\n<\/html>", "Integrals_as_Area_Explorer": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Integrals as Area Explorer<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --good: #059669;\n      --warn: #dc2626;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n      min-height: 100vh;\n      overflow-x: hidden;\n    }\n\n    .container {\n      max-width: 1280px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      line-height: 1.6;\n      color: var(--muted);\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 360px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .canvas-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    .value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    select, input[type=\"range\"] {\n      width: 100%;\n    }\n\n    select {\n      padding: 10px 12px;\n      border-radius: 10px;\n      border: 1px solid var(--line);\n      background: white;\n      font-size: 15px;\n    }\n\n    input[type=\"range\"] {\n      cursor: pointer;\n    }\n\n    .formula-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      line-height: 1.7;\n      color: var(--muted);\n      margin-top: 10px;\n    }\n\n    .formula {\n      display: inline-block;\n      padding: 8px 10px;\n      background: #eef2ff;\n      border-radius: 10px;\n      color: #1e3a8a;\n      font-family: \"Courier New\", monospace;\n      margin: 6px 0;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 16px;\n    }\n\n    .stat {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    .status {\n      margin-top: 16px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      color: #0f172a;\n      line-height: 1.5;\n    }\n\n    .graph-wrap {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n    }\n\n    canvas {\n      width: 100%;\n      height: 520px;\n      display: block;\n      background: white;\n      border-radius: 12px;\n      border: 1px solid #e5e7eb;\n    }\n\n    .notes {\n      margin-top: 18px;\n      display: grid;\n      grid-template-columns: repeat(2, 1fr);\n      gap: 16px;\n    }\n\n    .note-box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 16px;\n    }\n\n    .note-box p, .note-box li {\n      line-height: 1.6;\n      color: var(--muted);\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 960px) {\n      .container { padding: 16px; }\n\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .notes {\n        grid-template-columns: 1fr;\n      }\n\n      canvas {\n        height: 420px;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Integrals as Area<\/h1>\n      <p>\n        Explore how a definite integral represents accumulated signed area under a curve.\n        Change the function, interval, method, and number of subintervals to see how the approximation improves.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"functionSelect\">Function<\/label>\n          <select id=\"functionSelect\">\n            <option value=\"x\">f(x) = x<\/option>\n            <option value=\"x2\" selected>f(x) = x²<\/option>\n            <option value=\"sin\">f(x) = sin(x)<\/option>\n            <option value=\"cos\">f(x) = cos(x)<\/option>\n            <option value=\"cubic\">f(x) = x³ - 3x<\/option>\n            <option value=\"gauss\">f(x) = e^(-x²/2)<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"aSlider\">\n            Lower bound a\n            <span class=\"value\" id=\"aValue\">-2.0<\/span>\n          <\/label>\n          <input type=\"range\" id=\"aSlider\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"-2\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"bSlider\">\n            Upper bound b\n            <span class=\"value\" id=\"bValue\">2.0<\/span>\n          <\/label>\n          <input type=\"range\" id=\"bSlider\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"2\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"nSlider\">\n            Number of subintervals\n            <span class=\"value\" id=\"nValue\">8<\/span>\n          <\/label>\n          <input type=\"range\" id=\"nSlider\" min=\"1\" max=\"60\" step=\"1\" value=\"8\" />\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"methodSelect\">Approximation method<\/label>\n          <select id=\"methodSelect\">\n            <option value=\"left\">Left Riemann Sum<\/option>\n            <option value=\"right\">Right Riemann Sum<\/option>\n            <option value=\"midpoint\" selected>Midpoint Rule<\/option>\n            <option value=\"trapezoid\">Trapezoidal Rule<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"formula-box\">\n          <h3>Key Idea<\/h3>\n          <div class=\"formula\">∫[a,b] f(x) dx<\/div><br>\n          <div class=\"formula\">Area above x-axis → positive<\/div><br>\n          <div class=\"formula\">Area below x-axis → negative<\/div><br>\n          <div class=\"formula\">Integral = signed accumulated area<\/div>\n        <\/div>\n\n        <div class=\"stats\">\n          <div class=\"stat\">\n            <small>Interval<\/small>\n            <strong id=\"intervalOut\">[-2.00, 2.00]<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Δx<\/small>\n            <strong id=\"dxOut\">0.50<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Approximate Integral<\/small>\n            <strong id=\"approxOut\">2.50<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Reference Integral<\/small>\n            <strong id=\"exactOut\">5.33<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Absolute Error<\/small>\n            <strong id=\"errorOut\">2.83<\/strong>\n          <\/div>\n          <div class=\"stat\">\n            <small>Method<\/small>\n            <strong id=\"methodOut\">Midpoint<\/strong>\n          <\/div>\n        <\/div>\n\n        <div class=\"status\" id=\"statusText\">\n          The colored region shows signed area. Green contributes positively and red contributes negatively.\n        <\/div>\n      <\/div>\n\n      <div class=\"canvas-panel\">\n        <h2>Graph and Area Visualization<\/h2>\n\n        <div class=\"graph-wrap\">\n          <canvas id=\"graphCanvas\" width=\"860\" height=\"520\"><\/canvas>\n        <\/div>\n\n        <div class=\"notes\">\n          <div class=\"note-box\">\n            <h3>What students should notice<\/h3>\n            <ul>\n              <li>As the number of subintervals increases, the approximation becomes more accurate.<\/li>\n              <li>Different numerical methods give different approximations for the same interval.<\/li>\n              <li>Area below the x-axis subtracts from the total integral.<\/li>\n            <\/ul>\n          <\/div>\n\n          <div class=\"note-box\">\n            <h3>Teaching idea<\/h3>\n            <p>\n              Let students predict whether the integral is positive, negative, or near zero before checking the value.\n              Then change the function and interval to compare the visual area with the numerical answer.\n            <\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based experiment for understanding definite integrals as area.\n    <\/div>\n  <\/div>\n\n  <script>\n    const functionSelect = document.getElementById(\"functionSelect\");\n    const aSlider = document.getElementById(\"aSlider\");\n    const bSlider = document.getElementById(\"bSlider\");\n    const nSlider = document.getElementById(\"nSlider\");\n    const methodSelect = document.getElementById(\"methodSelect\");\n\n    const aValue = document.getElementById(\"aValue\");\n    const bValue = document.getElementById(\"bValue\");\n    const nValue = document.getElementById(\"nValue\");\n\n    const intervalOut = document.getElementById(\"intervalOut\");\n    const dxOut = document.getElementById(\"dxOut\");\n    const approxOut = document.getElementById(\"approxOut\");\n    const exactOut = document.getElementById(\"exactOut\");\n    const errorOut = document.getElementById(\"errorOut\");\n    const methodOut = document.getElementById(\"methodOut\");\n    const statusText = document.getElementById(\"statusText\");\n\n    const canvas = document.getElementById(\"graphCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    function f(x) {\n      const type = functionSelect.value;\n      if (type === \"x\") return x;\n      if (type === \"x2\") return x * x;\n      if (type === \"sin\") return Math.sin(x);\n      if (type === \"cos\") return Math.cos(x);\n      if (type === \"cubic\") return x * x * x - 3 * x;\n      if (type === \"gauss\") return Math.exp(-(x * x) / 2);\n      return x * x;\n    }\n\n    function labelForFunction() {\n      const type = functionSelect.value;\n      if (type === \"x\") return \"f(x) = x\";\n      if (type === \"x2\") return \"f(x) = x²\";\n      if (type === \"sin\") return \"f(x) = sin(x)\";\n      if (type === \"cos\") return \"f(x) = cos(x)\";\n      if (type === \"cubic\") return \"f(x) = x³ - 3x\";\n      if (type === \"gauss\") return \"f(x) = e^(-x²/2)\";\n      return \"f(x)\";\n    }\n\n    function fmt(x) {\n      return Number(x).toFixed(2);\n    }\n\n    function integrateReference(a, b, steps = 4000) {\n      const dx = (b - a) / steps;\n      let sum = 0;\n      for (let i = 0; i < steps; i++) {\n        const x1 = a + i * dx;\n        const x2 = x1 + dx;\n        sum += 0.5 * (f(x1) + f(x2)) * dx;\n      }\n      return sum;\n    }\n\n    function approximateIntegral(a, b, n, method) {\n      const dx = (b - a) / n;\n      let sum = 0;\n\n      for (let i = 0; i < n; i++) {\n        const xL = a + i * dx;\n        const xR = xL + dx;\n\n        if (method === \"left\") {\n          sum += f(xL) * dx;\n        } else if (method === \"right\") {\n          sum += f(xR) * dx;\n        } else if (method === \"midpoint\") {\n          sum += f((xL + xR) / 2) * dx;\n        } else if (method === \"trapezoid\") {\n          sum += 0.5 * (f(xL) + f(xR)) * dx;\n        }\n      }\n\n      return sum;\n    }\n\n    function getYRange() {\n      let yMin = Infinity;\n      let yMax = -Infinity;\n\n      for (let x = -5; x <= 5; x += 0.02) {\n        const y = f(x);\n        if (y < yMin) yMin = y;\n        if (y > yMax) yMax = y;\n      }\n\n      yMin = Math.min(yMin, 0);\n      yMax = Math.max(yMax, 0);\n\n      const pad = Math.max(1, (yMax - yMin) * 0.15);\n      return { yMin: yMin - pad, yMax: yMax + pad };\n    }\n\n    function mapX(x, xMin, xMax, pad, w) {\n      return pad + ((x - xMin) / (xMax - xMin)) * (w - 2 * pad);\n    }\n\n    function mapY(y, yMin, yMax, pad, h) {\n      return h - pad - ((y - yMin) / (yMax - yMin)) * (h - 2 * pad);\n    }\n\n    function drawAxes(xMin, xMax, yMin, yMax, pad, w, h) {\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1;\n\n      for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {\n        const px = mapX(x, xMin, xMax, pad, w);\n        ctx.beginPath();\n        ctx.moveTo(px, pad);\n        ctx.lineTo(px, h - pad);\n        ctx.stroke();\n      }\n\n      const yStep = (yMax - yMin) / 8;\n      for (let i = 0; i <= 8; i++) {\n        const y = yMin + i * yStep;\n        const py = mapY(y, yMin, yMax, pad, h);\n        ctx.beginPath();\n        ctx.moveTo(pad, py);\n        ctx.lineTo(w - pad, py);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n\n      const xAxisY = mapY(0, yMin, yMax, pad, h);\n      const yAxisX = mapX(0, xMin, xMax, pad, w);\n\n      ctx.beginPath();\n      ctx.moveTo(pad, xAxisY);\n      ctx.lineTo(w - pad, xAxisY);\n      ctx.stroke();\n\n      ctx.beginPath();\n      ctx.moveTo(yAxisX, pad);\n      ctx.lineTo(yAxisX, h - pad);\n      ctx.stroke();\n\n      ctx.fillStyle = \"#374151\";\n      ctx.font = \"14px Arial\";\n\n      for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {\n        const px = mapX(x, xMin, xMax, pad, w);\n        ctx.fillText(x.toString(), px - 4, xAxisY + 18);\n      }\n\n      for (let i = 0; i <= 8; i++) {\n        const y = yMin + i * yStep;\n        const py = mapY(y, yMin, yMax, pad, h);\n        ctx.fillText(y.toFixed(1), 8, py + 4);\n      }\n    }\n\n    function drawFunction(xMin, xMax, yMin, yMax, pad, w, h) {\n      ctx.strokeStyle = \"#2563eb\";\n      ctx.lineWidth = 3;\n      ctx.beginPath();\n\n      let started = false;\n      for (let x = xMin; x <= xMax; x += 0.01) {\n        const y = f(x);\n        const px = mapX(x, xMin, xMax, pad, w);\n        const py = mapY(y, yMin, yMax, pad, h);\n\n        if (!started) {\n          ctx.moveTo(px, py);\n          started = true;\n        } else {\n          ctx.lineTo(px, py);\n        }\n      }\n      ctx.stroke();\n    }\n\n    function drawArea(a, b, xMin, xMax, yMin, yMax, pad, w, h) {\n      const steps = 400;\n      const dx = (b - a) / steps;\n\n      for (let i = 0; i < steps; i++) {\n        const x1 = a + i * dx;\n        const x2 = x1 + dx;\n        const xm = (x1 + x2) / 2;\n        const ym = f(xm);\n\n        const px1 = mapX(x1, xMin, xMax, pad, w);\n        const px2 = mapX(x2, xMin, xMax, pad, w);\n        const py0 = mapY(0, yMin, yMax, pad, h);\n        const py = mapY(ym, yMin, yMax, pad, h);\n\n        ctx.fillStyle = ym >= 0 ? \"rgba(5,150,105,0.28)\" : \"rgba(220,38,38,0.28)\";\n        ctx.fillRect(px1, Math.min(py, py0), px2 - px1, Math.abs(py0 - py));\n      }\n    }\n\n    function drawApproximation(a, b, n, method, xMin, xMax, yMin, yMax, pad, w, h) {\n      const dx = (b - a) / n;\n\n      ctx.lineWidth = 1.5;\n\n      for (let i = 0; i < n; i++) {\n        const xL = a + i * dx;\n        const xR = xL + dx;\n        let height;\n\n        if (method === \"left\") height = f(xL);\n        else if (method === \"right\") height = f(xR);\n        else if (method === \"midpoint\") height = f((xL + xR) / 2);\n        else height = null;\n\n        const pxL = mapX(xL, xMin, xMax, pad, w);\n        const pxR = mapX(xR, xMin, xMax, pad, w);\n        const py0 = mapY(0, yMin, yMax, pad, h);\n\n        if (method === \"trapezoid\") {\n          const y1 = f(xL);\n          const y2 = f(xR);\n          const py1 = mapY(y1, yMin, yMax, pad, h);\n          const py2 = mapY(y2, yMin, yMax, pad, h);\n\n          ctx.beginPath();\n          ctx.moveTo(pxL, py0);\n          ctx.lineTo(pxL, py1);\n          ctx.lineTo(pxR, py2);\n          ctx.lineTo(pxR, py0);\n          ctx.closePath();\n          ctx.fillStyle = \"rgba(37,99,235,0.14)\";\n          ctx.fill();\n          ctx.strokeStyle = \"rgba(37,99,235,0.7)\";\n          ctx.stroke();\n        } else {\n          const py = mapY(height, yMin, yMax, pad, h);\n          ctx.fillStyle = \"rgba(37,99,235,0.14)\";\n          ctx.fillRect(pxL, Math.min(py, py0), pxR - pxL, Math.abs(py0 - py));\n          ctx.strokeStyle = \"rgba(37,99,235,0.7)\";\n          ctx.strokeRect(pxL, Math.min(py, py0), pxR - pxL, Math.abs(py0 - py));\n        }\n      }\n    }\n\n    function drawBounds(a, b, xMin, xMax, yMin, yMax, pad, w, h) {\n      const pa = mapX(a, xMin, xMax, pad, w);\n      const pb = mapX(b, xMin, xMax, pad, w);\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.setLineDash([6, 6]);\n      ctx.beginPath();\n      ctx.moveTo(pa, pad);\n      ctx.lineTo(pa, h - pad);\n      ctx.stroke();\n\n      ctx.beginPath();\n      ctx.moveTo(pb, pad);\n      ctx.lineTo(pb, h - pad);\n      ctx.stroke();\n      ctx.setLineDash([]);\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"bold 14px Arial\";\n      ctx.fillText(\"a\", pa - 4, h - pad + 22);\n      ctx.fillText(\"b\", pb - 4, h - pad + 22);\n    }\n\n    function updateExplorer() {\n      let a = parseFloat(aSlider.value);\n      let b = parseFloat(bSlider.value);\n      const n = parseInt(nSlider.value, 10);\n      const method = methodSelect.value;\n\n      if (a > b) [a, b] = [b, a];\n\n      aValue.textContent = a.toFixed(1);\n      bValue.textContent = b.toFixed(1);\n      nValue.textContent = n;\n\n      const dx = (b - a) / n;\n      const approx = approximateIntegral(a, b, n, method);\n      const exact = integrateReference(a, b);\n      const error = Math.abs(approx - exact);\n\n      intervalOut.textContent = `[${fmt(a)}, ${fmt(b)}]`;\n      dxOut.textContent = fmt(dx);\n      approxOut.textContent = fmt(approx);\n      exactOut.textContent = fmt(exact);\n      errorOut.textContent = fmt(error);\n      methodOut.textContent = method === \"left\"\n        ? \"Left\"\n        : method === \"right\"\n        ? \"Right\"\n        : method === \"midpoint\"\n        ? \"Midpoint\"\n        : \"Trapezoid\";\n\n      statusText.textContent =\n        `For ${labelForFunction()} on [${fmt(a)}, ${fmt(b)}], the integral represents signed area. `\n        + `Positive regions add to the total, while negative regions subtract from it.`;\n\n      drawScene(a, b, n, method);\n    }\n\n    function drawScene(a, b, n, method) {\n      const w = canvas.width;\n      const h = canvas.height;\n      const pad = 55;\n      const xMin = -5;\n      const xMax = 5;\n      const { yMin, yMax } = getYRange();\n\n      ctx.clearRect(0, 0, w, h);\n\n      drawAxes(xMin, xMax, yMin, yMax, pad, w, h);\n      drawArea(a, b, xMin, xMax, yMin, yMax, pad, w, h);\n      drawApproximation(a, b, n, method, xMin, xMax, yMin, yMax, pad, w, h);\n      drawFunction(xMin, xMax, yMin, yMax, pad, w, h);\n      drawBounds(a, b, xMin, xMax, yMin, yMax, pad, w, h);\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"bold 18px Arial\";\n      ctx.fillText(labelForFunction(), 70, 30);\n    }\n\n    function bindEvents() {\n      functionSelect.addEventListener(\"change\", updateExplorer);\n      aSlider.addEventListener(\"input\", updateExplorer);\n      bSlider.addEventListener(\"input\", updateExplorer);\n      nSlider.addEventListener(\"input\", updateExplorer);\n      methodSelect.addEventListener(\"change\", updateExplorer);\n    }\n\n    bindEvents();\n    updateExplorer();\n  <\/script>\n<\/body>\n<\/html>", "linear_regression_simulator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Linear Regression Simulator<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --point: #dc2626;\n      --fit: #059669;\n      --error: #f59e0b;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n    }\n\n    .container {\n      max-width: 1450px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 420px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    input, button {\n      font: inherit;\n    }\n\n    input[type=\"range\"],\n    input[type=\"number\"] {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n    }\n\n    .range-row {\n      display: grid;\n      grid-template-columns: 1fr 72px;\n      gap: 10px;\n      align-items: center;\n    }\n\n    .value-box {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      text-align: center;\n      padding: 10px 6px;\n      font-weight: bold;\n      color: var(--accent);\n    }\n\n    .box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .btn-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n    }\n\n    button {\n      padding: 10px 14px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      cursor: pointer;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      border-color: var(--accent);\n      color: var(--accent);\n    }\n\n    .primary {\n      background: var(--accent);\n      color: white;\n      border-color: var(--accent);\n    }\n\n    .primary:hover {\n      opacity: 0.92;\n      color: white;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n      cursor: grab;\n    }\n\n    canvas.dragging {\n      cursor: grabbing;\n    }\n\n    #regressionCanvas {\n      height: 560px;\n    }\n\n    .legend {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 16px;\n      margin-top: 12px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .legend-item {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .line-swatch, .dot-swatch {\n      display: inline-block;\n    }\n\n    .dot-swatch {\n      width: 14px;\n      height: 14px;\n      border-radius: 50%;\n    }\n\n    .line-swatch {\n      width: 22px;\n      height: 0;\n      border-top: 3px solid;\n    }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border-radius: 12px;\n      overflow: hidden;\n    }\n\n    th, td {\n      border-bottom: 1px solid #e5e7eb;\n      padding: 10px;\n      text-align: center;\n      font-size: 14px;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 1100px) {\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .stats {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>Linear Regression<\/h1>\n      <p>\n        Generate noisy data from a line, drag the points, and observe how the best-fit line,\n        prediction errors, and MSE change.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"pointCount\">Number of points<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"pointCount\" min=\"3\" max=\"30\" value=\"12\" />\n            <div class=\"value-box\" id=\"pointCountValue\">12<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"slopeSlider\">Slope<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"slopeSlider\" min=\"-5\" max=\"5\" step=\"0.1\" value=\"1.5\" />\n            <div class=\"value-box\" id=\"slopeValue\">1.5<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"interceptSlider\">Intercept<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"interceptSlider\" min=\"-20\" max=\"20\" step=\"0.5\" value=\"8\" />\n            <div class=\"value-box\" id=\"interceptValue\">8<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"noiseSlider\">Noise level<\/label>\n          <div class=\"range-row\">\n            <input type=\"range\" id=\"noiseSlider\" min=\"0\" max=\"20\" step=\"0.5\" value=\"4\" />\n            <div class=\"value-box\" id=\"noiseValue\">4<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <div class=\"btn-row\">\n            <button class=\"primary\" id=\"generateBtn\">Generate Data<\/button>\n            <button id=\"addPointBtn\">Add Random Point<\/button>\n            <button id=\"clearBtn\">Clear Points<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>How to use<\/h3>\n          <ul style=\"margin:0; padding-left:20px; color:var(--muted); line-height:1.6;\">\n            <li>Change slope, intercept, and noise, then generate data.<\/li>\n            <li>Drag points on the graph to manually change the dataset.<\/li>\n            <li>The green line is the best-fit regression line.<\/li>\n            <li>The orange vertical segments show prediction errors.<\/li>\n          <\/ul>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>Model status<\/h3>\n          <div class=\"status\" id=\"statusText\">\n            Generate data to see the scatter plot, best-fit line, and residual errors.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"box\">\n          <h2>Scatter Plot and Best-Fit Line<\/h2>\n          <canvas id=\"regressionCanvas\" width=\"980\" height=\"560\"><\/canvas>\n\n          <div class=\"legend\">\n            <div class=\"legend-item\"><span class=\"dot-swatch\" style=\"background:#dc2626;\"><\/span> Data points<\/div>\n            <div class=\"legend-item\"><span class=\"line-swatch\" style=\"border-color:#059669;\"><\/span> Best-fit line<\/div>\n            <div class=\"legend-item\"><span class=\"line-swatch\" style=\"border-color:#f59e0b;\"><\/span> Prediction error<\/div>\n          <\/div>\n\n          <div class=\"stats\">\n            <div class=\"stat\">\n              <small>Fitted slope<\/small>\n              <strong id=\"fittedSlopeOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Fitted intercept<\/small>\n              <strong id=\"fittedInterceptOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>MSE<\/small>\n              <strong id=\"mseOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Points<\/small>\n              <strong id=\"pointCountOut\">0<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h2>Prediction Errors<\/h2>\n          <table>\n            <thead>\n              <tr>\n                <th>Point<\/th>\n                <th>x<\/th>\n                <th>Actual y<\/th>\n                <th>Predicted y<\/th>\n                <th>Error<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"errorsBody\"><\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"box notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>The best-fit line minimizes the average squared prediction error.<\/li>\n            <li>More noise usually increases the MSE and makes the fitted line less exact.<\/li>\n            <li>Dragging one point far away can noticeably change the regression line.<\/li>\n            <li>Residuals show how far each point is from the model prediction.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding linear regression.\n    <\/div>\n  <\/div>\n\n  <script>\n    const canvas = document.getElementById(\"regressionCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    const pointCountSlider = document.getElementById(\"pointCount\");\n    const slopeSlider = document.getElementById(\"slopeSlider\");\n    const interceptSlider = document.getElementById(\"interceptSlider\");\n    const noiseSlider = document.getElementById(\"noiseSlider\");\n\n    const pointCountValue = document.getElementById(\"pointCountValue\");\n    const slopeValue = document.getElementById(\"slopeValue\");\n    const interceptValue = document.getElementById(\"interceptValue\");\n    const noiseValue = document.getElementById(\"noiseValue\");\n\n    const generateBtn = document.getElementById(\"generateBtn\");\n    const addPointBtn = document.getElementById(\"addPointBtn\");\n    const clearBtn = document.getElementById(\"clearBtn\");\n\n    const fittedSlopeOut = document.getElementById(\"fittedSlopeOut\");\n    const fittedInterceptOut = document.getElementById(\"fittedInterceptOut\");\n    const mseOut = document.getElementById(\"mseOut\");\n    const pointCountOut = document.getElementById(\"pointCountOut\");\n    const errorsBody = document.getElementById(\"errorsBody\");\n    const statusText = document.getElementById(\"statusText\");\n\n    let points = [];\n    let draggingIndex = -1;\n\n    const plotPadding = 50;\n\n    function updateControlLabels() {\n      pointCountValue.textContent = pointCountSlider.value;\n      slopeValue.textContent = slopeSlider.value;\n      interceptValue.textContent = interceptSlider.value;\n      noiseValue.textContent = noiseSlider.value;\n    }\n\n    function randBetween(min, max) {\n      return min + Math.random() * (max - min);\n    }\n\n    function gaussianNoise(scale) {\n      let u = 0, v = 0;\n      while (u === 0) u = Math.random();\n      while (v === 0) v = Math.random();\n      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * scale;\n    }\n\n    function generateData() {\n      const n = Number(pointCountSlider.value);\n      const slope = Number(slopeSlider.value);\n      const intercept = Number(interceptSlider.value);\n      const noise = Number(noiseSlider.value);\n\n      points = [];\n      for (let i = 0; i < n; i++) {\n        const x = randBetween(0, 10);\n        const y = slope * x + intercept + gaussianNoise(noise);\n        points.push({ x, y });\n      }\n\n      draw();\n    }\n\n    function addRandomPoint() {\n      const slope = Number(slopeSlider.value);\n      const intercept = Number(interceptSlider.value);\n      const noise = Number(noiseSlider.value);\n      const x = randBetween(0, 10);\n      const y = slope * x + intercept + gaussianNoise(noise);\n      points.push({ x, y });\n      draw();\n    }\n\n    function clearPoints() {\n      points = [];\n      draw();\n    }\n\n    function getBounds() {\n      if (points.length === 0) {\n        return { minX: 0, maxX: 10, minY: 0, maxY: 10 };\n      }\n\n      const xs = points.map(p => p.x);\n      const ys = points.map(p => p.y);\n\n      let minX = Math.min(...xs);\n      let maxX = Math.max(...xs);\n      let minY = Math.min(...ys);\n      let maxY = Math.max(...ys);\n\n      if (minX === maxX) { minX -= 1; maxX += 1; }\n      if (minY === maxY) { minY -= 1; maxY += 1; }\n\n      const padX = (maxX - minX) * 0.15;\n      const padY = (maxY - minY) * 0.15;\n\n      return {\n        minX: minX - padX,\n        maxX: maxX + padX,\n        minY: minY - padY,\n        maxY: maxY + padY\n      };\n    }\n\n    function toCanvasCoords(x, y, bounds) {\n      const plotW = canvas.width - plotPadding * 2;\n      const plotH = canvas.height - plotPadding * 2;\n\n      const cx = plotPadding + ((x - bounds.minX) / (bounds.maxX - bounds.minX)) * plotW;\n      const cy = canvas.height - plotPadding - ((y - bounds.minY) / (bounds.maxY - bounds.minY)) * plotH;\n\n      return { x: cx, y: cy };\n    }\n\n    function toDataCoords(cx, cy, bounds) {\n      const plotW = canvas.width - plotPadding * 2;\n      const plotH = canvas.height - plotPadding * 2;\n\n      const x = bounds.minX + ((cx - plotPadding) / plotW) * (bounds.maxX - bounds.minX);\n      const y = bounds.minY + ((canvas.height - plotPadding - cy) / plotH) * (bounds.maxY - bounds.minY);\n\n      return { x, y };\n    }\n\n    function fitLine(data) {\n      const n = data.length;\n      if (n < 2) return null;\n\n      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;\n      data.forEach(p => {\n        sumX += p.x;\n        sumY += p.y;\n        sumXY += p.x * p.y;\n        sumX2 += p.x * p.x;\n      });\n\n      const denominator = n * sumX2 - sumX * sumX;\n      if (Math.abs(denominator) < 1e-12) {\n        return { slope: 0, intercept: sumY / n };\n      }\n\n      const slope = (n * sumXY - sumX * sumY) / denominator;\n      const intercept = (sumY - slope * sumX) / n;\n      return { slope, intercept };\n    }\n\n    function computeMSE(data, model) {\n      if (!model || data.length === 0) return 0;\n      const sum = data.reduce((acc, p) => {\n        const pred = model.slope * p.x + model.intercept;\n        return acc + (p.y - pred) ** 2;\n      }, 0);\n      return sum / data.length;\n    }\n\n    function drawAxes(bounds) {\n      const plotW = canvas.width - plotPadding * 2;\n      const plotH = canvas.height - plotPadding * 2;\n\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= 10; i++) {\n        const x = plotPadding + (plotW / 10) * i;\n        const y = plotPadding + (plotH / 10) * i;\n\n        ctx.beginPath();\n        ctx.moveTo(x, plotPadding);\n        ctx.lineTo(x, canvas.height - plotPadding);\n        ctx.stroke();\n\n        ctx.beginPath();\n        ctx.moveTo(plotPadding, y);\n        ctx.lineTo(canvas.width - plotPadding, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(plotPadding, plotPadding);\n      ctx.lineTo(plotPadding, canvas.height - plotPadding);\n      ctx.lineTo(canvas.width - plotPadding, canvas.height - plotPadding);\n      ctx.stroke();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"13px Arial\";\n\n      for (let i = 0; i <= 10; i++) {\n        const xVal = bounds.minX + ((bounds.maxX - bounds.minX) / 10) * i;\n        const yVal = bounds.minY + ((bounds.maxY - bounds.minY) / 10) * (10 - i);\n\n        const x = plotPadding + (plotW / 10) * i;\n        const y = plotPadding + (plotH / 10) * i;\n\n        ctx.fillText(xVal.toFixed(1), x - 12, canvas.height - plotPadding + 20);\n        ctx.fillText(yVal.toFixed(1), 4, y + 4);\n      }\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"x\", canvas.width / 2, canvas.height - 10);\n\n      ctx.save();\n      ctx.translate(18, canvas.height / 2);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(\"y\", 0, 0);\n      ctx.restore();\n    }\n\n    function drawBestFitLine(bounds, model) {\n      if (!model) return;\n\n      const x1 = bounds.minX;\n      const y1 = model.slope * x1 + model.intercept;\n      const x2 = bounds.maxX;\n      const y2 = model.slope * x2 + model.intercept;\n\n      const p1 = toCanvasCoords(x1, y1, bounds);\n      const p2 = toCanvasCoords(x2, y2, bounds);\n\n      ctx.beginPath();\n      ctx.moveTo(p1.x, p1.y);\n      ctx.lineTo(p2.x, p2.y);\n      ctx.strokeStyle = \"#059669\";\n      ctx.lineWidth = 3;\n      ctx.stroke();\n    }\n\n    function drawResiduals(bounds, model) {\n      if (!model) return;\n\n      points.forEach(p => {\n        const predY = model.slope * p.x + model.intercept;\n        const actual = toCanvasCoords(p.x, p.y, bounds);\n        const predicted = toCanvasCoords(p.x, predY, bounds);\n\n        ctx.beginPath();\n        ctx.moveTo(actual.x, actual.y);\n        ctx.lineTo(predicted.x, predicted.y);\n        ctx.strokeStyle = \"#f59e0b\";\n        ctx.lineWidth = 2;\n        ctx.stroke();\n      });\n    }\n\n    function drawPoints(bounds) {\n      points.forEach((p, i) => {\n        const cp = toCanvasCoords(p.x, p.y, bounds);\n        ctx.beginPath();\n        ctx.arc(cp.x, cp.y, 7, 0, Math.PI * 2);\n        ctx.fillStyle = \"#dc2626\";\n        ctx.fill();\n        ctx.lineWidth = 2;\n        ctx.strokeStyle = \"#ffffff\";\n        ctx.stroke();\n\n        ctx.fillStyle = \"#111827\";\n        ctx.font = \"12px Arial\";\n        ctx.fillText(`P${i + 1}`, cp.x + 9, cp.y - 9);\n      });\n    }\n\n    function updateTable(model) {\n      errorsBody.innerHTML = \"\";\n\n      if (!model || points.length === 0) return;\n\n      points.forEach((p, i) => {\n        const pred = model.slope * p.x + model.intercept;\n        const error = p.y - pred;\n\n        const tr = document.createElement(\"tr\");\n        tr.innerHTML = `\n          <td>P${i + 1}<\/td>\n          <td>${p.x.toFixed(2)}<\/td>\n          <td>${p.y.toFixed(2)}<\/td>\n          <td>${pred.toFixed(2)}<\/td>\n          <td>${error.toFixed(2)}<\/td>\n        `;\n        errorsBody.appendChild(tr);\n      });\n    }\n\n    function updateOutputs(model, mse) {\n      pointCountOut.textContent = points.length;\n\n      if (!model || points.length < 2) {\n        fittedSlopeOut.textContent = \"-\";\n        fittedInterceptOut.textContent = \"-\";\n        mseOut.textContent = \"-\";\n        statusText.textContent = \"Add at least two points to fit a regression line.\";\n        updateTable(null);\n        return;\n      }\n\n      fittedSlopeOut.textContent = model.slope.toFixed(3);\n      fittedInterceptOut.textContent = model.intercept.toFixed(3);\n      mseOut.textContent = mse.toFixed(3);\n      statusText.textContent = \"The green line is the least-squares best-fit line. Orange segments show prediction error for each point.\";\n      updateTable(model);\n    }\n\n    function draw() {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n      const bounds = getBounds();\n      const model = fitLine(points);\n      const mse = computeMSE(points, model);\n\n      drawAxes(bounds);\n      drawResiduals(bounds, model);\n      drawBestFitLine(bounds, model);\n      drawPoints(bounds);\n      updateOutputs(model, mse);\n    }\n\n    function getMousePos(evt) {\n      const rect = canvas.getBoundingClientRect();\n      const scaleX = canvas.width / rect.width;\n      const scaleY = canvas.height / rect.height;\n      return {\n        x: (evt.clientX - rect.left) * scaleX,\n        y: (evt.clientY - rect.top) * scaleY\n      };\n    }\n\n    function findPointAtCanvasPos(mx, my) {\n      const bounds = getBounds();\n      for (let i = points.length - 1; i >= 0; i--) {\n        const cp = toCanvasCoords(points[i].x, points[i].y, bounds);\n        const d = Math.hypot(mx - cp.x, my - cp.y);\n        if (d <= 10) return i;\n      }\n      return -1;\n    }\n\n    canvas.addEventListener(\"mousedown\", (e) => {\n      const pos = getMousePos(e);\n      draggingIndex = findPointAtCanvasPos(pos.x, pos.y);\n      if (draggingIndex !== -1) {\n        canvas.classList.add(\"dragging\");\n      }\n    });\n\n    canvas.addEventListener(\"mousemove\", (e) => {\n      if (draggingIndex === -1) return;\n\n      const bounds = getBounds();\n      const pos = getMousePos(e);\n\n      const clampedX = Math.max(plotPadding, Math.min(canvas.width - plotPadding, pos.x));\n      const clampedY = Math.max(plotPadding, Math.min(canvas.height - plotPadding, pos.y));\n\n      const dataPos = toDataCoords(clampedX, clampedY, bounds);\n      points[draggingIndex].x = dataPos.x;\n      points[draggingIndex].y = dataPos.y;\n      draw();\n    });\n\n    window.addEventListener(\"mouseup\", () => {\n      draggingIndex = -1;\n      canvas.classList.remove(\"dragging\");\n    });\n\n    pointCountSlider.addEventListener(\"input\", updateControlLabels);\n    slopeSlider.addEventListener(\"input\", updateControlLabels);\n    interceptSlider.addEventListener(\"input\", updateControlLabels);\n    noiseSlider.addEventListener(\"input\", updateControlLabels);\n\n    generateBtn.addEventListener(\"click\", generateData);\n    addPointBtn.addEventListener(\"click\", addRandomPoint);\n    clearBtn.addEventListener(\"click\", clearPoints);\n\n    updateControlLabels();\n    generateData();\n  <\/script>\n<\/body>\n<\/html>", "knn_simulator": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>K-Nearest Neighbors Simulator<\/title>\n  <style>\n    :root {\n      --bg: #f4f7fb;\n      --panel: #ffffff;\n      --text: #1f2937;\n      --muted: #6b7280;\n      --line: #d1d5db;\n      --accent: #2563eb;\n      --classA: #dc2626;\n      --classB: #2563eb;\n      --good: #059669;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: Arial, Helvetica, sans-serif;\n      background: var(--bg);\n      color: var(--text);\n    }\n\n    .container {\n      max-width: 1450px;\n      margin: 0 auto;\n      padding: 24px;\n    }\n\n    .hero {\n      background: linear-gradient(135deg, #eef4ff, #ffffff);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 24px;\n      margin-bottom: 20px;\n    }\n\n    .hero h1 {\n      margin: 0 0 10px;\n    }\n\n    .hero p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 400px 1fr;\n      gap: 20px;\n    }\n\n    .panel, .main-panel {\n      background: var(--panel);\n      border: 1px solid var(--line);\n      border-radius: 18px;\n      padding: 18px;\n      box-shadow: 0 8px 24px rgba(0,0,0,0.05);\n    }\n\n    h2, h3 {\n      margin-top: 0;\n    }\n\n    .group {\n      margin-bottom: 18px;\n    }\n\n    label {\n      display: block;\n      font-weight: bold;\n      margin-bottom: 8px;\n    }\n\n    input, select, button {\n      font: inherit;\n    }\n\n    select,\n    input[type=\"number\"],\n    input[type=\"range\"] {\n      width: 100%;\n      padding: 10px 12px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n    }\n\n    .range-value {\n      color: var(--accent);\n      font-weight: bold;\n      margin-left: 8px;\n    }\n\n    .box {\n      background: #f9fafb;\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 14px;\n      margin-bottom: 18px;\n    }\n\n    .btn-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n    }\n\n    button {\n      padding: 10px 14px;\n      border: 1px solid var(--line);\n      border-radius: 10px;\n      background: white;\n      cursor: pointer;\n      transition: 0.2s ease;\n    }\n\n    button:hover {\n      border-color: var(--accent);\n      color: var(--accent);\n    }\n\n    .primary {\n      background: var(--accent);\n      color: white;\n      border-color: var(--accent);\n    }\n\n    .primary:hover {\n      opacity: 0.92;\n      color: white;\n    }\n\n    .status {\n      margin-top: 10px;\n      padding: 14px;\n      border-radius: 12px;\n      font-weight: bold;\n      background: #ecfeff;\n      border: 1px solid #a5f3fc;\n      line-height: 1.5;\n    }\n\n    .stats {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(120px, 1fr));\n      gap: 12px;\n      margin-top: 14px;\n    }\n\n    .stat {\n      background: white;\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 12px;\n    }\n\n    .stat small {\n      display: block;\n      color: var(--muted);\n      margin-bottom: 6px;\n    }\n\n    .stat strong {\n      font-size: 18px;\n    }\n\n    canvas {\n      width: 100%;\n      display: block;\n      background: white;\n      border: 1px solid #e5e7eb;\n      border-radius: 12px;\n      cursor: crosshair;\n    }\n\n    #knnCanvas {\n      height: 560px;\n    }\n\n    .legend {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 16px;\n      margin-top: 12px;\n      color: var(--muted);\n      font-size: 14px;\n    }\n\n    .legend-item {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .swatch {\n      width: 14px;\n      height: 14px;\n      border-radius: 50%;\n      border: 1px solid rgba(0,0,0,0.08);\n    }\n\n    .swatch-a { background: var(--classA); }\n    .swatch-b { background: var(--classB); }\n    .swatch-q { background: #111827; }\n    .swatch-n { background: #f59e0b; }\n\n    table {\n      width: 100%;\n      border-collapse: collapse;\n      background: white;\n      border-radius: 12px;\n      overflow: hidden;\n    }\n\n    th, td {\n      border-bottom: 1px solid #e5e7eb;\n      padding: 10px;\n      text-align: center;\n      font-size: 14px;\n    }\n\n    th {\n      background: #eef2ff;\n      color: #1e3a8a;\n    }\n\n    .notes-wrap p, .notes-wrap li {\n      color: var(--muted);\n      line-height: 1.6;\n    }\n\n    .footer {\n      margin-top: 22px;\n      color: var(--muted);\n      font-size: 14px;\n      text-align: center;\n    }\n\n    @media (max-width: 1050px) {\n      .layout {\n        grid-template-columns: 1fr;\n      }\n\n      .stats {\n        grid-template-columns: 1fr 1fr;\n      }\n    }\n\n    @media (max-width: 640px) {\n      .stats {\n        grid-template-columns: 1fr;\n      }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"container\">\n    <div class=\"hero\">\n      <h1>K-Nearest Neighbors<\/h1>\n      <p>\n        Place training points on the graph, choose a query point, and explore how the value of k changes\n        the nearest neighbors, predicted class, and decision regions.\n      <\/p>\n    <\/div>\n\n    <div class=\"layout\">\n      <div class=\"panel\">\n        <h2>Controls<\/h2>\n\n        <div class=\"group\">\n          <label for=\"modeSelect\">Click mode<\/label>\n          <select id=\"modeSelect\">\n            <option value=\"add\">Add training point<\/option>\n            <option value=\"query\">Place query point<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"classSelect\">Training point class<\/label>\n          <select id=\"classSelect\">\n            <option value=\"A\">Class A<\/option>\n            <option value=\"B\">Class B<\/option>\n          <\/select>\n        <\/div>\n\n        <div class=\"group\">\n          <label for=\"kSlider\">\n            Number of neighbors (k)\n            <span class=\"range-value\" id=\"kValue\">3<\/span>\n          <\/label>\n          <input type=\"range\" id=\"kSlider\" min=\"1\" max=\"9\" step=\"1\" value=\"3\" />\n        <\/div>\n\n        <div class=\"box\">\n          <div class=\"btn-row\">\n            <button class=\"primary\" id=\"sampleBtn\">Load Sample<\/button>\n            <button id=\"undoBtn\">Undo Last Point<\/button>\n            <button id=\"clearBtn\">Clear All<\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>How to use<\/h3>\n          <ul style=\"margin:0; padding-left:20px; color:var(--muted); line-height:1.6;\">\n            <li>Choose <strong>Add training point<\/strong> and click the graph.<\/li>\n            <li>Select Class A or Class B before placing points.<\/li>\n            <li>Switch to <strong>Place query point<\/strong> and click to test a prediction.<\/li>\n            <li>Move the k slider to see how the prediction and regions change.<\/li>\n          <\/ul>\n        <\/div>\n\n        <div class=\"box\">\n          <h3>Model status<\/h3>\n          <div class=\"status\" id=\"statusText\">\n            Add some training points, then place a query point to classify it.\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"main-panel\">\n        <div class=\"box\">\n          <h2>Decision Regions and Points<\/h2>\n          <canvas id=\"knnCanvas\" width=\"980\" height=\"560\"><\/canvas>\n\n          <div class=\"legend\">\n            <div class=\"legend-item\"><span class=\"swatch swatch-a\"><\/span> Class A<\/div>\n            <div class=\"legend-item\"><span class=\"swatch swatch-b\"><\/span> Class B<\/div>\n            <div class=\"legend-item\"><span class=\"swatch swatch-q\"><\/span> Query point<\/div>\n            <div class=\"legend-item\"><span class=\"swatch swatch-n\"><\/span> Nearest neighbors<\/div>\n          <\/div>\n\n          <div class=\"stats\">\n            <div class=\"stat\">\n              <small>Predicted class<\/small>\n              <strong id=\"predictedClassOut\">-<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Nearest neighbors used<\/small>\n              <strong id=\"neighborsUsedOut\">0<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Class A points<\/small>\n              <strong id=\"classACountOut\">0<\/strong>\n            <\/div>\n            <div class=\"stat\">\n              <small>Class B points<\/small>\n              <strong id=\"classBCountOut\">0<\/strong>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"box\">\n          <h2>Nearest Neighbors<\/h2>\n          <table>\n            <thead>\n              <tr>\n                <th>#<\/th>\n                <th>Point<\/th>\n                <th>Class<\/th>\n                <th>Distance to Query<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody id=\"neighborsBody\"><\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"box notes-wrap\">\n          <h3>What students should notice<\/h3>\n          <ul>\n            <li>A smaller k makes the model more sensitive to nearby individual points.<\/li>\n            <li>A larger k makes the model smoother and less sensitive to local noise.<\/li>\n            <li>The decision regions change shape depending on the training data and k value.<\/li>\n            <li>The predicted class is based on the majority class among the nearest neighbors.<\/li>\n          <\/ul>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"footer\">\n      Interactive browser-based simulation for understanding K-Nearest Neighbors classification.\n    <\/div>\n  <\/div>\n\n  <script>\n    const canvas = document.getElementById(\"knnCanvas\");\n    const ctx = canvas.getContext(\"2d\");\n\n    const modeSelect = document.getElementById(\"modeSelect\");\n    const classSelect = document.getElementById(\"classSelect\");\n    const kSlider = document.getElementById(\"kSlider\");\n    const kValue = document.getElementById(\"kValue\");\n\n    const sampleBtn = document.getElementById(\"sampleBtn\");\n    const undoBtn = document.getElementById(\"undoBtn\");\n    const clearBtn = document.getElementById(\"clearBtn\");\n\n    const predictedClassOut = document.getElementById(\"predictedClassOut\");\n    const neighborsUsedOut = document.getElementById(\"neighborsUsedOut\");\n    const classACountOut = document.getElementById(\"classACountOut\");\n    const classBCountOut = document.getElementById(\"classBCountOut\");\n    const neighborsBody = document.getElementById(\"neighborsBody\");\n    const statusText = document.getElementById(\"statusText\");\n\n    let trainingPoints = [];\n    let queryPoint = null;\n\n    const padding = 42;\n    const pointRadius = 8;\n    const gridStep = 18;\n\n    function getPlotBounds() {\n      return {\n        left: padding,\n        right: canvas.width - padding,\n        top: padding,\n        bottom: canvas.height - padding,\n        width: canvas.width - padding * 2,\n        height: canvas.height - padding * 2\n      };\n    }\n\n    function clampToPlot(x, y) {\n      const b = getPlotBounds();\n      return {\n        x: Math.max(b.left, Math.min(b.right, x)),\n        y: Math.max(b.top, Math.min(b.bottom, y))\n      };\n    }\n\n    function distance(a, b) {\n      return Math.hypot(a.x - b.x, a.y - b.y);\n    }\n\n    function getK() {\n      return Math.max(1, Number(kSlider.value));\n    }\n\n    function getNearestNeighbors(q) {\n      const sorted = trainingPoints\n        .map((p, index) => ({\n          ...p,\n          index: index + 1,\n          dist: distance(q, p)\n        }))\n        .sort((a, b) => a.dist - b.dist);\n\n      return sorted.slice(0, Math.min(getK(), sorted.length));\n    }\n\n    function predictClass(q) {\n      if (!q || trainingPoints.length === 0) {\n        return null;\n      }\n\n      const neighbors = getNearestNeighbors(q);\n      let countA = 0;\n      let countB = 0;\n      let distA = 0;\n      let distB = 0;\n\n      neighbors.forEach(n => {\n        if (n.class === \"A\") {\n          countA++;\n          distA += n.dist;\n        } else {\n          countB++;\n          distB += n.dist;\n        }\n      });\n\n      if (countA > countB) return { class: \"A\", neighbors };\n      if (countB > countA) return { class: \"B\", neighbors };\n\n      return { class: distA <= distB ? \"A\" : \"B\", neighbors };\n    }\n\n    function drawBackgroundRegions() {\n      if (trainingPoints.length === 0) return;\n\n      const b = getPlotBounds();\n\n      for (let x = b.left; x < b.right; x += gridStep) {\n        for (let y = b.top; y < b.bottom; y += gridStep) {\n          const center = { x: x + gridStep / 2, y: y + gridStep / 2 };\n          const result = predictClass(center);\n          if (!result) continue;\n\n          ctx.fillStyle = result.class === \"A\"\n            ? \"rgba(220, 38, 38, 0.10)\"\n            : \"rgba(37, 99, 235, 0.10)\";\n          ctx.fillRect(x, y, gridStep, gridStep);\n        }\n      }\n    }\n\n    function drawAxes() {\n      const b = getPlotBounds();\n\n      ctx.strokeStyle = \"#d1d5db\";\n      ctx.lineWidth = 1;\n\n      for (let i = 0; i <= 10; i++) {\n        const x = b.left + (b.width / 10) * i;\n        const y = b.top + (b.height / 10) * i;\n\n        ctx.beginPath();\n        ctx.moveTo(x, b.top);\n        ctx.lineTo(x, b.bottom);\n        ctx.stroke();\n\n        ctx.beginPath();\n        ctx.moveTo(b.left, y);\n        ctx.lineTo(b.right, y);\n        ctx.stroke();\n      }\n\n      ctx.strokeStyle = \"#111827\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(b.left, b.top);\n      ctx.lineTo(b.left, b.bottom);\n      ctx.lineTo(b.right, b.bottom);\n      ctx.stroke();\n\n      ctx.fillStyle = \"#6b7280\";\n      ctx.font = \"13px Arial\";\n\n      for (let i = 0; i <= 10; i++) {\n        const x = b.left + (b.width / 10) * i;\n        const y = b.bottom - (b.height / 10) * i;\n        ctx.fillText(String(i * 10), x - 8, b.bottom + 20);\n        if (i < 10) {\n          ctx.fillText(String(i * 10), b.left - 28, y + 4);\n        }\n      }\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"16px Arial\";\n      ctx.fillText(\"Feature 1\", b.left + b.width / 2 - 30, canvas.height - 8);\n\n      ctx.save();\n      ctx.translate(16, b.top + b.height / 2 + 30);\n      ctx.rotate(-Math.PI / 2);\n      ctx.fillText(\"Feature 2\", 0, 0);\n      ctx.restore();\n    }\n\n    function drawTrainingPoints() {\n      trainingPoints.forEach((p, index) => {\n        ctx.beginPath();\n        ctx.arc(p.x, p.y, pointRadius, 0, Math.PI * 2);\n        ctx.fillStyle = p.class === \"A\" ? \"#dc2626\" : \"#2563eb\";\n        ctx.fill();\n\n        ctx.lineWidth = 2;\n        ctx.strokeStyle = \"#ffffff\";\n        ctx.stroke();\n\n        ctx.fillStyle = \"#111827\";\n        ctx.font = \"12px Arial\";\n        ctx.fillText(`P${index + 1}`, p.x + 10, p.y - 10);\n      });\n    }\n\n    function drawQueryAndNeighbors() {\n      if (!queryPoint) return;\n\n      const result = predictClass(queryPoint);\n      if (!result) return;\n\n      const neighbors = result.neighbors;\n\n      neighbors.forEach(n => {\n        ctx.beginPath();\n        ctx.moveTo(queryPoint.x, queryPoint.y);\n        ctx.lineTo(n.x, n.y);\n        ctx.strokeStyle = \"rgba(245, 158, 11, 0.9)\";\n        ctx.lineWidth = 2;\n        ctx.stroke();\n\n        ctx.beginPath();\n        ctx.arc(n.x, n.y, pointRadius + 6, 0, Math.PI * 2);\n        ctx.strokeStyle = \"#f59e0b\";\n        ctx.lineWidth = 3;\n        ctx.stroke();\n      });\n\n      ctx.beginPath();\n      ctx.arc(queryPoint.x, queryPoint.y, 10, 0, Math.PI * 2);\n      ctx.fillStyle = \"#111827\";\n      ctx.fill();\n      ctx.lineWidth = 3;\n      ctx.strokeStyle = \"#ffffff\";\n      ctx.stroke();\n\n      ctx.fillStyle = \"#111827\";\n      ctx.font = \"13px Arial\";\n      ctx.fillText(\"Query\", queryPoint.x + 12, queryPoint.y + 4);\n    }\n\n    function updateOutputs() {\n      const countA = trainingPoints.filter(p => p.class === \"A\").length;\n      const countB = trainingPoints.filter(p => p.class === \"B\").length;\n      classACountOut.textContent = countA;\n      classBCountOut.textContent = countB;\n\n      if (!queryPoint || trainingPoints.length === 0) {\n        predictedClassOut.textContent = \"-\";\n        neighborsUsedOut.textContent = \"0\";\n        neighborsBody.innerHTML = \"\";\n        statusText.textContent = \"Add some training points, then place a query point to classify it.\";\n        return;\n      }\n\n      const result = predictClass(queryPoint);\n      const neighbors = result.neighbors;\n\n      predictedClassOut.textContent = result.class;\n      predictedClassOut.style.color = result.class === \"A\" ? \"#dc2626\" : \"#2563eb\";\n      neighborsUsedOut.textContent = neighbors.length;\n\n      neighborsBody.innerHTML = \"\";\n      neighbors.forEach((n, i) => {\n        const tr = document.createElement(\"tr\");\n        tr.innerHTML = `\n          <td>${i + 1}<\/td>\n          <td>P${n.index}<\/td>\n          <td style=\"font-weight:bold; color:${n.class === \"A\" ? \"#dc2626\" : \"#2563eb\"};\">${n.class}<\/td>\n          <td>${n.dist.toFixed(2)}<\/td>\n        `;\n        neighborsBody.appendChild(tr);\n      });\n\n      statusText.textContent =\n        `The query point is classified as Class ${result.class} using the ${neighbors.length} nearest neighbor(s). Change k to see how the prediction and decision regions respond.`;\n    }\n\n    function draw() {\n      ctx.clearRect(0, 0, canvas.width, canvas.height);\n      drawBackgroundRegions();\n      drawAxes();\n      drawTrainingPoints();\n      drawQueryAndNeighbors();\n      updateOutputs();\n    }\n\n    function canvasClick(event) {\n      const rect = canvas.getBoundingClientRect();\n      const scaleX = canvas.width / rect.width;\n      const scaleY = canvas.height / rect.height;\n\n      const rawX = (event.clientX - rect.left) * scaleX;\n      const rawY = (event.clientY - rect.top) * scaleY;\n      const pos = clampToPlot(rawX, rawY);\n\n      if (modeSelect.value === \"add\") {\n        trainingPoints.push({\n          x: pos.x,\n          y: pos.y,\n          class: classSelect.value\n        });\n      } else {\n        queryPoint = { x: pos.x, y: pos.y };\n      }\n\n      draw();\n    }\n\n    function undoLastPoint() {\n      if (trainingPoints.length > 0) {\n        trainingPoints.pop();\n        draw();\n      }\n    }\n\n    function clearAll() {\n      trainingPoints = [];\n      queryPoint = null;\n      draw();\n    }\n\n    function loadSample() {\n      trainingPoints = [\n        { x: 180, y: 420, class: \"A\" },\n        { x: 220, y: 360, class: \"A\" },\n        { x: 260, y: 430, class: \"A\" },\n        { x: 300, y: 330, class: \"A\" },\n\n        { x: 620, y: 180, class: \"B\" },\n        { x: 700, y: 230, class: \"B\" },\n        { x: 760, y: 170, class: \"B\" },\n
